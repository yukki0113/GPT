<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>JRDB Fact Lite PoC</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">JRDB / Fact Lite PoC</p>
      <h1>自由条件集計</h1>
    </div>
    <div id="fact-network-badge" class="badge">確認中</div>
  </header>

  <main>
    <section class="card">
      <h2>Fact Lite 状態</h2>
      <dl class="status-grid">
        <div><dt>ローカルDB</dt><dd id="fact-db-status">確認中</dd></div>
        <div><dt>最終同期</dt><dd id="fact-sync-status">未同期</dd></div>
        <div><dt>配布版</dt><dd id="fact-remote-status">未確認</dd></div>
        <div><dt>OPFS</dt><dd id="fact-opfs-status">確認中</dd></div>
      </dl>
      <div class="sync-panel">
        <div class="button-row">
          <button id="fact-btn-check" type="button" class="secondary" disabled>最新版を確認</button>
          <button id="fact-btn-sync" type="button" disabled>今すぐ同期</button>
          <a href="./" class="link-button">Mart版へ戻る</a>
        </div>
        <div id="fact-sync-progress" class="query-status"></div>
      </div>
    </section>

    <section class="card">
      <h2>条件</h2>
      <div class="filter-grid">
        <label>年 From<input id="fact-year-from" type="number" value="2016" min="2016" max="2026" disabled /></label>
        <label>年 To<input id="fact-year-to" type="number" value="2026" min="2016" max="2026" disabled /></label>
        <label>競馬場
          <select id="fact-venue" disabled>
            <option value="">指定なし</option>
            <option value="1">札幌</option><option value="2">函館</option><option value="3">福島</option><option value="4">新潟</option>
            <option value="5">東京</option><option value="6">中山</option><option value="7">中京</option><option value="8">京都</option>
            <option value="9">阪神</option><option value="10">小倉</option>
          </select>
        </label>
        <label>芝 / ダ / 障害
          <select id="fact-track-type" disabled>
            <option value="">指定なし</option><option value="1">芝</option><option value="2">ダート</option><option value="3">障害</option>
          </select>
        </label>
        <label>距離<input id="fact-distance" type="number" step="100" placeholder="例: 1600" disabled /></label>
        <label>馬場状態
          <select id="fact-track-condition" disabled>
            <option value="">指定なし</option>
            <option value="10">良</option><option value="11">速良</option><option value="12">遅良</option>
            <option value="20">稍重</option><option value="21">速稍重</option><option value="22">遅稍重</option>
            <option value="30">重</option><option value="31">速重</option><option value="32">遅重</option>
            <option value="40">不良</option><option value="41">速不良</option><option value="42">遅不良</option>
          </select>
        </label>
        <label>年齢
          <select id="fact-age" disabled>
            <option value="">指定なし</option><option value="2">2歳</option><option value="3">3歳</option><option value="4">4歳</option><option value="5">5歳</option><option value="6">6歳</option><option value="7">7歳</option><option value="8">8歳以上</option>
          </select>
        </label>
        <label>性別
          <select id="fact-sex" disabled>
            <option value="">指定なし</option><option value="1">牡</option><option value="2">牝</option><option value="3">セン</option>
          </select>
        </label>
        <label>人気帯
          <select id="fact-pop-band" disabled>
            <option value="">指定なし</option><option value="1-3">1〜3人気</option><option value="4-6">4〜6人気</option><option value="7-9">7〜9人気</option><option value="10+">10人気以下</option>
          </select>
        </label>
        <label>脚質
          <select id="fact-running-style" disabled>
            <option value="">指定なし</option><option value="1">逃げ</option><option value="2">先行</option><option value="3">差し</option><option value="4">追込</option><option value="5">好位差し</option><option value="6">自在</option>
          </select>
        </label>
        <label>最低出走数<input id="fact-min-starts" type="number" value="20" min="1" disabled /></label>
      </div>
      <button id="fact-btn-aggregate" type="button" disabled>集計</button>
      <div id="fact-query-status" class="query-status"></div>
    </section>

    <section class="card">
      <div class="tabs" id="fact-tabs" role="tablist" aria-label="Fact Lite集計軸">
        <button type="button" class="tab active" data-axis="sire" disabled>種牡馬</button>
        <button type="button" class="tab" data-axis="bms" disabled>母父</button>
        <button type="button" class="tab" data-axis="jockey" disabled>騎手</button>
        <button type="button" class="tab" data-axis="frame" disabled>枠</button>
        <button type="button" class="tab" data-axis="style" disabled>脚質</button>
        <button type="button" class="tab" data-axis="age" disabled>年齢</button>
        <button type="button" class="tab" data-axis="sex" disabled>性別</button>
        <button type="button" class="tab" data-axis="pop_band" disabled>人気帯</button>
      </div>
      <div id="fact-result-area"><div class="empty-state">Fact Liteを同期すると集計結果を表示します。</div></div>
    </section>
  </main>

  <footer><small>JRDB Fact Lite v0.1 real-device PoC</small></footer>
  <script src="./fact-lite.js"></script>
</body>
</html>
