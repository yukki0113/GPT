<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>JRDB Fact Lite PoC</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">JRDB / Fact Lite PoC</p>
      <h1>自由条件集計</h1>
    </div>
    <div id="fact-network-badge" class="badge">確認中</div>
  </header>

  <main>
    <section class="card">
      <h2>Fact Lite 状態</h2>
      <dl class="status-grid">
        <div><dt>ローカルDB</dt><dd id="fact-db-status">確認中</dd></div>
        <div><dt>最終同期</dt><dd id="fact-sync-status">未同期</dd></div>
        <div><dt>配布版</dt><dd id="fact-remote-status">未確認</dd></div>
        <div><dt>OPFS</dt><dd id="fact-opfs-status">確認中</dd></div>
      </dl>
      <div class="sync-panel">
        <div class="button-row">
          <button id="fact-btn-check" type="button" class="secondary" disabled>最新版を確認</button>
          <button id="fact-btn-sync" type="button" disabled>今すぐ同期</button>
          <a href="./" class="link-button">Mart版へ戻る</a>
        </div>
        <div id="fact-sync-progress" class="query-status"></div>
      </div>
    </section>

    <section class="card">
      <h2>条件</h2>
      <div class="filter-grid">
        <div class="range-field">
          <span class="range-label">年</span>
          <div class="range-controls">
            <input id="fact-year-from" type="number" value="2016" min="2016" max="2026" aria-label="年 From" disabled />
            <span class="range-separator">～</span>
            <input id="fact-year-to" type="number" value="2026" min="2016" max="2026" aria-label="年 To" disabled />
          </div>
        </div>
        <div class="range-field">
          <span class="range-label">月</span>
          <div class="range-controls">
            <select id="fact-month-from" aria-label="月 From" disabled>
              <option value="">指定なし</option>
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option>
              <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>
              <option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
            <span class="range-separator">～</span>
            <select id="fact-month-to" aria-label="月 To" disabled>
              <option value="">指定なし</option>
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option>
              <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>
              <option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
          </div>
        </div>
        <label>競馬場
          <select id="fact-venue" disabled>
            <option value="">指定なし</option>
            <option value="1">札幌</option><option value="2">函館</option><option value="3">福島</option><option value="4">新潟</option>
            <option value="5">東京</option><option value="6">中山</option><option value="7">中京</option><option value="8">京都</option>
            <option value="9">阪神</option><option value="10">小倉</option>
          </select>
        </label>
        <label>芝 / ダ / 障害
          <select id="fact-track-type" disabled>
            <option value="">指定なし</option><option value="1">芝</option><option value="2">ダート</option><option value="3">障害</option>
          </select>
        </label>
        <div class="range-field">
          <span class="range-label">距離</span>
          <div class="range-controls">
            <input id="fact-distance-from" type="number" step="100" placeholder="例: 1200" aria-label="距離 From" disabled />
            <span class="range-separator">～</span>
            <input id="fact-distance-to" type="number" step="100" placeholder="例: 1800" aria-label="距離 To" disabled />
          </div>
        </div>
        <label>馬場状態
          <select id="fact-track-condition" disabled>
            <option value="">指定なし</option>
            <option value="10">良</option><option value="11">速良</option><option value="12">遅良</option>
            <option value="20">稍重</option><option value="21">速稍重</option><option value="22">遅稍重</option>
            <option value="30">重</option><option value="31">速重</option><option value="32">遅重</option>
            <option value="40">不良</option><option value="41">速不良</option><option value="42">遅不良</option>
          </select>
        </label>
        <label>クラス
          <select id="fact-race-class" disabled>
            <option value="">指定なし</option>
            <option value="1">新馬</option><option value="2">未出走</option><option value="3">未勝利</option>
            <option value="4">1勝クラス</option><option value="5">2勝クラス</option><option value="6">3勝クラス</option>
            <option value="7">オープン</option><option value="8">L</option><option value="9">G3</option>
            <option value="10">G2</option><option value="11">G1</option><option value="12">その他重賞</option><option value="13">その他</option>
          </select>
        </label>
        <label>レース名
          <input id="fact-race-name" type="text" placeholder="現配布データでは未収録" disabled />
          <small id="fact-race-name-note">レース名データを確認中</small>
        </label>
        <label>最低出走数<input id="fact-min-starts" type="number" value="20" min="1" disabled /></label>
        <label class="fact-checkbox-field">
          <input id="fact-exclude-jumps" type="checkbox" checked disabled />
          <span>障害レースを除く</span>
        </label>
      </div>
      <div class="button-row">
        <button id="fact-btn-aggregate" type="button" disabled>集計</button>
        <button id="fact-btn-clear" type="button" class="secondary" disabled>クリア</button>
      </div>
      <div id="fact-query-status" class="query-status"></div>
    </section>

    <section class="card">
      <div class="tabs" id="fact-tabs" role="tablist" aria-label="Fact Lite集計軸">
        <button type="button" class="tab active" data-axis="sire" disabled>種牡馬</button>
        <button type="button" class="tab" data-axis="jockey" disabled>騎手</button>
        <button type="button" class="tab" data-axis="frame" disabled>枠</button>
        <button type="button" class="tab" data-axis="style" disabled>脚質</button>
        <button type="button" class="tab" data-axis="age" disabled>年齢</button>
        <button type="button" class="tab" data-axis="sex" disabled>性別</button>
        <button type="button" class="tab" data-axis="popularity" disabled>人気</button>
        <button type="button" class="tab" data-axis="distance_change" disabled>前走距離</button>
        <button type="button" class="tab" data-axis="prev_class" disabled>前走クラス</button>
      </div>
      <div id="fact-result-area"><div class="empty-state">Fact Liteを同期すると集計結果を表示します。</div></div>
    </section>
  </main>

  <footer><small>JRDB Fact Lite v0.2 real-device PoC</small></footer>
  <script src="./fact-lite.js?v=17"></script>
  <script src="./fact-lite-sort.js?v=17"></script>
</body>
</html>
