<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>JRDB 自分用競馬新聞</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./newspaper.css?v=3" />
  <link rel="stylesheet" href="./newspaper-v4.css?v=6" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">JRDB / Newspaper PoC</p>
      <h1>自分用競馬新聞</h1>
    </div>
    <div id="newspaper-network-badge" class="badge">確認中</div>
  </header>

  <main class="newspaper-main">
    <section class="card">
      <h2>新聞データ</h2>
      <dl class="status-grid">
        <div><dt>端末保存</dt><dd id="newspaper-local-status">確認中</dd></div>
        <div><dt>OPFS</dt><dd id="newspaper-opfs-status">確認中</dd></div>
        <div><dt>Service Worker</dt><dd id="newspaper-sw-status">確認中</dd></div>
        <div><dt>表示レース</dt><dd id="newspaper-race-status">未読込</dd></div>
      </dl>

      <div class="import-panel newspaper-import-panel">
        <label>
          Newspaper race JSON
          <input id="newspaper-file" type="file" accept=".json,application/json" />
        </label>
        <div class="button-row">
          <button id="newspaper-import" type="button" disabled>読み込んで端末保存</button>
          <button id="newspaper-clear" type="button" class="secondary" disabled>端末保存を削除</button>
        </div>
        <div id="newspaper-import-status" class="query-status"></div>
      </div>

      <div class="button-row newspaper-nav-links">
        <a href="./fact-lite.html" class="link-button">自由条件集計</a>
        <a href="./" class="link-button">Mart版</a>
      </div>
      <p class="note">PoCでは1レースJSONを手動取込し、OPFSへ保存します。いったん保存すればオフライン再起動でも表示できます。日次manifestによる自動配信は後続実装です。</p>
    </section>

    <section id="newspaper-race-card" class="card newspaper-race-card" hidden>
      <div class="newspaper-race-heading">
        <div>
          <p id="newspaper-race-meta" class="eyebrow"></p>
          <h2 id="newspaper-race-title"></h2>
          <p id="newspaper-race-subtitle" class="newspaper-race-subtitle"></p>
        </div>
        <div class="newspaper-history-toggle" role="group" aria-label="表示する過去走数">
          <button type="button" class="newspaper-history-button active" data-history-count="3">3走</button>
          <button type="button" class="newspaper-history-button" data-history-count="5">5走</button>
          <button type="button" class="newspaper-history-button" data-history-count="8">8走</button>
        </div>
      </div>
      <div id="newspaper-source-status" class="query-status"></div>
    </section>

    <section id="newspaper-table-card" class="card newspaper-table-card" hidden>
      <div class="newspaper-scroll-hint">横へスクロールできます。枠・基本情報は左へ消え、馬番・馬名だけ固定表示します。</div>
      <div id="newspaper-table-wrap" class="table-wrap newspaper-table-wrap"></div>
    </section>

    <section id="newspaper-notes-card" class="card" hidden>
      <h2>レース短評</h2>
      <div id="newspaper-race-notes"></div>
    </section>
  </main>

  <dialog id="newspaper-detail-dialog" class="newspaper-dialog">
    <form method="dialog" class="newspaper-dialog-inner">
      <div class="newspaper-dialog-header">
        <strong id="newspaper-dialog-title">詳細</strong>
        <button type="submit" class="secondary">閉じる</button>
      </div>
      <div id="newspaper-dialog-body"></div>
    </form>
  </dialog>

  <footer><small>JRDB 自分用競馬新聞 / PWA display PoC</small></footer>
  <script src="./newspaper.js?v=2"></script>
  <script src="./newspaper-v2.js?v=3"></script>
  <script src="./newspaper-v4.js?v=6"></script>
</body>
</html>
