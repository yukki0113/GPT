<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>Kenshow_Labo. / 注目馬一覧</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./momotaro/momotaro.css?v=7" />
</head>
<body>
  <header class="app-header">
    <details class="app-menu">
      <summary class="app-menu-trigger" aria-label="メニューを開く">
        <span class="app-menu-icon" aria-hidden="true">☰</span>
        <span class="app-brand">Kenshow_Labo.</span>
      </summary>
      <nav class="app-menu-panel" aria-label="メインメニュー">
        <div class="app-menu-section">閲覧</div>
        <a href="./newspaper.html" class="app-menu-link">競馬新聞</a>
        <a href="./watchlist.html" class="app-menu-link active" aria-current="page">注目馬一覧</a>
        <a href="./fact-lite.html" class="app-menu-link">条件別集計</a>
      </nav>
    </details>
    <div id="prediction-network-badge" class="badge">確認中</div>
  </header>

  <main>
    <h1 class="visually-hidden">注目馬一覧</h1>
    <section class="card momotaro-prediction-toolbar">
      <h2>今日の注目馬一覧</h2>
      <div class="momotaro-tabs" role="group" aria-label="表示対象">
        <button type="button" data-filter="all" class="active">すべて</button>
        <button type="button" data-filter="ryota">りょーた</button>
        <button type="button" data-filter="oji-review">王子</button>
        <button type="button" data-filter="kenshow-analysis">けん</button>
        <button type="button" data-filter="eval-analysis">Eval</button>
        <button type="button" data-filter="keibailuka">🐬</button>
      </div>
      <div class="button-row" hidden><button id="prediction-refresh" type="button">最新データを確認</button></div>
      <div id="prediction-status" class="query-status"></div>
    </section>
    <section class="card"><div id="prediction-list"><div class="empty-state">データを確認してください。</div></div></section>
  </main>

  <footer><small>Kenshow_Labo. / 注目馬一覧</small></footer>
  <script>
    window.JRDB_PWA_CONFIG = {
      predictionCurrentBase: "./momotaro/data/newspaper/current/",
      evalCurrentBase: "./data/newspaper/current/"
    };
  </script>
  <script src="./momotaro/predictions.js?v=11"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
        .then(function (registration) { return registration.update().catch(function () {}); })
        .catch(function (error) { console.error("Service Worker registration failed", error); });
    }
  </script>
</body>
</html>
