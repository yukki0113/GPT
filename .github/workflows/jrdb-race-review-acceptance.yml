name: RaceReviewDB Candidate Acceptance

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  acceptance:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_RACE_REVIEW_ACCEPTANCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/data-storage/requirements.txt

      - name: Install storage runtime
        run: |
          python -m pip install --disable-pip-version-check             -r tools/data-storage/requirements.txt
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Download Turn 2 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/race_review_candidate
          gh run download 36094708797             --repo "$GITHUB_REPOSITORY"             --name RaceReviewDB-next-36094708797             --dir /tmp/race_review_candidate
          test -f /tmp/race_review_candidate/postrace_review/v0_1/current.json

      - name: Run real-data acceptance audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          python horse-racing/jrdb/src/jrdb_postrace_review_acceptance.py             --root /tmp/race_review_candidate/postrace_review/v0_1             --expected-period-to 2026-09-22             --summary-json /tmp/race_review_acceptance.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-acceptance-${{ github.run_id }}
          path: /tmp/race_review_acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/race_review_acceptance.json')
          if path.is_file():
              result = json.loads(path.read_text(encoding='utf-8'))
          else:
              result = {
                  'status': 'FAIL',
                  'error': 'acceptance evidence missing',
              }

          result['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          result['audit_exit_code'] = os.environ.get('AUDIT_EXIT')
          Path('/tmp/race_review_acceptance.md').write_text(
              'JRDB_RACE_REVIEW_ACCEPTANCE_RESULT\n```json\n'
              + json.dumps(result, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body-file /tmp/race_review_acceptance.md

      - name: Close request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [ "$AUDIT_EXIT" = "0" ]; then
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason completed
          else
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason "not planned"
          fi

      - name: Fail unless acceptance passed
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          test "$AUDIT_EXIT" = "0"
