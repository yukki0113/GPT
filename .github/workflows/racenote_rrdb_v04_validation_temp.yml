name: RaceNote RRDB v0.4 integration validation
on:
  push:
    branches: [racenote-rrdb-v04]
    paths:
      - 'horse-racing/jrdb/src/racenote_rrdb_enrichment.py'
      - 'horse-racing/jrdb/src/build_racenote_daily.py'
      - 'horse-racing/jrdb/src/racenote_v052_historical_probe.py'
      - 'horse-racing/jrdb/src/racenote_v053_from_historical_warehouse.py'
      - 'horse-racing/jrdb/src/racenote_v052_from_paci.py'
      - 'horse-racing/jrdb/src/racenote_v053_from_paci.py'
      - 'horse-racing/jrdb/tests/test_racenote_rrdb_v04.py'
      - '.github/workflows/racenote_rrdb_v04_validation_temp.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racenote-rrdb-v04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema pytest
      - name: Compile changed RaceNote entrypoints
        run: |
          python -m py_compile             horse-racing/jrdb/src/racenote_rrdb_enrichment.py             horse-racing/jrdb/src/build_racenote_daily.py             horse-racing/jrdb/src/racenote_v052_historical_probe.py             horse-racing/jrdb/src/racenote_v053_from_historical_warehouse.py             horse-racing/jrdb/src/racenote_v052_from_paci.py             horse-racing/jrdb/src/racenote_v053_from_paci.py
      - name: Focused RRDB v0.4 regressions
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python -m pytest             horse-racing/jrdb/tests/test_jrdb_recommendation_signals.py             horse-racing/jrdb/tests/test_jrdb_recommendation_reverse_v04.py             horse-racing/jrdb/tests/test_racenote_rrdb_v04.py -q
