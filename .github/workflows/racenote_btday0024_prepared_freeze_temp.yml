name: RaceNote BTDAY-0024 prepared forecast freeze temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  freeze:
    if: startsWith(github.event.issue.title, '[RACENOTE_BTDAY0024_PREPARED_FREEZE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse HEAD >/tmp/mainsha.txt
          mkdir -p /tmp/a /tmp/prep
          gh run download 36873236472 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0024-DAY-PREP --dir /tmp/a
          unzip -q "$(find /tmp/a -type f -name '*.zip' | head -1)" -d /tmp/prep
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/prep/day_prep_handoff.json').read_text())
          assert h['selection_id']=='BTDAY-0024'
          assert h['target_date']=='2026-02-01'
          assert h['result_opened'] is False
          assert h['race_count']==36
          PY

      - name: Build complete prepared records from authored manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('horse-racing/jrdb/tmp/btday0024_authored_manifest.json').read_text())
          authored={x['key']:x for x in manifest}
          readers={}
          for p in Path('/tmp/prep/reader').glob('*.json'):
              x=json.loads(p.read_text())
              r=x['race']
              readers[f"{r['venue']}:{int(r['race_no'])}"]=x
          assert set(authored)==set(readers)
          rows=[]
          for key in sorted(authored,key=lambda k:(k.split(':')[0],int(k.split(':')[1]))):
              c=authored[key]; x=readers[key]; race=x['race']
              by={int(h['basic']['horse_no']):h for h in x['horses']}
              marks=c['marks']; assert len(marks)==5 and len(set(marks))==5
              hs=[by[n] for n in marks]
              refs=[]
              for i,h in enumerate(hs):
                  rr=((h.get('racereview') or {}).get('recommendation') or {})
                  ids=rr.get('matched_signal_ids') or []
                  if c['rrdb_used'] and ids:
                      role=['UPGRADE_RECENT_FORM','SUPPORT_REPEATABILITY','SUPPORT_COUNTERARGUMENT','CONTEXT_ONLY','CONTEXT_ONLY'][i]
                  else:
                      role='CONTEXT_ONLY'
                  src=rr.get('source_run') or {}
                  refs.append({
                    'horse_no':int(h['basic']['horse_no']),
                    'horse_name':h['basic']['horse_name'],
                    'source_run_ref':src.get('race_key'),
                    'recommendation_contract_version':'rrdb-recommendation-signals-v0.3',
                    'matched_signal_ids':ids,
                    'signal_strength':{s.get('signal_id'):s.get('strength') for s in (rr.get('signals') or [])} or None,
                    'decision_role':role,
                    'next_watch_grade':None,
                    'matched_rule_ids':[]
                  })
              def he(i,rank):
                  h=hs[i]
                  return {'horse_no':marks[i],'horse_name':h['basic']['horse_name'],'rank':rank}
              rec={
                'schema_version':'RaceNote-Forecast-Research-Record-0.4.2',
                'identity':{
                  'target_date':'2026-02-01','venue':race['venue'],'race_no':race['race_no'],
                  'race_key':f"2026-02-01-{race['venue']}-{race['race_no']}",
                  'race_name':race.get('race_name'),'surface':race['surface'],
                  'distance_m':race['distance_m'],'class':race['class']
                },
                'research':{
                  'evaluation_mode':'BLINDED_HISTORICAL',
                  'turn_id':'BTDAY-0024-TURN2-FULLDAY',
                  'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate',
                  'candidate_patch':'mainline + single-shot five-mark forecast',
                  'reader_facing_prose_contract':'FORECAST_READER_FACING_PROSE_v0_1',
                  'authoring_mode':'MODEL_RACE_BY_RACE_REASONING',
                  'prose_origin':'MODEL_AUTHORED_NOT_SCRIPT_GENERATED'
                },
                'source':{
                  'racenote_identity':f"BTDAY-0024/20260201/{race['venue']}/{race['race_no']}R",
                  'racenote_semantic_sha256':x['source_semantic_sha256'],
                  'day_prep_package':'BTDAY-0024_DAY_PREP_20260201_FINAL.zip',
                  'reader_input_policy':'TARGET_DAY_MARKET_OBJECT_REMOVED_BEFORE_FORECAST'
                },
                'prediction':{
                  'axis':he(0,1),
                  'marks':{'main':he(0,1),'second':he(1,2),'third':he(2,3),'others':[he(3,4),he(4,5)]},
                  'axis_comment':c['axis'],
                  'reader_facing_reason':c['prose'],
                  'stability_counter_reason':None,'concern':None,'full_field_order':None
                },
                'decision_trace':{
                  'race_model':c['race_model'],
                  'mainline_cases':[
                    {'horse':{'horse_no':marks[i],'horse_name':hs[i]['basic']['horse_name']},'case_for':c['reasons'][i]}
                    for i in [0,1,3,4]
                  ],
                  'single_shot_case':{
                    'horse':{'horse_no':marks[2],'horse_name':hs[2]['basic']['horse_name']},
                    'case_for':c['reasons'][2],
                    'selected_independently_from_mainline':True
                  },
                  'mark_reason':{
                    'main':c['reasons'][0],'second':c['reasons'][1],'third':c['reasons'][2],
                    'others':[c['reasons'][3],c['reasons'][4]]
                  },
                  'rrdb_evidence':{
                    'available':True,'reviewed':True,'used_in_decision':bool(c['rrdb_used']),
                    'recommendation_contract_version':'rrdb-recommendation-signals-v0.3',
                    'horse_refs':refs,
                    'reason_not_used':None if c['rrdb_used'] else
                      'RRDB was reviewed for the selected horses, but it did not change the race-local mainline or independent single-shot judgment.'
                  },
                  'legacy_0_3_fields':{'status':'NOT_USED_v0.4.2'}
                },
                'audit':{}
              }
              rows.append(rec)
          Path('/tmp/prepared.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          assert len(rows)==36
          PY

      - name: Deterministic Freeze package
        run: |
          python horse-racing/jrdb/src/racenote_freeze_prepared_forecast.py             --prep-root /tmp/prep             --prepared-records /tmp/prepared.json             --output-root /tmp/bt24             --selection-id BTDAY-0024             --date 2026-02-01             --main-sha "$(cat /tmp/mainsha.txt)"

      - name: Validate prose and forecast contract
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt24/day_merge/forecast_20260201_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/bt24/day_merge/forecast_20260201_all_audit.json')
          a=json.loads(p.read_text())
          v=json.loads(Path('/tmp/validator.json').read_text())
          assert v['status']=='PASS',v
          assert v['record_count']==36
          assert v['anti_template']['status']=='PASS',v
          a['reader_facing_prose_guard']='PASS'
          a['anti_template']=v['anti_template']
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Guard canonical immutability
        run: |
          set -euo pipefail
          CAND='/tmp/bt24/day_merge/forecast_20260201_all_handoff.json'
          CANON='horse-racing/jrdb/backtests/BTDAY-0024/20260201/day_merge/forecast_20260201_all_handoff.json'
          set +e
          python horse-racing/jrdb/src/racenote_freeze_immutability_guard.py             --candidate-handoff "$CAND" --canonical-handoff "$CANON" --output /tmp/immutability.json
          rc=$?
          set -e
          if test "$rc" -eq 3; then
            cat /tmp/immutability.json
            exit 3
          fi
          cat /tmp/immutability.json

      - name: Publish canonical archive
        run: |
          set -euo pipefail
          STATUS="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/immutability.json'))['status'])
          PY
          )"
          if test "$STATUS" = "IDENTICAL_RETRY"; then
            git rev-parse HEAD >/tmp/commit.txt
            exit 0
          fi
          test "$STATUS" = "NEW_FREEZE"
          DEST='horse-racing/jrdb/backtests/BTDAY-0024/20260201'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/bt24 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260201_validator.json"
          cp /tmp/immutability.json "$DEST/day_merge/forecast_20260201_immutability.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0024 20260201 authored forecast"
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD >/tmp/commit.txt

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json,os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          a=json.loads(Path('/tmp/bt24/day_merge/forecast_20260201_all_audit.json').read_text()) if Path('/tmp/bt24/day_merge/forecast_20260201_all_audit.json').exists() else {}
          im=json.loads(Path('/tmp/immutability.json').read_text()) if Path('/tmp/immutability.json').exists() else {}
          print('RACENOTE_BTDAY0024_PREPARED_FREEZE_RESULT')
          print(json.dumps({
            'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL',
            'clean_blind_eligible':True if ok else None,
            'result_opened':False,
            'race_count':36 if ok else None,
            'technical_skips':0 if ok else None,
            'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate',
            'rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.3',
            'authoring_mode':'MODEL_RACE_BY_RACE_REASONING',
            'prose_origin':'MODEL_AUTHORED_NOT_SCRIPT_GENERATED',
            'prediction_hash_contract':'SEMANTIC_V1_EXECUTION_METADATA_EXCLUDED',
            'validator_status':v.get('status'),
            'anti_template':(v.get('anti_template') or {}).get('status'),
            'immutability_status':im.get('status'),
            'market_blind_guard':a.get('market_blind_guard'),
            'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,
            'run_id':int(os.environ['GITHUB_RUN_ID'])
          },ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          if test -f /tmp/commit.txt; then
            gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
          fi
