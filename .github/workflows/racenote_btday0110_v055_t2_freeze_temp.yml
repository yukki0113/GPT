name: RaceNote BTDAY-0110 v0.5.5 T2 Freeze
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0110.v055-t2-freeze'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: horse-racing/jrdb/src
      ROOT: horse-racing/jrdb/backtests/BTDAY-0110/20251206/v055
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb==1.1.3 jsonschema
      - name: Materialize model-authored incoming decisions
        env:
          DECISIONS_GZ_B64: ''
        run: |
          python - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          data=json.loads(gzip.decompress(base64.b64decode(os.environ['DECISIONS_GZ_B64'])))
          incoming=root/'incoming'
          incoming.mkdir(exist_ok=True)
          for venue in ('中京','中山','阪神'):
              p=incoming/f'{venue}.json'
              if p.exists(): raise SystemExit(f'incoming already exists: {p}')
              arr=data[venue]
              assert len(arr)==12 and [x['race_no'] for x in arr]==list(range(1,13))
              p.write_text(json.dumps(arr,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Pre-Freeze canonical validation with no authored side effects
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from racenote_v055_single_day import load_session,_validator_reader
          from racenote_decision_core_v055 import validate_core,validate_prose_collection
          from racenote_v055_authoring_quality import inspect
          root=Path(os.environ['ROOT'])
          session,_,entries=load_session(root)
          cores=[]
          for venue in session['expected_venues']:
              arr=json.loads((root/'incoming'/f'{venue}.json').read_text())
              for core in arr:
                  key=(venue,int(core['race_no']))
                  normal=json.loads((root/'reader'/entries[key]['derived_normal_filename']).read_text())
                  validate_core(core,_validator_reader(normal),contract_revision=session.get('contract_revision'))
                  cores.append(core)
          validate_prose_collection(cores)
          q=inspect(cores)
          if q['status']!='PASS':
              raise SystemExit('authoring quality FAIL: '+json.dumps(q,ensure_ascii=False))
          print(json.dumps({'status':'PRE_FREEZE_PASS','race_count':len(cores),'quality':q['status']},ensure_ascii=False))
          PY
      - name: Save all venues
        run: |
          set -euo pipefail
          for venue in 中京 中山 阪神; do
            python horse-racing/jrdb/src/racenote_v055_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/$venue.json"
          done
      - name: Freeze and verify
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v055_single_day.py verify --root "$ROOT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          h=json.loads((root/'frozen/day_handoff.json').read_text())
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          assert h['record_count']==36
          assert h['market_blind'] is True
          assert h['result_opened'] is False
          assert h['target_market_opened'] is False
          assert h['confidence_frozen'] is True
          assert h['confidence_meaning']=='HONMEI_WIN_CONFIDENCE'
          q=json.loads((root/'frozen/authoring_quality_report.json').read_text())
          assert q['status']=='PASS'
          print(json.dumps({'status':'VERIFIED','record_count':h['record_count'],'session_id':h['session_id'],'quality':q['status'],'confidence_frozen':h['confidence_frozen']},ensure_ascii=False))
          PY
      - name: Commit immutable T2 Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/incoming" "$ROOT/authored_decisions" "$ROOT/authoring_quality_report.json" "$ROOT/frozen"
          git commit -m "RaceNote: freeze BTDAY-0110 v0.5.5 predictions"
          git pull --rebase origin main
          git push origin HEAD:main
