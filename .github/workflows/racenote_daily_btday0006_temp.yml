name: RaceNote daily backtest BTDAY-0006 temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  build:
    if: startsWith(github.event.issue.title, '[RACENOTE_DAILY_BTDAY0006]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pyarrow pandas numpy jsonschema gdown

      - name: Pick BTDAY-0006 from unused eligible pool
        run: |
          cp horse-racing/jrdb/config/racenote_backtest_day_pool_2026.json /tmp/pool.json
          python horse-racing/jrdb/src/racenote_backtest_day_picker.py pick             --state /tmp/pool.json             -n 1             --seed '8fd5cb40a6d9f04f2f39d2782b739406'             | tee /tmp/selection.json

          python - <<'PY'
          import json
          from pathlib import Path
          pool=json.loads(Path('/tmp/pool.json').read_text(encoding='utf-8'))
          sel=json.loads(Path('/tmp/selection.json').read_text(encoding='utf-8'))
          assert sel['selection_id']=='BTDAY-0006', sel
          date=sel['dates'][0]
          row=next(x for x in pool['days'] if x['date']==date)
          Path('/tmp/date.txt').write_text(date,encoding='utf-8')
          Path('/tmp/date_compact.txt').write_text(date.replace('-',''),encoding='utf-8')
          Path('/tmp/file_name.txt').write_text(row['file_name'],encoding='utf-8')
          Path('/tmp/drive_file_id.txt').write_text(row['drive_file_id'],encoding='utf-8')
          print(json.dumps({'selection':sel,'row':row},ensure_ascii=False,indent=2))
          PY

      - name: Prepare sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/input /tmp/analysis_art /tmp/analysis /tmp/rrdb /tmp/rules /tmp/output
          DATE="$(cat /tmp/date.txt)"
          FILE_NAME="$(cat /tmp/file_name.txt)"
          DRIVE_FILE_ID="$(cat /tmp/drive_file_id.txt)"

          gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "/tmp/input/${FILE_NAME}"
          gdown 'https://drive.google.com/uc?id=1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/input/RaceReviewDB_CURRENT.zip
          gdown 'https://drive.google.com/uc?id=1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/input/NextWatch.zip

          gh run download 36437363166 --repo "${GITHUB_REPOSITORY}"             --name 'jrdb-post-race-parquet-refresh-36437363166'             --dir /tmp/analysis_art
          tar -xJf /tmp/analysis_art/analysis-parquet-candidate.tar.xz -C /tmp/analysis

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/analysis/current.json')
          manifest=Path('/tmp/analysis/generations/analysis-v1_4-canonical-20260928-02/manifest.json')
          if not manifest.is_file():
              raise SystemExit('canonical -02 manifest missing')
          p.write_text(json.dumps({
              'status':'CURRENT',
              'generation_id':'analysis-v1_4-canonical-20260928-02',
              'manifest':'generations/analysis-v1_4-canonical-20260928-02/manifest.json'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          unzip -q /tmp/input/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
          unzip -q /tmp/input/NextWatch.zip -d /tmp/rules

      - name: Run D5 daily builder
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -o pipefail
          DATE="$(cat /tmp/date.txt)"
          FILE_NAME="$(cat /tmp/file_name.txt)"
          python horse-racing/jrdb/src/build_racenote_daily.py             --date "${DATE}"             --paci "/tmp/input/${FILE_NAME}"             --analysis-root /tmp/analysis             --racereview-root /tmp/rrdb/postrace_review/v0_1             --next-watch-rules /tmp/rules/next_watch_candidate_rules_frozen.json             --output /tmp/output | tee /tmp/build_stdout.json

      - name: Create DAY PREP handoff
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          date=Path('/tmp/date.txt').read_text(encoding='utf-8').strip()
          compact=date.replace('-','')
          file_name=Path('/tmp/file_name.txt').read_text(encoding='utf-8').strip()
          drive_file_id=Path('/tmp/drive_file_id.txt').read_text(encoding='utf-8').strip()
          root=Path('/tmp/output')/f'RaceNote_{compact}'
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          validation=json.loads((root/'validation_report.json').read_text(encoding='utf-8'))
          readers=sorted((root/'reader').glob('*.json'))
          venues={}
          for p in readers:
              x=json.loads(p.read_text(encoding='utf-8'))
              r=x['race']
              venues.setdefault(r['venue'],[]).append(int(r['race_no']))
          handoff={
            'schema_version':'RaceNote-Day-Prep-Handoff-0.1-draft',
            'selection_id':'BTDAY-0006',
            'target_date':date,
            'paci_file':file_name,
            'paci_drive_file_id':drive_file_id,
            'forecast_logic_candidate':'RaceNote-Human-Context-Reader-0.3.3-candidate',
            'forecast_logic_base':'RaceNote-Human-Context-Reader-0.3.2',
            'candidate_patch':'CONVERGE counter/reversal self-reference guard',
            'analysis_generation':manifest['sources']['analysis']['generation_id'],
            'rrdb_generation':manifest['sources']['rrdb'].get('generation_id'),
            'next_watch_rule_version':manifest['sources']['next_watch'].get('rule_version'),
            'venues':sorted(venues),
            'venue_races':{k:sorted(v) for k,v in sorted(venues.items())},
            'venue_count':len(venues),
            'race_count':manifest['counts']['races_built'],
            'horse_count':manifest['counts']['horses'],
            'technical_skips':manifest['counts']['technical_skips'],
            'status':manifest['status'],
            'validation_status':validation['status'],
            'result_opened':False
          }
          (root/'day_prep_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'selected_pool_state.json').write_text(Path('/tmp/pool.json').read_text(encoding='utf-8'),encoding='utf-8')
          out=Path('/tmp')/f'BTDAY-0006_DAY_PREP_{compact}_FINAL.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p,p.relative_to(root))
          Path('/tmp/artifact_name.txt').write_text(f'BTDAY-0006-DAY-PREP-{compact}',encoding='utf-8')
          Path('/tmp/package_path.txt').write_text(str(out),encoding='utf-8')
          print(json.dumps(handoff,ensure_ascii=False,indent=2))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTDAY-0006-DAY-PREP
          path: /tmp/BTDAY-0006_DAY_PREP_*_FINAL.zip
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          date=Path('/tmp/date.txt').read_text(encoding='utf-8').strip() if Path('/tmp/date.txt').exists() else None
          compact=date.replace('-','') if date else None
          root=Path('/tmp/output')/f'RaceNote_{compact}' if compact else None
          ok=bool(root and (root/'day_prep_handoff.json').is_file())
          x=json.loads((root/'day_prep_handoff.json').read_text(encoding='utf-8')) if ok else {}
          print('RACENOTE_DAILY_BTDAY0006_RESULT')
          print(json.dumps({
              'status':'success' if ok else 'failure',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'artifact_name':'BTDAY-0006-DAY-PREP',
              **x
          },ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
