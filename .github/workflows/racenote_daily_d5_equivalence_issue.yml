name: racenote-daily-d5-equivalence-issue
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  audit:
    if: startsWith(github.event.issue.title, '[RACENOTE_D5_EQ]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/data-storage/requirements.txt
      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          req=json.loads((os.environ.get("ISSUE_BODY") or "").strip())
          required=["date","analysis_run_id","analysis_artifact","rrdb_run_id","rrdb_artifact","rules_run_id","rules_artifact"]
          missing=[x for x in required if not req.get(x)]
          if missing: raise SystemExit(f"missing keys: {missing}")
          Path("/tmp/d5_request.json").write_text(json.dumps(req),encoding="utf-8")
          PY
      - name: Download fixed upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          req=json.loads(Path("/tmp/d5_request.json").read_text())
          for key in ("analysis","rrdb","rules"):
              root=Path("/tmp")/f"d5_{key}"
              root.mkdir(parents=True,exist_ok=True)
              subprocess.run(["gh","run","download",str(req[f"{key}_run_id"]),"--repo",os.environ["GITHUB_REPOSITORY"],"--name",str(req[f"{key}_artifact"]),"--dir",str(root)],check=True)
          PY
      - name: Resolve artifact roots
        run: |
          python - <<'PY'
          import json, tarfile, zipfile
          from pathlib import Path
          def safe_zip(src,dst):
              dst.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(src) as z:
                  for m in z.infolist(): (dst/m.filename).resolve().relative_to(dst.resolve())
                  z.extractall(dst)
          def find_current(root):
              hits=list(root.rglob("current.json"))
              if len(hits)==1: return hits[0].parent
              for z in root.rglob("*.zip"):
                  d=root/("_x_"+z.stem)
                  try: safe_zip(z,d)
                  except Exception: continue
                  hits=list(d.rglob("current.json"))
                  if len(hits)==1: return hits[0].parent
              return None
          ar=Path("/tmp/d5_analysis")
          tars=sorted(list(ar.rglob("analysis-parquet-canonical.tar.xz"))+list(ar.rglob("analysis-parquet-candidate.tar.xz")))
          if len(tars)!=1: raise SystemExit(f"expected one Analysis tar, got {tars}")
          out=Path("/tmp/analysis_root"); out.mkdir()
          with tarfile.open(tars[0],"r:*") as tf:
              for m in tf.getmembers(): (out/m.name).resolve().relative_to(out.resolve())
              tf.extractall(out,filter="data")
          hits=list(out.rglob("current.json"))
          if len(hits)!=1: raise SystemExit(f"Analysis current.json count={len(hits)}")
          analysis_root=hits[0].parent
          rrdb_root=find_current(Path("/tmp/d5_rrdb"))
          if rrdb_root is None: raise SystemExit("RRDB current.json not found")
          rules_root=Path("/tmp/d5_rules")
          rules=list(rules_root.rglob("next_watch_candidate_rules_frozen.json"))
          if not rules:
              for z in rules_root.rglob("*.zip"):
                  d=rules_root/("_x_"+z.stem)
                  try: safe_zip(z,d)
                  except Exception: continue
              rules=list(rules_root.rglob("next_watch_candidate_rules_frozen.json"))
          if len(rules)!=1: raise SystemExit(f"frozen rules count={len(rules)}")
          Path("/tmp/d5_resolved.json").write_text(json.dumps({"analysis_root":str(analysis_root),"rrdb_root":str(rrdb_root),"rules":str(rules[0])}),encoding="utf-8")
          PY
      - name: Fetch PACI
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          DATE=$(python -c "import json;print(json.load(open('/tmp/d5_request.json'))['date'])")
          python horse-racing/jrdb/src/fetch_jrdb_paci.py --date "$DATE" --out-dir /tmp/paci
      - name: Run D5 equivalence audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set +e
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path("/tmp/d5_request.json").read_text())
          src=json.loads(Path("/tmp/d5_resolved.json").read_text())
          paci=list(Path("/tmp/paci").glob("PACI*.zip"))
          if len(paci)!=1: raise SystemExit(f"PACI count={len(paci)}")
          cmd=["python","horse-racing/jrdb/src/audit_racenote_daily_d5_equivalence.py","--date",req["date"],"--paci",str(paci[0]),"--analysis-root",src["analysis_root"],"--racereview-root",src["rrdb_root"],"--next-watch-rules",src["rules"],"--output","/tmp/d5_out"]
          raise SystemExit(subprocess.run(cmd).returncode)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload D5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racenote-d5-equivalence-${{ github.run_id }}
          path: /tmp/d5_out/
          if-no-files-found: warn
          retention-days: 30
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path("/tmp/d5_out/d5_equivalence_report.json")
          result=json.loads(p.read_text()) if p.is_file() else {"status":"FAIL","cutover_eligible":False,"hard_errors":["report missing"]}
          result["run_id"]=int(os.environ["GITHUB_RUN_ID"])
          result["audit_exit_code"]=os.environ.get("AUDIT_EXIT")
          body="RACENOTE_D5_EQ_RESULT\n"+json.dumps(result,ensure_ascii=False,indent=2)
          subprocess.run(["gh","issue","comment",os.environ["ISSUE_NUMBER"],"--body",body],check=True)
          PY
      - name: Fail workflow if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
