name: JRDB Common Reader tests

on:
  push:
    paths:
      - 'horse-racing/jrdb/src/jrdb_raw.py'
      - 'horse-racing/jrdb/src/jrdb_raw_history.py'
      - 'horse-racing/jrdb/src/racenote_jrdb.py'
      - 'horse-racing/jrdb/src/enrich_eval_csv_with_paci.py'
      - 'horse-racing/jrdb/src/jrdb_index_base_adapter.py'
      - 'horse-racing/jrdb/src/build_jrdb_index_base_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_analysis_raw_adapter.py'
      - 'horse-racing/jrdb/src/update_jrdb_analysis_incremental.py'
      - 'horse-racing/jrdb/src/build_jrdb_analysis_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_racenote_raw_adapter.py'
      - 'horse-racing/jrdb/src/racenote_request.py'
      - 'horse-racing/jrdb/src/build_racenote_archive_month_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_eval_raw_adapter.py'
      - 'horse-racing/jrdb/src/jrdb_eval_horse_result_adapter.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_race_conditions.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_dataset.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_horse_results.py'
      - 'horse-racing/jrdb/tests/test_jrdb_raw_common.py'
      - 'horse-racing/jrdb/tests/test_jrdb_raw_racenote_compat.py'
      - 'horse-racing/jrdb/tests/test_enrich_eval_csv_with_paci.py'
      - 'horse-racing/jrdb/tests/test_jrdb_index_base_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_analysis_raw_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_racenote_raw_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_eval_horse_result_adapter.py'
      - '.github/workflows/jrdb_common_reader_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/jrdb_raw.py'
      - 'horse-racing/jrdb/src/jrdb_raw_history.py'
      - 'horse-racing/jrdb/src/racenote_jrdb.py'
      - 'horse-racing/jrdb/src/enrich_eval_csv_with_paci.py'
      - 'horse-racing/jrdb/src/jrdb_index_base_adapter.py'
      - 'horse-racing/jrdb/src/build_jrdb_index_base_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_analysis_raw_adapter.py'
      - 'horse-racing/jrdb/src/update_jrdb_analysis_incremental.py'
      - 'horse-racing/jrdb/src/build_jrdb_analysis_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_racenote_raw_adapter.py'
      - 'horse-racing/jrdb/src/racenote_request.py'
      - 'horse-racing/jrdb/src/build_racenote_archive_month_from_raw.py'
      - 'horse-racing/jrdb/src/jrdb_eval_raw_adapter.py'
      - 'horse-racing/jrdb/src/jrdb_eval_horse_result_adapter.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_race_conditions.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_dataset.py'
      - 'horse-racing/jrdb/src/export_jrdb_eval_horse_results.py'
      - 'horse-racing/jrdb/tests/test_jrdb_raw_common.py'
      - 'horse-racing/jrdb/tests/test_jrdb_raw_racenote_compat.py'
      - 'horse-racing/jrdb/tests/test_enrich_eval_csv_with_paci.py'
      - 'horse-racing/jrdb/tests/test_jrdb_index_base_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_analysis_raw_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_racenote_raw_adapter.py'
      - 'horse-racing/jrdb/tests/test_jrdb_eval_horse_result_adapter.py'
      - '.github/workflows/jrdb_common_reader_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run common reader regressions
        working-directory: horse-racing/jrdb/tests
        run: |
          python -m unittest -v \
            test_jrdb_raw_common \
            test_jrdb_raw_racenote_compat \
            test_enrich_eval_csv_with_paci \
            test_jrdb_index_base_adapter \
            test_jrdb_analysis_raw_adapter \
            test_jrdb_racenote_raw_adapter \
            test_jrdb_eval_horse_result_adapter
