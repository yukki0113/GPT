name: RaceNote BTDAY-0068 reselection
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0068.reselect'
permissions:
  contents: write
jobs:
  reselect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-select BTDAY-0068 from unused eligible pool
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "horse-racing/jrdb/src")
          from racenote_backtest_day_picker import load_json, save_json, release_selection, pick_days

          p = Path("horse-racing/jrdb/config/racenote_backtest_day_pool_2026.json")
          state = load_json(p)
          sels = state.get("selections", [])
          if not sels or sels[-1].get("selection_id") != "BTDAY-0068":
              raise SystemExit("BTDAY-0068 must be the latest reservation for safe in-place reselection")
          old = dict(sels[-1])
          old_dates = list(old.get("dates") or [])
          if len(old_dates) != 1:
              raise SystemExit("expected exactly one old BTDAY-0068 date")
          old_date = old_dates[0]

          release_selection(state, "BTDAY-0068")
          # The old forecast date has already been exposed to this research thread.
          # Keep it permanently ineligible for future clean-blind draws.
          for row in state["days"]:
              if row["date"] == old_date:
                  row["eligible"] = False
                  row["exclusion_reason"] = "prior BTDAY-0068 forecast exposure; superseded reservation"
                  break
          else:
              raise SystemExit("old BTDAY-0068 date missing from pool")

          released = state["selections"].pop()
          if released.get("selection_id") != "BTDAY-0068":
              raise SystemExit("unexpected released selection")

          new = pick_days(state, 1)
          if new.get("selection_id") != "BTDAY-0068":
              raise SystemExit(f"picker returned unexpected id: {new.get('selection_id')}")
          new_date = new["dates"][0]
          if new_date == old_date:
              raise SystemExit("reselection returned old exposed date")

          audit = {
              "schema_version": "racenote-btday-reselection-audit-0.1",
              "selection_id": "BTDAY-0068",
              "reason": "user-requested fresh unused-day reselection after prior BTDAY-0068 execution",
              "old_reservation": old,
              "old_date_excluded_from_future_clean_blind": old_date,
              "new_reservation": new,
          }
          save_json(p, state)
          ap = Path("horse-racing/jrdb/backtests/BTDAY-0068/reselection_audit_20261009.json")
          save_json(ap, audit)
          print(json.dumps(audit, ensure_ascii=False))
          PY
      - name: Commit reservation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horse-racing/jrdb/config/racenote_backtest_day_pool_2026.json
          git add horse-racing/jrdb/backtests/BTDAY-0068/reselection_audit_20261009.json
          git rm .github/workflows/racenote_btday0068_reselect_temp.yml
          git rm horse-racing/jrdb/backtests/requests/BTDAY-0068.reselect
          git commit -m "RaceNote: reselect BTDAY-0068 from unused pool"
          git pull --rebase origin main
          git push origin HEAD:main
