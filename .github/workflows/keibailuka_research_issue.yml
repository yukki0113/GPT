name: keibailuka Historical Research via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  research:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[KEIBAILUKA_RESEARCH_REQUEST]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install duckdb requests
      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          body=os.environ['ISSUE_BODY']
          m=re.search(r'```json\s*(\{.*\})\s*```',body,re.S)
          req=json.loads(m.group(1) if m else body)
          open('/tmp/request.json','w',encoding='utf-8').write(json.dumps(req,ensure_ascii=False))
          PY
      - name: Run research
        id: research
        run: |
          set -o pipefail
          mkdir -p /tmp/keibailuka-research
          python horse-racing/fetch_keibailuka_blog/src/analyze_keibailuka_historical.py --request-json /tmp/request.json --output-dir /tmp/keibailuka-research | tee /tmp/summary.txt
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibailuka-research-${{ github.event.issue.number }}
          path: /tmp/keibailuka-research
          if-no-files-found: warn
      - name: Comment result
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "KEIBAILUKA_RESEARCH_RESULT"
            echo
            if [ -f /tmp/keibailuka-research/summary.md ]; then
              cat /tmp/keibailuka-research/summary.md
            else
              echo "research failed; inspect workflow logs"
            fi
            echo
            echo "artifact: keibailuka-research-${ISSUE_NUMBER}"
            echo "run_id: ${{ github.run_id }}"
            echo "research_outcome: ${{ steps.research.outcome }}"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          if [ "${{ steps.research.outcome }}" = "success" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          fi
