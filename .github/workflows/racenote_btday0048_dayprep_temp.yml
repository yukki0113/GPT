name: RaceNote BTDAY-0048 DAY PREP temp
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: write
  issues: write
jobs:
  build:
    if: startsWith(github.event.issue.title, '[RACENOTE_DAILY_BTDAY0048]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pyarrow pandas numpy jsonschema gdown
      - name: Prepare sources and build clean forecast input
        env:
          PYTHONPATH: horse-racing/jrdb/src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input /tmp/analysis_art /tmp/analysis /tmp/rrdb /tmp/rules /tmp/out
          gdown 'https://drive.google.com/uc?id=158Vmwgtiwhja3gMGTN0GMnq85IZ33TWR' -O /tmp/input/PACI260207.zip
          gdown 'https://drive.google.com/uc?id=1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/input/RaceReviewDB_CURRENT.zip
          gdown 'https://drive.google.com/uc?id=1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/input/NextWatch.zip
          gh run download 36437363166 --repo "$GITHUB_REPOSITORY" --name 'jrdb-post-race-parquet-refresh-36437363166' --dir /tmp/analysis_art
          tar -xJf /tmp/analysis_art/analysis-parquet-candidate.tar.xz -C /tmp/analysis
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path('/tmp/analysis/generations/analysis-v1_4-canonical-20260928-02/manifest.json')
          if not m.is_file(): raise SystemExit('analysis generation missing')
          Path('/tmp/analysis/current.json').write_text(json.dumps({
            'status':'CURRENT',
            'generation_id':'analysis-v1_4-canonical-20260928-02',
            'manifest':'generations/analysis-v1_4-canonical-20260928-02/manifest.json'
          },indent=2)+'\n')
          PY
          unzip -q /tmp/input/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
          unzip -q /tmp/input/NextWatch.zip -d /tmp/rules
          python horse-racing/jrdb/src/build_racenote_daily.py             --date 2026-02-07             --paci /tmp/input/PACI260207.zip             --analysis-root /tmp/analysis             --racereview-root /tmp/rrdb/postrace_review/v0_1             --next-watch-rules /tmp/rules/next_watch_candidate_rules_frozen.json             --output /tmp/out
          ROOT=/tmp/out/RaceNote_20260207
          test -s "$ROOT/manifest.json"
          test -s "$ROOT/validation_report.json"
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_prepare_forecast_input.py             --day-prep-root "$ROOT"             --output-root /tmp/forecast_prep             --selection-id BTDAY-0048             --date 2026-02-07             --main-sha "$MAIN_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/out/RaceNote_20260207')
          m=json.loads((root/'manifest.json').read_text())
          v=json.loads((root/'validation_report.json').read_text())
          h=json.loads(Path('/tmp/forecast_prep/day_prep_handoff.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          assert v.get('firewall',{}).get('target_result_exposed') is False
          assert h['market_blind'] is True
          assert h['target_market_opened'] is False
          assert h['result_opened'] is False
          readers=sorted(Path('/tmp/forecast_prep/reader').glob('*.json'))
          assert len(readers)==h['race_count']
          Path('/tmp/summary.json').write_text(json.dumps({
            'status':'PASS',
            'main_sha':h['main_sha'],
            'race_count':h['race_count'],
            'market_blind':h['market_blind'],
            'target_market_opened':h['target_market_opened'],
            'result_opened':h['result_opened'],
            'manifest_sha':h['reader_stripped_manifest_sha256'],
            'analysis_generation':m['sources']['analysis']['generation_id'],
            'rrdb_generation':m['sources']['rrdb'].get('generation_id')
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist clean prep to Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0048/20260207'
          mkdir -p "$TARGET/day_prep" "$TARGET/forecast_prep"
          cp /tmp/out/RaceNote_20260207/manifest.json "$TARGET/day_prep/manifest.json"
          cp /tmp/out/RaceNote_20260207/validation_report.json "$TARGET/day_prep/validation_report.json"
          cp -R /tmp/forecast_prep/. "$TARGET/forecast_prep/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'RaceNote: stage BTDAY-0048 clean forecast prep'
          git push origin HEAD:main
      - name: Upload clean prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTDAY-0048-FORECAST-PREP
          path: |
            /tmp/out/RaceNote_20260207/manifest.json
            /tmp/out/RaceNote_20260207/validation_report.json
            /tmp/forecast_prep/
          retention-days: 14
      - name: Comment result and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s /tmp/summary.json; then
            BODY="$(cat /tmp/summary.json)"
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "RACENOTE_DAILY_BTDAY0048_RESULT
\`\`\`json
${BODY}
\`\`\`"
            gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "BTDAY-0048 DAY PREP failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            exit 1
          fi
