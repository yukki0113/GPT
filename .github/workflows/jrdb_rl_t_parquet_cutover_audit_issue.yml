name: JRDB RL-T Parquet cutover audit via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_RLT_PARQUET_CUTOVER_AUDIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run cutover audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/rlt-cutover-audit
          python horse-racing/jrdb/src/audit_rl_t_training_research_parquet_cutover.py             --root .             --output /tmp/rlt-cutover-audit/audit.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-rlt-parquet-cutover-audit-${{ github.run_id }}
          path: /tmp/rlt-cutover-audit/audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}'             --body "RL-T Parquet cutover audit PASS. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --reason completed
