name: RaceNote Gen0.3 real-data prepare

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that produced the RaceNote artifact
        required: true
        type: string
      source_artifact_name:
        description: Exact RaceNote artifact name from source_run_id
        required: true
        type: string
      bundle_name:
        description: Exact race bundle file name, e.g. race_bundle_20260920_中山11R.json
        required: true
        type: string
      racereview_drive_file_id:
        description: Stable RaceReviewDB CURRENT Drive file ID
        required: false
        default: '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'
        type: string
      race_day_facts_json:
        description: Optional independent pre-result race-day facts JSON
        required: false
        default: '{}'
        type: string

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[RACENOTE_GEN03_PREPARE]'

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == 'yukki0113' &&
       startsWith(github.event.issue.title, '[RACENOTE_GEN03_PREPARE]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install gdown duckdb pyarrow

      - name: Parse prepare request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          INPUT_BUNDLE_NAME: ${{ inputs.bundle_name }}
          INPUT_RACEREVIEW_DRIVE_FILE_ID: ${{ inputs.racereview_drive_file_id }}
          INPUT_RACE_DAY_FACTS_JSON: ${{ inputs.race_day_facts_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event_name = os.environ.get('EVENT_NAME') or ''
          if event_name == 'issues':
              title = os.environ.get('ISSUE_TITLE') or ''
              prefix = os.environ['REQUEST_PREFIX']
              request_id = title[len(prefix):].strip()
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
                  raise SystemExit('invalid request_id')
              try:
                  request = json.loads(
                      (os.environ.get('ISSUE_BODY') or '').strip()
                  )
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f'Issue body must be raw JSON: {exc}'
                  ) from exc
              source_run_id = str(request.get('source_run_id') or '').strip()
              source_artifact_name = str(
                  request.get('source_artifact_name') or ''
              ).strip()
              bundle_name = str(request.get('bundle_name') or '').strip()
              racereview_drive_file_id = str(
                  request.get('racereview_drive_file_id')
                  or '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'
              ).strip()
              race_day_facts = request.get('race_day_facts')
              if race_day_facts is not None:
                  if not isinstance(race_day_facts, dict):
                      raise SystemExit(
                          'race_day_facts must be an object'
                      )
          else:
              request_id = 'manual-' + os.environ.get('GITHUB_RUN_ID', 'run')
              source_run_id = (
                  os.environ.get('INPUT_SOURCE_RUN_ID') or ''
              ).strip()
              source_artifact_name = (
                  os.environ.get('INPUT_SOURCE_ARTIFACT_NAME') or ''
              ).strip()
              bundle_name = (
                  os.environ.get('INPUT_BUNDLE_NAME') or ''
              ).strip()
              racereview_drive_file_id = (
                  os.environ.get('INPUT_RACEREVIEW_DRIVE_FILE_ID')
                  or '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'
              ).strip()
              raw_race_day_facts = (
                  os.environ.get('INPUT_RACE_DAY_FACTS_JSON')
                  or '{}'
              ).strip()
              try:
                  race_day_facts = json.loads(raw_race_day_facts)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f'race_day_facts_json must be JSON: {exc}'
                  ) from exc
              if race_day_facts == {}:
                  race_day_facts = None
              elif not isinstance(race_day_facts, dict):
                  raise SystemExit(
                      'race_day_facts_json must be an object'
                  )

          if not re.fullmatch(r'\d+', source_run_id):
              raise SystemExit('source_run_id must be numeric')
          if not source_artifact_name:
              raise SystemExit('source_artifact_name is required')
          if not re.fullmatch(
              r'race_bundle_\d{8}_.+\d{1,2}R\.json',
              bundle_name,
          ):
              raise SystemExit('bundle_name is invalid')
          if not re.fullmatch(
              r'[A-Za-z0-9_-]+',
              racereview_drive_file_id,
          ):
              raise SystemExit('racereview_drive_file_id is invalid')

          resolved = {
              'request_id': request_id,
              'source_run_id': int(source_run_id),
              'source_artifact_name': source_artifact_name,
              'bundle_name': bundle_name,
              'racereview_drive_file_id': racereview_drive_file_id,
              'race_day_facts': race_day_facts,
          }
          Path('/tmp/gen03_prepare_request.json').write_text(
              json.dumps(resolved, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if race_day_facts is not None:
              Path('/tmp/race_day_facts.json').write_text(
                  json.dumps(
                      race_day_facts,
                      ensure_ascii=False,
                      indent=2,
                  ) + '\n',
                  encoding='utf-8',
              )

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              f.write(f'SOURCE_RUN_ID={resolved["source_run_id"]}\n')
              f.write(
                  'SOURCE_ARTIFACT_NAME='
                  + resolved['source_artifact_name']
                  + '\n'
              )
              f.write(f'BUNDLE_NAME={resolved["bundle_name"]}\n')
              f.write(
                  'RACEREVIEW_DRIVE_ID='
                  + resolved['racereview_drive_file_id']
                  + '\n'
              )
              f.write(f'REQUEST_ID={resolved["request_id"]}\n')
              if race_day_facts is None:
                  f.write('HAS_RACE_DAY_FACTS=false\n')
              else:
                  f.write('HAS_RACE_DAY_FACTS=true\n')
          print(json.dumps(resolved, ensure_ascii=False))
          PY

      - name: Download source RaceNote artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/racenote_source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir /tmp/racenote_source
          find /tmp/racenote_source -maxdepth 3 -type f -print

      - name: Extract target RaceNote bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          source = Path('/tmp/racenote_source')
          outer_candidates = sorted(source.rglob('RaceNote_*.zip'))
          if len(outer_candidates) != 1:
              raise SystemExit(
                  f'expected exactly one RaceNote ZIP, found {outer_candidates}'
              )

          extracted = Path('/tmp/racenote_bundle')
          extracted.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(outer_candidates[0]) as archive:
              members = archive.namelist()
              wanted = os.environ['BUNDLE_NAME']
              matches = [
                  name
                  for name in members
                  if Path(name).name == wanted
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected one {wanted} in RaceNote ZIP; found {matches}'
                  )
              info = archive.getinfo(matches[0])
              if Path(info.filename).is_absolute() or '..' in Path(info.filename).parts:
                  raise SystemExit('unsafe RaceNote ZIP member')
              data = archive.read(info)
              target = extracted / wanted
              target.write_bytes(data)
              print(target)
          PY

      - name: Build Independent firewall view
        run: |
          set -euo pipefail
          mkdir -p /tmp/racenote_prepare/firewall
          python horse-racing/jrdb/src/racenote_gen0_2_input_firewall.py \
            "/tmp/racenote_bundle/$BUNDLE_NAME" \
            --output-dir /tmp/racenote_prepare/firewall
          test -s /tmp/racenote_prepare/firewall/independent_view.json

      - name: Attach independent race-day facts
        if: env.HAS_RACE_DAY_FACTS == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
            python horse-racing/jrdb/src/racenote_race_day_facts.py \
              --independent-view /tmp/racenote_prepare/firewall/independent_view.json \
              --race-day-facts /tmp/race_day_facts.json \
              --output /tmp/racenote_prepare/firewall/independent_view_with_race_day_facts.json
          mv \
            /tmp/racenote_prepare/firewall/independent_view_with_race_day_facts.json \
            /tmp/racenote_prepare/firewall/independent_view.json
          test -s /tmp/racenote_prepare/firewall/independent_view.json

      - name: Download and extract RaceReviewDB CURRENT
        run: |
          set -euo pipefail
          mkdir -p /tmp/racereview_download /tmp/racereview_extract
          gdown "$RACEREVIEW_DRIVE_ID" \
            -O /tmp/racereview_download/RaceReviewDB_CURRENT.zip
          test -s /tmp/racereview_download/RaceReviewDB_CURRENT.zip
          python -m zipfile -t \
            /tmp/racereview_download/RaceReviewDB_CURRENT.zip >/dev/null
          python - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path('/tmp/racereview_download/RaceReviewDB_CURRENT.zip')
          destination = Path('/tmp/racereview_extract')
          resolved = destination.resolve()

          with zipfile.ZipFile(source) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt RaceReview member: {bad}')
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  try:
                      target.relative_to(resolved)
                  except ValueError as exc:
                      raise SystemExit(
                          f'unsafe RaceReview ZIP member: {member.filename}'
                      ) from exc
              archive.extractall(destination)

          current_files = sorted(destination.rglob('current.json'))
          if len(current_files) != 1:
              raise SystemExit(
                  f'expected one RaceReview current.json; found {current_files}'
              )
          root = current_files[0].parent
          Path('/tmp/racereview_root.txt').write_text(
              str(root),
              encoding='utf-8',
          )
          print(root)
          PY

      - name: Build RaceReview evidence sidecar
        run: |
          set -euo pipefail
          RR_ROOT="$(cat /tmp/racereview_root.txt)"
          PYTHONPATH=horse-racing/jrdb/src \
            python horse-racing/jrdb/src/racenote_racereview_adapter.py \
              --independent-view /tmp/racenote_prepare/firewall/independent_view.json \
              --racereview-root "$RR_ROOT" \
              --per-horse-limit 5 \
              --output /tmp/racenote_prepare/racereview_evidence.json

      - name: Build Horse Evidence Cards
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
            python horse-racing/jrdb/src/racenote_horse_evidence_card.py \
              --racereview-evidence /tmp/racenote_prepare/racereview_evidence.json \
              --output /tmp/racenote_prepare/horse_evidence_cards.json

      - name: Build General Evidence
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
            python horse-racing/jrdb/src/racenote_general_evidence.py \
              --independent-view /tmp/racenote_prepare/firewall/independent_view.json \
              --racereview-card /tmp/racenote_prepare/horse_evidence_cards.json \
              --output /tmp/racenote_prepare/general_evidence.json

      - name: Build All-Runner Synthesis authoring request
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src python - <<'PY'
          import json
          from pathlib import Path
          from racenote_all_runner_synthesis import build_synthesis_request

          general_path = Path('/tmp/racenote_prepare/general_evidence.json')
          general = json.loads(general_path.read_text(encoding='utf-8'))
          request = build_synthesis_request(general)
          output = Path('/tmp/racenote_prepare/all_runner_synthesis_request.json')
          output.write_text(
              json.dumps(request, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(
              json.dumps(
                  {
                      'status': 'PASS',
                      'runner_count': len(request['horses']),
                      'target': request['target'],
                      'output': str(output),
                  },
                  ensure_ascii=False,
              )
          )
          PY

      - name: Write compact prepare summary
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src python - <<'PY'
          import json
          from pathlib import Path

          general = json.loads(
              Path('/tmp/racenote_prepare/general_evidence.json').read_text(
                  encoding='utf-8'
              )
          )
          rr = json.loads(
              Path('/tmp/racenote_prepare/racereview_evidence.json').read_text(
                  encoding='utf-8'
              )
          )
          cards = json.loads(
              Path('/tmp/racenote_prepare/horse_evidence_cards.json').read_text(
                  encoding='utf-8'
              )
          )

          summary = {
              'status': 'PASS',
              'target': general['target'],
              'runner_count': len(general['horses']),
              'racereview_generation_id': rr['source'].get('generation_id'),
              'racereview_history_status_counts': {},
              'prediction_interpretation_state_counts': {
                  'data_trend': {},
                  'racereview': {},
              },
              'hidden_strength_horse_nos': [],
              'fragile_form_horse_nos': [],
              'race_day_facts_status': (
                  general['race_data_context']['race_day_facts']['status']
              ),
              'race_day_facts_source_kind': (
                  general['race_data_context']['race_day_facts']['source_kind']
              ),
              'next_stage': general['next_stage'],
          }

          for horse in rr['horses']:
              status = horse.get('history_status') or 'UNKNOWN'
              counts = summary['racereview_history_status_counts']
              counts[status] = counts.get(status, 0) + 1

          for horse in general['horses']:
              interpretation = horse['prediction_interpretation']
              trend = interpretation['data_trend']['state']
              review = interpretation['racereview']['state']
              trend_counts = summary[
                  'prediction_interpretation_state_counts'
              ]['data_trend']
              review_counts = summary[
                  'prediction_interpretation_state_counts'
              ]['racereview']
              trend_counts[trend] = trend_counts.get(trend, 0) + 1
              review_counts[review] = review_counts.get(review, 0) + 1

          for card in cards['horses']:
              profile = card.get('profile') or {}
              hidden = profile.get('hidden_strength') or {}
              fragile = profile.get('fragile_form') or {}
              if hidden.get('status') not in (None, '', 'NONE'):
                  summary['hidden_strength_horse_nos'].append(
                      card['horse_no']
                  )
              if fragile.get('status') not in (None, '', 'NONE'):
                  summary['fragile_form_horse_nos'].append(
                      card['horse_no']
                  )

          Path('/tmp/racenote_prepare/prepare_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload prepared Gen0.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: racenote-gen0-3-prepare-${{ github.run_id }}
          path: /tmp/racenote_prepare/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Comment prepare result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path('/tmp/racenote_prepare/prepare_summary.json')
          if summary_path.is_file():
              summary = json.loads(
                  summary_path.read_text(encoding='utf-8')
              )
          else:
              summary = {
                  'status': 'FAIL',
                  'error': 'prepare_summary.json missing',
              }

          request_path = Path('/tmp/gen03_prepare_request.json')
          if request_path.is_file():
              request = json.loads(
                  request_path.read_text(encoding='utf-8')
              )
          else:
              request = {}

          result = {
              'request_id': request.get('request_id'),
              'status': summary.get('status', 'FAIL'),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'artifact_name': (
                  'racenote-gen0-3-prepare-'
                  + os.environ['GITHUB_RUN_ID']
              ),
              'target': summary.get('target'),
              'runner_count': summary.get('runner_count'),
              'racereview_generation_id': summary.get(
                  'racereview_generation_id'
              ),
              'race_day_facts_status': summary.get(
                  'race_day_facts_status'
              ),
              'race_day_facts_source_kind': summary.get(
                  'race_day_facts_source_kind'
              ),
          }
          Path('/tmp/gen03_prepare_comment.md').write_text(
              'RACENOTE_GEN03_PREPARE_RESULT\n```json\n'
              + json.dumps(result, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/gen03_prepare_comment.md

      - name: Close prepare issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY"
