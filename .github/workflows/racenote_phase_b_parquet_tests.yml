name: RaceNote Phase B Parquet native tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/racenote_analysis_backend.py'
      - 'horse-racing/jrdb/src/racenote_history_engine.py'
      - 'horse-racing/jrdb/src/racenote_history_enrichment.py'
      - 'horse-racing/jrdb/src/racenote_request.py'
      - 'horse-racing/jrdb/tests/test_racenote_analysis_parquet_backend.py'
      - '.github/workflows/racenote_phase_b_parquet_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_analysis_backend.py'
      - 'horse-racing/jrdb/src/racenote_history_engine.py'
      - 'horse-racing/jrdb/src/racenote_history_enrichment.py'
      - 'horse-racing/jrdb/src/racenote_request.py'
      - 'horse-racing/jrdb/tests/test_racenote_analysis_parquet_backend.py'
      - '.github/workflows/racenote_phase_b_parquet_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet dependencies
        run: python -m pip install -r tools/data-storage/requirements.txt
      - name: Compile RaceNote sources
        run: python -m py_compile horse-racing/jrdb/src/racenote_analysis_backend.py horse-racing/jrdb/src/racenote_history_engine.py horse-racing/jrdb/src/racenote_history_enrichment.py horse-racing/jrdb/src/racenote_request.py
      - name: Run Phase B focused tests
        working-directory: horse-racing/jrdb/tests
        run: python -m unittest -v test_racenote_analysis_parquet_backend
