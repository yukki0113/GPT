name: JRDB RL Retirement Final Audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  final-audit:
    if: ${{ github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[JRDB_RL_RETIREMENT_FINAL_AUDIT]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final retirement audit
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rl-retirement-final
          python horse-racing/jrdb/src/audit_rl_retirement_final.py \
            --output /tmp/rl-retirement-final/final_audit.json
      - name: Upload formal audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-rl-retirement-final-${{ github.run_id }}
          path: /tmp/rl-retirement-final/final_audit.json
          if-no-files-found: error
          retention-days: 90
      - name: Comment audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_PATH: /tmp/rl-retirement-final/final_audit.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['AUDIT_PATH'])
          if p.exists():
              r=json.loads(p.read_text(encoding='utf-8'))
              body='JRDB_RL_RETIREMENT_FINAL_AUDIT_RESULT\n\n'+json.dumps({
                'status':r.get('status'),
                'source_commit':r.get('source_commit'),
                'active_workflow_count':r.get('active_workflow_count'),
                'summary':r.get('summary'),
                'failure_count':r.get('failure_count'),
                'failures':r.get('failures')
              },ensure_ascii=False,indent=2)
          else:
              body='JRDB_RL_RETIREMENT_FINAL_AUDIT_RESULT\n\n{"status":"FAIL","reason":"audit output missing"}'
          Path('/tmp/rl-retirement-final/comment.md').write_text(body,encoding='utf-8')
          PY
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/rl-retirement-final/comment.md
      - name: Enforce final audit gate
        if: steps.audit.outcome != 'success'
        run: exit 1
