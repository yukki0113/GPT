name: RRDB Next-Watch 0926-0927 Evaluation Temp

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    if: github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[RRDB_NEXTWATCH_EVAL_TEMP]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check duckdb gdown

      - name: Download inputs
        run: |
          mkdir -p /tmp/rrdb_eval
          gdown 1UwNfrupMTHRPhkzULPvClGre4MWz2TFg -O /tmp/rrdb_eval/RaceReviewDB_CURRENT.zip
          gdown 1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr -O /tmp/rrdb_eval/rules.zip
          gdown 1PSYw6uL2Gx-rbtcJsgsGFZZNGTnMc4od -O /tmp/rrdb_eval/PACI260926.zip
          gdown 1G57s0Ix5Xb6AcKfZ2HrpOvasLC05dYg8 -O /tmp/rrdb_eval/PACI260927.zip
          gdown 1bkAIzKRcQ16RvYEbb7ZNBk_pNhbs9S2A -O /tmp/rrdb_eval/SED260926.zip
          gdown 1Vb3DsKz2hEA-FFHG-00ZwjrDTxCEA3qI -O /tmp/rrdb_eval/SED260927.zip
          python -m zipfile -t /tmp/rrdb_eval/RaceReviewDB_CURRENT.zip >/dev/null

      - name: Run reverse selectors
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          mkdir -p /tmp/rrdb_eval/work26 /tmp/rrdb_eval/work27
          python horse-racing/jrdb/src/jrdb_next_watch_reverse.py \
            --race-date 2026-09-26 \
            --paci-zip /tmp/rrdb_eval/PACI260926.zip \
            --current-zip /tmp/rrdb_eval/RaceReviewDB_CURRENT.zip \
            --turn5-zip /tmp/rrdb_eval/rules.zip \
            --work-root /tmp/rrdb_eval/work26 \
            --output-json /tmp/rrdb_eval/reverse26.json
          python horse-racing/jrdb/src/jrdb_next_watch_reverse.py \
            --race-date 2026-09-27 \
            --paci-zip /tmp/rrdb_eval/PACI260927.zip \
            --current-zip /tmp/rrdb_eval/RaceReviewDB_CURRENT.zip \
            --turn5-zip /tmp/rrdb_eval/rules.zip \
            --work-root /tmp/rrdb_eval/work27 \
            --output-json /tmp/rrdb_eval/reverse27.json

      - name: Settle against SED
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path

          root = Path('/tmp/rrdb_eval')

          def parse_int(raw):
              s = raw.decode('ascii', errors='ignore').strip()
              return int(s) if s.isdigit() else 0

          def parse_sed(path):
              out = {}
              with zipfile.ZipFile(path) as z:
                  member = next(n for n in z.namelist() if Path(n).name.upper().startswith('SED'))
                  data = z.read(member)
              for raw in data.splitlines():
                  if len(raw) < 356:
                      continue
                  key = raw[0:10].decode('ascii', errors='ignore')
                  finish = parse_int(raw[140:142])
                  place_pay = parse_int(raw[348:355])
                  out[key] = {'finish': finish, 'place_pay': place_pay}
              return out

          all_rows = []
          summaries = []
          for date, revname, sedname in [
              ('2026-09-26','reverse26.json','SED260926.zip'),
              ('2026-09-27','reverse27.json','SED260927.zip'),
          ]:
              rev = json.loads((root/revname).read_text(encoding='utf-8'))
              sed = parse_sed(root/sedname)
              for grade in ('S','A'):
                  items = rev[grade.lower()]
                  rows = []
                  for x in items:
                      k = x['target_race_horse_key']
                      if k not in sed:
                          raise SystemExit(f'missing SED join {date} {grade} {k} {x.get("horse_name")}')
                      r = sed[k]
                      row = {
                          'date': date,
                          'grade': grade,
                          'horse_name': x.get('horse_name'),
                          'target_race_key': x.get('target_race_key'),
                          'race_no': x.get('target_race_no'),
                          'horse_no': x.get('target_horse_no'),
                          'finish': r['finish'],
                          'place_pay': r['place_pay'],
                          'hit': r['place_pay'] > 0,
                          'matched_rules': x.get('matched_rules') or [],
                      }
                      rows.append(row)
                      all_rows.append(row)
                  n = len(rows)
                  hits = sum(r['hit'] for r in rows)
                  payout = sum(r['place_pay'] for r in rows)
                  summaries.append({
                      'date': date, 'grade': grade, 'n': n, 'hits': hits,
                      'hit_rate': hits/n if n else None,
                      'stake_yen': n*100,
                      'payout_yen': payout,
                      'roi': payout/(n*100) if n else None,
                  })

          for grade in ('S','A','S+A'):
              if grade == 'S+A':
                  rows = all_rows
              else:
                  rows = [r for r in all_rows if r['grade']==grade]
              n=len(rows); hits=sum(r['hit'] for r in rows); payout=sum(r['place_pay'] for r in rows)
              summaries.append({
                  'date':'TOTAL','grade':grade,'n':n,'hits':hits,
                  'hit_rate':hits/n if n else None,'stake_yen':n*100,
                  'payout_yen':payout,'roi':payout/(n*100) if n else None,
              })

          result = {'status':'PASS','summary':summaries,'rows':all_rows}
          (root/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY

      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/rrdb_eval/result.json').read_text(encoding='utf-8'))
          lines=['RRDB_NEXTWATCH_EVAL_RESULT','', '### Summary','', '| Date | Grade | N | Hits | Place rate | Stake | Payout | ROI |','|---|---:|---:|---:|---:|---:|---:|---:|']
          for x in r['summary']:
              hr='-' if x['hit_rate'] is None else f"{x['hit_rate']*100:.1f}%"
              roi='-' if x['roi'] is None else f"{x['roi']*100:.1f}%"
              lines.append(f"| {x['date']} | {x['grade']} | {x['n']} | {x['hits']} | {hr} | ¥{x['stake_yen']:,} | ¥{x['payout_yen']:,} | {roi} |")
          lines += ['', '### Horses', '', '| Date | Grade | Race | No | Horse | Finish | Place payout | Hit | Rules |','|---|---|---:|---:|---|---:|---:|---|---|']
          for x in r['rows']:
              lines.append(f"| {x['date']} | {x['grade']} | {x['race_no']}R | {x['horse_no']} | {x['horse_name']} | {x['finish']} | ¥{x['place_pay']:,} | {'○' if x['hit'] else ''} | {','.join(x['matched_rules'])} |")
          Path('/tmp/rrdb_eval/comment.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/rrdb_eval/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
