name: RaceLap Forward Refresh Tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/jrdb_race_lap_forward_refresh.py'
      - 'horse-racing/jrdb/tests/test_jrdb_race_lap_forward_refresh.py'
      - '.github/workflows/racelap_forward_refresh_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/data-storage/requirements.txt pytest
      - name: Forward refresh regression
        env:
          PYTHONPATH: horse-racing/jrdb/src:horse-racing/jrdb/tests
        run: python -m pytest -q horse-racing/jrdb/tests/test_jrdb_race_lap_forward_refresh.py
