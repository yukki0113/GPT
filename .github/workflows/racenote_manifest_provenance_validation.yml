name: RaceNote manifest provenance validation

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/build_racenote_daily.py'
      - 'horse-racing/jrdb/tests/test_racenote_daily_build_d4.py'
      - '.github/workflows/racenote_manifest_provenance_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema pytest
      - name: Run Day Prep manifest provenance regression
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: python -m pytest -q horse-racing/jrdb/tests/test_racenote_daily_build_d4.py
