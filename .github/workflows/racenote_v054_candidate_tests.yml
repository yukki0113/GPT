name: RaceNote v0.5.4 candidate tests

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_*v054*.py'
      - 'horse-racing/jrdb/src/racenote_save_venue_batch_v046.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v052.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v053.py'
      - 'horse-racing/jrdb/src/jrdb_raw.py'
      - 'horse-racing/jrdb/tests/test_racenote_v054*.py'
      - 'horse-racing/jrdb/docs/racenote/*v0_5_4*'
      - '.github/workflows/racenote_v054_candidate_tests.yml'
  push:
    paths:
      - 'horse-racing/jrdb/src/racenote_*v054*.py'
      - 'horse-racing/jrdb/src/racenote_save_venue_batch_v046.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v052.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v053.py'
      - 'horse-racing/jrdb/src/jrdb_raw.py'
      - 'horse-racing/jrdb/tests/test_racenote_v054*.py'
      - '.github/workflows/racenote_v054_candidate_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'duckdb==1.1.3' 'jsonschema>=4.22,<5' pytest
      - name: Compile v0.5.4 and KYI parser
        working-directory: horse-racing/jrdb
        run: |
          python -m py_compile \
            src/jrdb_raw.py \
            src/racenote_save_venue_batch_v046.py \
            src/racenote_decision_core_v052.py \
            src/racenote_decision_core_v053.py \
            src/racenote_reader_v054.py \
            src/racenote_decision_core_v054.py \
            src/racenote_v054_evidence.py \
            src/racenote_v054_kyi_bundle.py \
            src/racenote_v054_single_day.py
      - name: v0.5.4 regression tests
        working-directory: horse-racing/jrdb/tests
        env:
          PYTHONPATH: ../src
        run: python -m pytest -q test_racenote_v054_evidence.py test_racenote_v054_reader.py test_racenote_v053_contract.py
