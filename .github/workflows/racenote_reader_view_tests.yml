name: RaceNote Reader View tests

on:
  push:
    paths:
      - 'horse-racing/jrdb/src/racenote_reader_view.py'
      - 'horse-racing/jrdb/src/racenote_reader_zip.py'
      - 'horse-racing/jrdb/tests/test_racenote_reader_view.py'
      - 'horse-racing/jrdb/tests/test_racenote_reader_zip.py'
      - '.github/workflows/racenote_reader_view_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_reader_view.py'
      - 'horse-racing/jrdb/src/racenote_reader_zip.py'
      - 'horse-racing/jrdb/tests/test_racenote_reader_view.py'
      - 'horse-racing/jrdb/tests/test_racenote_reader_zip.py'
      - '.github/workflows/racenote_reader_view_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Reader View adapters
        working-directory: horse-racing/jrdb
        run: |
          python -m py_compile \
            src/racenote_reader_view.py \
            src/racenote_reader_zip.py

      - name: Run Reader View regressions
        working-directory: horse-racing/jrdb/tests
        run: |
          python -m unittest -v \
            test_racenote_reader_view \
            test_racenote_reader_zip
