name: RL-T Warehouse Direct Materialization Smoke

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RL_T_WAREHOUSE_DIRECT_MATERIALIZE]')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check 'requests==2.34.2'

      - name: Download accepted final manifest
        run: |
          mkdir -p /tmp/rlt_direct/final /tmp/rlt_direct/report
          python - <<'PY'
          import requests
          from pathlib import Path
          target=Path('/tmp/rlt_direct/final/manifest.json')
          with requests.get(
              'https://drive.usercontent.google.com/download',
              params={'id':'1jUX9geM4IrOcWygzbSTGVsgCJ37ULXQN','export':'download','confirm':'t'},
              stream=True,
              timeout=(20,180),
          ) as r:
              r.raise_for_status()
              with target.open('wb') as h:
                  for block in r.iter_content(1024*1024):
                      if block:
                          h.write(block)
          PY

      - name: Materialize accepted RL-T Warehouse assets directly
        run: |
          python horse-racing/jrdb/src/materialize_jrdb_warehouse_from_object_index.py \
            --warehouse-manifest /tmp/rlt_direct/final/manifest.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_bac_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_kyi_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_cha_a_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_cha_b_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_cyb_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_sed_a_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_sed_b_v1.json \
            --drive-index horse-racing/jrdb/config/warehouse_drive_index_ukc_v1.json \
            --output-root /tmp/rlt_direct/warehouse \
            --families BAC KYI CHA CYB SED UKC \
            --result-json /tmp/rlt_direct/report/materialize.json \
            > /tmp/rlt_direct/report/materialize_stdout.log

      - name: Verify exact accepted coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/rlt_direct/report/materialize.json').read_text(encoding='utf-8'))
          if report.get('status')!='PASS':
              raise SystemExit('materialization status is not PASS')
          if report.get('generation_id')!='jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('generation mismatch')
          if report.get('asset_count')!=96:
              raise SystemExit('expected 96 RL-T Warehouse assets, got '+str(report.get('asset_count')))
          counts={}
          for asset in report['assets']:
              counts[asset['family']]=counts.get(asset['family'],0)+1
          if counts!={'BAC':16,'KYI':16,'CHA':16,'CYB':16,'SED':16,'UKC':16}:
              raise SystemExit('family coverage mismatch: '+repr(counts))
          Path('/tmp/rlt_direct/report/coverage.json').write_text(json.dumps(counts,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/rlt_direct/report/materialize.json')
          if p.exists():
              r=json.loads(p.read_text(encoding='utf-8'))
              result={'status':r.get('status'),'generation_id':r.get('generation_id'),'asset_count':r.get('asset_count'),'families':r.get('families')}
          else:
              result={'status':'FAIL','message':'materialize result missing'}
          Path('/tmp/result.md').write_text('RL_T_WAREHOUSE_DIRECT_MATERIALIZE_RESULT\n'+json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlt-warehouse-direct-materialize-${{ github.run_id }}
          path: /tmp/rlt_direct/report/
          if-no-files-found: warn
          retention-days: 30

      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
