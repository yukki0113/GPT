name: JRDB Newspaper Day Build via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  build-day:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEWSPAPER_DAY_REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          req = json.loads((os.environ.get("ISSUE_BODY") or "").strip())
          date = str(req.get("date") or "").strip()
          revision = req.get("revision", 1)
          raw_run_id = req.get("raw_run_id")
          artifact_name = str(req.get("artifact_name") or "").strip()
          analysis_bundle_drive_file_id = str(req.get("analysis_bundle_drive_file_id") or "").strip()
          analysis_generation_id = str(req.get("analysis_generation_id") or "").strip()
          analysis_manifest_sha256 = str(req.get("analysis_manifest_sha256") or "").strip().lower()

          if not re.fullmatch(r"20\d{6}", date):
              raise SystemExit("date must be YYYYMMDD")
          if not isinstance(revision, int) or isinstance(revision, bool) or revision < 1:
              raise SystemExit("revision must be integer >= 1")
          if not isinstance(raw_run_id, int) or isinstance(raw_run_id, bool) or raw_run_id <= 0:
              raise SystemExit("raw_run_id must be positive integer")
          if artifact_name != f"jrdb-raw-{date}":
              raise SystemExit(f"artifact_name must be jrdb-raw-{date}")

          Path("/tmp/request.json").write_text(
              json.dumps({
                  "date": date,
                  "revision": revision,
                  "raw_run_id": raw_run_id,
                  "artifact_name": artifact_name,
                  "analysis_bundle_drive_file_id": analysis_bundle_drive_file_id,
                  "analysis_generation_id": analysis_generation_id,
                  "analysis_manifest_sha256": analysis_manifest_sha256,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REQUEST_DATE={date}\n")
              env.write(f"REQUEST_REVISION={revision}\n")
              env.write(f"RAW_RUN_ID={raw_run_id}\n")
              env.write(f"RAW_ARTIFACT={artifact_name}\n")
              env.write(f"OUTPUT_ARTIFACT=jrdb-newspaper-day-{date}\n")
          PY

      - name: Verify raw run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.status + "/" + (.conclusion // "")')"
          test "$STATUS" = "completed/success"

      - name: Download raw artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/raw
          mkdir -p /tmp/raw
          gh run download "$RAW_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$RAW_ARTIFACT" --dir /tmp/raw
          find /tmp/raw -maxdepth 4 -type f -print

      - name: Build audited day package
        run: |
          set -euo pipefail
          PACI="$(find /tmp/raw -type f -name "PACI${REQUEST_DATE:2}.zip" -print -quit)"
          test -n "$PACI"
          rm -rf /tmp/day
          PYTHONPATH=horse-racing/jrdb/src python horse-racing/jrdb/src/jrdb_newspaper_day_build.py             --paci "$PACI"             --date "$REQUEST_DATE"             --revision "$REQUEST_REVISION"             --output-dir /tmp/day             > /tmp/day-result.json

          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("/tmp/day/audit.json").read_text(encoding="utf-8"))
          manifest=json.loads(Path("/tmp/day/manifest.json").read_text(encoding="utf-8"))
          if audit.get("status") != "PASS":
              raise SystemExit("day audit is not PASS")
          if not audit.get("history_coverage_complete"):
              raise SystemExit("history coverage incomplete")
          expected=int((manifest.get("completeness") or {}).get("expected_races") or 0)
          ready=int((manifest.get("completeness") or {}).get("ready_races") or 0)
          if expected <= 0 or expected != ready:
              raise SystemExit("race completeness mismatch")
          PY

      - name: Resolve canonical Analysis and attach STANDARD Edge
        env:
          PYTHONPATH: horse-racing/jrdb/src:tools/data-storage
        run: |
          set -euo pipefail
          PACI="$(find /tmp/raw -type f -name "PACI${REQUEST_DATE:2}.zip" -print -quit)"
          python - <<'PY'
          import json, subprocess, tarfile
          from pathlib import Path
          from jrdb_analysis_parquet_current import resolve_current
          from jrdb_newspaper_query_edge_day import _error_day
          req=json.loads(Path('/tmp/request.json').read_text())
          root=Path('/tmp/analysis_parquet')
          try:
              file_id=req['analysis_bundle_drive_file_id']
              if not file_id or not req['analysis_generation_id'] or not req['analysis_manifest_sha256']:
                  raise ValueError('canonical Analysis bundle identity missing from request')
              bundle=Path('/tmp/analysis-parquet-current.tar.xz')
              subprocess.run(['curl','--fail','--location','--retry','3',
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  '--output',str(bundle)],check=True)
              root.mkdir(parents=True,exist_ok=True)
              with tarfile.open(bundle,'r:xz') as archive:
                  for member in archive.getmembers():
                      target=(root/member.name).resolve()
                      if root.resolve() not in (target,*target.parents) or member.issym() or member.islnk():
                          raise ValueError('unsafe Analysis archive member')
                  archive.extractall(root)
              report=resolve_current(root)
              import hashlib
              sha=hashlib.sha256(Path(report['manifest']).read_bytes()).hexdigest()
              if report['generation_id']!=req['analysis_generation_id'] or sha!=req['analysis_manifest_sha256']:
                  raise ValueError('canonical Analysis generation or manifest SHA mismatch')
          except Exception as exc:
              _error_day(Path('/tmp/day'),Path('/tmp/day-edge'),f'Analysis unavailable: {exc}')
          PY
          if test -d /tmp/day-edge; then
            rm -rf /tmp/day
            mv /tmp/day-edge /tmp/day
          else
            python horse-racing/jrdb/src/jrdb_newspaper_query_edge_day.py \
              --base-day /tmp/day --output-dir /tmp/day-edge --paci "$PACI" \
              --analysis-root /tmp/analysis_parquet > /tmp/edge-result.json
            rm -rf /tmp/day
            mv /tmp/day-edge /tmp/day
          fi

      - name: Attach optional v0.5 Edge addon
        env:
          PYTHONPATH: horse-racing/jrdb/src:tools/data-storage
        run: |
          set -euo pipefail
          PACI="$(find /tmp/raw -type f -name "PACI${REQUEST_DATE:2}.zip" -print -quit)"
          python - "$PACI" <<'PY'
          import json, sys
          from pathlib import Path
          from jrdb_newspaper_edge_v05_preview import build_preview

          archive = Path('horse-racing/jrdb/config/edgedb/v0_5/frozen/v05_2026_oos_eval_artifact.zip')
          result = build_preview(Path('/tmp/day'), Path('/tmp/day-v05'), Path(sys.argv[1]),
                                 Path('/tmp/analysis_parquet'), archive)
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
          rm -rf /tmp/day
          mv /tmp/day-v05 /tmp/day

      - name: Upload day artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_ARTIFACT }}
          path: /tmp/day/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Comment success and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit=json.loads(Path("/tmp/day/audit.json").read_text(encoding="utf-8"))
          manifest=json.loads(Path("/tmp/day/manifest.json").read_text(encoding="utf-8"))
          result={
              "status":"success",
              "run_id":int(os.environ["RUN_ID"]),
              "artifact_name":os.environ["OUTPUT_ARTIFACT"],
              "audit_status":audit["status"],
              "date":manifest["date"],
              "race_count":audit["race_count"],
              "venue_codes":audit["venue_codes"],
              "totals":audit["totals"],
              "history_coverage_complete":audit["history_coverage_complete"],
              "completeness":manifest["completeness"],
          }
          Path("/tmp/comment.md").write_text(
              "JRDB_NEWSPAPER_DAY_RESULT\n```json\n"
              + json.dumps(result,ensure_ascii=False,indent=2)
              + "\n```\n",
              encoding="utf-8",
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Comment failure and close
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "JRDB Newspaper day build failed. Workflow run: $RUN_URL"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason not_planned
