name: RaceNote BTDAY-0066 v052 freeze temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0066/20260719/v052/RUN_FREEZE'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save venues, Freeze, Verify
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0066/20260719/v052'
          for V in 函館 小倉 福島; do
            python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/$V.json"
          done
          python horse-racing/jrdb/src/racenote_v052_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v052_single_day.py verify --root "$ROOT"
      - name: Commit immutable Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0066/20260719/v052/authored_decisions \
                  horse-racing/jrdb/backtests/BTDAY-0066/20260719/v052/frozen
          git commit -m 'RaceNote: freeze BTDAY-0066 v052 clean blind'
          git pull --rebase origin main
          git push origin HEAD:main
