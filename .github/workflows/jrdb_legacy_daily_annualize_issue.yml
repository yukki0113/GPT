name: JRDB Legacy Daily Family Annualize via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[JRDB_LEGACY_DAILY_ANNUALIZE_REQUEST]'

jobs:
  annualize:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_LEGACY_DAILY_ANNUALIZE_REQUEST]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os
          from pathlib import Path

          req = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          family = str(req.get('family','')).upper()
          dates_by_year = req.get('dates_by_year') or {}
          workers = int(req.get('workers', 6))
          if family not in {'ZED','ZKB'}:
              raise SystemExit('family must be ZED or ZKB')
          if not isinstance(dates_by_year, dict) or not dates_by_year:
              raise SystemExit('dates_by_year must be a non-empty object')
          normalized = {}
          for year_raw, dates in dates_by_year.items():
              year = int(year_raw)
              if year < 1999 or year > 2025:
                  raise SystemExit(f'unsupported year: {year}')
              if not isinstance(dates, list) or not dates:
                  raise SystemExit(f'dates for {year} must be a non-empty list')
              checked=[]
              seen=set()
              for raw in dates:
                  s=str(raw).replace('-','')
                  d=dt.datetime.strptime(s,'%Y%m%d').date()
                  if d.year != year:
                      raise SystemExit(f'date/year mismatch: {s} vs {year}')
                  if s in seen:
                      continue
                  seen.add(s); checked.append(s)
              normalized[str(year)] = sorted(checked)
          if not 1 <= workers <= 12:
              raise SystemExit('workers must be 1..12')
          resolved={'family':family,'dates_by_year':normalized,'workers':workers}
          Path('/tmp/request.json').write_text(json.dumps(resolved,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Install LZH reader
        run: python -m pip install --disable-pip-version-check 'libarchive-c>=5,<6'

      - name: Fetch legacy daily LZH and annualize
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import concurrent.futures
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path
          import libarchive

          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          family=req['family']
          dir_name={'ZED':'Zed','ZKB':'Zkb'}[family]
          root=Path('/tmp/jrdb_legacy_annualized')
          root.mkdir(parents=True,exist_ok=True)
          token=base64.b64encode(
              f"{os.environ['JRDB_USER']}:{os.environ['JRDB_PASSWORD']}".encode('utf-8')
          ).decode('ascii')
          auth=f'Basic {token}'

          def fetch_one(date):
              name=f'{family}{date[2:]}.lzh'
              url=f'https://jrdb.com/member/data/{dir_name}/{name}'
              request=urllib.request.Request(url,headers={
                  'Authorization':auth,
                  'User-Agent':'JRDB-Legacy-Annualizer/0.1',
                  'Accept':'application/octet-stream,*/*',
              })
              try:
                  with urllib.request.urlopen(request,timeout=45) as response:
                      payload=response.read()
              except urllib.error.HTTPError as error:
                  return {'date':date,'url':url,'status':error.code}
              source_sha=hashlib.sha256(payload).hexdigest()
              members=[]
              with libarchive.memory_reader(payload) as archive:
                  for entry in archive:
                      if entry.isdir:
                          continue
                      data=b''.join(entry.get_blocks())
                      members.append((Path(entry.pathname).name,data))
              expected=f'{family}{date[2:]}.txt'
              matches=[(n,b) for n,b in members if n.upper()==expected.upper()]
              if len(matches)!=1:
                  return {
                      'date':date,'url':url,'status':'EXTRACT_MISMATCH',
                      'members':[n for n,_ in members],
                      'source_sha256':source_sha,
                  }
              txt_name,txt_bytes=matches[0]
              return {
                  'date':date,'url':url,'status':200,
                  'source_size_bytes':len(payload),
                  'source_sha256':source_sha,
                  'txt_name':txt_name,
                  'txt_size_bytes':len(txt_bytes),
                  'txt_sha256':hashlib.sha256(txt_bytes).hexdigest(),
                  'txt_bytes':txt_bytes,
              }

          annual_rows=[]
          all_source_rows=[]
          failures=[]
          for year_s, dates in sorted(req['dates_by_year'].items()):
              year=int(year_s)
              with concurrent.futures.ThreadPoolExecutor(max_workers=req['workers']) as pool:
                  rows=list(pool.map(fetch_one,dates))
              rows=sorted(rows,key=lambda x:x['date'])
              all_source_rows.extend([{k:v for k,v in row.items() if k!='txt_bytes'} for row in rows])
              bad=[row for row in rows if row.get('status')!=200]
              if bad:
                  failures.extend(bad)
                  continue
              out=root/f'{family}_{year}.zip'
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
                  for row in rows:
                      zf.writestr(row['txt_name'],row['txt_bytes'])
              with zipfile.ZipFile(out) as zf:
                  corrupt=zf.testzip()
                  names=zf.namelist()
              if corrupt is not None:
                  raise SystemExit(f'corrupt annual zip {out.name}: {corrupt}')
              if len(names)!=len(dates):
                  raise SystemExit(f'member count mismatch {out.name}: {len(names)} != {len(dates)}')
              annual_rows.append({
                  'family':family,'year':year,'file_name':out.name,
                  'member_count':len(names),'size_bytes':out.stat().st_size,
                  'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              })

          manifest={
              'status':'success' if not failures else 'partial',
              'family':family,
              'year_count':len(req['dates_by_year']),
              'requested_source_count':sum(len(v) for v in req['dates_by_year'].values()),
              'annual_file_count':len(annual_rows),
              'failures':[{k:v for k,v in x.items() if k!='txt_bytes'} for x in failures],
              'annual_files':annual_rows,
              'sources':all_source_rows,
          }
          (root/'annualize_manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          if failures:
              sample=', '.join(f"{x['date']}:{x.get('status')}" for x in failures[:20])
              raise SystemExit(f'legacy source failures={len(failures)} sample={sample}')
          PY

      - name: Upload annualized artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-${{ github.event.issue.number }}-legacy-annualized
          path: /tmp/jrdb_legacy_annualized/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/jrdb_legacy_annualized/annualize_manifest.json').read_text(encoding='utf-8'))
          result={
              'status':'success',
              'run_id':int(os.environ['RUN_ID']),
              'artifact_name':f"jrdb-{os.environ['ISSUE_NUMBER']}-legacy-annualized",
              'family':m['family'],
              'requested_source_count':m['requested_source_count'],
              'annual_file_count':m['annual_file_count'],
              'annual_files':m['annual_files'],
          }
          Path('/tmp/comment.md').write_text(
              'JRDB_LEGACY_DAILY_ANNUALIZE_RESULT\n```json\n'+
              json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n',
              encoding='utf-8'
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "JRDB legacy daily annualize failed. Workflow run: $RUN_URL"
