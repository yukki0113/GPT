name: RaceNote BTDAY-0072 historical route retry
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0072/HISTORICAL_RETRY_TRIGGER'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown
      - name: Validate existing reservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('horse-racing/jrdb/config/racenote_backtest_day_pool_2026.json').read_text())
          rec=next(x for x in s['selections'] if x['selection_id']=='BTDAY-0072')
          assert rec['dates']==['2025-12-21']
          src=rec['sources'][0]
          assert src['source_mode']=='historical_warehouse'
          assert src['source_reference']=='jrdb_normalized_warehouse_v1_2010_2025_g20260921'
          row=next(x for x in s['days'] if x['date']=='2025-12-21' and x.get('source_mode')=='historical_warehouse')
          assert row['used'] is True and row['selection_id']=='BTDAY-0072'
          Path('/tmp/reservation.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Materialize SHA-pinned historical inputs
        run: |
          set -euo pipefail
          python tools/gpt_io/public_drive/fetch.py             --manifest horse-racing/jrdb/config/public_drive/racenote_historical_golden_20251228_v1.json             --output-root /tmp/historical             --receipt /tmp/historical/public_drive_fetch_receipt.json
          mkdir -p /tmp/historical/analysis /tmp/historical/rrdb
          tar -xJf /tmp/historical/analysis.tar.xz -C /tmp/historical/analysis
          unzip -q /tmp/historical/rrdb.zip -d /tmp/historical/rrdb
      - name: Build canonical historical v0.5.2 TURN 1 from accepted gate
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0072/20251221'
          test ! -e "$TARGET/operation_handoff.json"
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v052_from_historical_warehouse.py             --date 2025-12-21             --selection-id BTDAY-0072             --main-sha "$MAIN_SHA"             --equivalence-report horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json             --warehouse-current /tmp/historical/warehouse/current.json             --warehouse-asset-root /tmp/historical/warehouse             --analysis-root /tmp/historical/analysis             --racereview-root /tmp/historical/rrdb/postrace_review/v0_1             --binding horse-racing/jrdb/config/racenote_reader_v050_binding.json             --policy horse-racing/jrdb/docs/racenote/research-work/results/stage_c/reader_feature_policy_v0_5_candidate.json             --output-root "$TARGET"
          cp "$TARGET/day_prep/RaceNote_20251221/manifest.json" "$TARGET/day_prep/manifest.json"
          cp "$TARGET/day_prep/RaceNote_20251221/validation_report.json" "$TARGET/day_prep/validation_report.json"
          mkdir -p "$TARGET/source_audit"
          cp /tmp/historical/public_drive_fetch_receipt.json "$TARGET/source_audit/public_drive_fetch_receipt.json"
          cp /tmp/reservation.json "$TARGET/source_audit/reservation.json"
          cp horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json "$TARGET/source_audit/accepted_equivalence_gate.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0072/20251221')
          op=json.loads((root/'operation_handoff.json').read_text())
          se=json.loads((root/'v052/session.json').read_text())
          mf=json.loads((root/'day_prep/manifest.json').read_text())
          vr=json.loads((root/'day_prep/validation_report.json').read_text())
          assert op['status']=='READY_FOR_V052_AUTHORING'
          assert op['source_backend']=='historical_warehouse'
          assert op['source_generation_id']=='jrdb_normalized_warehouse_v1_2010_2025_g20260921'
          assert op['as_of_exclusive']=='2025-12-21'
          assert op['market_blind'] is True and op['result_opened'] is False and op['target_market_opened'] is False
          assert se['status']=='SESSION_SEALED'
          assert se['logic_version']=='RaceNote-Human-Context-Reader-0.5.2-candidate'
          assert se['market_blind'] is True and se['result_opened'] is False and se['target_market_opened'] is False
          assert mf['status']=='PASS' and vr['status']=='PASS'
          assert len(se['race_roster'])==op['race_count']
          PY
      - name: Commit immutable historical TURN 1
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0072/20251221'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET/day_prep/manifest.json" "$TARGET/day_prep/validation_report.json"
          git add "$TARGET/forecast_prep" "$TARGET/v052" "$TARGET/operation_handoff.json" "$TARGET/source_audit"
          git commit -m 'RaceNote: stage BTDAY-0072 historical v0.5.2 TURN 1'
          git pull --rebase origin main
          git push origin HEAD:main
