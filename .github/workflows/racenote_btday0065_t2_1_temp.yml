name: RaceNote BTDAY-0065 T2-1 Kyoto temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0065/T2_1_TRIGGER'
permissions:
  contents: write
jobs:
  save-kyoto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save Kyoto only
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0065/20260524/v052'
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/京都.json"
      - name: Commit Kyoto authored output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0065/20260524/v052/authored_decisions/京都.json
          git commit -m 'RaceNote: save BTDAY-0065 Kyoto v052 T2-1'
          git pull --rebase origin main
          git push origin HEAD:main
