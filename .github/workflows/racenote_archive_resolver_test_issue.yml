name: racenote-archive-resolver-test-issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  test:
    if: startsWith(github.event.issue.title, '[RACENOTE_ARCHIVE_RESOLVE_TEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse month
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          request = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          month = str(request.get('month', '')).strip()
          if not re.fullmatch(r'\d{6}', month):
              raise SystemExit('month must be YYYYMM')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as file:
              file.write(f'TARGET_MONTH={month}\n')
          PY

      - name: Resolve Archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=horse-racing/jrdb/src python \
            horse-racing/jrdb/src/resolve_racenote_archive_release.py \
            --repo "${{ github.repository }}" \
            --target-month "$TARGET_MONTH" \
            --output-dir /tmp/archive_resolver \
            --result-json /tmp/archive_resolution.json

      - name: Verify resolved contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/archive_resolution.json').read_text(encoding='utf-8'))
          if result.get('status') != 'resolved':
              raise SystemExit(f"Archive not resolved: {result}")
          validation = result.get('validation', {})
          if validation.get('coverage_mode') != 'full_month':
              raise SystemExit('coverage_mode mismatch')
          if validation.get('publication_status') != 'publishable':
              raise SystemExit('publication_status mismatch')
          if validation.get('provenance_status') != 'complete':
              raise SystemExit('provenance_status mismatch')
          if not Path(result['archive_path']).is_file():
              raise SystemExit('resolved archive file missing')
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: racenote-archive-resolver-test-${{ github.run_id }}
          path: /tmp/archive_resolution.json
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/archive_resolution.json')
          result = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          comment = {
              'status': result.get('status', 'failure'),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'target_month': result.get('target_month'),
              'tag_name': result.get('tag_name'),
              'asset_name': result.get('asset_name'),
              'archive_sha256': result.get('archive_sha256'),
              'coverage_mode': result.get('validation', {}).get('coverage_mode'),
              'publication_status': result.get('validation', {}).get('publication_status'),
              'race_count': result.get('validation', {}).get('race_count'),
          }
          Path('/tmp/resolver_result.md').write_text(
              'RACENOTE_ARCHIVE_RESOLVE_TEST_RESULT\n```json\n'
              + json.dumps(comment, ensure_ascii=False, indent=2)
              + '\n```\n', encoding='utf-8'
          )
          PY
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/resolver_result.md

      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"


  btday0017_turn2_archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0017_EXISTING]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen payload
        run: |
          python - <<'PY'
          import base64, zipfile
          from pathlib import Path
          src=Path('.github/tmp/BTDAY-0017_ARCHIVE_20260815_v2.zip.b64')
          zpath=Path('/tmp/bt17.zip')
          zpath.write_bytes(base64.b64decode(src.read_text(encoding='utf-8')))
          out=Path('/tmp/bt17'); out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              assert bad is None, bad
              z.extractall(out)
          PY
      - name: Validate frozen forecast
        run: |
          python - <<'PYVAL'
          import json
          from pathlib import Path

          records=[]
          for line in Path('/tmp/bt17/day_merge/forecast_20260815_all.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  records.append(json.loads(line))
          errors=[]
          if len(records) != 36:
              errors.append(f'record_count={len(records)} expected=36')

          hashes=[]
          models=[]
          for idx,r in enumerate(records,1):
              pre=f'row[{idx}]'
              if r.get('schema_version') != 'RaceNote-Forecast-Research-Record-0.4.2':
                  errors.append(f'{pre}: schema_version')
              research=r.get('research') or {}
              if research.get('logic_version') != 'RaceNote-Human-Context-Reader-0.4.2-candidate':
                  errors.append(f'{pre}: logic_version')
              pred=r.get('prediction') or {}
              marks=pred.get('marks') or {}
              refs=[marks.get('main'),marks.get('second'),marks.get('third')]+list((marks.get('others') or [])[:2])
              names=[str((x or {}).get('horse_name') or '') for x in refs]
              if len(names)!=5 or any(not x for x in names) or len(set(names))!=5:
                  errors.append(f'{pre}: five_unique_marks')
              trace=r.get('decision_trace') or {}
              model=str(trace.get('race_model') or '').strip()
              models.append(model)
              if len(model)<30:
                  errors.append(f'{pre}: race_model')
              ml=trace.get('mainline_cases')
              if not isinstance(ml,list) or len(ml)<3:
                  errors.append(f'{pre}: mainline_cases')
              ss=trace.get('single_shot_case') or {}
              if ss.get('selected_independently_from_mainline') is not True:
                  errors.append(f'{pre}: single_shot_independence')
              if str(((ss.get('horse') or {}).get('horse_name') or '')) != names[2]:
                  errors.append(f'{pre}: single_shot_not_third')
              rr=trace.get('rrdb_evidence') or {}
              if rr.get('reviewed') is not True:
                  errors.append(f'{pre}: rrdb_not_reviewed')
              for hr in rr.get('horse_refs') or []:
                  if hr.get('next_watch_grade') not in (None,''):
                      errors.append(f'{pre}: legacy_next_watch_grade')
                  if hr.get('matched_rule_ids'):
                      errors.append(f'{pre}: legacy_matched_rule_ids')
                  cv=hr.get('recommendation_contract_version')
                  if cv not in (None,'rrdb-recommendation-signals-v0.2'):
                      errors.append(f'{pre}: rrdb_contract={cv}')
              audit=r.get('audit') or {}
              if audit.get('pre_result_guard')!='PASS' or audit.get('result_visible_at_freeze') is not False:
                  errors.append(f'{pre}: result_guard')
              if audit.get('market_blind_guard')!='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST':
                  errors.append(f'{pre}: market_guard')
              h=str(audit.get('prediction_hash') or '')
              if not h:
                  errors.append(f'{pre}: prediction_hash')
              hashes.append(h)

          if len(set(hashes)) != 36:
              errors.append('prediction_hash_unique_count')
          if len(set(models))/len(models) < .85:
              errors.append('race_model_unique_ratio')

          a=json.loads(Path('/tmp/bt17/day_merge/forecast_20260815_all_audit.json').read_text(encoding='utf-8'))
          h=json.loads(Path('/tmp/bt17/day_merge/forecast_20260815_all_handoff.json').read_text(encoding='utf-8'))
          if a.get('status')!='FROZEN_CLEAN_BLIND' or a.get('clean_blind_eligible') is not True:
              errors.append('day_audit_clean_blind')
          if a.get('result_opened') is not False or h.get('result_opened') is not False:
              errors.append('result_opened')
          if a.get('record_count')!=36 or a.get('prediction_hash_unique_count')!=36:
              errors.append('day_audit_counts')
          if a.get('rrdb_contract_guard')!='PASS_RECOMMENDATION_V0_2_GRADE_DISABLED':
              errors.append('rrdb_contract_guard')
          if h.get('logic_version')!='RaceNote-Human-Context-Reader-0.4.2-candidate':
              errors.append('handoff_logic_version')

          out={
              'validator_version':'BTDAY-0017-v0.4.2-independent-equivalent-guard-0.1',
              'status':'PASS' if not errors else 'FAIL',
              'record_count':len(records),
              'error_count':len(errors),
              'errors':errors,
              'note':'Independent equivalent guard used because repository validator has a pre-existing syntax typo.'
          }
          Path('/tmp/validator.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if errors:
              raise SystemExit(2)
          PYVAL

      - name: Publish canonical archive
        run: |
          DEST='horse-racing/jrdb/backtests/BTDAY-0017/20260815'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/bt17 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260815_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0017 20260815 forecast"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/commit.txt
      - name: Report BTDAY-0017
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          print('RACENOTE_BTDAY0017_TURN2_RESULT')
          print(json.dumps({
            'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL',
            'clean_blind_eligible':True if ok else None,
            'result_opened':False,
            'race_count':36 if ok else None,
            'technical_skips':0 if ok else None,
            'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate',
            'rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.2',
            'validator_status':v.get('status'),
            'market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST' if ok else None,
            'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,
            'run_id':int(os.environ['GITHUB_RUN_ID'])
          },ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" || true
