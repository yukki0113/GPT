name: RaceNote A01 historical immutable RRDB golden smoke

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/config/public_drive/racenote_historical_golden_20251228_v1.json'
      - 'horse-racing/jrdb/tests/test_racenote_a01_immutable_golden.py'
      - '.github/workflows/racenote_a01_golden_rrdb_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-rrdb-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing public Drive downloader and test harness
        run: python -m pip install 'gdown>=6.1,<7' pytest
      - name: A01 manifest contract and fail-closed regressions
        run: python -m pytest -q horse-racing/jrdb/tests/test_racenote_a01_immutable_golden.py
      - name: Fetch archived RRDB golden snapshot with pinned SHA
        run: |
          set -euo pipefail
          python tools/gpt_io/public_drive/fetch.py \
            --manifest horse-racing/jrdb/config/public_drive/racenote_historical_golden_20251228_v1.json \
            --artifact golden_20 \
            --output-root /tmp/racenote-a01-golden \
            --receipt /tmp/racenote-a01-golden-receipt.json
      - name: Verify accepted RRDB generation, validation and archive CRC
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          path=Path('/tmp/racenote-a01-golden/rrdb.zip')
          assert path.stat().st_size == 47410583
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'a46eb35f2525cada2ae42ec4e0f2d783e5cb7ed24db5eb2d9b7c07e2322099f9'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              root='postrace_review/v0_1/'
              current=json.loads(z.read(root+'current.json'))
              assert current['generation_id'] == 'jrdb_race_review_v0_1_incremental_g38052055588'
              manifest=json.loads(z.read(root+current['manifest']))
              assert manifest['generation_id'] == current['generation_id']
              assert manifest['validation_status'] == 'PASS'
              assert manifest['period_to'] == '2026-10-04'
          print('A01_IMMUTABLE_GOLDEN_RRDB_SMOKE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racenote-a01-golden-rrdb-receipt
          path: /tmp/racenote-a01-golden-receipt.json
          if-no-files-found: ignore
          retention-days: 7
