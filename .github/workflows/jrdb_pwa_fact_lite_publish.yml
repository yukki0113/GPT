name: JRDB PWA Fact Lite Publish

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "jrdb-pwa-pages"
  cancel-in-progress: false

env:
  ISSUE_PREFIX: "[JRDB_PWA_FACT_LITE_PUBLISH]"
  FACT_RELEASE_TAG: jrdb-pwa-fact-lite-current
  FACT_PARQUET_RELEASE_TAG: jrdb-pwa-fact-lite-parquet-current
  FACT_PARQUET_RELEASE_ARCHIVE: jrdb_pwa_fact_lite_parquet_current.tar.xz
  FACT_PARQUET_RELEASE_META: jrdb_pwa_fact_lite_parquet_current_release.json
  MART_RELEASE_TAG: jrdb-stats-mart-current

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[JRDB_PWA_FACT_LITE_PUBLISH]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          mkdir -p .fact_publish
          python - <<'PY'
          import json
          import os

          request = json.loads(os.environ["ISSUE_BODY"])
          required = ["drive_file_id", "source_filename", "data_version"]
          missing = [key for key in required if key not in request]
          if missing:
              raise SystemExit("Missing request fields: " + ", ".join(missing))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DRIVE_FILE_ID={request['drive_file_id']}\n")
              env_file.write(f"SOURCE_FILENAME={request['source_filename']}\n")
              env_file.write(f"DATA_VERSION={request['data_version']}\n")
              parquet_bundle = str(request.get("analysis_parquet_bundle_file_id") or "").strip()
              if parquet_bundle:
                  env_file.write(f"ANALYSIS_PARQUET_BUNDLE_FILE_ID={parquet_bundle}\n")
          PY

      - name: Download Analysis Lite from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANALYSIS_PARQUET_BUNDLE_FILE_ID:-}" ]; then
            python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt
          fi
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output ".fact_publish/${SOURCE_FILENAME}"

          if [[ "${SOURCE_FILENAME}" == *.zip ]]; then
            unzip -t ".fact_publish/${SOURCE_FILENAME}"
            mkdir -p .fact_publish/analysis_unzip
            unzip -q ".fact_publish/${SOURCE_FILENAME}" -d .fact_publish/analysis_unzip
            mapfile -t sqlite_files < <(find .fact_publish/analysis_unzip -type f -name '*.sqlite' -print)
            if [ "${#sqlite_files[@]}" -ne 1 ]; then
              echo "Expected exactly one Analysis SQLite payload, found ${#sqlite_files[@]}"
              exit 1
            fi
            cp "${sqlite_files[0]}" .fact_publish/analysis.sqlite
          else
            cp ".fact_publish/${SOURCE_FILENAME}" .fact_publish/analysis.sqlite
          fi

          # After canonical cutover, the bundle contains current.json, the
          # immutable Parquet objects and manifest. SQLite is materialized only
          # for the legacy comparison and BAC lookup builder.
          if [ -n "${ANALYSIS_PARQUET_BUNDLE_FILE_ID:-}" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${ANALYSIS_PARQUET_BUNDLE_FILE_ID}&export=download&confirm=t" \
              --output .fact_publish/analysis-parquet.tar.xz
            mkdir -p .fact_publish/analysis-parquet
            tar -xJf .fact_publish/analysis-parquet.tar.xz -C .fact_publish/analysis-parquet
            manifest="$(python -c 'import json; from pathlib import Path; root=Path(".fact_publish/analysis-parquet"); p=json.loads((root/"current.json").read_text()); print(root/p["manifest"])')"
            python horse-racing/jrdb/src/materialize_jrdb_analysis_sqlite.py \
              --manifest "$manifest" --out .fact_publish/analysis-from-parquet.sqlite
            mv .fact_publish/analysis-from-parquet.sqlite .fact_publish/analysis.sqlite
            echo "ANALYSIS_PARQUET_GLOB=.fact_publish/analysis-parquet/objects/fact_entry_result_lite/**/*.parquet" >> "$GITHUB_ENV"
          fi

      - name: Resolve BAC periods from Analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          analysis = Path('.fact_publish/analysis.sqlite')
          connection = sqlite3.connect(f'file:{analysis}?mode=ro', uri=True)
          try:
              min_year, max_year = connection.execute(
                  'SELECT MIN(year), MAX(year) FROM fact_entry_result_lite'
              ).fetchone()
              if min_year is None or max_year is None:
                  raise SystemExit('Could not resolve Analysis BAC period')

              recent_year_from = max(int(min_year), int(max_year) - 1)
              dates = [
                  str(row[0])
                  for row in connection.execute(
                      'SELECT DISTINCT race_date FROM fact_entry_result_lite '
                      'WHERE year BETWEEN ? AND ? ORDER BY race_date',
                      (recent_year_from, int(max_year)),
                  )
              ]
          finally:
              connection.close()

          if not dates:
              raise SystemExit('Could not resolve recent Analysis BAC dates')

          Path('.fact_publish/recent_year_dates.txt').write_text(
              '\n'.join(dates) + '\n', encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env_file:
              env_file.write(f'MIN_ANALYSIS_YEAR={int(min_year)}\n')
              env_file.write(f'MAX_ANALYSIS_YEAR={int(max_year)}\n')
              env_file.write(f'RECENT_ANALYSIS_YEAR_FROM={recent_year_from}\n')
          print({
              'min_year': int(min_year),
              'max_year': int(max_year),
              'recent_year_from': recent_year_from,
              'recent_year_dates': len(dates),
          })
          PY

      - name: Fetch BAC Raw for race-name lookup
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_ROOT=".fact_publish/raw"
          mkdir -p "$RAW_ROOT"

          if [ "$MIN_ANALYSIS_YEAR" -lt "$MAX_ANALYSIS_YEAR" ]; then
            python horse-racing/jrdb/src/fetch_jrdb_history.py \
              --from-year "$MIN_ANALYSIS_YEAR" \
              --to-year "$((MAX_ANALYSIS_YEAR - 1))" \
              --kinds BAC \
              --output-dir "$RAW_ROOT" \
              --sleep-seconds 0.25
          fi

          # Annual BAC can lag or omit late-year race days. Re-fetch every race
          # date in the latest two Analysis years as a deterministic fallback.
          while IFS= read -r race_date; do
            if [ -z "$race_date" ]; then
              continue
            fi
            python horse-racing/jrdb/src/fetch_jrdb_history.py \
              --date "$race_date" \
              --kinds BAC \
              --output-dir "$RAW_ROOT" \
              --sleep-seconds 0
          done < .fact_publish/recent_year_dates.txt

      - name: Build BAC race-name lookup
        shell: bash
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/build_jrdb_pwa_race_names.py \
            --analysis .fact_publish/analysis.sqlite \
            --raw-root .fact_publish/raw \
            --db .fact_publish/race_names.sqlite \
            | tee .fact_publish/race_name_result.txt

      - name: Build and validate Fact Lite
        shell: bash
        run: |
          set -euo pipefail
          FACT_FILE=".fact_publish/jrdb_pwa_fact_lite.sqlite"
          if [ -n "${ANALYSIS_PARQUET_GLOB:-}" ]; then
            python horse-racing/jrdb/src/build_jrdb_pwa_fact_lite.py \
              --analysis .fact_publish/analysis.sqlite \
              --race-names .fact_publish/race_names.sqlite \
              --db .fact_publish/fact-legacy.sqlite
            PYTHONPATH=tools/data-storage python horse-racing/jrdb/src/build_jrdb_pwa_fact_lite_dual.py \
              --analysis-parquet "$ANALYSIS_PARQUET_GLOB" \
              --race-names .fact_publish/race_names.sqlite \
              --sqlite-out "$FACT_FILE" \
              --parquet-dir .fact_publish/fact-parquet \
              | tee .fact_publish/build_result.txt
            PYTHONPATH=tools/data-storage python horse-racing/jrdb/src/audit_jrdb_pwa_fact_lite_dual.py \
              --legacy-sqlite .fact_publish/fact-legacy.sqlite \
              --new-sqlite "$FACT_FILE" \
              --parquet-dir .fact_publish/fact-parquet \
              --output .fact_publish/equivalence_audit.json
          else
            python horse-racing/jrdb/src/build_jrdb_pwa_fact_lite.py \
              --analysis .fact_publish/analysis.sqlite \
              --race-names .fact_publish/race_names.sqlite \
              --db "$FACT_FILE" \
              | tee .fact_publish/build_result.txt
          fi

          ACTUAL_SIZE="$(stat -c %s "$FACT_FILE")"
          ACTUAL_SHA256="$(sha256sum "$FACT_FILE" | awk '{print $1}')"

          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          path = Path('.fact_publish/jrdb_pwa_fact_lite.sqlite')
          connection = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
          try:
              required = {
                  'fact_stats_entry',
                  'dim_sire',
                  'dim_bms',
                  'dim_jockey',
                  'dim_race',
              }
              names = {row[0] for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing tables: ' + ', '.join(missing))

              fact_columns = {
                  row[1]
                  for row in connection.execute('PRAGMA table_info(fact_stats_entry)')
              }
              required_columns = {
                  'month',
                  'race_id',
                  'prev_distance_delta',
                  'prev_class_code',
                  'win5_leg_no',
              }
              missing_columns = sorted(required_columns - fact_columns)
              if missing_columns:
                  raise SystemExit(
                      'Missing Fact Lite v0.3 columns: ' + ', '.join(missing_columns)
                  )

              integrity = connection.execute('PRAGMA integrity_check').fetchone()
              if not integrity or integrity[0] != 'ok':
                  raise SystemExit(f'integrity_check failed: {integrity}')

              meta = connection.execute(
                  "SELECT schema_version, period_from, period_to, row_count "
                  "FROM meta_pwa_fact_build ORDER BY build_id DESC LIMIT 1"
              ).fetchone()
              if not meta:
                  raise SystemExit('meta_pwa_fact_build is empty')
              if str(meta[0]) != '0.3':
                  raise SystemExit(f'unexpected schema_version: {meta[0]}')

              actual_rows = connection.execute(
                  "SELECT COUNT(*) FROM fact_stats_entry"
              ).fetchone()[0]
              if int(meta[3]) != int(actual_rows):
                  raise SystemExit(
                      f'row_count mismatch: meta={meta[3]} actual={actual_rows}'
                  )

              race_name_count = connection.execute(
                  "SELECT COUNT(*) FROM dim_race "
                  "WHERE TRIM(COALESCE(race_name, '')) <> ''"
              ).fetchone()[0]
              if int(race_name_count) <= 0:
                  raise SystemExit('race-name lookup produced no named races')

              prev_distance_rows = connection.execute(
                  "SELECT COUNT(*) FROM fact_stats_entry "
                  "WHERE prev_distance_delta IS NOT NULL"
              ).fetchone()[0]
              prev_class_rows = connection.execute(
                  "SELECT COUNT(*) FROM fact_stats_entry "
                  "WHERE prev_class_code IS NOT NULL"
              ).fetchone()[0]
              win5_rows = connection.execute(
                  "SELECT COUNT(*) FROM fact_stats_entry "
                  "WHERE win5_leg_no IS NOT NULL"
              ).fetchone()[0]
          finally:
              connection.close()

          sha = os.popen(f"sha256sum {path} | awk '{{print $1}}'").read().strip()
          size = path.stat().st_size
          manifest = {
              'artifact_type': 'jrdb_pwa_fact_lite',
              'schema_version': str(meta[0]),
              'data_version': os.environ['DATA_VERSION'],
              'period_from': str(meta[1]),
              'period_to': str(meta[2]),
              'rows': int(meta[3]),
              'source_filename': os.environ['SOURCE_FILENAME'],
              'size': size,
              'sha256': sha,
              'capabilities': {
                  'month_filter': True,
                  'distance_range_filter': True,
                  'race_name_search': True,
                  'win5_filter': True,
                  'previous_distance_axis': prev_distance_rows > 0,
                  'previous_class_axis': prev_class_rows > 0,
                  'race_name_rows': int(race_name_count),
                  'previous_distance_rows': int(prev_distance_rows),
                  'previous_class_rows': int(prev_class_rows),
                  'win5_rows': int(win5_rows),
              },
              'download': {
                  'provider': 'github_pages',
                  'path': './data/fact-lite/jrdb_pwa_fact_lite.sqlite'
              }
          }
          Path('.fact_publish/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env_file:
              env_file.write(f'RACE_NAME_COUNT={int(race_name_count)}\n')
              env_file.write(f'PREV_DISTANCE_ROWS={int(prev_distance_rows)}\n')
              env_file.write(f'PREV_CLASS_ROWS={int(prev_class_rows)}\n')
              env_file.write(f'WIN5_ROWS={int(win5_rows)}\n')
          PY

          echo "FACT_SIZE=$ACTUAL_SIZE" >> "$GITHUB_ENV"
          echo "FACT_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"

      - name: Publish Fact Lite release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$FACT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FACT_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JRDB PWA Fact Lite current" \
              --notes "PWA Fact Lite distribution cache. Generated from Analysis Lite plus BAC race-name lookup; not a Git-tracked canonical data artifact."
          fi
          gh release upload "$FACT_RELEASE_TAG" \
            .fact_publish/jrdb_pwa_fact_lite.sqlite \
            .fact_publish/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Package Fact Lite Parquet generation for browser delivery
        if: env.ANALYSIS_PARQUET_GLOB != ''
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/data-storage python horse-racing/jrdb/src/package_jrdb_pwa_fact_lite_parquet.py package \
            --parquet-dir .fact_publish/fact-parquet \
            --equivalence-audit .fact_publish/equivalence_audit.json \
            --data-version "$DATA_VERSION" \
            --output-root .fact_publish/fact-parquet-release \
            | tee .fact_publish/fact_parquet_package_result.json

          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cJf ".fact_publish/${FACT_PARQUET_RELEASE_ARCHIVE}" \
            -C .fact_publish/fact-parquet-release current.json generations

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package = json.loads(Path('.fact_publish/fact_parquet_package_result.json').read_text(encoding='utf-8'))
          archive = Path('.fact_publish') / os.environ['FACT_PARQUET_RELEASE_ARCHIVE']
          release = {
              'schema_version': '0.1',
              'release_kind': 'jrdb_fact_lite_parquet_current_cache',
              'generation_id': package['generation_id'],
              'archive_filename': archive.name,
              'archive_size_bytes': archive.stat().st_size,
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'manifest_path': package['manifest_path'],
              'manifest_size_bytes': package['manifest_size_bytes'],
              'manifest_sha256': package['manifest_sha256'],
              'asset_count': package['asset_count'],
              'asset_size_bytes': package['asset_size_bytes'],
          }
          Path('.fact_publish', os.environ['FACT_PARQUET_RELEASE_META']).write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish Fact Lite Parquet release
        if: env.ANALYSIS_PARQUET_GLOB != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$FACT_PARQUET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FACT_PARQUET_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JRDB PWA Fact Lite Parquet current" \
              --notes "Immutable Fact Lite Parquet browser-delivery cache. The generation manifest is authoritative; this Release is not the long-term data source of truth."
          fi
          gh release upload "$FACT_PARQUET_RELEASE_TAG" \
            ".fact_publish/${FACT_PARQUET_RELEASE_ARCHIVE}" \
            ".fact_publish/${FACT_PARQUET_RELEASE_META}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Retain Fact Lite Parquet candidate
        if: env.ANALYSIS_PARQUET_GLOB != ''
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-fact-lite-parquet-${{ env.DATA_VERSION }}
          retention-days: 14
          path: |
            .fact_publish/fact-parquet/**
            .fact_publish/equivalence_audit.json
            .fact_publish/fact-parquet-release/**
            .fact_publish/${{ env.FACT_PARQUET_RELEASE_ARCHIVE }}
            .fact_publish/${{ env.FACT_PARQUET_RELEASE_META }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact with staged Fact Lite Parquet data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p .pages/vendor/duckdb .pages/data .pages/data/fact-lite
          cp -a horse-racing/jrdb/pwa/. .pages/

          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js \
            --output .pages/vendor/sql-wasm.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.wasm \
            --output .pages/vendor/sql-wasm.wasm

          # Fact Lite's future Parquet consumer is single-thread DuckDB-Wasm.
          # Keep these static assets local to Pages; no browser CDN dependency.
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/dist/duckdb-browser.mjs \
            --output .pages/vendor/duckdb/duckdb-browser.mjs
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/dist/duckdb-browser-mvp.worker.js \
            --output .pages/vendor/duckdb/duckdb-browser-mvp.worker.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/dist/duckdb-mvp.wasm \
            --output .pages/vendor/duckdb/duckdb-mvp.wasm

          if gh release view "$MART_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$MART_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "jrdb_stats_mart.sqlite" \
              --pattern "manifest.json" \
              --dir .pages/data
          fi

          cp .fact_publish/jrdb_pwa_fact_lite.sqlite .pages/data/fact-lite/jrdb_pwa_fact_lite.sqlite
          cp .fact_publish/manifest.json .pages/data/fact-lite/manifest.json

          if [ -d .fact_publish/fact-parquet-release ]; then
            mkdir -p .pages/data/fact-lite-parquet
            cp -a .fact_publish/fact-parquet-release/current.json .pages/data/fact-lite-parquet/current.json
            cp -a .fact_publish/fact-parquet-release/generations .pages/data/fact-lite-parquet/generations
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close successful request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Published Fact Lite ${DATA_VERSION}. size=${FACT_SIZE} sha256=${FACT_SHA256} race_names=${RACE_NAME_COUNT} prev_distance=${PREV_DISTANCE_ROWS} prev_class=${PREV_CLASS_ROWS} win5=${WIN5_ROWS}. Stats Mart distribution remains unchanged."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "JRDB PWA Fact Lite publish failed. Existing Stats Mart distribution was not intentionally replaced. Check workflow logs before retrying."
