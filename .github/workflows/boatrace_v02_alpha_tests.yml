name: Boat Race ForwardTrial v0.2 alpha tests

on:
  push:
    paths:
      - 'boat-racing/src/forward_trial_predict.py'
      - 'boat-racing/src/forward_trial_v02_alpha_shadow.py'
      - 'boat-racing/tests/test_forward_trial_predict.py'
      - 'boat-racing/tests/test_forward_trial_v02_alpha_shadow.py'
      - '.github/workflows/boatrace_v02_alpha_tests.yml'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Control and alpha Shadow tests
        working-directory: boat-racing
        run: |
          python -m unittest \
            tests.test_forward_trial_predict \
            tests.test_forward_trial_v02_alpha_shadow \
            -v
