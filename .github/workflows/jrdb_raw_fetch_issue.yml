name: JRDB Raw Fetch via Issue

on:
  repository_dispatch:
    types: [jrdb_raw_fetch_request]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing request Issue number
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  fetch:

    runs-on: ubuntu-latest
    steps:
      - name: Resolve request Issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ROUTED_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ['EVENT_NAME']
          if event_name == 'repository_dispatch':
              issue_text = str(os.environ.get('ROUTED_ISSUE_NUMBER') or '').strip()
          elif event_name == 'workflow_dispatch':
              issue_text = str(os.environ.get('MANUAL_ISSUE_NUMBER') or '').strip()
          else:
              raise SystemExit(f'unsupported event: {event_name}')

          if not re.fullmatch(r'[1-9][0-9]*', issue_text):
              raise SystemExit('issue_number must be a positive integer')

          completed = subprocess.run(
              ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue_text}"],
              check=True, capture_output=True, text=True,
          )
          issue = json.loads(completed.stdout)
          Path('/tmp/routed_issue.json').write_text(
              json.dumps(issue, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f"issue_number={issue_text}\n")
          PY
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        id: request
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          issue=json.loads(Path('/tmp/routed_issue.json').read_text(encoding='utf-8'))
          req=json.loads(str(issue.get('body') or '').strip())
          date=str(req.get('date','')).strip()
          kinds=req.get('kinds') or []
          if not re.fullmatch(r'20\d{6}',date):
              raise SystemExit('date must be YYYYMMDD')
          if not isinstance(kinds,list) or not kinds:
              raise SystemExit('kinds must be non-empty list')
          kinds=[str(x).upper() for x in kinds]
          allowed={'PACI','SED','HJC'}
          if any(x not in allowed for x in kinds):
              raise SystemExit('supported kinds: PACI, SED, HJC')
          Path('/tmp/request.json').write_text(json.dumps({'date':date,'kinds':kinds},indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'date={date}\n')
              f.write(f'artifact_name=jrdb-raw-{date}\n')
          PY

      - name: Fetch requested raw ZIPs
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/jrdb_raw
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          for kind in req['kinds']:
              if kind=='PACI':
                  cmd=['python','horse-racing/jrdb/src/fetch_jrdb_paci.py','--date',req['date'],'--out-dir','/tmp/jrdb_raw']
              else:
                  cmd=['python','horse-racing/jrdb/src/fetch_jrdb_history.py','--date',req['date'],'--kinds',kind,'--output-dir','/tmp/jrdb_raw']
              subprocess.run(cmd,check=True)
          PY

      - name: Build manifest and validate ZIPs
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          out=Path('/tmp/jrdb_raw'); yy=req['date'][2:]; rows=[]
          for kind in req['kinds']:
              name=f'{kind}{yy}.zip'
              path=out/name if kind=='PACI' else out/kind/name
              if not path.exists(): raise SystemExit(f'missing output: {path}')
              if not zipfile.is_zipfile(path): raise SystemExit(f'invalid zip: {path}')
              with zipfile.ZipFile(path) as zf:
                  bad=zf.testzip()
                  if bad is not None: raise SystemExit(f'corrupt member in {name}: {bad}')
                  members=zf.namelist()
              rows.append({'kind':kind,'file_name':name,'size_bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'members':members})
          Path('/tmp/jrdb_raw/manifest.json').write_text(json.dumps({'date':req['date'],'status':'success','files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: /tmp/jrdb_raw/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Comment success and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/jrdb_raw/manifest.json').read_text(encoding='utf-8'))
          result={'status':'success','run_id':int(os.environ['RUN_ID']),'artifact_name':os.environ['ARTIFACT_NAME'],'manifest':manifest}
          Path('/tmp/comment.md').write_text('JRDB_RAW_FETCH_RESULT\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n',encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "JRDB raw fetch failed. Workflow run: $RUN_URL"
