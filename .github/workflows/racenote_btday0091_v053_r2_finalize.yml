name: RaceNote BTDAY-0091 v0.5.3 r2 finalize
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0091/FINALIZE_TRIGGER'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble venue decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("horse-racing/jrdb/backtests/BTDAY-0091/20251115/v053")
          for venue in ("東京","福島"):
              d=root/"incoming_parts"/venue
              arr=[json.loads((d/f"{i}.json").read_text(encoding="utf-8")) for i in range(1,13)]
              (root/"incoming"/f"{venue}.json").write_text(json.dumps(arr,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Save venues Freeze Verify
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0091/20251115/v053'
          python horse-racing/jrdb/src/racenote_v053_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/京都.json"
          python horse-racing/jrdb/src/racenote_v053_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/東京.json"
          python horse-racing/jrdb/src/racenote_v053_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/福島.json"
          python horse-racing/jrdb/src/racenote_v053_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v053_single_day.py verify --root "$ROOT"
      - name: Commit frozen outputs
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0091/20251115/v053'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/incoming" "$ROOT/authored_decisions" "$ROOT/frozen"
          git commit -m 'RaceNote: freeze and verify BTDAY-0091 v0.5.3 r2'
          git pull --rebase origin main
          git push origin HEAD:main
