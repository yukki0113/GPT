name: RL-T Historical Warehouse Audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RL_T_HISTORICAL_WAREHOUSE_AUDIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/data-storage/requirements.txt

      - name: Install shared storage runtime and downloader
        run: |
          python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt 'gdown>=5,<6'
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Parse formal request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          req = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          request_id = str(req.get('request_id') or '').strip()
          expected_years = {str(y) for y in range(2010, 2026)}
          required = ('BAC','KYI','CHA','CYB','SED','UKC')

          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('invalid request_id')
          if req.get('generation_id') != 'jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected generation_id')
          for key in ('manifest_id','audit_id'):
              if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(req.get(key) or '')):
                  raise SystemExit(f'invalid {key}')

          families = req.get('families') or {}
          for family in required:
              spec = families.get(family) or {}
              for mode in ('raw','warehouse'):
                  rows = spec.get(mode) or {}
                  if set(rows) != expected_years:
                      raise SystemExit(f'{family}.{mode} must contain 2010-2025 exactly')
                  for year, item in rows.items():
                      if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(item.get('id') or '')):
                          raise SystemExit(f'invalid Drive id: {family}.{mode}.{year}')
                      if not re.fullmatch(r'[0-9a-f]{64}', str(item.get('sha256') or '').lower()):
                          raise SystemExit(f'invalid sha256: {family}.{mode}.{year}')

          root = Path('/tmp/rlt_historical_audit')
          (root/'output').mkdir(parents=True, exist_ok=True)
          (root/'request.json').write_text(json.dumps(req, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f'request_id={request_id}\n')
          PY

      - name: Download immutable Raw and Warehouse evidence
        id: download
        env:
          PYTHONPATH: tools/data-storage
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, time
          from pathlib import Path

          root = Path('/tmp/rlt_historical_audit')
          req = json.loads((root/'request.json').read_text(encoding='utf-8'))

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()

          def download(file_id, path, expected_sha=None, attempts=5):
              path.parent.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(1, attempts + 1):
                  if path.exists():
                      path.unlink()
                  cp = subprocess.run(
                      ['gdown','--id',file_id,'-O',str(path)],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  if cp.returncode == 0 and path.is_file():
                      actual = sha256(path)
                      if expected_sha is None or actual == expected_sha.lower():
                          return actual
                      last = f'SHA mismatch actual={actual}'
                  else:
                      last = cp.stdout[-2000:]
                  if attempt < attempts:
                      time.sleep(min(20, 2 ** attempt))
              raise SystemExit(f'download failed after {attempts} attempts id={file_id}: {last}')

          download(req['manifest_id'], root/'final'/'manifest.json')
          download(req['audit_id'], root/'final'/'audit.json')

          manifest = json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((root/'final'/'audit.json').read_text(encoding='utf-8'))
          expected = req['generation_id']
          if manifest.get('artifact_type') != 'jrdb_normalized_warehouse_final_generation':
              raise SystemExit('unexpected final manifest type')
          if manifest.get('generation_id') != expected or manifest.get('status') != 'PASS':
              raise SystemExit('final manifest is not accepted PASS generation')
          if audit.get('generation_id') != expected or audit.get('status') != 'PASS':
              raise SystemExit('final audit is not PASS for accepted generation')
          if audit.get('year_coverage') != [2010, 2025]:
              raise SystemExit('unexpected Warehouse coverage')

          manifest_assets = {
              (str(a.get('family') or '').upper(), str(int(a['year']))): a
              for a in manifest.get('assets') or []
              if str(a.get('family') or '').upper() in {'BAC','KYI','CHA','CYB','SED','UKC'}
          }

          staging_map = {}
          for family in ('BAC','KYI','CHA','CYB','SED','UKC'):
              wh_root = root/'warehouse'/family
              staging_map[family] = str(wh_root)
              for year in range(2010, 2026):
                  y = str(year)
                  raw = req['families'][family]['raw'][y]
                  raw_path = root/'raw'/family/f'{family}_{year}.zip'
                  download(raw['id'], raw_path, raw['sha256'])

                  wh = req['families'][family]['warehouse'][y]
                  asset = manifest_assets.get((family, y))
                  if asset is None:
                      raise SystemExit(f'manifest asset missing {family}/{year}')
                  if str(asset.get('sha256') or '').lower() != wh['sha256'].lower():
                      raise SystemExit(f'request/manifest Warehouse SHA mismatch {family}/{year}')
                  wh_path = wh_root / str(asset['relative_path'])
                  download(wh['id'], wh_path, wh['sha256'])

          (root/'staging_map.json').write_text(
              json.dumps(staging_map, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Run full 2010-2025 Index Base dual-read audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          ROOT=/tmp/rlt_historical_audit
          BAC_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['BAC'])")"
          KYI_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['KYI'])")"
          CHA_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['CHA'])")"
          CYB_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['CYB'])")"
          SED_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['SED'])")"
          UKC_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['UKC'])")"

          python horse-racing/jrdb/src/audit_jrdb_index_base_raw_vs_warehouse.py             --raw-root "$ROOT/raw"             --warehouse-manifest "$ROOT/final/manifest.json"             --asset-root "BAC=$BAC_ROOT"             --asset-root "KYI=$KYI_ROOT"             --asset-root "CHA=$CHA_ROOT"             --asset-root "CYB=$CYB_ROOT"             --asset-root "SED=$SED_ROOT"             --asset-root "UKC=$UKC_ROOT"             --years {2010..2025}             --audit-json "$ROOT/output/audit.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build compact result
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/rlt_historical_audit')
          path = root/'output'/'audit.json'
          report = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {
              'status':'FAIL','error':'audit.json missing before dual-read completion'
          }
          tables = report.get('tables') or {}
          summary = {
              'status': report.get('status') or 'FAIL',
              'source_generation_id': report.get('source_generation_id'),
              'years': report.get('years'),
              'table_pass': {k: v.get('pass') for k,v in tables.items()},
              'row_counts': {k: v.get('row_count') for k,v in tables.items()},
              'integrity': report.get('integrity'),
              'error': report.get('error'),
          }
          out = root/'output'/'summary.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"status={summary['status']}\n")
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlt-historical-warehouse-audit-${{ github.run_id }}
          path: /tmp/rlt_historical_audit/output/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('/tmp/rlt_historical_audit/output/summary.json')
          summary = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'FAIL'}
          payload = {**summary, 'run_id': int(os.environ['GITHUB_RUN_ID']),
                     'audit_exit_code': os.environ.get('AUDIT_EXIT')}
          Path('/tmp/result.md').write_text(
              'RL_T_HISTORICAL_WAREHOUSE_AUDIT_RESULT\n```json\n'
              + json.dumps(payload, ensure_ascii=False, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: |
          if [ "$AUDIT_STATUS" = "PASS" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "not planned"
          fi

      - name: Fail workflow when audit fails
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: test "$AUDIT_STATUS" = "PASS"
