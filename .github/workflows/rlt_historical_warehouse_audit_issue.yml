name: RL-T Historical Warehouse Audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RL_T_HISTORICAL_WAREHOUSE_AUDIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/data-storage/requirements.txt

      - name: Install shared storage runtime and authenticated Drive client
        run: |
          python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt google-api-python-client google-auth
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Parse formal request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          req = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          request_id = str(req.get('request_id') or '').strip()
          required = ('BAC','KYI','CHA','CYB','SED','UKC')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('invalid request_id')
          if req.get('generation_id') != 'jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected generation_id')
          for key in ('manifest_id','audit_id'):
              if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(req.get(key) or '')):
                  raise SystemExit(f'invalid {key}')
          stages = req.get('staging_folders') or {}
          if set(stages) != set(required):
              raise SystemExit('staging_folders must contain BAC/KYI/CHA/CYB/SED/UKC exactly')
          for family, file_id in stages.items():
              if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(file_id)):
                  raise SystemExit(f'invalid staging folder id: {family}')
          root = Path('/tmp/rlt_historical_audit')
          (root/'output').mkdir(parents=True, exist_ok=True)
          (root/'request.json').write_text(json.dumps(req, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f'request_id={request_id}\n')
          PY

      - name: Discover and download exact evidence through authenticated Drive API
        id: download
        env:
          GPT_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GPT_GDRIVE_SERVICE_ACCOUNT_JSON }}
          GPT_GDRIVE_AUTOMATION_ROOT_ID: ${{ secrets.GPT_GDRIVE_AUTOMATION_ROOT_ID }}
        run: |
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from tools.gpt_io.gdrive import gdrive_api as api

          root = Path('/tmp/rlt_historical_audit')
          req = json.loads((root/'request.json').read_text(encoding='utf-8'))
          expected_generation = req['generation_id']
          service, automation_root = api.load_service()

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()

          def guarded_download(file_id, path, expected_sha=None, attempts=5):
              api.assert_under_root(service, str(file_id), automation_root)
              path.parent.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(1, attempts + 1):
                  path.unlink(missing_ok=True)
                  try:
                      meta = api.download(service, str(file_id), path, force=True)
                      actual = str(meta['sha256']).lower()
                      if expected_sha is None or actual == str(expected_sha).lower():
                          return meta
                      last = f'SHA mismatch actual={actual}'
                  except Exception as exc:
                      last = repr(exc)
                  if attempt < attempts:
                      time.sleep(min(30, 2 ** attempt))
              raise SystemExit(f'authenticated Drive download failed after {attempts} attempts id={file_id}: {last}')

          def child(parent_id, name):
              rows = [x for x in api.list_children(service, parent_id) if x.get('name') == name]
              if len(rows) != 1:
                  raise SystemExit(f'expected one child {name!r} under {parent_id}, got {len(rows)}')
              return rows[0]

          guarded_download(req['manifest_id'], root/'final'/'manifest.json')
          guarded_download(req['audit_id'], root/'final'/'audit.json')
          manifest = json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((root/'final'/'audit.json').read_text(encoding='utf-8'))

          if manifest.get('artifact_type') != 'jrdb_normalized_warehouse_final_generation':
              raise SystemExit('unexpected final manifest type')
          if manifest.get('generation_id') != expected_generation or manifest.get('status') != 'PASS':
              raise SystemExit('final manifest is not accepted PASS generation')
          if audit.get('generation_id') != expected_generation or audit.get('status') != 'PASS':
              raise SystemExit('final audit is not PASS for accepted generation')
          if audit.get('year_coverage') != [2010, 2025]:
              raise SystemExit('unexpected Warehouse coverage')

          required = ('BAC','KYI','CHA','CYB','SED','UKC')
          assets = {
              (str(a.get('family') or '').upper(), int(a['year'])): a
              for a in manifest.get('assets') or []
              if str(a.get('family') or '').upper() in required and 2010 <= int(a['year']) <= 2025
          }
          expected_keys = {(family, year) for family in required for year in range(2010, 2026)}
          if set(assets) != expected_keys:
              raise SystemExit('final manifest does not contain exact required 6x16 asset set')

          staging_map = {}
          download_audit = {}
          for family in required:
              stage_id = req['staging_folders'][family]
              api.assert_under_root(service, stage_id, automation_root)
              receipt_meta = child(stage_id, 'raw_receipt.json')
              objects_meta = child(stage_id, 'objects')

              receipt_path = root/'receipts'/f'{family}.json'
              guarded_download(receipt_meta['id'], receipt_path)
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              if receipt.get('status') != 'PASS' or receipt.get('family') != family:
                  raise SystemExit(f'{family}: invalid raw receipt')
              raw_by_year = {int(a['year']): a for a in receipt.get('archives') or []}
              if set(raw_by_year) != set(range(2010, 2026)):
                  raise SystemExit(f'{family}: Raw receipt coverage mismatch')

              fam_folder = child(objects_meta['id'], family.lower())
              year_folders = {
                  int(x['name'].split('=',1)[1]): x
                  for x in api.list_children(service, fam_folder['id'])
                  if str(x.get('name') or '').startswith('year=')
              }
              if set(year_folders) != set(range(2010, 2026)):
                  raise SystemExit(f'{family}: Warehouse year-folder coverage mismatch')

              wh_root = root/'warehouse'/family
              staging_map[family] = str(wh_root)
              family_audit = {'years': {}}
              for year in range(2010, 2026):
                  raw = raw_by_year[year]
                  raw_path = root/'raw'/family/f'{family}_{year}.zip'
                  guarded_download(raw['drive_id'], raw_path, raw['sha256'])

                  asset = assets[(family, year)]
                  expected_name = Path(str(asset['relative_path'])).name
                  parquet_meta = child(year_folders[year]['id'], expected_name)
                  wh_path = wh_root / str(asset['relative_path'])
                  guarded_download(parquet_meta['id'], wh_path, asset['sha256'])
                  family_audit['years'][str(year)] = {
                      'raw_id': raw['drive_id'],
                      'raw_sha256': raw['sha256'],
                      'warehouse_id': parquet_meta['id'],
                      'warehouse_sha256': asset['sha256'],
                  }
              download_audit[family] = family_audit

          (root/'staging_map.json').write_text(
              json.dumps(staging_map, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (root/'output'/'download_audit.json').write_text(
              json.dumps({
                  'status':'PASS',
                  'generation_id':expected_generation,
                  'transport':'authenticated_google_drive_api',
                  'families':download_audit,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Run full 2010-2025 Index Base dual-read audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          ROOT=/tmp/rlt_historical_audit
          BAC_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['BAC'])")"
          KYI_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['KYI'])")"
          CHA_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['CHA'])")"
          CYB_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['CYB'])")"
          SED_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['SED'])")"
          UKC_ROOT="$(python -c "import json;print(json.load(open('$ROOT/staging_map.json'))['UKC'])")"

          python horse-racing/jrdb/src/audit_jrdb_index_base_raw_vs_warehouse.py             --raw-root "$ROOT/raw"             --warehouse-manifest "$ROOT/final/manifest.json"             --asset-root "BAC=$BAC_ROOT"             --asset-root "KYI=$KYI_ROOT"             --asset-root "CHA=$CHA_ROOT"             --asset-root "CYB=$CYB_ROOT"             --asset-root "SED=$SED_ROOT"             --asset-root "UKC=$UKC_ROOT"             --years {2010..2025}             --audit-json "$ROOT/output/audit.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build compact result
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/rlt_historical_audit')
          path = root/'output'/'audit.json'
          report = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {
              'status':'FAIL','error':'audit.json missing before dual-read completion'
          }
          tables = report.get('tables') or {}
          summary = {
              'status': report.get('status') or 'FAIL',
              'source_generation_id': report.get('source_generation_id'),
              'years': report.get('years'),
              'table_pass': {k: v.get('pass') for k,v in tables.items()},
              'row_counts': {k: v.get('row_count') for k,v in tables.items()},
              'integrity': report.get('integrity'),
              'error': report.get('error'),
          }
          out = root/'output'/'summary.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"status={summary['status']}\n")
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlt-historical-warehouse-audit-${{ github.run_id }}
          path: /tmp/rlt_historical_audit/output/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('/tmp/rlt_historical_audit/output/summary.json')
          summary = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'FAIL'}
          payload = {**summary, 'run_id': int(os.environ['GITHUB_RUN_ID']),
                     'audit_exit_code': os.environ.get('AUDIT_EXIT')}
          Path('/tmp/result.md').write_text(
              'RL_T_HISTORICAL_WAREHOUSE_AUDIT_RESULT\n```json\n'
              + json.dumps(payload, ensure_ascii=False, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: |
          if [ "$AUDIT_STATUS" = "PASS" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "not planned"
          fi

      - name: Fail workflow when audit fails
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: test "$AUDIT_STATUS" = "PASS"
