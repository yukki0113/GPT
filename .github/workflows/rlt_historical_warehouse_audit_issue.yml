name: RL-T Historical Warehouse Audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RL_T_HISTORICAL_WAREHOUSE_AUDIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Warehouse runtime
        run: |
          python -m pip install --disable-pip-version-check             'duckdb==1.1.3' 'pyarrow==25.0.1' 'PyYAML==6.0.3' 'requests==2.34.2'
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Parse formal request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          req = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          request_id = str(req.get('request_id') or '').strip()
          required = ('BAC','KYI','CHA','CYB','SED','UKC')
          years = [int(y) for y in (req.get('years') or list(range(2010, 2026)))]
          if not years or years != sorted(set(years)) or any(y < 2010 or y > 2025 for y in years):
              raise SystemExit('years must be a unique sorted subset of 2010-2025')
          req['years'] = years
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('invalid request_id')
          if req.get('generation_id') != 'jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected generation_id')
          for key in ('manifest_id','audit_id'):
              if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(req.get(key) or '')):
                  raise SystemExit(f'invalid {key}')
          builds = req.get('family_builds') or {}
          if set(builds) != set(required):
              raise SystemExit('family_builds must contain BAC/KYI/CHA/CYB/SED/UKC exactly')
          for family, spec in builds.items():
              if not re.fullmatch(r'[0-9a-f]{40}', str(spec.get('source_git_commit') or '')):
                  raise SystemExit(f'invalid source_git_commit: {family}')
              if not str(spec.get('created_at') or '').endswith('+00:00'):
                  raise SystemExit(f'invalid created_at: {family}')
              if not str(spec.get('generation_id') or '').startswith('historical-warehouse-staging-'):
                  raise SystemExit(f'invalid staging generation_id: {family}')
          root = Path('/tmp/rlt_historical_audit')
          (root/'output').mkdir(parents=True, exist_ok=True)
          (root/'request.json').write_text(json.dumps(req, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f'request_id={request_id}\n')
          PY

      - name: Download accepted final manifest and audit
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          root=Path('/tmp/rlt_historical_audit')
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))

          def download(file_id, path, attempts=5):
              path.parent.mkdir(parents=True, exist_ok=True)
              last=None
              for attempt in range(1, attempts+1):
                  part=path.with_suffix(path.suffix+'.part')
                  part.unlink(missing_ok=True)
                  try:
                      with requests.get(
                          'https://drive.usercontent.google.com/download',
                          params={'id':file_id,'export':'download','confirm':'t'},
                          stream=True, timeout=(20,180),
                      ) as response:
                          response.raise_for_status()
                          with part.open('wb') as h:
                              for block in response.iter_content(1024*1024):
                                  if block: h.write(block)
                      part.replace(path)
                      return
                  except Exception as exc:
                      last=repr(exc)
                      part.unlink(missing_ok=True)
                      if attempt<attempts: time.sleep(min(20, 2**attempt))
              raise SystemExit(f'final evidence download failed id={file_id}: {last}')

          download(req['manifest_id'], root/'final'/'manifest.json')
          download(req['audit_id'], root/'final'/'audit.json')
          manifest=json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'final'/'audit.json').read_text(encoding='utf-8'))
          if manifest.get('artifact_type')!='jrdb_normalized_warehouse_final_generation':
              raise SystemExit('unexpected final manifest type')
          if manifest.get('generation_id')!=req['generation_id'] or manifest.get('status')!='PASS':
              raise SystemExit('accepted final manifest gate failed')
          if audit.get('generation_id')!=req['generation_id'] or audit.get('status')!='PASS':
              raise SystemExit('accepted final audit gate failed')
          if audit.get('year_coverage') != [2010, 2025]:
              raise SystemExit('accepted final audit coverage mismatch')
          PY

      - name: Fetch original annual JRDB Raw from upstream
        id: raw
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          mkdir -p /tmp/rlt_historical_audit/raw /tmp/rlt_historical_audit/report
          FROM_YEAR="$(python -c "import json;d=json.load(open('/tmp/rlt_historical_audit/request.json'));print(min(d['years']))")"
          TO_YEAR="$(python -c "import json;d=json.load(open('/tmp/rlt_historical_audit/request.json'));print(max(d['years']))")"
          python horse-racing/jrdb/src/fetch_jrdb_history.py             --from-year "$FROM_YEAR" --to-year "$TO_YEAR"             --kinds BAC KYI CHA CYB SED UKC             --output-dir /tmp/rlt_historical_audit/raw             --manifest /tmp/rlt_historical_audit/report/raw_fetch_manifest.jsonl             --sleep-seconds 0.5 --max-retries 4 --retry-backoff-seconds 2             > /tmp/rlt_historical_audit/report/raw_fetch_stdout.log             2> /tmp/rlt_historical_audit/report/raw_fetch_stderr.log

      - name: Prepare original staging archive names
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/rlt_historical_audit')
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))
          for family in ('BAC','KYI','CHA','CYB','SED','UKC'):
              for year in req['years']:
                  source=root/'raw'/family/f'{family}_{year}.zip'
                  if not source.is_file():
                      raise SystemExit(f'missing fetched Raw: {source}')
                  target=root/'rebuild_input'/family/str(year)/f'{family}.zip'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  try:
                      os.link(source,target)
                  except OSError:
                      import shutil
                      shutil.copy2(source,target)
          PY

      - name: Rebuild accepted Warehouse assets from frozen semantics
        id: rebuild
        run: |
          set -euo pipefail
          ROOT=/tmp/rlt_historical_audit
          mkdir -p "$ROOT/rebuild_report" "$ROOT/rebuilt"
          for FAMILY in BAC KYI CHA CYB SED UKC; do
            COMMIT="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['source_git_commit'])")"
            CREATED_AT="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['created_at'])")"
            GEN="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['generation_id'])")"
            WORKTREE="$ROOT/source-$FAMILY"
            git worktree add --detach "$WORKTREE" "$COMMIT"

            FAMILY="$FAMILY" COMMIT="$COMMIT" CREATED_AT="$CREATED_AT" GEN="$GEN" WORKTREE="$WORKTREE" ROOT="$ROOT"             PYTHONPATH="$WORKTREE/horse-racing/jrdb/src:$WORKTREE/tools/data-storage"             python - <<'PY'
          import json, os, sys
          from pathlib import Path

          family=os.environ['FAMILY']
          commit=os.environ['COMMIT']
          created_at=os.environ['CREATED_AT']
          generation=os.environ['GEN']
          root=Path(os.environ['ROOT'])
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))

          from build_jrdb_normalized_warehouse import ArchiveSpec, build_generation

          specs=[
              ArchiveSpec(
                  family=family,
                  year=year,
                  path=root/'rebuild_input'/family/str(year)/f'{family}.zip',
              )
              for year in req['years']
          ]
          result=build_generation(
              specs,
              root/'rebuilt'/family,
              generation,
              commit,
              created_at=created_at,
          )
          (root/'rebuild_report'/f'{family}.json').write_text(
              json.dumps(result['manifest'],ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8',
          )
          PY
            git worktree remove --force "$WORKTREE"
          done

      - name: Verify rebuilt Warehouse is byte-identical to accepted assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('/tmp/rlt_historical_audit')
          final=json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))
          selected_years=set(req['years'])
          relation_map={
              'BAC':{'bac'}, 'KYI':{'kyi'}, 'CHA':{'cha'}, 'CYB':{'cyb'},
              'SED':{'sed'}, 'UKC':{'ukc','ukc_source_record_lineage'},
          }
          checks={}
          all_pass=True
          for family, relations in relation_map.items():
              rebuilt=json.loads((root/'rebuild_report'/f'{family}.json').read_text(encoding='utf-8'))
              expected={
                  (a['family'],int(a['year'])):a for a in final['assets']
                  if a['family'] in relations and int(a['year']) in selected_years
              }
              actual={
                  (a['family'],int(a['year'])):a for a in rebuilt['assets']
                  if a['family'] in relations and int(a['year']) in selected_years
              }
              keys_ok=set(expected)==set(actual)
              details={}
              if keys_ok:
                  for key in sorted(expected):
                      e,a=expected[key],actual[key]
                      fields=('sha256','size_bytes','row_count','schema_hash','canonical_key','relative_path')
                      equal={field:a.get(field)==e.get(field) for field in fields}
                      details[f'{key[0]}:{key[1]}']=equal
                      if not all(equal.values()): all_pass=False
              else:
                  all_pass=False
              checks[family]={
                  'key_set_equal':keys_ok,
                  'expected_asset_count':len(expected),
                  'actual_asset_count':len(actual),
                  'asset_fields':details,
              }

          report={
              'status':'PASS' if all_pass else 'FAIL',
              'accepted_generation_id':final.get('generation_id'),
              'comparison':'rebuilt_at_original_source_commit_and_created_at_vs_accepted_manifest',
              'families':checks,
          }
          (root/'output'/'warehouse_rebuild_equivalence.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          if not all_pass:
              raise SystemExit('rebuilt Warehouse does not exactly match accepted manifest')
          PY

      - name: Run full 2010-2025 Index Base dual-read audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          ROOT=/tmp/rlt_historical_audit
          YEARS="$(python -c "import json;print(' '.join(map(str,json.load(open('$ROOT/request.json'))['years'])))")"
          python horse-racing/jrdb/src/audit_jrdb_index_base_raw_vs_warehouse.py             --raw-root "$ROOT/raw"             --warehouse-manifest "$ROOT/final/manifest.json"             --asset-root "BAC=$ROOT/rebuilt/BAC"             --asset-root "KYI=$ROOT/rebuilt/KYI"             --asset-root "CHA=$ROOT/rebuilt/CHA"             --asset-root "CYB=$ROOT/rebuilt/CYB"             --asset-root "SED=$ROOT/rebuilt/SED"             --asset-root "UKC=$ROOT/rebuilt/UKC"             --years $YEARS             --audit-json "$ROOT/output/audit.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build compact result
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/rlt_historical_audit')
          audit_path=root/'output'/'audit.json'
          rebuild_path=root/'output'/'warehouse_rebuild_equivalence.json'
          audit=json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {}
          rebuild=json.loads(rebuild_path.read_text(encoding='utf-8')) if rebuild_path.exists() else {}
          tables=audit.get('tables') or {}
          status='PASS' if rebuild.get('status')=='PASS' and audit.get('status')=='PASS' else 'FAIL'
          summary={
              'status':status,
              'warehouse_rebuild_equivalence':rebuild.get('status'),
              'source_generation_id':audit.get('source_generation_id'),
              'years':audit.get('years'),
              'table_pass':{k:v.get('pass') for k,v in tables.items()},
              'row_counts':{k:v.get('row_count') for k,v in tables.items()},
              'integrity':audit.get('integrity'),
              'audit_error':audit.get('error'),
          }
          (root/'output'/'summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"status={status}\n")
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlt-historical-warehouse-audit-${{ github.run_id }}
          path: |
            /tmp/rlt_historical_audit/output/
            /tmp/rlt_historical_audit/report/
            /tmp/rlt_historical_audit/rebuild_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/rlt_historical_audit/output/summary.json')
          summary=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'FAIL'}
          payload={**summary,'run_id':int(os.environ['GITHUB_RUN_ID']),
                   'audit_exit_code':os.environ.get('AUDIT_EXIT')}
          Path('/tmp/result.md').write_text(
              'RL_T_HISTORICAL_WAREHOUSE_AUDIT_RESULT\n```json\n'
              +json.dumps(payload,ensure_ascii=False,indent=2)+'\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: |
          if [ "$AUDIT_STATUS" = "PASS" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "not planned"
          fi

      - name: Fail workflow when audit fails
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.summary.outputs.status }}
        run: test "$AUDIT_STATUS" = "PASS"
