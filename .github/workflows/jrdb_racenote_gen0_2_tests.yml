name: JRDB RaceNote Gen0.2 tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/racenote_gen0_2_input_firewall.py'
      - 'horse-racing/jrdb/src/racenote_forecast_gen0_2.py'
      - 'horse-racing/jrdb/schema/racenote_forecast_gen0_schema_v0_2.json'
      - 'horse-racing/jrdb/config/racenote_forecast_gen0_ledger_v0_2.json'
      - 'horse-racing/jrdb/tests/test_racenote_gen0_2_input_firewall.py'
      - 'horse-racing/jrdb/tests/test_racenote_forecast_gen0_2.py'
      - '.github/workflows/jrdb_racenote_gen0_2_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Gen0.2 unit tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q \
            horse-racing/jrdb/tests/test_racenote_gen0_2_input_firewall.py \
            horse-racing/jrdb/tests/test_racenote_forecast_gen0_2.py
