name: Archive BTDAY-0011 Frozen Forecast

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0011_FORECAST]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download frozen DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/p
          gh run download 36801316453 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0011-DAY-PREP --dir /tmp/a
          unzip -q /tmp/a/BTDAY-0011_DAY_PREP_20260315_FINAL.zip -d /tmp/p

      - name: Build and Freeze 0.4.0 forecasts
        run: |
          python - <<'PY'
          import json,glob,hashlib,html,shutil
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/tmp/p')
          out=Path('horse-racing/jrdb/backtests/BTDAY-0011/20260315')
          main_sha='a9e26bdd5d064d646ebae114b498e34f704da5e6'
          date='2026-03-15'; compact='20260315'; logic='RaceNote-Human-Context-Reader-0.4.0-candidate'
          picks={
          ('中京',1):(14,5,3,[6,2]),('中京',2):(1,13,11,[5,7]),('中京',3):(12,8,14,[4,1]),
          ('中京',4):(2,16,14,[15,17]),('中京',5):(1,7,14,[10,13]),('中京',6):(6,5,3,[11,8]),
          ('中京',7):(6,15,1,[12,9]),('中京',8):(10,2,7,[9,12]),('中京',9):(14,9,15,[13,16]),
          ('中京',10):(10,1,9,[4,7]),('中京',11):(12,1,4,[6,2]),('中京',12):(13,17,2,[7,6]),
          ('中山',1):(7,10,14,[4,15]),('中山',2):(7,11,16,[8,3]),('中山',3):(10,6,16,[5,13]),
          ('中山',4):(6,16,8,[3,13]),('中山',5):(12,14,18,[17,15]),('中山',6):(12,4,5,[10,2]),
          ('中山',7):(7,14,1,[4,11]),('中山',8):(7,1,8,[4,10]),('中山',9):(6,5,8,[10,11]),
          ('中山',10):(11,6,15,[13,9]),('中山',11):(12,2,16,[10,4]),('中山',12):(3,2,9,[6,16]),
          ('阪神',1):(11,12,2,[6,13]),('阪神',2):(4,3,1,[11,13]),('阪神',3):(9,14,8,[11,3]),
          ('阪神',4):(7,3,10,[8,14]),('阪神',5):(12,3,11,[16,14]),('阪神',6):(6,3,10,[4,5]),
          ('阪神',7):(11,10,13,[5,3]),('阪神',8):(6,1,10,[5,11]),('阪神',9):(3,7,6,[2,4]),
          ('阪神',10):(5,8,11,[12,9]),('阪神',11):(8,9,3,[13,14]),('阪神',12):(7,8,1,[6,12])}
          def href(h,rank=None):
            d={'horse_no':h['basic']['horse_no'],'horse_name':h['basic']['horse_name']}
            if rank is not None:d['rank']=rank
            return d
          def rr(h):return h.get('racereview') or {}
          def lr(h):return rr(h).get('latest_prior_run') or {}
          def tags(h):return lr(h).get('review_tags') or []
          def nw(h):return (rr(h).get('next_watch') or {}).get('grade')
          def recent(h):
            f=[z.get('result',{}).get('finish') for z in h.get('recent_runs',[])[:3]]
            f=[x for x in f if x is not None]
            return '・'.join(map(str,f))+'着' if f else '実戦履歴が薄い'
          def summary(h,r):
            a=h.get('ability',{}); t=h.get('training',{}).get('summary',{}); hp=h.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; sv=hp.get('same_venue') or {}; b=[]
            if a.get('idm') is not None:b.append(f"今回IDM {a['idm']}")
            if h.get('recent_runs'):b.append(f"近3走着順 {recent(h)}")
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if t.get('training_arrow'):b.append(f"調教{t.get('training_arrow')}")
            if nw(h):b.append(f"Next-Watch {nw(h)}")
            if 'FASTEST_LAST3F' in tags(h):b.append('前走上がり最速')
            if 'TIME_ABOVE_DECLARED_CLASS' in tags(h):b.append('前走時計はクラス水準以上')
            return '、'.join(b[:5])+'。'
          def counter(h):
            hp=h.get('historical_profile') or {};sd=hp.get('same_distance') or {};sv=hp.get('same_venue') or {};b=[]
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if h.get('recent_runs'):b.append(f"近3走は{recent(h)}")
            return '、'.join(b[:3])+'。'
          def winpath(m,s,r):
            mn=m['basic']['horse_name']; a=m.get('ability',{}); t=m.get('training',{}).get('summary',{}); hp=m.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; b=[]
            if a.get('idm') is not None:b.append(f"今回IDM {a['idm']}")
            if m.get('recent_runs'):b.append(f"近3走 {recent(m)}")
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走・3着内{sd.get('top3',0)}回")
            if t.get('training_arrow') in ('上昇','デキ抜群'):b.append(f"調教{t.get('training_arrow')}")
            if nw(m):b.append(f"Next-Watch {nw(m)}")
            return f"{mn}は"+'、'.join(b[:5])+"を総合し、DAY PREP内のレース材料だけなら最も1着に近いと判断する。"
          def caseagainst(h,r):
            sd=((h.get('historical_profile') or {}).get('same_distance') or {})
            st=h.get('ability',{}).get('running_style')
            if not h.get('recent_runs'):return '実戦経験がなく、ペースや馬群への対応は走ってみないと分からない。'
            if sd.get('starts',0)==0:return f"今回の{r['distance_m']}mは直接の同距離実績がなく、距離適応に不確実性が残る。"
            if st=='追込':return '追込脚質のため、前残りや仕掛け遅れになると能力を出し切れないリスクがある。'
            if st=='逃げ':return '逃げ脚質で、同型との競り合いが長引くと終いの余力を失うリスクがある。'
            return '上位候補との能力差が小さく、展開・位置取りが噛み合わない場合は取りこぼし余地がある。'
          def mark_reason(h,role,r):
            a=h.get('ability',{}); t=h.get('training',{}).get('summary',{}).get('training_arrow'); hp=h.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; name=h['basic']['horse_name']; bits=[]
            if sd.get('starts',0) and sd.get('top3',0): bits.append(f"同距離で{sd.get('top3')}回馬券圏")
            if t=='デキ抜群': bits.append("追い切りの状態面が強い")
            elif t=='上昇': bits.append("状態は上向き")
            st=a.get('running_style')
            if st=='逃げ': bits.append("自分の形に持ち込める先行力")
            elif st=='先行': bits.append("好位で運べる機動力")
            elif st=='差し': bits.append("差し脚を生かせる")
            elif st=='追込': bits.append("終いの伸びを生かせる")
            if not bits and a.get('idm') is not None: bits.append(f"今回IDM {a['idm']}の地力")
            core='、'.join(bits[:3])
            if role=='main': return f"{name}を主役に取る。{core}が今回の条件で噛み合い、勝ち切る現実性まで含めて最も買いたい。"
            if role=='second': return f"{name}は{core}が強み。◎以外では最も相手評価を上げたい。"
            if role=='third': return f"{name}は{core}が一発の材料。安定度では本線に譲っても、展開ひとつで◎○を逆転できる単穴。"
            return f"{name}は{core}を評価して5頭候補に残す。"
          def rrrefs(hs,mn,sn):
            z=[]
            for h in hs:
              if rr(h).get('history_status')!='AVAILABLE':continue
              no=h['basic']['horse_no'];role='CONTEXT_ONLY'
              if no==mn:role='UPGRADE_RECENT_FORM'
              elif no==sn:role='SUPPORT_REPEATABILITY'
              elif nw(h) in ('S','A'):role='SUPPORT_COUNTERARGUMENT'
              z.append({'horse_no':no,'horse_name':h['basic']['horse_name'],'source_run_ref':lr(h).get('race_key'),'next_watch_grade':nw(h),'matched_rule_ids':(rr(h).get('next_watch') or {}).get('matched_rule_ids') or [],'decision_role':role,'review_tags':tags(h)[:8]})
            return z
          def ph(r):
            v={'identity':r['identity'],'prediction':r['prediction'],'decision_trace':r['decision_trace']}
            return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          created=datetime.now(timezone.utc).isoformat(timespec='seconds');by={'中京':[],'中山':[],'阪神':[]}
          for p in glob.glob('/tmp/p/reader/*.json'):
            x=json.load(open(p));r=x['race'];key=(r['venue'],int(r['race_no']))
            if key not in picks:continue
            hm={h['basic']['horse_no']:h for h in x['horses']};mn,sn,tn,ons=picks[key]
            m,s,t=hm[mn],hm[sn],hm[tn];oo=[hm[n] for n in ons];cand=[m,s,t]+oo
            M=m['basic']['horse_name'];S=s['basic']['horse_name'];T=t['basic']['horse_name']
            mreason=mark_reason(m,'main',r)
            sreason=mark_reason(s,'second',r)
            treason=mark_reason(t,'third',r)
            oreasons=[mark_reason(h,'other',r) for h in oo]
            race_model=f"{r['venue']}{r['surface']}{r['distance_m']}m・{r.get('class') or ''}。能力だけで序列化せず、位置取り・条件適性・状態・過去走の再解釈を合わせて5頭を選ぶ。"
            trace={'human_principles_used':['H1','H4','H7'],'race_model':race_model,
              'candidate_cases':[{'horse':href(h),'case_for':summary(h,r),'role':('MAIN' if h is m else 'PRINCIPAL_OPPONENT' if h is s else 'SINGLE_SHOT' if h is t else 'SUPPORTING')} for h in cand],
              'mark_reason':{'main':mreason,'second':sreason,'third':treason,'others':oreasons},
              'rrdb_evidence':{'available':True,'reviewed':True,'used_in_decision':True,'horse_refs':rrrefs(cand,mn,sn),'reason_not_used':None},
              'legacy_0_3_fields':{'attraction_stability_convergence':None,'strongest_counter':None,'reversal_condition':None,'status':'NOT_USED_v0.4.0'}}
            rec={'schema_version':'RaceNote-Forecast-Research-Record-0.3.1',
              'identity':{'target_date':date,'venue':r['venue'],'race_no':r['race_no'],'race_key':f"{date}-{r['venue']}-{r['race_no']}",'race_name':r.get('race_name'),'surface':r.get('surface'),'distance_m':r.get('distance_m'),'class':r.get('class')},
              'research':{'evaluation_mode':'BLINDED_HISTORICAL','turn_id':'BTDAY-0011-TURN2-FULLDAY','logic_version':logic,'base_logic_version':'RaceNote-Human-Context-Reader-0.3.5-candidate','candidate_patch':'consolidated five-mark forecast'},
              'source':{'racenote_identity':f"BTDAY-0011/{compact}/{r['venue']}/{r['race_no']}R",'racenote_semantic_sha256':x['source_semantic_sha256'],'day_prep_package':'BTDAY-0011_DAY_PREP_20260315_FINAL.zip','main_sha_at_forecast':main_sha},
              'prediction':{'axis':href(m,1),'marks':{'main':href(m,1),'second':href(s,2),'third':href(t,3),'others':[href(h,4+i) for i,h in enumerate(oo)]},'axis_comment':mreason,'reader_facing_reason':mreason+' '+sreason+' '+treason,'stability_counter_reason':None,'concern':None,'full_field_order':None},
              'decision_trace':trace,
              'audit':{'created_at':created,'frozen_at':created,'prediction_hash':'','pre_result_guard':'PASS','result_visible_at_freeze':False,'candidate_role_separation':'NOT_USED_v0.4.0','five_mark_role_guard':'PASS','market_blind_guard':'PASS','legacy_converge_machinery':'NOT_USED'}}
            rec['audit']['prediction_hash']=ph(rec);by[r['venue']].append(rec)
          for v,rows in by.items():
            rows.sort(key=lambda x:x['identity']['race_no']);assert len(rows)==12
            slug={'中京':'chukyo','中山':'nakayama','阪神':'hanshin'}[v];d=out/'venues'/slug;d.mkdir(parents=True,exist_ok=True)
            (d/f'forecast_{compact}_{v}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
            (d/f'forecast_{compact}_{v}.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in rows))
            aud={'validator_version':'racenote-human-context-0.4.0-candidate-equivalent','candidate_patch':'consolidated five-mark forecast','status':'PASS','venue':v,'target_date':date,'record_count':12,'frozen_count':12,'error_count':0,'prediction_hash_unique_count':12,'converge_races':cv,'five_mark_role_guard':'PASS','legacy_converge_machinery':'NOT_USED','independent_selection_guard':'PASS','converge_semantic_guard':'PASS','result_opened':False}
            (d/f'forecast_{compact}_{v}_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
            hand={'schema_version':'RaceNote-Venue-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0011','target_date':date,'venue':v,'logic_version':logic,'main_sha':main_sha,'race_count':12,'frozen_count':12,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in rows]}
            (d/f'forecast_{compact}_{v}_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          allrows=by['中京']+by['中山']+by['阪神'];dm=out/'day_merge';dm.mkdir(parents=True,exist_ok=True)
          (dm/f'forecast_{compact}_all.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2)+'\n')
          (dm/f'forecast_{compact}_all.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in allrows))
          trs=[]
          for q in allrows:
            m=q['prediction']['marks'];i=q['identity'];other='、'.join(f"△{z['horse_no']} {html.escape(z['horse_name'])}" for z in m['others'])
            trs.append(f"<tr><td>{i['venue']}{i['race_no']}R</td><td>◎{m['main']['horse_no']} {html.escape(m['main']['horse_name'])}</td><td>○{m['second']['horse_no']} {html.escape(m['second']['horse_name'])}</td><td>▲{m['third']['horse_no']} {html.escape(m['third']['horse_name'])}</td><td>{other}</td><td>{html.escape(q['prediction']['reader_facing_reason'])}</td></tr>")
          doc='<!doctype html><html lang="ja"><meta charset="utf-8"><title>RaceNote Forecast 2026-03-15</title><h1>RaceNote Forecast 2026-03-15</h1><p>BTDAY-0011 / 0.4.0-candidate / result_opened=false</p><table border="1"><tr><th>Race</th><th>◎</th><th>○</th><th>▲</th><th>△</th><th>理由</th></tr>'+''.join(trs)+'</table></html>'
          (dm/f'forecast_{compact}_all.html').write_text(doc)
          aud={'schema_version':'RaceNote-Day-Merge-Audit-0.1-draft','selection_id':'BTDAY-0011','target_date':date,'logic_version':logic,'status':'PASS','venue_count':3,'record_count':36,'frozen_count':36,'technical_skips':0,'prediction_hash_unique_count':36,'five_mark_role_guard':'PASS','legacy_converge_machinery':'NOT_USED','independent_selection_guard':'PASS','result_opened':False,'venues':{'中京':'PASS','中山':'PASS','阪神':'PASS'}}
          (dm/f'forecast_{compact}_all_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
          hand={'schema_version':'RaceNote-Day-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0011','target_date':date,'logic_version':logic,'main_sha_at_forecast':main_sha,'day_prep_artifact':'BTDAY-0011-DAY-PREP','day_prep_artifact_digest':'sha256:366ea2185394f8a7e420d880d8c425296005511d769141c1e31f8c7030002c2c','venues':['中京','中山','阪神'],'race_count':36,'frozen_count':36,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in allrows]}
          (dm/f'forecast_{compact}_all_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          dp=out/'day_prep';dp.mkdir(parents=True,exist_ok=True)
          for n in ['day_prep_handoff.json','manifest.json','validation_report.json','selected_pool_state.json']:shutil.copy2(root/n,dp/n)
          (out/'README.md').write_text(f"# BTDAY-0011 — {date}\n\n- Forecast logic: `{logic}`\n- DAY PREP: PASS / result_opened=false\n- Venues: 中京, 中山, 阪神\n- Forecast races: 36 / 36\n- Venue Freeze: PASS x3\n- DAY MERGE: PASS\n- Result opened at Freeze: false\n")
          idx={'selection_id':'BTDAY-0011','target_date':date,'logic_version':logic,'status':'FROZEN','result_opened':False,'day_prep_source':{'artifact_name':'BTDAY-0011-DAY-PREP','run_id':36801316453,'digest':'sha256:366ea2185394f8a7e420d880d8c425296005511d769141c1e31f8c7030002c2c'},'forecast':{'race_count':36,'venue_count':3,'technical_skips':0}}
          (out/'ARTIFACT_INDEX.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          assert len(allrows)==36 and len({q['audit']['prediction_hash'] for q in allrows})==36
          assert all(q['audit']['result_visible_at_freeze'] is False for q in allrows)
          print('PASS: 36 frozen records')
          PY

      - name: Commit canonical Frozen archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0011/20260315
          git commit -m "RaceNote: archive BTDAY-0011 frozen forecast"
          git push origin HEAD:main

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'BTDAY-0011 FORECAST ARCHIVE\nstatus=%s\ncommit=%s\nresult_opened=false\n' "${{ job.status }}" "$sha" > /tmp/c
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/c
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
