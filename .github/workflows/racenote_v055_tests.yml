name: RaceNote v0.5.5 lean forecast tests

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_decision_core_v055.py'
      - 'horse-racing/jrdb/src/racenote_v055_authoring_quality.py'
      - 'horse-racing/jrdb/src/racenote_reader_v055.py'
      - 'horse-racing/jrdb/src/racenote_v055_single_day.py'
      - 'horse-racing/jrdb/tests/test_racenote_v055_decision_core.py'
      - 'horse-racing/jrdb/config/racenote_forecast_logic_current.json'
      - 'horse-racing/jrdb/config/racenote_forecast_logic_human_context_v0_5_5.json'
      - 'horse-racing/jrdb/docs/racenote/FORECAST_HUMAN_CONTEXT_READER_v0_5_5_CANDIDATE.md'
      - 'horse-racing/jrdb/docs/racenote/RACENOTE_V055_SINGLE_DAY_RUNBOOK_v0_1.md'
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v0.5.5 sources
        run: |
          python -m py_compile \
            horse-racing/jrdb/src/racenote_decision_core_v055.py \
            horse-racing/jrdb/src/racenote_v055_authoring_quality.py \
            horse-racing/jrdb/src/racenote_reader_v055.py \
            horse-racing/jrdb/src/racenote_v055_single_day.py
      - name: Run focused tests
        run: python -m pytest -q horse-racing/jrdb/tests/test_racenote_v055_decision_core.py
