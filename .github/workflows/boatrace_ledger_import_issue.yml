name: boatrace-ledger-import-issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: boatrace-ledger-import
  cancel-in-progress: false

env:
  REQUEST_PREFIX: '[BOATRACE_LEDGER_IMPORT]'

jobs:
  import:
    if: >
      startsWith(github.event.issue.title, '[BOATRACE_LEDGER_IMPORT]')
    runs-on: ubuntu-latest
    env:
      GPT_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GPT_GDRIVE_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google clients
        run: python -m pip install google-api-python-client google-auth

      - name: Parse and validate request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          prefix = os.environ['REQUEST_PREFIX']
          title = os.environ['ISSUE_TITLE']
          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('title suffix must be a 1-80 character request_id')
          try:
              request = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          except json.JSONDecodeError as exc:
              raise SystemExit(f'issue body must be raw JSON: {exc}') from exc
          date = str(request.get('date', '')).strip()
          if not re.fullmatch(r'\d{8}', date):
              raise SystemExit('date must be YYYYMMDD')
          datetime.strptime(date, '%Y%m%d')
          folder_id = str(request.get('source_folder_id', '')).strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]{10,100}', folder_id):
              raise SystemExit('source_folder_id is invalid')
          spreadsheet_id = str(request.get('spreadsheet_id', '1gEAYJ90Zv3HDi5gh_at0jDWEQrgCSB5tIywJFZjXcFM')).strip()
          if spreadsheet_id != '1gEAYJ90Zv3HDi5gh_at0jDWEQrgCSB5tIywJFZjXcFM':
              raise SystemExit('only the canonical ledger spreadsheet_id is allowed')
          file_ids = request.get('file_ids')
          if file_ids is not None:
              if not isinstance(file_ids, dict) or set(file_ids) != {'prediction', 'sales', 'result', 'racecard'}:
                  raise SystemExit('file_ids must contain exactly prediction/sales/result/racecard')
              if any(not re.fullmatch(r'[A-Za-z0-9_-]{10,100}', str(value)) for value in file_ids.values()):
                  raise SystemExit('file_ids contains an invalid Drive ID')
          resolved = {'request_id': request_id, 'date': date, 'source_folder_id': folder_id,
                      'spreadsheet_id': spreadsheet_id, 'file_ids': file_ids,
                      'dry_run': bool(request.get('dry_run', False))}
          Path('/tmp/ledger-request.json').write_text(json.dumps(resolved, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Run regression tests
        run: python -m unittest discover -s boat-racing/tests -v

      - name: Import and verify ledger
        id: task
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(Path('/tmp/ledger-request.json').read_text(encoding='utf-8'))
          output = Path('/tmp/boatrace-ledger-result.json')
          command = ['python', 'boat-racing/src/run_forward_trial_chat_import.py',
                     '--date', request['date'], '--folder-id', request['source_folder_id'],
                     '--spreadsheet-id', request['spreadsheet_id'], '--output', str(output)]
          if request.get('file_ids'):
              command.extend(['--file-ids-json', json.dumps(request['file_ids'])])
          if request.get('dry_run'):
              command.append('--dry-run')
          completed = subprocess.run(command, check=False)
          raise SystemExit(completed.returncode)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build result envelope
        if: always()
        env:
          TASK_OUTCOME: ${{ steps.task.outcome }}
          TASK_EXIT_CODE: ${{ steps.task.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path('/tmp/boatrace-ledger-result.json')
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding='utf-8'))
          else:
              result = {'status': 'failure', 'failure_class': 'IMPLEMENTATION_ERROR',
                        'error_code': 'IMPORT_DID_NOT_PRODUCE_RESULT',
                        'message': 'Inspect the failed workflow step log.', 'retryable': False}
          result['run_id'] = int(os.environ['RUN_ID'])
          result['task_outcome'] = os.environ.get('TASK_OUTCOME', '')
          result['task_exit_code'] = os.environ.get('TASK_EXIT_CODE', '')
          Path('/tmp/boatrace-ledger-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatrace-ledger-result-${{ github.run_id }}
          path: /tmp/boatrace-ledger-result.json
          retention-days: 90

      - name: Comment result
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo '<!-- BOATRACE_LEDGER_IMPORT_RESULT -->'
            echo '```json'
            cat /tmp/boatrace-ledger-result.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          if [ "${{ steps.task.outcome }}" = "success" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          fi

      - name: Fail workflow when import failed
        if: steps.task.outcome != 'success'
        run: exit 1
