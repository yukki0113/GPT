name: JRDB RaceNote Gen0.3 tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/racenote_general_evidence.py'
      - 'horse-racing/jrdb/src/racenote_pairwise_comparison.py'
      - 'horse-racing/jrdb/src/racenote_scenario_robustness.py'
      - 'horse-racing/jrdb/src/racenote_edge_performance_adapter.py'
      - 'horse-racing/jrdb/src/racenote_forecast_gen0_3.py'
      - 'horse-racing/jrdb/schema/racenote_general_evidence_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_pairwise_comparison_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_scenario_robustness_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_forecast_gen0_schema_v0_3.json'
      - 'horse-racing/jrdb/config/racenote_forecast_gen0_ledger_v0_3.json'
      - 'horse-racing/jrdb/tests/test_racenote_general_evidence.py'
      - 'horse-racing/jrdb/tests/test_racenote_pairwise_comparison.py'
      - 'horse-racing/jrdb/tests/test_racenote_scenario_robustness.py'
      - 'horse-racing/jrdb/tests/test_racenote_edge_performance_adapter.py'
      - 'horse-racing/jrdb/tests/test_racenote_forecast_gen0_3.py'
      - '.github/workflows/jrdb_racenote_gen0_3_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_general_evidence.py'
      - 'horse-racing/jrdb/src/racenote_pairwise_comparison.py'
      - 'horse-racing/jrdb/src/racenote_scenario_robustness.py'
      - 'horse-racing/jrdb/src/racenote_edge_performance_adapter.py'
      - 'horse-racing/jrdb/src/racenote_forecast_gen0_3.py'
      - 'horse-racing/jrdb/schema/racenote_general_evidence_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_pairwise_comparison_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_scenario_robustness_schema_v0_1.json'
      - 'horse-racing/jrdb/schema/racenote_forecast_gen0_schema_v0_3.json'
      - 'horse-racing/jrdb/config/racenote_forecast_gen0_ledger_v0_3.json'
      - 'horse-racing/jrdb/tests/test_racenote_general_evidence.py'
      - 'horse-racing/jrdb/tests/test_racenote_pairwise_comparison.py'
      - 'horse-racing/jrdb/tests/test_racenote_scenario_robustness.py'
      - 'horse-racing/jrdb/tests/test_racenote_edge_performance_adapter.py'
      - 'horse-racing/jrdb/tests/test_racenote_forecast_gen0_3.py'
      - '.github/workflows/jrdb_racenote_gen0_3_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Gen0.3 modules
        working-directory: horse-racing/jrdb
        run: |
          python -m py_compile src/racenote_general_evidence.py
          python -m py_compile src/racenote_pairwise_comparison.py
          python -m py_compile src/racenote_scenario_robustness.py
          python -m py_compile src/racenote_edge_performance_adapter.py
          python -m py_compile src/racenote_forecast_gen0_3.py
      - name: Validate Gen0.3 JSON schemas and config
        working-directory: horse-racing/jrdb
        run: |
          python -m json.tool schema/racenote_general_evidence_schema_v0_1.json >/dev/null
          python -m json.tool schema/racenote_pairwise_comparison_schema_v0_1.json >/dev/null
          python -m json.tool schema/racenote_scenario_robustness_schema_v0_1.json >/dev/null
          python -m json.tool schema/racenote_forecast_gen0_schema_v0_3.json >/dev/null
          python -m json.tool config/racenote_forecast_gen0_ledger_v0_3.json >/dev/null
      - name: Run Gen0.3 unit tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q             horse-racing/jrdb/tests/test_racenote_general_evidence.py             horse-racing/jrdb/tests/test_racenote_pairwise_comparison.py             horse-racing/jrdb/tests/test_racenote_scenario_robustness.py             horse-racing/jrdb/tests/test_racenote_edge_performance_adapter.py             horse-racing/jrdb/tests/test_racenote_forecast_gen0_3.py
