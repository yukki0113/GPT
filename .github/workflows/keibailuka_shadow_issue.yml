name: keibailuka shadow score issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  score:
    if: startsWith(github.event.issue.title, '[KEIBAILUKA_SHADOW_REQUEST]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horse-racing/fetch_keibailuka_blog/requirements.txt
      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          body=os.environ["ISSUE_BODY"]
          m=re.search(r"```json\s*(\{.*\})\s*```",body,re.S)
          if not m:
              raise SystemExit("request json not found")
          obj=json.loads(m.group(1))
          open("/tmp/request.json","w",encoding="utf-8").write(json.dumps(obj,ensure_ascii=False))
          PY
      - name: Run shadow score
        run: |
          mkdir -p /tmp/keibailuka-shadow
          python horse-racing/fetch_keibailuka_blog/src/run_keibailuka_shadow_sheet_date.py \
            --request-json /tmp/request.json \
            --output-dir /tmp/keibailuka-shadow
      - uses: actions/upload-artifact@v4
        with:
          name: keibailuka-shadow-${{ github.event.issue.number }}
          path: /tmp/keibailuka-shadow
      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file /tmp/keibailuka-shadow/summary.md
          gh issue close "$ISSUE" --reason completed
