name: RaceReviewDB PACI Incremental Update

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  RACEREVIEW_CURRENT_DRIVE_ID: '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'

jobs:
  incremental:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_RACE_REVIEW_INCREMENTAL]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/data-storage/requirements.txt

      - name: Install storage runtime
        run: |
          python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Parse PACI and SED request lists
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/race_review_request
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get('ISSUE_BODY') or ''
          grouped = {'PACI': [], 'SED': []}

          for raw in body.splitlines():
              line = raw.strip()
              kind = None
              if line.startswith('PACI|'):
                  kind = 'PACI'
              elif line.startswith('SED|'):
                  kind = 'SED'
              if kind is None:
                  continue

              parts = line.split('|')
              if len(parts) != 3:
                  raise SystemExit(f'invalid result input line: {line}')
              _, file_id, name = parts
              if not re.fullmatch(r'[A-Za-z0-9_-]+', file_id):
                  raise SystemExit(f'invalid Drive file id: {file_id}')
              if not re.fullmatch(kind + r'\d{6}\.zip', name):
                  raise SystemExit(f'invalid {kind} file name: {name}')
              grouped[kind].append((name, file_id))

          for kind in ('PACI', 'SED'):
              grouped[kind].sort()
              if not grouped[kind]:
                  raise SystemExit(f'no {kind} request lines found')
              dates = [
                  name[len(kind):len(kind)+6]
                  for name, _ in grouped[kind]
              ]
              if len(dates) != len(set(dates)):
                  raise SystemExit(f'duplicate {kind} dates in request')

          paci_dates = [name[4:10] for name, _ in grouped['PACI']]
          sed_dates = [name[3:9] for name, _ in grouped['SED']]
          if paci_dates != sed_dates:
              raise SystemExit(
                  f'PACI/SED date coverage mismatch: {paci_dates} != {sed_dates}'
              )

          for kind in ('PACI', 'SED'):
              path = Path(
                  '/tmp/race_review_request/' + kind.lower() + '.tsv'
              )
              path.write_text(
                  ''.join(
                      f'{name}\t{file_id}\n'
                      for name, file_id in grouped[kind]
                  ),
                  encoding='utf-8',
              )

          print(f'input_count={len(grouped["PACI"])}')
          print(f'first={grouped["PACI"][0][0]}')
          print(f'last={grouped["PACI"][-1][0]}')
          PY

      - name: Download RaceReviewDB CURRENT
        run: |
          set -euo pipefail
          mkdir -p /tmp/race_review_input
          gdown "$RACEREVIEW_CURRENT_DRIVE_ID"             -O /tmp/race_review_input/RaceReviewDB_CURRENT.zip
          test -s /tmp/race_review_input/RaceReviewDB_CURRENT.zip
          python -m zipfile -t             /tmp/race_review_input/RaceReviewDB_CURRENT.zip >/dev/null

      - name: Download requested PACI and SED archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/race_review_input/paci /tmp/race_review_input/sed

          download_one() {
            NAME="$1"
            FILE_ID="$2"
            TARGET="$3"

            rm -f "$TARGET"

            for attempt in 1 2; do
              if gdown "$FILE_ID" -O "$TARGET"                 && test -s "$TARGET"                 && python -m zipfile -t "$TARGET" >/dev/null 2>&1; then
                return 0
              fi
              echo "gdown retry: $NAME attempt=$attempt" >&2
              rm -f "$TARGET"
              sleep $((attempt * 2))
            done

            URL1="https://drive.usercontent.google.com/download?id=$FILE_ID&export=download&confirm=t"
            if curl --fail --location --silent --show-error               --retry 5 --retry-all-errors               --connect-timeout 20 --max-time 180               "$URL1" -o "$TARGET"               && test -s "$TARGET"               && python -m zipfile -t "$TARGET" >/dev/null 2>&1; then
              return 0
            fi

            rm -f "$TARGET"
            URL2="https://drive.google.com/uc?export=download&id=$FILE_ID&confirm=t"
            if curl --fail --location --silent --show-error               --retry 5 --retry-all-errors               --connect-timeout 20 --max-time 180               "$URL2" -o "$TARGET"               && test -s "$TARGET"               && python -m zipfile -t "$TARGET" >/dev/null 2>&1; then
              return 0
            fi

            rm -f "$TARGET"
            return 1
          }

          validate_members() {
            KIND="$1"
            NAME="$2"
            TARGET="$3"
            python - "$KIND" "$NAME" "$TARGET" <<'PY'
          import sys
          import zipfile

          kind, name, target = sys.argv[1:4]
          if kind == 'PACI':
              date = name[4:10]
              required = {f'BAC{date}.txt', f'KYI{date}.txt'}
          else:
              date = name[3:9]
              required = {f'SED{date}.txt'}

          with zipfile.ZipFile(target) as archive:
              members = set(archive.namelist())
          missing = sorted(required - members)
          if missing:
              raise SystemExit(
                  f'{name}: missing required ZIP members: {missing}'
              )
          PY
          }

          download_list() {
            KIND="$1"
            TSV="$2"
            DEST="$3"
            while IFS=$'\t' read -r NAME FILE_ID; do
              TARGET="$DEST/$NAME"
              if ! download_one "$NAME" "$FILE_ID" "$TARGET"; then
                echo "Drive download failed after all methods: $NAME ($FILE_ID)" >&2
                exit 1
              fi
              validate_members "$KIND" "$NAME" "$TARGET"
            done < "$TSV"
          }

          download_list             PACI             /tmp/race_review_request/paci.tsv             /tmp/race_review_input/paci
          download_list             SED             /tmp/race_review_request/sed.tsv             /tmp/race_review_input/sed

      - name: Run RaceReviewDB incremental update
        id: update
        continue-on-error: true
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          ROOT=/tmp/race_review
          mkdir -p "$ROOT/work" "$ROOT/output"

          PACI_ARGS=()
          while IFS=$'\t' read -r NAME FILE_ID; do
            PACI_ARGS+=(--paci "/tmp/race_review_input/paci/$NAME")
          done < /tmp/race_review_request/paci.tsv

          SED_ARGS=()
          while IFS=$'\t' read -r NAME FILE_ID; do
            SED_ARGS+=(--sed "/tmp/race_review_input/sed/$NAME")
          done < /tmp/race_review_request/sed.tsv

          GENERATION_ID="jrdb_race_review_v0_1_incremental_g$GITHUB_RUN_ID"
          echo "generation_id=$GENERATION_ID" >> "$GITHUB_OUTPUT"

          python horse-racing/jrdb/src/jrdb_postrace_review_incremental.py             --current-zip /tmp/race_review_input/RaceReviewDB_CURRENT.zip             --work-root "$ROOT/work"             "${PACI_ARGS[@]}"             "${SED_ARGS[@]}"             --output-root "$ROOT/output/postrace_review/v0_1"             --generation-id "$GENERATION_ID"             --summary-json "$ROOT/output/incremental_summary.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verify generated CURRENT candidate
        id: verify
        if: always()
        continue-on-error: true
        env:
          GENERATION_ID: ${{ steps.update.outputs.generation_id }}
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/race_review/output')
          review = root / 'postrace_review' / 'v0_1'
          compact = {
              'status': 'FAIL',
              'generation_id': os.environ.get('GENERATION_ID') or None,
          }

          try:
              summary = json.loads(
                  (root / 'incremental_summary.json').read_text(
                      encoding='utf-8'
                  )
              )
              current = json.loads(
                  (review / 'current.json').read_text(encoding='utf-8')
              )
              manifest = json.loads(
                  (review / current['manifest']).read_text(
                      encoding='utf-8'
                  )
              )
              audit = json.loads(
                  (
                      review
                      / 'generations'
                      / manifest['generation_id']
                      / 'audit.json'
                  ).read_text(encoding='utf-8')
              )

              if current.get('status') != 'CURRENT':
                  raise RuntimeError('candidate pointer is not CURRENT')
              if manifest.get('validation_status') != 'PASS':
                  raise RuntimeError('candidate manifest is not PASS')
              if audit.get('status') != 'PASS':
                  raise RuntimeError('candidate audit is not PASS')
              if summary.get('status') != 'PASS':
                  raise RuntimeError('incremental summary is not PASS')
              if manifest.get('generation_id') != summary.get('generation_id'):
                  raise RuntimeError('generation mismatch')
              if manifest.get('period_to') != summary.get('period_to'):
                  raise RuntimeError('period_to mismatch')

              requested = []
              for line in Path(
                  '/tmp/race_review_request/paci.tsv'
              ).read_text(encoding='utf-8').splitlines():
                  name, _file_id = line.split('\t')
                  requested.append(
                      '20'
                      + name[4:6]
                      + '-'
                      + name[6:8]
                      + '-'
                      + name[8:10]
                  )
              requested.sort()

              if summary.get('target_dates') != requested:
                  raise RuntimeError(
                      'target date mismatch: '
                      f'{summary.get("target_dates")} != {requested}'
                  )
              if manifest.get('period_to') != requested[-1]:
                  raise RuntimeError(
                      'candidate period_to does not reach '
                      f'{requested[-1]}'
                  )

              compact = {
                  'status': 'PASS',
                  'generation_id': summary.get('generation_id'),
                  'previous_generation_id': summary.get(
                      'previous_generation_id'
                  ),
                  'previous_period_to': summary.get('previous_period_to'),
                  'period_to': summary.get('period_to'),
                  'target_dates': summary.get('target_dates'),
                  'updates': summary.get('updates'),
                  'snapshot_object_hash': manifest.get(
                      'snapshot_object_hash'
                  ),
                  'row_counts': {
                      name: meta.get('total_rows')
                      for name, meta in (
                          manifest.get('relations') or {}
                      ).items()
                  },
                  'database_warnings': (
                      audit.get('database_audit') or {}
                  ).get('warnings'),
              }
          except Exception as exc:
              compact['error'] = str(exc)

          path = root / 'compact_summary.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(compact, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(compact, ensure_ascii=False))

          if compact.get('status') != 'PASS':
              raise SystemExit(1)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload next RaceReviewDB snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-next-${{ github.run_id }}
          path: /tmp/race_review/output/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Comment compact result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          UPDATE_EXIT: ${{ steps.update.outputs.exit_code }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/race_review/output/compact_summary.json')
          if path.is_file():
              summary = json.loads(path.read_text(encoding='utf-8'))
          else:
              summary = {
                  'status': 'FAIL',
                  'error': 'compact_summary.json missing',
              }

          summary['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          summary['update_exit_code'] = os.environ.get('UPDATE_EXIT')
          summary['verify_exit_code'] = os.environ.get('VERIFY_EXIT')

          Path('/tmp/race_review_result.md').write_text(
              'JRDB_RACE_REVIEW_INCREMENTAL_RESULT\n```json\n'
              + json.dumps(summary, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body-file /tmp/race_review_result.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          if [ "$VERIFY_EXIT" = "0" ]; then
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason completed
          else
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason "not planned"
          fi

      - name: Fail unless update and verification passed
        if: always()
        env:
          UPDATE_EXIT: ${{ steps.update.outputs.exit_code }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          test "$UPDATE_EXIT" = "0"
          test "$VERIFY_EXIT" = "0"
