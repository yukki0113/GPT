name: JRDB Ability existing-horse comparison via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  compare:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_ABILITY_COMPARE]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy scipy scikit-learn
      - name: Run regression tests
        run: |
          python -m pytest -q \
            horse-racing/jrdb/tests/test_build_jrdb_ability_snapshot.py \
            horse-racing/jrdb/tests/test_compare_jrdb_ability_models.py \
            horse-racing/jrdb/tests/test_finalize_jrdb_ability_comparison.py \
            horse-racing/jrdb/tests/test_build_jrdb_official_runperf.py \
            horse-racing/jrdb/tests/test_audit_jrdb_official_runperf.py
      - name: Prepare 2010-2023 workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/jrdb_ability_compare/raw /tmp/jrdb_ability_compare/report
      - name: Fetch Raw
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: python horse-racing/jrdb/src/fetch_jrdb_history.py --from-year 2010 --to-year 2023 --kinds BAC KYI SED UKC CHA CYB --output-dir /tmp/jrdb_ability_compare/raw --manifest /tmp/jrdb_ability_compare/report/fetch_manifest.jsonl --sleep-seconds 1
      - name: Build Index Base
        run: |
          YEARS=$(seq 2010 2023)
          python horse-racing/jrdb/src/build_jrdb_index_base_from_raw.py --raw-root /tmp/jrdb_ability_compare/raw --years $YEARS --db /tmp/jrdb_ability_compare/index.sqlite --no-archive-hash
      - name: Audit Index Base
        run: python horse-racing/jrdb/src/audit_jrdb_index_base.py --db /tmp/jrdb_ability_compare/index.sqlite --out /tmp/jrdb_ability_compare/report/index_audit.json --no-db-hash
      - name: Build RunPerf
        run: python horse-racing/jrdb/src/build_jrdb_runperf_features.py --index-db /tmp/jrdb_ability_compare/index.sqlite --out /tmp/jrdb_ability_compare/runperf.sqlite --methods EXPANDING
      - name: Audit RunPerf
        run: python horse-racing/jrdb/src/audit_jrdb_runperf.py --db /tmp/jrdb_ability_compare/runperf.sqlite --out /tmp/jrdb_ability_compare/report/runperf_audit.json --no-db-hash
      - name: Build Official RunPerf
        run: python horse-racing/jrdb/src/build_jrdb_official_runperf.py --runperf-db /tmp/jrdb_ability_compare/runperf.sqlite --out /tmp/jrdb_ability_compare/official.sqlite
      - name: Audit Official RunPerf
        run: python horse-racing/jrdb/src/audit_jrdb_official_runperf.py --db /tmp/jrdb_ability_compare/official.sqlite --source-runperf-db /tmp/jrdb_ability_compare/runperf.sqlite --out /tmp/jrdb_ability_compare/report/official_audit.json --no-db-hash
      - name: Build Ability Snapshot
        run: python horse-racing/jrdb/src/build_jrdb_ability_snapshot.py --index-db /tmp/jrdb_ability_compare/index.sqlite --official-runperf-db /tmp/jrdb_ability_compare/official.sqlite --out /tmp/jrdb_ability_compare/ability.sqlite
      - name: Audit Ability Snapshot
        run: python horse-racing/jrdb/src/audit_jrdb_ability_snapshot.py --db /tmp/jrdb_ability_compare/ability.sqlite --out /tmp/jrdb_ability_compare/report/ability_snapshot_audit.json
      - name: Compare Ability models
        run: python horse-racing/jrdb/src/compare_jrdb_ability_models.py --db /tmp/jrdb_ability_compare/ability.sqlite --out /tmp/jrdb_ability_compare/report/ability_comparison.json
      - name: Finalize Ability comparison report
        run: python horse-racing/jrdb/src/finalize_jrdb_ability_comparison.py --report /tmp/jrdb_ability_compare/report/ability_comparison.json
      - name: Build lightweight result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('/tmp/jrdb_ability_compare/report/ability_comparison.json')
          result = {
              'status': 'failure',
              'run_id': '${{ github.run_id }}',
              'head_sha': '${{ github.sha }}',
              'development_end': 2023,
              'holdout_touched': False,
              '2024_2025_predictive_metrics_inspected': False,
              'model_promoted': False,
          }

          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))

              def compact_candidate(candidate):
                  if candidate is None:
                      return None
                  return {
                      'candidate': candidate.get('candidate'),
                      'mean_primary': candidate.get('mean_primary'),
                      'primary_sd': candidate.get('primary_sd'),
                      'row_count': candidate.get('row_count'),
                      'race_count': candidate.get('race_count'),
                      'selection_status': candidate.get('selection_status'),
                  }

              result.update({
                  'protocol_version': report.get('protocol_version'),
                  'development_end': report.get('development_end'),
                  'holdout_touched': report.get('holdout_touched'),
                  '2024_2025_predictive_metrics_inspected': report.get('2024_2025_predictive_metrics_inspected'),
                  'debut_rows_used': report.get('debut_rows_used'),
                  'source_eligible_rows': report.get('source_eligible_rows'),
                  'candidate_counts': report.get('candidate_counts'),
                  'candidate_validity': report.get('candidate_validity'),
                  'preprocessing_leakage_violations': report.get('preprocessing_leakage_violations'),
                  'best_a0': compact_candidate(report.get('best_a0')),
                  'best_ridge': compact_candidate(report.get('best_ridge')),
                  'best_elastic_net': compact_candidate(report.get('best_elastic_net')),
                  'paired_vs_best_a0': report.get('paired_vs_best_a0'),
              })
              result['status'] = 'success' if report.get('status') == 'PASS' and report.get('holdout_touched') is False else 'failure'

          Path('/tmp/jrdb_ability_compare/report/workflow_result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False),
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jrdb-ability-compare-2010-2023-${{ github.run_id }}
          path: /tmp/jrdb_ability_compare/report
          if-no-files-found: warn
      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const p='/tmp/jrdb_ability_compare/report/workflow_result.json';
            const body=fs.existsSync(p)?'JRDB_ABILITY_COMPARE_RESULT\n```json\n'+fs.readFileSync(p,'utf8')+'\n```':'JRDB_ABILITY_COMPARE_RESULT\nworkflow failed before report generation';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
