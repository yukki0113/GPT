            ('札幌',9):'出遅れて最後方から外へ持ち出し差し切り。前が競れば末脚がさらに生きる。',
            ('札幌',10):'好位を取れる脚があり状態上向き。流れが落ち着けば前残りから押し切りまで。',
            ('札幌',11):'前走は最後方から直線だけで脚を使った。流れが締まれば末脚が勝ち負けへ直結する。',
            ('札幌',12):'前走は先手から決め手勝負に屈しただけ。状態上向きで自分のペースなら押し切り余地。'
          }

          def href(h,rank=None):
            d={'horse_no':h['basic']['horse_no'],'horse_name':h['basic']['horse_name']}
            if rank is not None:d['rank']=rank
            return d
          def rr(h): return h.get('racereview') or {}
          def lr(h): return rr(h).get('latest_prior_run') or {}
          def nw(h): return (rr(h).get('next_watch') or {}).get('grade')
          def tags(h): return lr(h).get('review_tags') or []
          def recent_comment(h):
            runs=h.get('recent_runs') or []
            if not runs:return None
            return ((runs[0].get('notes') or {}).get('race_comment'))
          def concise_case(h,r):
            a=h.get('ability') or {}; hp=h.get('historical_profile') or {}; tr=((h.get('training') or {}).get('summary') or {})
            bits=[]
            if a.get('idm') is not None: bits.append(f"IDM {a['idm']}")
            if recent_comment(h): bits.append(recent_comment(h))
            sd=hp.get('same_distance') or {}
            if sd.get('starts',0): bits.append(f"同距離{sd.get('starts')}走/3着内{sd.get('top3',0)}")
            if tr.get('training_arrow') in ('上昇','デキ抜群'): bits.append(f"調教{tr.get('training_arrow')}")
            if nw(h): bits.append(f"Next-Watch {nw(h)}")
            return ' / '.join(bits[:4])
          def rrrefs(hs):
            z=[]
            for h in hs:
              if rr(h).get('history_status')!='AVAILABLE':continue
              z.append({'horse_no':h['basic']['horse_no'],'horse_name':h['basic']['horse_name'],
                        'source_run_ref':lr(h).get('race_key'),'next_watch_grade':nw(h),
                        'review_tags':tags(h)[:8]})
            return z
          def ph(rec):
            v={'identity':rec['identity'],'prediction':rec['prediction'],'decision_trace':rec['decision_trace']}
            return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          created=datetime.now(timezone.utc).isoformat(timespec='seconds')
          by={'中京':[],'新潟':[],'札幌':[]}
          reader_texts=[]

          for p in glob.glob('/tmp/p/reader/*.json'):
            x=json.load(open(p,encoding='utf-8')); r=x['race']; key=(r['venue'],int(r['race_no']))
            if key not in picks: continue
            hm={h['basic']['horse_no']:h for h in x['horses']}
            mn,sn,tn,ons=picks[key]
            assert len({mn,sn,tn,*ons})==5
            m,s,t=hm[mn],hm[sn],hm[tn]; oo=[hm[n] for n in ons]
            mainline=[m,s]+oo
            cand=[m,s,t]+oo
            race_model=f"{r['venue']} {r['surface']}{r['distance_m']}m。位置取り、直近の競馬内容、条件適性と状態を優先し、本線4頭とは別に全頭から単穴を探索。"
            mark_reason={
              'main':concise_case(m,r),
              'second':concise_case(s,r),
              'third':single_reason[key],
              'others':[concise_case(h,r) for h in oo]
            }
            trace={
              'race_model':race_model,
              'mainline_cases':[{'horse':href(h),'case_for':concise_case(h,r)} for h in mainline],
              'single_shot_case':{'horse':href(t),'case_for':single_reason[key],'selected_independently_from_mainline':True},
              'mark_reason':mark_reason,
              'rrdb_evidence':{'available':True,'reviewed':True,'horse_refs':rrrefs(cand)},
              'legacy_0_3_fields':{'status':'NOT_USED_v0.4.1'}
            }
            reader=prose[key]; reader_texts.append(reader)
            rec={
              'schema_version':'RaceNote-Forecast-Research-Record-0.3.1',
              'identity':{'target_date':date,'venue':r['venue'],'race_no':r['race_no'],'race_key':f"{date}-{r['venue']}-{r['race_no']}",
                          'race_name':r.get('race_name'),'surface':r.get('surface'),'distance_m':r.get('distance_m'),'class':r.get('class')},
              'research':{'evaluation_mode':'BLINDED_HISTORICAL','turn_id':'BTDAY-0014-TURN2-FULLDAY',
                          'logic_version':logic,'base_logic_version':'RaceNote-Human-Context-Reader-0.4.0-candidate',
                          'candidate_patch':'mainline + single-shot five-mark forecast','reader_facing_prose_contract':prose_contract},
              'source':{'racenote_identity':f"BTDAY-0014/{compact}/{r['venue']}/{r['race_no']}R",
                        'racenote_semantic_sha256':x['source_semantic_sha256'],
                        'day_prep_package':'BTDAY-0014_DAY_PREP_20260822_FINAL.zip','main_sha_at_forecast':main_sha},
              'prediction':{'axis':href(m,1),'marks':{'main':href(m,1),'second':href(s,2),'third':href(t,3),
                            'others':[href(h,4+i) for i,h in enumerate(oo)]},
                            'axis_comment':mark_reason['main'],'reader_facing_reason':reader,
                            'stability_counter_reason':None,'concern':None,'full_field_order':None},
              'decision_trace':trace,
              'audit':{'created_at':created,'frozen_at':created,'prediction_hash':'',
                       'pre_result_guard':'PASS','result_visible_at_freeze':False,
                       'five_mark_role_guard':'PASS','mainline_single_shot_guard':'PASS',
                       'reader_facing_prose_guard':'PASS','market_blind_guard':'PASS',
                       'legacy_converge_machinery':'NOT_USED'}
            }
            rec['audit']['prediction_hash']=ph(rec)
            by[r['venue']].append(rec)

          # Prose anti-template gate: all comments are unique after replacing horse names/numbers,
          # and known role-definition boilerplate is forbidden.
          banned=['UPGRADE','DOWNGRADE','CONFIRM','hidden_strength','Next-Watch','勝ち切る現実性まで含めて最も買いたい','◎以外では最も相手評価を上げたい',
                  '安定度では本線に譲っても','展開ひとつで◎○を逆転できる単穴','5頭候補に残す',
                  'DAY PREP内のレース材料だけなら']
          assert len(reader_texts)==36 and len(set(reader_texts))==36
          assert all('\\n' not in txt and '\\r' not in txt for txt in reader_texts)
          assert not any(b in txt for txt in reader_texts for b in banned)
          names=[]
          for rows in by.values():
            for q in rows:
              names += [q['prediction']['marks'][k]['horse_name'] for k in ('main','second','third')]
              names += [z['horse_name'] for z in q['prediction']['marks']['others']]
          skeletons=[]
          for txt in reader_texts:
            z=txt
            for n in sorted(set(names),key=len,reverse=True): z=z.replace(n,'<HORSE>')
            z=re.sub(r'\d+','<N>',z)
            skeletons.append(z)
          assert len(set(skeletons))==36
          prose_audit={'contract':prose_contract,'status':'PASS','comment_count':36,
                       'unique_comment_count':36,'unique_normalized_skeleton_count':36,
                       'banned_role_template_hits':0,'one_paragraph_count':36,'prose_contract_commit':'a6328f2e08191ab128a995a232234ecd512e96b7'}

          for v,rows in by.items():
            rows.sort(key=lambda x:x['identity']['race_no']); assert len(rows)==12
            slug={'中京':'chukyo','新潟':'niigata','札幌':'sapporo'}[v]
            d=out/'venues'/slug; d.mkdir(parents=True,exist_ok=True)
            (d/f'forecast_{compact}_{v}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
            (d/f'forecast_{compact}_{v}.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in rows),encoding='utf-8')
            aud={'validator_version':'racenote-human-context-0.4.1-candidate-equivalent',
                 'candidate_patch':'mainline + single-shot five-mark forecast','reader_facing_prose_contract':prose_contract,
                 'status':'PASS','venue':v,'target_date':date,'record_count':12,'frozen_count':12,'error_count':0,
                 'prediction_hash_unique_count':12,'five_mark_role_guard':'PASS','mainline_single_shot_guard':'PASS',
                 'reader_facing_prose_guard':'PASS','market_blind_guard':'PASS','legacy_converge_machinery':'NOT_USED','result_opened':False}
            (d/f'forecast_{compact}_{v}_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
            hand={'schema_version':'RaceNote-Venue-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0014','target_date':date,
                  'venue':v,'logic_version':logic,'reader_facing_prose_contract':prose_contract,'main_sha':main_sha,
                  'race_count':12,'frozen_count':12,'technical_skips':0,'result_opened':False,
                  'prediction_hashes':[q['audit']['prediction_hash'] for q in rows]}
            (d/f'forecast_{compact}_{v}_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          allrows=by['中京']+by['新潟']+by['札幌']; dm=out/'day_merge'; dm.mkdir(parents=True,exist_ok=True)
          (dm/f'forecast_{compact}_all.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (dm/f'forecast_{compact}_all.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in allrows),encoding='utf-8')
          trs=[]
          for q in allrows:
            m=q['prediction']['marks']; i=q['identity']
            other='、'.join(f"△{z['horse_no']} {html.escape(z['horse_name'])}" for z in m['others'])
            trs.append(f"<tr><td>{i['venue']}{i['race_no']}R</td><td>◎{m['main']['horse_no']} {html.escape(m['main']['horse_name'])}</td><td>○{m['second']['horse_no']} {html.escape(m['second']['horse_name'])}</td><td>▲{m['third']['horse_no']} {html.escape(m['third']['horse_name'])}</td><td>{other}</td><td>{html.escape(q['prediction']['reader_facing_reason'])}</td></tr>")
          doc='<!doctype html><html lang="ja"><meta charset="utf-8"><title>RaceNote Forecast 2026-08-22</title><h1>RaceNote Forecast 2026-08-22</h1><p>BTDAY-0014 / 0.4.1-candidate / '+prose_contract+' / result_opened=false</p><table border="1"><tr><th>Race</th><th>◎</th><th>○</th><th>▲</th><th>△</th><th>理由</th></tr>'+''.join(trs)+'</table></html>'
          (dm/f'forecast_{compact}_all.html').write_text(doc,encoding='utf-8')
          aud={'schema_version':'RaceNote-Day-Merge-Audit-0.1-draft','selection_id':'BTDAY-0014','target_date':date,
               'logic_version':logic,'reader_facing_prose_contract':prose_contract,'status':'PASS','venue_count':3,
               'record_count':36,'frozen_count':36,'technical_skips':0,'prediction_hash_unique_count':36,
               'five_mark_role_guard':'PASS','mainline_single_shot_guard':'PASS','reader_facing_prose_guard':'PASS',
               'anti_template_audit':prose_audit,'market_blind_guard':'PASS','legacy_converge_machinery':'NOT_USED',
               'independent_selection_guard':'PASS','result_opened':False,'venues':{'中京':'PASS','新潟':'PASS','札幌':'PASS'}}
          (dm/f'forecast_{compact}_all_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          hand={'schema_version':'RaceNote-Day-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0014','target_date':date,
                'logic_version':logic,'reader_facing_prose_contract':prose_contract,'main_sha_at_forecast':main_sha,
                'day_prep_artifact':'BTDAY-0014-DAY-PREP',
                'day_prep_artifact_digest':'sha256:943da68b7f16f40f1a7472192cfb51a74debb1b7e9b9f355e3762f1ef2e680b4',
                'venues':['中京','新潟','札幌'],'race_count':36,'frozen_count':36,'technical_skips':0,'result_opened':False,
                'prediction_hashes':[q['audit']['prediction_hash'] for q in allrows]}
          (dm/f'forecast_{compact}_all_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          dp=out/'day_prep'; dp.mkdir(parents=True,exist_ok=True)
          for n in ['day_prep_handoff.json','manifest.json','validation_report.json','selected_pool_state.json']:
            shutil.copy2(root/n,dp/n)
          (out/'README.md').write_text(
            f"# BTDAY-0014 — {date}\n\n- Forecast logic: `{logic}`\n- Reader prose: `{prose_contract}`\n"
            "- DAY PREP: PASS / result_opened=false\n- Venues: 中京, 新潟, 札幌\n- Forecast races: 36 / 36\n"
            "- Mainline + independent single-shot: PASS\n- Reader-facing anti-template check: PASS\n"
            "- Venue Freeze: PASS x3\n- DAY MERGE: PASS\n- Result opened at Freeze: false\n",encoding='utf-8')
          idx={'selection_id':'BTDAY-0014','target_date':date,'logic_version':logic,'reader_facing_prose_contract':prose_contract,
               'status':'FROZEN','result_opened':False,
               'day_prep_source':{'artifact_name':'BTDAY-0014-DAY-PREP','run_id':36807812348,
                                  'digest':'sha256:943da68b7f16f40f1a7472192cfb51a74debb1b7e9b9f355e3762f1ef2e680b4'},
               'forecast':{'race_count':36,'venue_count':3,'technical_skips':0,
                           'mainline_single_shot_guard':'PASS','reader_facing_prose_guard':'PASS'}}
          (out/'ARTIFACT_INDEX.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert len(allrows)==36 and len({q['audit']['prediction_hash'] for q in allrows})==36
          assert all(q['audit']['result_visible_at_freeze'] is False for q in allrows)
          print(json.dumps({'status':'PASS','frozen':36,'unique_hashes':36,'prose_audit':prose_audit},ensure_ascii=False))
          PY

      - name: Commit canonical Frozen archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0014/20260822
          git commit -m "RaceNote: archive BTDAY-0014 frozen forecast"
          git push origin HEAD:main

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'BTDAY-0014 FORECAST ARCHIVE\nstatus=%s\ncommit=%s\nlogic=RaceNote-Human-Context-Reader-0.4.1-candidate\nprose=FORECAST_READER_FACING_PROSE_v0_1\nresult_opened=false\n' "${{ job.status }}" "$sha" > /tmp/c
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/c
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
