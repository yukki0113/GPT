name: JRDB Edge Forward Backfill via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[JRDB_EDGE_FORWARD_BACKFILL]'

jobs:
  backfill:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_EDGE_FORWARD_BACKFILL]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse and validate request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          prefix='[JRDB_EDGE_FORWARD_BACKFILL]'
          title=os.environ['ISSUE_TITLE']
          request_id=title[len(prefix):].strip()
          if not request_id or not re.fullmatch(r'[A-Za-z0-9._-]{1,96}', request_id):
              raise SystemExit('request_id in title must match [A-Za-z0-9._-]{1,96}')
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={
              'dates','analysis_url','analysis_sha256','registry_run_id',
              'registry_artifact_name','registry_sha256','sources'
          }
          missing=sorted(required-set(req))
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          dates=req['dates']
          if not isinstance(dates,list) or not dates or len(dates)>31:
              raise SystemExit('dates must be a non-empty list with at most 31 entries')
          normalized=[]
          for value in dates:
              day=str(value).strip()
              if not re.fullmatch(r'20\d{6}',day):
                  raise SystemExit(f'invalid date: {day}')
              if day in normalized:
                  raise SystemExit(f'duplicate date: {day}')
              normalized.append(day)
          if normalized != sorted(normalized):
              raise SystemExit('dates must be sorted ascending')
          analysis_url=str(req['analysis_url']).strip()
          if not analysis_url.startswith('https://drive.google.com/'):
              raise SystemExit('analysis_url must be a Google Drive URL')
          sha_re=re.compile(r'[0-9a-f]{64}')
          analysis_sha=str(req['analysis_sha256']).strip().lower()
          registry_sha=str(req['registry_sha256']).strip().lower()
          if not sha_re.fullmatch(analysis_sha) or not sha_re.fullmatch(registry_sha):
              raise SystemExit('analysis_sha256 and registry_sha256 must be lowercase SHA-256 hex')
          run_id=req['registry_run_id']
          if not isinstance(run_id,int) or run_id<=0:
              raise SystemExit('registry_run_id must be a positive integer')
          artifact=str(req['registry_artifact_name']).strip()
          if not artifact:
              raise SystemExit('registry_artifact_name must be non-empty')
          sources=req['sources']
          if not isinstance(sources,dict) or set(sources)!=set(normalized):
              raise SystemExit('sources keys must exactly equal dates')
          normalized_sources={}
          for day in normalized:
              row=sources[day]
              if not isinstance(row,dict):
                  raise SystemExit(f'sources.{day} must be an object')
              paci=str(row.get('paci_sha256','')).strip().lower()
              sed=str(row.get('sed_sha256','')).strip().lower()
              if not sha_re.fullmatch(paci) or not sha_re.fullmatch(sed):
                  raise SystemExit(f'sources.{day} requires paci_sha256 and sed_sha256')
              normalized_sources[day]={'paci_sha256':paci,'sed_sha256':sed}
          normalized_req={
              'request_id':request_id,
              'dates':normalized,
              'analysis_url':analysis_url,
              'analysis_sha256':analysis_sha,
              'registry_run_id':run_id,
              'registry_artifact_name':artifact,
              'registry_sha256':registry_sha,
              'sources':normalized_sources,
              'evaluation_mode':'RECONSTRUCTED_BACKFILL',
          }
          Path('/tmp/request.json').write_text(
              json.dumps(normalized_req,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'request_id={request_id}\n')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download and verify upstream Registry artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/registry
          python - <<'PY' > /tmp/registry_env.sh
          import json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          print(f"REGISTRY_RUN_ID={req['registry_run_id']}")
          print(f"REGISTRY_ARTIFACT_NAME={req['registry_artifact_name']}")
          print(f"REGISTRY_SHA256={req['registry_sha256']}")
          PY
          source /tmp/registry_env.sh
          gh run download "$REGISTRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$REGISTRY_ARTIFACT_NAME" --dir /tmp/registry
          mapfile -t candidates < <(find /tmp/registry -type f -name edge_registry_active.jsonl -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "expected exactly one edge_registry_active.jsonl; found ${#candidates[@]}" >&2
            exit 1
          fi
          cp "${candidates[0]}" /tmp/edge_registry_active.jsonl
          echo "$REGISTRY_SHA256  /tmp/edge_registry_active.jsonl" | sha256sum -c -

      - name: Download and verify Analysis Lite
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          subprocess.run(['gdown',req['analysis_url'],'-O','/tmp/analysis.download'],check=True)
          PY
          python - <<'PY'
          import hashlib, json, shutil, sqlite3, zipfile
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          src=Path('/tmp/analysis.download')
          dst=Path('/tmp/jrdb_analysis.sqlite')
          if zipfile.is_zipfile(src):
              with zipfile.ZipFile(src) as archive:
                  bad=archive.testzip()
                  if bad is not None:
                      raise SystemExit(f'Analysis ZIP corrupt member: {bad}')
                  members=[n for n in archive.namelist() if not n.endswith('/') and Path(n).name.lower().endswith(('.sqlite','.bin'))]
                  if len(members)!=1:
                      raise SystemExit(f'Analysis ZIP must contain exactly one DB: {members}')
                  with archive.open(members[0]) as source, dst.open('wb') as target:
                      shutil.copyfileobj(source,target,1024*1024)
          else:
              src.replace(dst)
          if dst.open('rb').read(16)!=b'SQLite format 3\x00':
              raise SystemExit('Analysis is not SQLite')
          digest=hashlib.sha256(dst.read_bytes()).hexdigest()
          if digest!=req['analysis_sha256']:
              raise SystemExit(f"Analysis SHA mismatch: expected={req['analysis_sha256']} actual={digest}")
          connection=sqlite3.connect(dst)
          try:
              integrity=connection.execute('PRAGMA integrity_check').fetchone()[0]
              minimum,maximum,count=connection.execute(
                  'SELECT MIN(race_date),MAX(race_date),COUNT(*) FROM fact_entry_result_lite'
              ).fetchone()
          finally:
              connection.close()
          if integrity!='ok':
              raise SystemExit(f'Analysis integrity_check={integrity}')
          Path('/tmp/analysis_coverage.json').write_text(
              json.dumps({'min_race_date':minimum,'max_race_date':maximum,'rows':count,'sha256':digest},indent=2)+'\n',encoding='utf-8'
          )
          PY

      - name: Fetch exact PACI and SED inputs
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          root=Path('/tmp/raw')
          for day in req['dates']:
              out=root/day
              out.mkdir(parents=True,exist_ok=True)
              subprocess.run([
                  'python','horse-racing/jrdb/src/fetch_jrdb_paci.py',
                  '--date',day,'--out-dir',str(out)
              ],check=True)
              subprocess.run([
                  'python','horse-racing/jrdb/src/fetch_jrdb_history.py',
                  '--date',day,'--kinds','SED','--output-dir',str(out)
              ],check=True)
              yy=day[2:]
              paci=out/f'PACI{yy}.zip'
              sed=out/'SED'/f'SED{yy}.zip'
              for label,path,expected in (
                  ('PACI',paci,req['sources'][day]['paci_sha256']),
                  ('SED',sed,req['sources'][day]['sed_sha256']),
              ):
                  if not path.is_file():
                      raise SystemExit(f'{label} missing for {day}: {path}')
                  actual=hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual!=expected:
                      raise SystemExit(f'{label} SHA mismatch for {day}: expected={expected} actual={actual}')
          PY

      - name: Run canonical reconstructed backfill
        run: |
          set -euo pipefail
          mkdir -p /tmp/edge_forward_backfill/days
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          ledger='/tmp/edge_forward_backfill/jrdb_edge_forward_backfill.sqlite'
          for day in req['dates']:
              yy=day[2:]
              cmd=[
                  'python','horse-racing/jrdb/src/run_jrdb_edge_forward_backfill.py',
                  '--paci',f'/tmp/raw/{day}/PACI{yy}.zip',
                  '--sed',f'/tmp/raw/{day}/SED/SED{yy}.zip',
                  '--registry-jsonl','/tmp/edge_registry_active.jsonl',
                  '--analysis-db','/tmp/jrdb_analysis.sqlite',
                  '--ledger',ledger,
                  '--output-dir',f'/tmp/edge_forward_backfill/days/{day}',
                  '--expected-paci-sha256',req['sources'][day]['paci_sha256'],
                  '--expected-sed-sha256',req['sources'][day]['sed_sha256'],
                  '--expected-registry-sha256',req['registry_sha256'],
                  '--expected-analysis-sha256',req['analysis_sha256'],
              ]
              subprocess.run(cmd,check=True)
          PY

      - name: Build cumulative result
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path
          import build_jrdb_edge_forward_ledger as ledger

          root=Path('/tmp/edge_forward_backfill')
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          connection=sqlite3.connect(root/'jrdb_edge_forward_backfill.sqlite')
          try:
              integrity=connection.execute('PRAGMA integrity_check').fetchone()[0]
              summary=ledger.summarize(connection,evaluation_mode='RECONSTRUCTED_BACKFILL')
          finally:
              connection.close()
          if integrity!='ok':
              raise SystemExit(f'ledger integrity_check={integrity}')
          days={}
          for day_value in req['dates']:
              day=root/'days'/day_value
              evaluation=json.loads((day/'forward_evaluation.json').read_text(encoding='utf-8'))
              provenance=json.loads((day/'provenance.json').read_text(encoding='utf-8'))
              days[day_value]={
                  'evaluation_overall':evaluation.get('overall'),
                  'runner_audit':evaluation.get('runner_audit'),
                  'matcher':provenance.get('matcher'),
                  'analysis_coverage':provenance.get('analysis_coverage'),
                  'ledger_import':provenance.get('ledger_import'),
              }
          result={
              'status':'success',
              'run_id':int(os.environ['RUN_ID']),
              'head_sha':os.environ['HEAD_SHA'],
              'request':req,
              'evaluation_mode':'RECONSTRUCTED_BACKFILL',
              'ledger_integrity':'ok',
              'combined_summary':summary,
              'days':days,
          }
          (root/'result.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          files={}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name!='artifact_manifest.json':
                  rel=str(path.relative_to(root))
                  files[rel]={'size_bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          (root/'artifact_manifest.json').write_text(
              json.dumps({'status':'PASS','files':files},indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Upload backfill artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-edge-forward-backfill-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: /tmp/edge_forward_backfill/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Comment success and close Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result=json.loads(Path('/tmp/edge_forward_backfill/result.json').read_text(encoding='utf-8'))
          summary=result.get('combined_summary') or {}
          compact={
              'status':result.get('status'),
              'run_id':result.get('run_id'),
              'head_sha':result.get('head_sha'),
              'artifact_name':f"jrdb-edge-forward-backfill-{os.environ['REQUEST_ID']}-{os.environ['RUN_ID']}",
              'dates':(result.get('request') or {}).get('dates'),
              'evaluation_mode':result.get('evaluation_mode'),
              'ledger_integrity':result.get('ledger_integrity'),
              'overall':summary.get('overall'),
              'available_evaluation_modes':summary.get('available_evaluation_modes'),
              'day_count':len(result.get('days') or {}),
          }
          body='JRDB_EDGE_FORWARD_BACKFILL_RESULT\n```json\n'+json.dumps(compact,ensure_ascii=False,indent=2,sort_keys=True)+'\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'],check=True)
          PY

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          result={
              'status':'failure',
              'run_id':int(os.environ['RUN_ID']),
              'failure_class':'IMPLEMENTATION_ERROR',
              'error_code':'BACKFILL_WORKFLOW_FAILED',
              'retryable':False,
              'message':'Inspect the failed Actions step; do not blindly rerun this request.',
          }
          body='JRDB_EDGE_FORWARD_BACKFILL_FAILURE\n```json\n'+json.dumps(result,indent=2)+'\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          PY
