name: RaceLap Forward Daily Refresh

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/requests/racelap_forward_daily_refresh.trigger'

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: horse-racing/jrdb/src
      COMPLETED_DATE: '2026-10-17'
      TARGET_DATE: '2026-10-18'
      CURRENT_RUN_ID: '39010439748'
      CURRENT_ARTIFACT_NAME: 'racelap-forward-current-canonical-20261012'
      GENERATION_ID: 'racelap-forward-canonical-20261017-01'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r tools/data-storage/requirements.txt

      - name: Download accepted RaceLap CURRENT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .racelap/current .racelap/raw .racelap/work .racelap/output
          gh run download "$CURRENT_RUN_ID" -n "$CURRENT_ARTIFACT_NAME" -D .racelap/current
          test "$(find .racelap/current -type f -name race_lap.parquet | wc -l)" -eq 1
          test "$(find .racelap/current -type f -name manifest.json | wc -l)" -eq 1

      - name: Fetch exact completed-day SED only
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          compact="${COMPLETED_DATE//-/}"
          python horse-racing/jrdb/src/fetch_jrdb_history.py \
            --date "$compact" \
            --kinds SED \
            --output-dir .racelap/raw \
            --sleep-seconds 0
          yymmdd="${compact:2:6}"
          test -s ".racelap/raw/SED/SED${yymmdd}.zip"

      - name: Resolve RaceLap CURRENT
        run: |
          set -euo pipefail
          current_manifest="$(find .racelap/current -type f -name manifest.json -print -quit)"
          current_bundle="$(dirname "$current_manifest")"
          sed_file="$(find .racelap/raw/SED -type f -name 'SED*.zip' -print -quit)"
          python horse-racing/jrdb/src/jrdb_race_lap_current_resolver.py \
            --current-bundle "$current_bundle" \
            --target-date "$TARGET_DATE" \
            --expected-period-to "$COMPLETED_DATE" \
            --sed "$sed_file" \
            --expected-date "$COMPLETED_DATE" \
            --work-root .racelap/work \
            --generation-id "$GENERATION_ID" \
            --resolved-bundle .racelap/output/current \
            --receipt .racelap/output/resolver_receipt.json

      - name: Validate receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('.racelap/output/resolver_receipt.json').read_text())
          assert r['status']=='CURRENT_READY'
          assert r['period_to']==os.environ['COMPLETED_DATE']
          assert r['expected_period_to']==os.environ['COMPLETED_DATE']
          assert r['updated'] is True
          assert r['network_access'] is False
          PY

      - uses: actions/upload-artifact@v4
        id: current_upload
        with:
          name: racelap-forward-current-${{ github.run_id }}
          path: |
            .racelap/output/current/
            .racelap/output/resolver_receipt.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        id: sed_upload
        with:
          name: racelap-canonical-sed-${{ github.run_id }}
          path: .racelap/raw/SED/SED*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Report
        run: |
          echo "current_artifact_id=${{ steps.current_upload.outputs.artifact-id }}"
          echo "sed_artifact_id=${{ steps.sed_upload.outputs.artifact-id }}"
          cat .racelap/output/resolver_receipt.json
