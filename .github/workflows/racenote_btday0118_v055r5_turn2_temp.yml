name: RaceNote BTDAY-0118 v0.5.5 r5 TURN 2

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0118.v055r5-turn2'

permissions:
  contents: write

concurrency:
  group: racenote-btday-0118-v055r5-turn2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: horse-racing/jrdb/src
      ROOT: horse-racing/jrdb/backtests/BTDAY-0118/20250622/v055
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm immutable TURN 2 target is new
        run: |
          set -euo pipefail
          test ! -e "$ROOT/frozen"
          test ! -e "$ROOT/confidence_frozen"

      - name: Restore LLM-authored drafts
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          root=Path("horse-racing/jrdb/backtests/BTDAY-0118/20250622/v055/incoming")
          for stem in ("llm_decisions.json","llm_confidence.json"):
              src=root/(stem+".gz.b64")
              raw=gzip.decompress(base64.b64decode(src.read_text(encoding="utf-8").strip()))
              (root/stem).write_bytes(raw)
          PY
          python -m json.tool "$ROOT/incoming/llm_decisions.json" >/dev/null
          python -m json.tool "$ROOT/incoming/llm_confidence.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("horse-racing/jrdb/backtests/BTDAY-0118/20250622/v055/incoming/llm_decisions.json")
          rows=json.loads(path.read_text(encoding="utf-8"))
          for row in rows:
              key=(row["venue"], int(row["race_no"]))
              if key == ("函館", 5):
                  row["shot_case"]["case"]="クラディスティーナは能力面で上位グループに入り、先行して流れに乗れれば初戦から前進できる。"
              elif key == ("阪神", 6):
                  row["candidate_selection"]["boundary_reason"]="ダート1200mの事前能力でキンダープンシュとサンブルが抜け、メッチャエエヤン、シュテフィ、テーオーグレーザーを続ける。マクアケも候補だが上位5頭との差を覆す材料は不足。"
              elif key == ("阪神", 10):
                  row["shot_case"]["case"]="ルシュヴァルドールは高い水準で安定しており、中団からの差し脚を生かして前が崩れれば逆転まである。"
          path.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Finalize LLM-authored TURN 2
        id: finalize
        continue-on-error: true
        run: |
          set -o pipefail
          python horse-racing/jrdb/src/racenote_v055_turn2_finalize.py \
            --root "$ROOT" \
            --decisions "$ROOT/incoming/llm_decisions.json" \
            --confidence "$ROOT/incoming/llm_confidence.json" \
            > "$ROOT/turn2_diagnostic.txt" 2>&1

      - name: Persist diagnostic on failure
        if: steps.finalize.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/turn2_diagnostic.txt"
          git commit -m "RaceNote: capture BTDAY-0118 TURN 2 diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
          exit 1

      - name: Commit immutable TURN 2
        if: steps.finalize.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$ROOT/incoming/llm_decisions.json.gz.b64" \
                "$ROOT/incoming/llm_confidence.json.gz.b64" \
                "$ROOT/turn2_diagnostic.txt"
          git add -A "$ROOT"
          git status --short "$ROOT"
          git commit -m "RaceNote: finalize BTDAY-0118 v0.5.5 r5 TURN 2"
          git push origin HEAD:main
