name: JRDB RL Retirement T3 Downstream Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_RL_RETIREMENT_T3_AUDIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run downstream dependency audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/rl-retirement-t3
          python horse-racing/jrdb/src/audit_rl_retirement_downstream_dependencies.py \
            --root . \
            --output /tmp/rl-retirement-t3/audit.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-rl-retirement-t3-${{ github.run_id }}
          path: /tmp/rl-retirement-t3/audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Close successful request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}' \
            --body "RL retirement T3 downstream dependency audit PASS. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --reason completed
