name: Temporary GPT Workflow Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gpt-admin-workflow-update-main
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[gpt-admin-workflow-update]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract workflow-only patch
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          body = os.environ.get('ISSUE_BODY', '')
          message_match = re.search(r'(?m)^commit_message:\s*(.+?)\s*$', body)
          if message_match is None:
              raise SystemExit("Missing commit_message")
          commit_message = message_match.group(1).strip()
          if not commit_message or len(commit_message) > 200:
              raise SystemExit('Invalid commit_message')

          patch_match = re.search(r'```diff\s*\n(.*?)\n```', body, flags=re.DOTALL)
          if patch_match is None:
              raise SystemExit('Missing diff block')
          patch = patch_match.group(1)

          paths = []
          for line in patch.splitlines():
              if not (line.startswith('--- ') or line.startswith('+++ ')):
                  continue
              raw = line[4:].split('\t', 1)[0].strip()
              if raw == '/dev/null':
                  continue
              if raw.startswith('a/') or raw.startswith('b/'):
                  raw = raw[2:]
              paths.append(raw)

          if not paths:
              raise SystemExit('No paths found')

          for raw in set(paths):
              path = pathlib.PurePosixPath(raw)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'Unsafe path: {raw}')
              if not raw.startswith('.github/workflows/'):
                  raise SystemExit(f'Only workflow files may be changed: {raw}')
              if raw == '.github/workflows/gpt_admin_workflow_update.yml':
                  raise SystemExit('Temporary updater may not modify itself')

          pathlib.Path('/tmp/workflow-update.patch').write_text(patch + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit_message={commit_message}\n')
          PY

      - name: Apply patch
        run: |
          git apply --check --whitespace=error-all /tmp/workflow-update.patch
          git apply --whitespace=error-all /tmp/workflow-update.patch
          git diff --check
          git diff -- .github/workflows/

      - name: Commit and push
        id: commit
        env:
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
        run: |
          git config user.name "gpt-admin-workflow-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "$COMMIT_MESSAGE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Workflow update pushed: $COMMIT_SHA"
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Workflow update failed: $RUN_URL"
