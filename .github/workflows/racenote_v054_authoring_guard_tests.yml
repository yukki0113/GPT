name: RaceNote v0.5.4 authoring guard tests

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_v054_authoring_quality.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v054.py'
      - 'horse-racing/jrdb/src/racenote_v054_single_day.py'
      - 'horse-racing/jrdb/tests/test_racenote_v054_authoring_quality.py'
      - 'horse-racing/jrdb/docs/racenote/**'
      - 'horse-racing/jrdb/config/racenote_forecast_logic_current.json'
      - '.github/workflows/racenote_v054_authoring_guard_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement_check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install settlement dependencies
        run: python -m pip install jsonschema pandas numpy pyarrow duckdb
      - name: Canonical settle 0104 and 0105
        run: |
          set -euo pipefail
          git fetch origin run/btday0104-v054-t1 run/btday0105-v054-t1
          mkdir -p /tmp/settle/{0104,0105}
          git show origin/run/btday0104-v054-t1:horse-racing/jrdb/backtests/BTDAY-0104/20251207/v054/frozen/records.json > /tmp/settle/0104/records.json
          git show origin/run/btday0105-v054-t1:horse-racing/jrdb/backtests/BTDAY-0105/20251228/v054/frozen/records.json > /tmp/settle/0105/records.json
          for SPEC in "0104 20251207" "0105 20251228"; do
            set -- $SPEC; ID="$1"; D="$2"; ISO="${D:0:4}-${D:4:2}-${D:6:2}"
            RAW="/tmp/settle/raw/$D"; mkdir -p "$RAW"
            python horse-racing/jrdb/src/fetch_jrdb_history.py --date "$D" --kinds SED HJC --output-dir "$RAW/src"
            python horse-racing/jrdb/src/racenote_daily_result_from_jrdb.py \
              --date "$ISO" \
              --sed "$RAW/src/SED/SED${D:2}.zip" \
              --hjc "$RAW/src/HJC/HJC${D:2}.zip" \
              --output "/tmp/settle/$ID/result.json" --pretty
            python horse-racing/jrdb/src/racenote_daily_settlement.py \
              --forecast "/tmp/settle/$ID/records.json" \
              --results "/tmp/settle/$ID/result.json" \
              --output-json "/tmp/settle/$ID/settlement.json" \
              --output-md "/tmp/settle/$ID/settlement.md" --top 20
            echo "===== BTDAY-$ID ====="
            cat "/tmp/settle/$ID/settlement.md"
          done

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed guard modules
        run: |
          python -m py_compile \
            horse-racing/jrdb/src/racenote_v054_authoring_quality.py \
            horse-racing/jrdb/src/racenote_decision_core_v054.py \
            horse-racing/jrdb/src/racenote_v054_single_day.py
      - name: Run authoring guard regression tests
        run: |
          python -m unittest -v horse-racing/jrdb/tests/test_racenote_v054_authoring_quality.py
