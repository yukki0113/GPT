name: RaceNote v0.5.4 authoring guard tests

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_v054_authoring_quality.py'
      - 'horse-racing/jrdb/src/racenote_decision_core_v054.py'
      - 'horse-racing/jrdb/src/racenote_v054_single_day.py'
      - 'horse-racing/jrdb/tests/test_racenote_v054_authoring_quality.py'
      - 'horse-racing/jrdb/docs/racenote/**'
      - 'horse-racing/jrdb/config/racenote_forecast_logic_current.json'
      - '.github/workflows/racenote_v054_authoring_guard_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install result-query dependencies
        run: python -m pip install jsonschema pandas numpy pyarrow duckdb
      - name: Extract frozen forecasts and pre-result confidence
        run: |
          set -euo pipefail
          git fetch origin run/btday0108-v054-t1 run/btday0109-v054-t1
          mkdir -p /tmp/btday/0108 /tmp/btday/0109
          git show origin/run/btday0108-v054-t1:horse-racing/jrdb/backtests/BTDAY-0108/20250621/v054/frozen/records.json > /tmp/btday/0108/records.json
          git show origin/run/btday0108-v054-t1:horse-racing/jrdb/backtests/BTDAY-0108/20250621/v054/confidence_pre_result.json > /tmp/btday/0108/confidence.json
          git show origin/run/btday0109-v054-t1:horse-racing/jrdb/backtests/BTDAY-0109/20250118/v054/frozen/records.json > /tmp/btday/0109/records.json
          git show origin/run/btday0109-v054-t1:horse-racing/jrdb/backtests/BTDAY-0109/20250118/v054/confidence_pre_result.json > /tmp/btday/0109/confidence.json
      - name: Fetch canonical JRDB result sources
        run: |
          set -euo pipefail
          for D in 20250621 20250118; do
            mkdir -p "/tmp/btday/raw/$D"
            python horse-racing/jrdb/src/fetch_jrdb_history.py --date "$D" --kinds SED HJC --output-dir "/tmp/btday/raw/$D/src"
          done
      - name: Query all runners and analyze prediction/confidence
        run: |
          set -euo pipefail
          for SPEC in "0108 20250621" "0109 20250118"; do
            set -- $SPEC
            ID="$1"; D="$2"; ISO="${D:0:4}-${D:4:2}-${D:6:2}"
            python horse-racing/jrdb/src/jrdb_result_query.py \
              --date "$ISO" \
              --sed "/tmp/btday/raw/$D/src/SED/SED${D:2}.zip" \
              --hjc "/tmp/btday/raw/$D/src/HJC/HJC${D:2}.zip" \
              --include-all-runners \
              --output "/tmp/btday/$ID/results.json" --pretty
          done
          python - <<'PY'
          import json
          from pathlib import Path

          SPECS={"0108":"2025-06-21","0109":"2025-01-18"}

          def rate(a,b): return round(a/b*100,1) if b else None

          def outcome_rows(btday):
              records=json.loads(Path(f"/tmp/btday/{btday}/records.json").read_text())
              conf=json.loads(Path(f"/tmp/btday/{btday}/confidence.json").read_text())
              results=json.loads(Path(f"/tmp/btday/{btday}/results.json").read_text())
              assert results["status"]=="success", results["status"]
              rix={(r["venue_name"],int(r["race_no"])):r for r in results["races"]}
              cix={(a["venue"],int(a["race_no"])):a for a in conf["assignments"]}
              rows=[]
              for rec in records:
                  venue=rec["venue"]; race=int(rec["race_no"]); core=rec["decision_core"]
                  marks=[int(x) for x in core["marks"]]
                  h=int(core["role_assignment"]["honmei_horse_no"]); sec=int(core["role_assignment"]["second_horse_no"])
                  rr=rix[(venue,race)]
                  allr={int(x["horse_no"]):x for x in rr["all_runners"] if x.get("horse_no") is not None}
                  top3=[int(x["horse_no"]) for x in rr["top3"]]; winner=top3[0]
                  ca=cix[(venue,race)]
                  hf=allr.get(h,{}).get("finish"); sf=allr.get(sec,{}).get("finish")
                  pair=None if hf is None or sf is None else int(hf)<int(sf)
                  rows.append({
                    "btday":btday,"date":SPECS[btday],"venue":venue,"race":race,
                    "honmei":h,"second":sec,"marks":marks,"winner":winner,"top3":top3,
                    "honmei_finish":hf,"second_finish":sf,"pairwise_honmei_better":pair,
                    "honmei_win":winner==h,"honmei_top2":h in top3[:2],"honmei_top3":h in top3,
                    "winner_in5":winner in marks,"top3_hits":sum(x in marks for x in top3),
                    "original_confidence":ca["original_confidence"],"confidence":ca["confidence"],
                    "gap":ca["pre_idm_gap"],"a5":ca["a5"],"a7":ca["a7_shadow"]
                  })
              return rows,results

          def summarize(rows):
              n=len(rows); ev=[r for r in rows if r["pairwise_honmei_better"] is not None]
              return {
                "n":n,
                "honmei_win":sum(r["honmei_win"] for r in rows),"honmei_win_pct":rate(sum(r["honmei_win"] for r in rows),n),
                "honmei_top2":sum(r["honmei_top2"] for r in rows),"honmei_top2_pct":rate(sum(r["honmei_top2"] for r in rows),n),
                "honmei_top3":sum(r["honmei_top3"] for r in rows),"honmei_top3_pct":rate(sum(r["honmei_top3"] for r in rows),n),
                "winner_in5":sum(r["winner_in5"] for r in rows),"winner_in5_pct":rate(sum(r["winner_in5"] for r in rows),n),
                "top3_ge2":sum(r["top3_hits"]>=2 for r in rows),"top3_ge2_pct":rate(sum(r["top3_hits"]>=2 for r in rows),n),
                "top3_all3":sum(r["top3_hits"]==3 for r in rows),"top3_all3_pct":rate(sum(r["top3_hits"]==3 for r in rows),n),
                "pairwise_evaluable":len(ev),
                "pairwise_honmei_better":sum(r["pairwise_honmei_better"] for r in ev),
                "pairwise_honmei_better_pct":rate(sum(r["pairwise_honmei_better"] for r in ev),len(ev)),
              }

          def group(rows,key,values):
              return {v:summarize([r for r in rows if r[key]==v]) for v in values}

          allrows=[]
          for bt in SPECS:
              rows,res=outcome_rows(bt); allrows+=rows
              payload={
                "btday":bt,
                "result_meta":{"status":res["status"],"race_count":res["race_count"],"missing_sources":res["missing_sources"],"provenance":res["provenance"]},
                "overall":summarize(rows),
                "effective_confidence":group(rows,"confidence",["A","B","C"]),
                "original_confidence":group(rows,"original_confidence",["A","B","C"]),
                "a5":summarize([r for r in rows if r["a5"]]),
                "a7":summarize([r for r in rows if r["a7"]]),
                "original_A_demoted":summarize([r for r in rows if r["original_confidence"]=="A" and r["confidence"]!="A"]),
                "a5_races":[r for r in rows if r["a5"]],
                "a7_races":[r for r in rows if r["a7"]],
              }
              print(f"===== BTDAY-{bt} ANALYSIS =====")
              print(json.dumps(payload,ensure_ascii=False))
          combined={
            "overall":summarize(allrows),
            "effective_confidence":group(allrows,"confidence",["A","B","C"]),
            "original_confidence":group(allrows,"original_confidence",["A","B","C"]),
            "a5":summarize([r for r in allrows if r["a5"]]),
            "a7":summarize([r for r in allrows if r["a7"]]),
            "original_A_demoted":summarize([r for r in allrows if r["original_confidence"]=="A" and r["confidence"]!="A"]),
            "a5_races":[r for r in allrows if r["a5"]],
            "a7_races":[r for r in allrows if r["a7"]],
          }
          print("===== COMBINED 0108+0109 =====")
          print(json.dumps(combined,ensure_ascii=False))
          PY
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed guard modules
        run: |
          python -m py_compile \
            horse-racing/jrdb/src/racenote_v054_authoring_quality.py \
            horse-racing/jrdb/src/racenote_decision_core_v054.py \
            horse-racing/jrdb/src/racenote_v054_single_day.py
      - name: Run authoring guard regression tests
        run: |
          python -m unittest -v horse-racing/jrdb/tests/test_racenote_v054_authoring_quality.py
