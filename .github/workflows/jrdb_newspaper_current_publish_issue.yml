name: JRDB Newspaper Current Publish

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

env:
  REQUEST_PREFIX: '[JRDB_NEWSPAPER_CURRENT_PUBLISH]'
  RELEASE_TAG: jrdb-newspaper-current
  RELEASE_ARCHIVE: jrdb_newspaper_current.tar.xz
  RELEASE_META: jrdb_newspaper_current_release.json

jobs:
  publish:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEWSPAPER_CURRENT_PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={'date','source_revision','target_revision','candidate_run_id','candidate_artifact_name'}
          missing=sorted(required-set(req))
          if missing: raise SystemExit(f'missing required fields: {missing}')
          date=str(req['date']).strip()
          if not re.fullmatch(r'20\d{2}-\d{2}-\d{2}',date):
              raise SystemExit('date must be YYYY-MM-DD')
          sr=req['source_revision']; tr=req['target_revision']; run=req['candidate_run_id']
          if not isinstance(sr,int) or isinstance(sr,bool) or sr<1: raise SystemExit('invalid source_revision')
          if not isinstance(tr,int) or isinstance(tr,bool) or tr!=sr+1: raise SystemExit('target_revision must equal source_revision + 1')
          if not isinstance(run,int) or isinstance(run,bool) or run<=0: raise SystemExit('candidate_run_id must be positive integer')
          art=str(req['candidate_artifact_name']).strip()
          if not art: raise SystemExit('candidate_artifact_name required')
          Path('/tmp/request.json').write_text(json.dumps(req,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f"REQUEST_DATE={date}\n")
              env.write(f"SOURCE_REVISION={sr}\n")
              env.write(f"TARGET_REVISION={tr}\n")
              env.write(f"CANDIDATE_RUN_ID={run}\n")
              env.write(f"CANDIDATE_ARTIFACT_NAME={art}\n")
          PY

      - name: Download validated candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/candidate
          mkdir -p /tmp/candidate
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "$CANDIDATE_ARTIFACT_NAME" --dir /tmp/candidate
          find /tmp/candidate -maxdepth 3 -type f -print

      - name: Validate parity report and candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/candidate')
          reports=list(root.rglob('report.json'))
          packages=list(root.rglob('day-package.json'))
          if len(reports)!=1 or len(packages)!=1:
              raise SystemExit(f'expected one report/day-package, got report={reports} package={packages}')
          report=json.loads(reports[0].read_text(encoding='utf-8'))
          if report.get('status')!='PASS' or report.get('live_parity')!='PASS' or report.get('current_personal_merge')!='PASS':
              raise SystemExit('candidate parity report is not fully PASS')
          if report.get('release_modified') is not False:
              raise SystemExit('unexpected release_modified state')
          if int(report.get('missing_join_count', -1))!=0 or int(report.get('extra_join_count', -1))!=0:
              raise SystemExit('candidate has join mismatches')
          package=json.loads(packages[0].read_text(encoding='utf-8'))
          manifest=package.get('manifest') or {}
          if manifest.get('date')!=os.environ['REQUEST_DATE']:
              raise SystemExit('candidate date mismatch')
          if int(manifest.get('revision') or 0)!=int(os.environ['SOURCE_REVISION']):
              raise SystemExit('candidate source revision mismatch')
          if len(package.get('races') or [])!=len(manifest.get('races') or []):
              raise SystemExit('candidate race count mismatch')
          Path('/tmp/candidate-package.txt').write_text(str(packages[0]),encoding='utf-8')
          PY

      - name: Build target revision current cache
        run: |
          set -euo pipefail
          rm -rf /tmp/publish-day /tmp/publish
          mkdir -p /tmp/publish-day/races /tmp/publish
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path(Path('/tmp/candidate-package.txt').read_text())
          pkg=json.loads(source.read_text(encoding='utf-8'))
          manifest=pkg['manifest']
          target_revision=int(os.environ['TARGET_REVISION'])
          manifest['revision']=target_revision
          races=pkg.get('races') or []
          by_key={str((r.get('race') or {}).get('race_key') or ''):r for r in races}
          if '' in by_key or len(by_key)!=len(races):
              raise SystemExit('invalid/duplicate candidate race keys')
          root=Path('/tmp/publish-day')
          for entry in manifest.get('races') or []:
              rk=str(entry.get('race_key') or '')
              race=by_key.get(rk)
              if race is None: raise SystemExit(f'missing race {rk}')
              race.setdefault('metadata',{})['revision']=target_revision
              out=root/str(entry['path'])
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(json.dumps(race,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              data=out.read_bytes()
              entry['sha256']=hashlib.sha256(data).hexdigest()
              entry['size_bytes']=len(data)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Final structural and Edge checks.
          memo_runners=0; memo_count=0
          for entry in manifest.get('races') or []:
              p=root/str(entry['path'])
              data=p.read_bytes()
              if hashlib.sha256(data).hexdigest()!=entry['sha256'] or len(data)!=entry['size_bytes']:
                  raise SystemExit(f'race integrity mismatch: {entry["path"]}')
              race=json.loads(data.decode('utf-8'))
              if int((race.get('metadata') or {}).get('revision') or 0)!=target_revision:
                  raise SystemExit('race target revision mismatch')
              for horse in race.get('horses') or []:
                  memos=horse.get('special_memos') or []
                  if memos:
                      memo_runners+=1
                      memo_count+=len(memos)
          if memo_runners!=271 or memo_count!=595:
              raise SystemExit(f'Edge memo count mismatch runners={memo_runners} count={memo_count}')
          Path('/tmp/publish/validation.json').write_text(json.dumps({
              'status':'PASS','date':manifest['date'],'revision':manifest['revision'],
              'race_count':len(manifest.get('races') or []),
              'memo_runners':memo_runners,'memo_count':memo_count,
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -C /tmp/publish-day -cJf "/tmp/publish/$RELEASE_ARCHIVE" .

          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/publish')
          day=Path('/tmp/publish-day')
          archive=root/os.environ['RELEASE_ARCHIVE']
          manifest=json.loads((day/'manifest.json').read_text(encoding='utf-8'))
          meta={
              'schema_version':'0.1',
              'release_kind':'jrdb_newspaper_current_cache',
              'date':manifest['date'],
              'revision':manifest['revision'],
              'race_count':len(manifest.get('races') or []),
              'manifest_sha256':hashlib.sha256((day/'manifest.json').read_bytes()).hexdigest(),
              'archive_filename':archive.name,
              'archive_size_bytes':archive.stat().st_size,
              'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
              'source_run_id':int(os.environ['CANDIDATE_RUN_ID']),
              'source_artifact':os.environ['CANDIDATE_ARTIFACT_NAME'],
          }
          (root/os.environ['RELEASE_META']).write_text(
              json.dumps(meta,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',
              encoding='utf-8')
          PY

      - name: Publish personal current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --title "JRDB Newspaper current"             --notes "Mutable personal PWA Newspaper cache published from validated EdgeDB live-parity candidate."             "/tmp/publish/$RELEASE_ARCHIVE" "/tmp/publish/$RELEASE_META"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern "$RELEASE_META" --dir /tmp/verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          meta=json.loads((Path('/tmp/verify')/os.environ['RELEASE_META']).read_text())
          if meta.get('date')!=os.environ['REQUEST_DATE'] or int(meta.get('revision') or 0)!=int(os.environ['TARGET_REVISION']):
              raise SystemExit('published current date/revision mismatch')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY

      - name: Comment success and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="JRDB_NEWSPAPER_CURRENT_PUBLISH_RESULT: PASS. 2026-10-04 personal current published as revision 8 from validated EdgeDB candidate. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Comment failure and close
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "JRDB Newspaper current publish failed. Existing published release may have been replaced only if failure occurred after publish step. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
