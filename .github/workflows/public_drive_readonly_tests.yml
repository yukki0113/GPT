name: Public Drive read-only helper tests
on:
  pull_request:
    paths:
      - 'tools/gpt_io/public_drive/**'
      - 'tools/gpt_io/tests/test_public_drive_fetch.py'
      - '.github/workflows/public_drive_readonly_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no Drive access, no secrets)
        run: python -m unittest discover -s tools/gpt_io/tests -p test_public_drive_fetch.py -v
