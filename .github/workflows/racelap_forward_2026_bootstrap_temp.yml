name: RaceLap 2026 One-time Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/requests/racelap_2026_bootstrap.trigger'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Optional failed bootstrap run id containing reusable daily SED artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: racelap-2026-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
      PYTHONPATH: horse-racing/jrdb/src
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/data-storage/requirements.txt
      - name: Reuse previous successful SED ZIPs when resuming
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test -z "$RESUME_RUN_ID" && test -f horse-racing/jrdb/requests/racelap_bootstrap_resume_run_id.txt; then
            RESUME_RUN_ID="$(cat horse-racing/jrdb/requests/racelap_bootstrap_resume_run_id.txt)"
          fi
          mkdir -p /tmp/lap/raw/SED
          if test -n "$RESUME_RUN_ID"; then
            gh run download "$RESUME_RUN_ID" \
              -n "racelap-bootstrap-raw-$RESUME_RUN_ID" -D /tmp/lap/raw/SED
          fi
      - name: Acquire exact known 2026 JRA race dates with retries
        run: |
          set -euo pipefail
          mkdir -p /tmp/lap/raw/SED /tmp/lap/state
          python - <<'PY'
          import json,subprocess,time,zipfile
          from pathlib import Path
          pool=json.loads(Path('horse-racing/jrdb/config/racenote_backtest_day_pool_2026.json').read_text(encoding='utf-8'))
          extra=json.loads(Path('horse-racing/jrdb/config/racenote_racelap_forward_bootstrap_2026.json').read_text(encoding='utf-8'))
          days=sorted({x['date'] for x in pool['days'] if x['date'].startswith('2026-') and x['date']<='2026-10-12' and x.get('file_name','').startswith('PACI')} | set(extra['supplemental_race_dates']))
          if len(days)<80: raise SystemExit(f'unexpected 2026 JRA date inventory: {len(days)}')
          failed=[]
          good=[]
          for date in days:
              compact=date.replace('-','')
              path=Path('/tmp/lap/raw/SED')/f'SED{compact[2:]}.zip'
              def verified():
                  try:
                      with zipfile.ZipFile(path) as zf:
                          return zf.testzip() is None and any('SRB' in x.upper() for x in zf.namelist())
                  except (OSError,zipfile.BadZipFile):
                      return False
              if verified():
                  good.append(date)
                  continue
              path.unlink(missing_ok=True)
              for delay in [0,4,12,30,60]:
                  if delay: time.sleep(delay)
                  subprocess.run([
                      'python','horse-racing/jrdb/src/fetch_jrdb_history.py',
                      '--date',compact,'--kinds','SED','--output-dir','/tmp/lap/raw',
                      '--max-retries','3','--retry-backoff-seconds','3',
                      '--sleep-seconds','1.5','--continue-on-error'
                  ],check=False,stdout=subprocess.DEVNULL)
                  if verified(): break
              if verified(): good.append(date)
              else: failed.append(date)
              time.sleep(1.5)
          report={'expected_dates':days,'complete_count':len(good),'missing_dates':failed,'status':'COMPLETE' if not failed else 'PARTIAL'}
          Path('/tmp/lap/state/acquisition.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'expected':len(days),'complete':len(good),'missing':failed},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: racelap-bootstrap-raw-${{ github.run_id }}
          path: /tmp/lap/raw/SED/SED*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Require complete known-day inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/lap/state/acquisition.json').read_text())
          assert j['status']=='COMPLETE', f"Retry missing dates from raw artifact: {j['missing_dates']}"
          PY
      - name: Acquire verified 2024-2025 annual baselines
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/fetch_jrdb_history.py \
            --from-year 2024 --to-year 2025 --kinds SED \
            --output-dir /tmp/lap/annual --sleep-seconds 1 \
            --max-retries 5 --retry-backoff-seconds 3
          test -s /tmp/lap/annual/SED/SED_2024.zip
          test -s /tmp/lap/annual/SED/SED_2025.zip
      - name: Build and validate initial forward current
        run: |
          set -euo pipefail
          mkdir -p /tmp/lap/candidate /tmp/lap/output
          mapfile -t DAILY < <(find /tmp/lap/raw/SED -type f -name 'SED*.zip' | sort)
          python horse-racing/jrdb/src/jrdb_race_lap_dataset.py \
            /tmp/lap/annual/SED/SED_2024.zip \
            /tmp/lap/annual/SED/SED_2025.zip \
            "${DAILY[@]}" \
            --output /tmp/lap/candidate/race_lap.parquet \
            --audit /tmp/lap/candidate/audit.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/lap/candidate/race_lap.parquet')
          a=json.loads(Path('/tmp/lap/candidate/audit.json').read_text(encoding='utf-8'))
          assert a['validation_status']=='PASS' and a['max_race_date']=='2026-10-12'
          m={
              'schema_version':'jrdb-race-lap-forward-current-0.1',
              'status':'CANDIDATE_PASS',
              'validation_status':'PASS',
              'generation_id':'racelap-forward-20261012-bootstrap-01',
              'dataset_schema_version':a['dataset_schema_version'],
              'shape_logic_version':a['shape_logic_version'],
              'period_from':a['min_race_date'],
              'period_to':a['max_race_date'],
              'race_count':a['race_count'],
              'parquet_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'parquet_size_bytes':p.stat().st_size,
              'duplicate_key_rows':0
          }
          Path('/tmp/lap/candidate/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python horse-racing/jrdb/src/jrdb_race_lap_forward_promote.py \
            --candidate /tmp/lap/candidate \
            --destination /tmp/lap/output/current \
            --target-date 2026-10-17 \
            --analysis-period-to 2026-10-12
      - uses: actions/upload-artifact@v4
        id: publish
        with:
          name: racelap-forward-current-bootstrap-${{ github.run_id }}
          path: /tmp/lap/output/current/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Print verified current binding
        run: |
          echo "RACELAP_CURRENT_ARTIFACT_ID=${{ steps.publish.outputs.artifact-id }}"
