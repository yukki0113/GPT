name: RaceNote BTDAY-0110 close unprocessed
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0110.close-unprocessed'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Assert no result unlock and close
        shell: bash
        run: |
          set -euo pipefail
          ROOT=horse-racing/jrdb/backtests/BTDAY-0110
          TARGET=$ROOT/20251206
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0110/20251206')
          s=json.loads((root/'v055/session.json').read_text())
          h=json.loads((root/'forecast_prep/day_prep_handoff.json').read_text())
          assert s['result_opened'] is False
          assert s['target_market_opened'] is False
          assert s['market_blind'] is True
          assert h['result_opened'] is False
          assert h['target_market_opened'] is False
          assert h['market_blind'] is True
          assert not (root/'v055/frozen/day_handoff.json').exists()
          assert not (root/'v055/frozen/records.json').exists()
          payload={
            'selection_id':'BTDAY-0110',
            'status':'CLOSED_UNPROCESSED',
            'target_date':'2025-12-06',
            'source_mode':'historical_warehouse',
            'source_reference':'jrdb_normalized_warehouse_v1_2010_2025_g20260921',
            'logic_version':s['logic_version'],
            'contract_revision':s['contract_revision'],
            'reason':'Prediction Reader field inventory was not yet complete and the v0.5.5 Reader was excessively large; run closed before model authoring/Freeze. No result, target final odds/popularity, payout, or settlement lookup was performed.',
            'used_date_retained':True,
            'turn1_retained_for_audit':True,
            'turn2_prediction_authored':False,
            'freeze_created':False,
            'market_blind':True,
            'result_opened':False,
            'target_market_opened':False,
            'settlement_performed':False
          }
          (Path('horse-racing/jrdb/backtests/BTDAY-0110')/'CLOSED_UNPROCESSED.json').write_text(
            json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf "$TARGET/v055/model_chunks"
          rm -f             .github/workflows/racenote_btday0110_v055_chunks_temp.yml             .github/workflows/racenote_btday0110_v055_reader_export_temp.yml             horse-racing/jrdb/backtests/requests/BTDAY-0110.v055-chunks             horse-racing/jrdb/backtests/requests/BTDAY-0110.v055-reader-export
      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "RaceNote: close BTDAY-0110 unprocessed"
          git pull --rebase origin main
          git push origin HEAD:main
