name: TMP RRDB v0.4 Validation
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/src/jrdb_recommendation_reverse.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_reverse_v04.py'
      - '.github/workflows/tmp_rrdb_v04_validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb
      - name: Compile v0.4 modules
        run: |
          python -m py_compile horse-racing/jrdb/src/jrdb_recommendation_signals.py
          python -m py_compile horse-racing/jrdb/src/jrdb_recommendation_reverse.py
          python -m py_compile horse-racing/jrdb/src/build_rrdb_newspaper_handoff.py
      - name: Run v0.4 focused tests
        working-directory: horse-racing/jrdb
        run: |
          python -m unittest -v tests.test_jrdb_recommendation_signals
          python -m unittest -v tests.test_jrdb_recommendation_reverse_v04
