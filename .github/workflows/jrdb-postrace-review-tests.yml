name: JRDB Post-Race Review Tests

on:
  push:
    branches:
      - main
    paths:
      - "horse-racing/jrdb/src/jrdb_postrace_review*.py"
      - "horse-racing/jrdb/src/audit_jrdb_postrace_review.py"
      - "horse-racing/jrdb/schema/jrdb_postrace_review_schema_v0_1.sql"
      - "horse-racing/jrdb/tests/test_*postrace_review*.py"
      - ".github/workflows/jrdb-postrace-review-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Review runtime dependency
        run: python -m pip install "duckdb==1.1.3"

      - name: Compile Review modules
        run: |
          python -m compileall -q             horse-racing/jrdb/src/jrdb_postrace_review.py             horse-racing/jrdb/src/jrdb_postrace_review_source.py             horse-racing/jrdb/src/jrdb_postrace_review_standard.py             horse-racing/jrdb/src/jrdb_postrace_review_context.py             horse-racing/jrdb/src/jrdb_postrace_review_bias.py             horse-racing/jrdb/src/jrdb_postrace_review_builder.py             horse-racing/jrdb/src/audit_jrdb_postrace_review.py             horse-racing/jrdb/src/jrdb_postrace_review_publish.py

      - name: Run Review unit tests
        run: |
          python -m unittest discover             -s horse-racing/jrdb/tests             -p "test_*postrace_review*.py"             -v
