name: RaceNote prediction-first CLI regression
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_v055_r6_prediction_cli.py'
      - '.github/workflows/racenote_r6_prediction_cli_test.yml'
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify compact commands against persisted four LLM race checkpoints
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT=horse-racing/jrdb/backtests/BTDAY-0136/20250302/v055
          STORE=horse-racing/jrdb/llm_checkpoints/BTDAY-0136/prediction
          CLI=horse-racing/jrdb/src/racenote_v055_r6_prediction_cli.py
          python -m py_compile "$CLI"
          python "$CLI" --root "$ROOT" --store "$STORE" status > /tmp/status.json
          python "$CLI" --root "$ROOT" --store "$STORE" next > /tmp/next.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          s=json.load(open('/tmp/status.json')); n=json.load(open('/tmp/next.json'))
          assert s['completed']==4 and s['remaining']==32,s
          assert n['completed']==4 and n['remaining']==32,n
          p=Path(n['next_race']['reader_path'])
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==n['next_race']['reader_sha256']
          print('PREDICTION_CLI_STATUS_NEXT=PASS')
          PY
          if python "$CLI" --root "$ROOT" --store "$STORE" finalize --output /tmp/should-not-finalize.json; then exit 1; fi
          test ! -e /tmp/should-not-finalize.json
          python "$CLI" --root "$ROOT" --store "$STORE" save --draft horse-racing/jrdb/llm_checkpoints/BTDAY-0136/prediction/中山_03.json > /tmp/save.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/save.json'))
          assert s['saved']==4 and s['remaining']==32,s
          print('PREDICTION_CLI_IDEMPOTENT_SAVE=PASS')
          PY
          test ! -e "$ROOT/incoming/llm_decisions.json"
          test ! -e "$ROOT/frozen/day_handoff.json"
