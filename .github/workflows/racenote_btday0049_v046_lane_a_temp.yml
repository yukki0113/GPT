name: RaceNote BTDAY-0049 v046 Lane A Freeze
on:
  push:
    branches:
      - research/racenote-btday0049-v046-lane-a-20261006
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v046/run_freeze.trigger'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/racenote-btday0049-v046-lane-a-20261006
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, save venues, and Freeze Lane A
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          AB=horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab
          for V in 中京 中山 阪神; do
            python horse-racing/jrdb/src/racenote_ab_lane.py save --ab-root "$AB" --lane v046 --decisions "$AB/v046/incoming/$V.json"
          done
          python horse-racing/jrdb/src/racenote_ab_lane.py freeze --ab-root "$AB" --lane v046
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v046/frozen/lane_handoff.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["status"]=="FROZEN_CLEAN_BLIND"
          assert x["validator_status"]=="PASS"
          assert x["logic_version"]=="RaceNote-Human-Context-Reader-0.4.6-candidate"
          assert x["market_blind"] is True
          assert x["result_opened"] is False
          assert x["target_market_opened"] is False
          assert x["record_count"]==36
          print(json.dumps(x, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$AB/v046/authored_decisions" "$AB/v046/frozen"
          git commit -m 'RaceNote: Freeze BTDAY-0049 v0.4.6 Lane A'
          git pull --rebase origin research/racenote-btday0049-v046-lane-a-20261006
          git push origin HEAD:research/racenote-btday0049-v046-lane-a-20261006
