name: Restore RaceNote Stage B artifacts

on:
  push:
    branches: [main]
    paths:
      - '.stageb_restore/READY'

permissions:
  contents: write

concurrency:
  group: restore-racenote-stage-b-artifacts
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Reassemble and verify supplied bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .stageb_restore/part_* > /tmp/stageb.b64
          base64 -d /tmp/stageb.b64 > /tmp/stageb.zip
          echo "fabe407d06e31bd90f3d73a9068541581c961066abc8da4c5f246e39375ba0d1  /tmp/stageb.zip" | sha256sum -c -
          test "$(unzip -Z1 /tmp/stageb.zip | grep -v '/$' | wc -l)" -eq 19

      - name: Restore original files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stageb_extract
          mkdir -p /tmp/stageb_extract
          unzip -q /tmp/stageb.zip -d /tmp/stageb_extract
          cp -a /tmp/stageb_extract/. .
          python -m py_compile horse-racing/jrdb/tools/run_racenote_feature_audit_stage_b.py

      - name: Remove temporary transport and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .stageb_restore
          rm -f .github/workflows/restore_racenote_stage_b_temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research(jrdb): restore Stage B feature audit artifacts'
          git pull --rebase origin main
          git push origin HEAD:main
