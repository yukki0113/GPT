name: Temporary Notification Rollout

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gpt-admin-notification-rollout-main
  cancel-in-progress: false

jobs:
  rollout:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[gpt-admin-notification-rollout]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final notification policy
        run: |
          python - <<'PY'
          from pathlib import Path

          def expression(name: str) -> str:
              return "$" + "{{ " + name + " }}"

          operational = {
              ".github/workflows/boatrace_pre_race_issue.yml": (
                  "BOATRACE pre-race completed successfully.",
                  "BOATRACE pre-race failed. Check the workflow run.",
              ),
              ".github/workflows/boatrace_racelist_issue.yml": (
                  "BOATRACE racelist completed successfully.",
                  "BOATRACE racelist failed. Check the workflow run.",
              ),
              ".github/workflows/boatrace_results_chat.yml": (
                  "BOATRACE results completed successfully.",
                  "BOATRACE results failed. Check the workflow run.",
              ),
              ".github/workflows/eval_media_chat.yml": (
                  "Eval media collection completed successfully.",
                  "Eval media collection failed. Check the workflow run.",
              ),
              ".github/workflows/eval_ocr_chat.yml": (
                  "Eval OCR completed successfully.",
                  "Eval OCR failed. Check the workflow run.",
              ),
              ".github/workflows/jra_results_chat.yml": (
                  "JRA results fetch completed successfully.",
                  "JRA results fetch failed. Check the workflow run.",
              ),
          }

          for filename, messages in operational.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "      - name: Notify completion\n" in text:
                  print(f"already configured: {filename}")
                  continue

              success_message, failure_message = messages
              block = """

      - name: Notify completion
        if: always()
        env:
          GH_TOKEN: __GH_TOKEN__
          ISSUE_NUMBER: __ISSUE_NUMBER__
          JOB_STATUS: __JOB_STATUS__
          RUN_URL: __RUN_URL__
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            printf '@yukki0113\\n\\n✅ __SUCCESS__\\n\\nWorkflow run: %s\\n' "$RUN_URL" > /tmp/final_notification.md
          else
            printf '@yukki0113\\n\\n❌ __FAILURE__\\n\\nWorkflow run: %s\\n' "$RUN_URL" > /tmp/final_notification.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "__REPOSITORY__" --body-file /tmp/final_notification.md
"""
              block = block.replace("__GH_TOKEN__", expression("github.token"))
              block = block.replace("__ISSUE_NUMBER__", expression("github.event.issue.number"))
              block = block.replace("__JOB_STATUS__", expression("job.status"))
              block = block.replace(
                  "__RUN_URL__",
                  expression("github.server_url")
                  + "/"
                  + expression("github.repository")
                  + "/actions/runs/"
                  + expression("github.run_id"),
              )
              block = block.replace("__REPOSITORY__", expression("github.repository"))
              block = block.replace("__SUCCESS__", success_message)
              block = block.replace("__FAILURE__", failure_message)
              path.write_text(text.rstrip() + block, encoding="utf-8")
              print(f"configured: {filename}")

          comment_updates = {
              ".github/workflows/gpt_git_update_issue.yml": [
                  (
                      "          ✅ Git update applied and pushed to \\`main\\`.\n",
                      "          @yukki0113\n\n          ✅ Git update applied and pushed to \\`main\\`.\n",
                  ),
                  (
                      "          ❌ Git update was not pushed. Validation, patch application, tests, commit, or push failed.\n",
                      "          @yukki0113\n\n          ❌ Git update was not pushed. Validation, patch application, tests, commit, or push failed.\n",
                  ),
              ],
              ".github/workflows/gpt_git_binary_update_issue.yml": [
                  (
                      "          ✅ Binary Git update reconstructed, verified, and pushed to \\`main\\`.\n",
                      "          @yukki0113\n\n          ✅ Binary Git update reconstructed, verified, and pushed to \\`main\\`.\n",
                  ),
                  (
                      "          ❌ Binary Git update was not pushed. Metadata validation, chunk reconstruction, SHA-256 verification, file validation, gitignore policy, commit, or push failed.\n",
                      "          @yukki0113\n\n          ❌ Binary Git update was not pushed. Metadata validation, chunk reconstruction, SHA-256 verification, file validation, gitignore policy, commit, or push failed.\n",
                  ),
              ],
          }

          for filename, replacements in comment_updates.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "          @yukki0113\n\n          ✅" in text and "          @yukki0113\n\n          ❌" in text:
                  print(f"already configured: {filename}")
                  continue

              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one anchor in {filename}: {old!r}; found {count}")
                  text = text.replace(old, new, 1)

              path.write_text(text, encoding="utf-8")
              print(f"configured: {filename}")
          PY

          git diff --check
          git diff -- .github/workflows/

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- .github/workflows/)" ]; then
            echo "No changes were required."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "gpt-notification-rollout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "feat: add final direct-mention notifications to issue workflows"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Notification rollout pushed: $COMMIT_SHA"
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Notification rollout failed: $RUN_URL"
