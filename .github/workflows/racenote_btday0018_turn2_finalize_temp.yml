name: RaceNote BTDAY-0018 TURN2 finalize temp

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: startsWith(github.event.issue.title, '[RACENOTE_BTDAY0018_TURN2_FINAL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore frozen payload
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-e598-820b-9218-14a64e82606d/raw?se=2026-10-01T09%3A11%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=f5b149e7-c827-5e99-814f-658c28697e52&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T08%3A24%3A40Z&ske=2026-10-02T08%3A24%3A40Z&sks=b&skv=2026-02-06&sig=BIN%2Bd62aOGdDyY6A/DNM/oIotddlJXXG7sO5MmOXfdI%3D' -o /tmp/bt18.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/bt18.zip')
          assert z.testzip() is None
          z.extractall('/tmp/bt18')
          print('members',len(z.namelist()))
          PY

      - name: Validate frozen forecast
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt18/day_merge/forecast_20260125_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/validator.json').read_text())
          a=json.loads(Path('/tmp/bt18/day_merge/forecast_20260125_all_audit.json').read_text())
          h=json.loads(Path('/tmp/bt18/day_merge/forecast_20260125_all_handoff.json').read_text())
          assert v['status']=='PASS',v
          assert a['status']=='FROZEN_CLEAN_BLIND'
          assert a['clean_blind_eligible'] is True
          assert a['result_opened'] is False
          assert a['record_count']==36 and a['frozen_count']==36
          assert a['prediction_hash_unique_count']==36
          assert a['five_mark_role_guard']=='PASS'
          assert a['mainline_single_shot_guard']=='PASS'
          assert a['reader_facing_prose_guard']=='PASS'
          assert a['market_blind_guard']=='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST'
          assert a['rrdb_contract_guard']=='PASS_RECOMMENDATION_V0_2_GRADE_DISABLED'
          assert h['selection_id']=='BTDAY-0018'
          assert h['target_date']=='2026-01-25'
          assert h['logic_version']=='RaceNote-Human-Context-Reader-0.4.2-candidate'
          assert h['rrdb_recommendation_contract']=='rrdb-recommendation-signals-v0.2'
          assert h['result_opened'] is False
          print(json.dumps({'validator':v,'audit':a},ensure_ascii=False,indent=2))
          PY

      - name: Publish canonical archive
        run: |
          set -euo pipefail
          DEST='horse-racing/jrdb/backtests/BTDAY-0018/20260125'
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/bt18 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260125_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0018 20260125 forecast"
          git push origin HEAD:main
          git rev-parse HEAD >/tmp/commit.txt

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json,os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          print('RACENOTE_BTDAY0018_TURN2_RESULT')
          print(json.dumps({
            'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL',
            'clean_blind_eligible':True if ok else None,
            'result_opened':False,
            'race_count':36 if ok else None,
            'technical_skips':0 if ok else None,
            'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate',
            'rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.2',
            'validator_status':v.get('status'),
            'market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST' if ok else None,
            'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,
            'run_id':int(os.environ['GITHUB_RUN_ID'])
          },ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
