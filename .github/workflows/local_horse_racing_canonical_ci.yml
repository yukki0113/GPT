name: Local horse racing canonical CI

on:
  push:
    paths:
      - 'local-horse-racing/**'
      - 'tools/data-storage/**'
      - '.github/workflows/local_horse_racing_canonical_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/data-storage/requirements.txt

      - name: Install shared storage dependencies
        run: python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt pytest

      - name: Shared dependency check
        env:
          PYTHONPATH: tools/data-storage
        run: python -m data_storage check-deps

      - name: Local horse racing tests
        env:
          PYTHONPATH: local-horse-racing:tools/data-storage
        run: python -m unittest discover -s local-horse-racing/tests -v

      - name: Shared data-storage regression tests
        env:
          PYTHONPATH: tools/data-storage
        run: python -m pytest tools/data-storage/tests -q
