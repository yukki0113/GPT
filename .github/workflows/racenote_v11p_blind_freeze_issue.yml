name: RaceNote v1.1-P Blind Freeze

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: racenote-v11p-blind-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: ${{ github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[RACENOTE_V11P_BLIND_FREEZE]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare and validate request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          prefix = '[RACENOTE_V11P_BLIND_FREEZE]'
          title = os.environ['ISSUE_TITLE']
          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,96}', request_id):
              raise SystemExit('REQUEST_INVALID: invalid request_id')
          try:
              body = json.loads(os.environ.get('ISSUE_BODY') or '')
          except json.JSONDecodeError as exc:
              raise SystemExit(f'REQUEST_INVALID: body must be JSON: {exc}')
          if body.get('request_id') != request_id:
              raise SystemExit('REQUEST_INVALID: title request_id and body request_id differ')
          expected = ['20260704', '20260725', '20260726']
          if body.get('dates') != expected:
              raise SystemExit(f'REQUEST_INVALID: dates must be exactly {expected}')
          if not isinstance(body.get('edge'), dict) or not isinstance(body.get('racenote'), dict):
              raise SystemExit('REQUEST_INVALID: edge and racenote objects are required')
          Path('/tmp/request.json').write_text(json.dumps(body, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'request_id={request_id}\n')
          PY

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run frozen logic tests
        run: |
          python -m pytest -q \
            horse-racing/jrdb/tests/test_racenote_v02_reconstructed.py \
            horse-racing/jrdb/tests/test_racenote_edge_prediction_policy.py \
            horse-racing/jrdb/tests/test_racenote_edge_prediction_policy_neutral.py

      - name: Download frozen upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream/edge /tmp/upstream/racenote
          edge_run="$(jq -r '.edge.run_id' /tmp/request.json)"
          edge_artifact="$(jq -r '.edge.artifact_name' /tmp/request.json)"
          gh run download "$edge_run" --repo "$GITHUB_REPOSITORY" --name "$edge_artifact" --dir /tmp/upstream/edge
          for day in 20260704 20260725 20260726; do
            run_id="$(jq -r --arg day "$day" '.racenote[$day].run_id' /tmp/request.json)"
            artifact="$(jq -r --arg day "$day" '.racenote[$day].artifact_name' /tmp/request.json)"
            mkdir -p "/tmp/upstream/racenote/$day"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "/tmp/upstream/racenote/$day"
          done

      - name: Build PRE_HJC freeze
        run: |
          code_head="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/run_racenote_v11p_blind_freeze.py \
            --request-json /tmp/request.json \
            --edge-root /tmp/upstream/edge \
            --racenote-root /tmp/upstream/racenote \
            --output-dir /tmp/freeze \
            --run-id "${{ github.run_id }}" \
            --head-sha "$code_head"

      - name: Upload freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: racenote-v11p-pre-hjc-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: /tmp/freeze/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Commit immutable freeze to main
        id: commit
        run: |
          set -euo pipefail
          target='horse-racing/jrdb/prediction_runs'
          mkdir -p "$target"
          for file in \
            RaceNote_v1_1_Polarity_Gated_20260704_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260725_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260726_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260704_25_26_PRE_HJC_FREEZE.json; do
            if [ -e "$target/$file" ]; then
              echo "DOMAIN_VALIDATION_FAILED: immutable freeze target already exists: $target/$file" >&2
              exit 2
            fi
            cp "/tmp/freeze/$file" "$target/$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"/RaceNote_v1_1_Polarity_Gated_20260704_PRE_HJC.json \
                  "$target"/RaceNote_v1_1_Polarity_Gated_20260725_PRE_HJC.json \
                  "$target"/RaceNote_v1_1_Polarity_Gated_20260726_PRE_HJC.json \
                  "$target"/RaceNote_v1_1_Polarity_Gated_20260704_25_26_PRE_HJC_FREEZE.json
          git commit -m 'freeze(jrdb): RaceNote v1.1-P 20260704 25 26 PRE_HJC'
          git push origin HEAD:main
          freeze_commit="$(git rev-parse HEAD)"
          echo "freeze_commit=$freeze_commit" >> "$GITHUB_OUTPUT"

      - name: Comment success and close Issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          FREEZE_COMMIT: ${{ steps.commit.outputs.freeze_commit }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = json.loads(Path('/tmp/freeze/result.json').read_text(encoding='utf-8'))
          compact = {
              'status': 'success',
              'freeze_stage': result['freeze_stage'],
              'result_data_used': False,
              'request_id': result['request_id'],
              'run_id': result['run_id'],
              'code_head_sha': result['head_sha'],
              'freeze_commit': os.environ['FREEZE_COMMIT'],
              'artifact_name': f"racenote-v11p-pre-hjc-{os.environ['REQUEST_ID']}-{os.environ['RUN_ID']}",
              'race_count': result['race_count'],
              'axis_changes': result['axis_changes'],
              'by_day': result['by_day'],
              'combined_canonical_payload_sha256': result['combined_canonical_payload_sha256'],
              'manifest_sha256': result['manifest_sha256'],
              'day_files': result['day_files'],
              'source_hashes': result['source_hashes'],
          }
          body = 'RACENOTE_V11P_BLIND_FREEZE_RESULT\n```json\n' + json.dumps(compact, ensure_ascii=False, indent=2, sort_keys=True) + '\n```\n'
          subprocess.run(['gh', 'issue', 'comment', os.environ['ISSUE_NUMBER'], '--repo', os.environ['GITHUB_REPOSITORY'], '--body', body], check=True)
          subprocess.run(['gh', 'issue', 'close', os.environ['ISSUE_NUMBER'], '--repo', os.environ['GITHUB_REPOSITORY'], '--reason', 'completed'], check=True)
          PY

      - name: Comment failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "RACENOTE_V11P_BLIND_FREEZE_RESULT\n\`\`\`json\n{\"status\":\"failure\",\"failure_class\":\"IMPLEMENTATION_OR_DOMAIN_VALIDATION_FAILED\",\"run_id\":$GITHUB_RUN_ID,\"retryable\":false}\n\`\`\`\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  btday-v044-freeze:
    if: ${{ github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[RACENOTE_BTDAY044_FREEZE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse request
        run: |
          set -euo pipefail
          jq -r '.issue.body' "$GITHUB_EVENT_PATH" > /tmp/request.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          allowed={
            'BTDAY-0042':('2026-03-21','20260321','BTDAY-0042-FORECAST-PREP-STRIPPED'),
            'BTDAY-0043':('2026-02-14','20260214','BTDAY-0043-FORECAST-PREP-STRIPPED'),
          }
          sid=x.get('selection_id')
          if sid not in allowed or not isinstance(x.get('decisions'),list) or len(x['decisions'])!=36:
              raise SystemExit('invalid BTDAY v0.4.4 request')
          date,compact,art=allowed[sid]
          if x.get('target_date')!=date:
              raise SystemExit('target date mismatch')
          Path('/tmp/decisions.json').write_text(json.dumps(x['decisions'],ensure_ascii=False)+'\n',encoding='utf-8')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as h:
              h.write(f'SID={sid}\nDATE={date}\nCOMPACT={compact}\nART={art}\n')
          PY

      - name: Download clean authoring input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prep
          gh run download 37043112729 --repo "$GITHUB_REPOSITORY" --name "$ART" --dir /tmp/prep
          test -s /tmp/prep/day_prep_handoff.json
          test -s /tmp/prep/reader_stripped_manifest.json

      - name: Deterministic validate and freeze
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/_tmp_btday044_freeze.py             --decisions /tmp/decisions.json             --prep-root /tmp/prep             --selection-id "$SID"             --date "$DATE"             --main-sha 4820483683f2a9b9f20f64a8dee4d2894ea70fd9             --repo-root .

      - name: Commit canonical archive
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "horse-racing/jrdb/backtests/$SID"
          git commit -m "research(racenote): freeze clean-blind $SID v0.4.4"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          sid=os.environ.get('SID'); compact=os.environ.get('COMPACT')
          p=Path('horse-racing/jrdb/backtests')/str(sid)/str(compact)/'day_merge/clean_blind_audit.json'
          ok=bool(os.environ.get('COMMIT_SHA')) and p.is_file()
          print('RACENOTE_BTDAY044_FREEZE_RESULT')
          print(json.dumps({'status':'PASS' if ok else 'FAIL','selection_id':sid,'commit':os.environ.get('COMMIT_SHA'),'audit':json.loads(p.read_text()) if p.is_file() else None},ensure_ascii=False,indent=2))
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          if [ -n "$COMMIT_SHA" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            exit 1
          fi
