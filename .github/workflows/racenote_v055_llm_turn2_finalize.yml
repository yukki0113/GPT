name: RaceNote v0.5.5 LLM T2 Finalize

on:
  workflow_dispatch:
    inputs:
      root:
        description: 'Legacy non-r5 daily v055 root'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: racenote-v055-llm-turn2-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve legacy non-r5 day
        id: resolve
        env:
          ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re
          root = os.environ["ROOT"].strip("/")
          if not re.fullmatch(r"horse-racing/jrdb/daily/\d{8}/v055_day/v055", root):
              raise SystemExit("Unsupported legacy root")
          path = pathlib.Path(root)
          session = json.loads((path / "session.json").read_text())
          if session.get("contract_revision") == "v055-prediction-freeze-confidence-review-r5":
              raise SystemExit("r5 must use the two-phase workflows")
          if not all((path / "incoming" / name).is_file() for name in ("llm_decisions.json", "llm_confidence.json")):
              raise SystemExit("Both legacy drafts required")
          if (path / "frozen").exists():
              raise SystemExit("Prediction already frozen")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready=true\nroot={root}\n")
          PY

      - name: Finalize LLM-authored T2
        if: steps.resolve.outputs.ready == 'true'
        env:
          PYTHONPATH: horse-racing/jrdb/src
          ROOT: ${{ steps.resolve.outputs.root }}
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_turn2_finalize.py \
            --root "$ROOT" \
            --decisions "$ROOT/incoming/llm_decisions.json" \
            --confidence "$ROOT/incoming/llm_confidence.json"

      - name: Commit immutable T2
        if: steps.resolve.outputs.ready == 'true'
        env:
          ROOT: ${{ steps.resolve.outputs.root }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$ROOT/authored_decisions" \
            "$ROOT/authoring_quality_report.json" \
            "$ROOT/frozen" \
            "$ROOT/confidence_review.json" \
            "$ROOT/confidence_frozen" \
            "$ROOT/turn2_summary.json"
          date_key="$(basename "$(dirname "$(dirname "$ROOT")")")"
          git commit -m "RaceNote: freeze LLM-authored ${date_key} v0.5.5 TURN 2"
          git pull --rebase origin main
          git push origin HEAD:main
