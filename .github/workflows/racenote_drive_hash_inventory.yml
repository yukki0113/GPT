name: Temporary pinned-hash inventory for RaceNote golden files
on:
  pull_request:
    paths:
      - '.github/workflows/racenote_drive_hash_inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gdown==5.2.0'
      - name: Download public golden inputs and compute pinned hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/golden
          cat > /tmp/golden/file_ids.txt <<'EOF'
          1uB0IQecWNKNn_ASZx4_0MhlWNXUmFrYA warehouse/current.json
          1jUX9geM4IrOcWygzbSTGVsgCJ37ULXQN warehouse/generations/jrdb_normalized_warehouse_v1_2010_2025_g20260921/manifest.json
          1k1HagEAM0BjwEVD0bT1sz1PwEMQy3btg raw/BAC/BAC_2025.zip
          17JU7BIAEnLOVyKWtoKw-BYkSugykbrfi raw/KYI/KYI_2025.zip
          1ci38S2wRDQfmvj1IM8INO7cX5nGX7Iww raw/CHA/CHA_2025.zip
          1Qcom4iheK07eyAAX8jO2wBkChYuN1oFS raw/CYB/CYB_2025.zip
          1arU2LbSU1u--qEqKpAvlNBjLapflh2nw raw/ZED/ZED_2025.zip
          1lFQky-22SLQqBMLwVbkLBEJTMfLesMf8 raw/ZKB/ZKB_2025.zip
          1OPXGvbo66mUx1cMpu2t1w2JxjAY02i1o raw/ZED/ZED_2024.zip
          1HCv3w6G1JphMXBtLGTXZgZyNZ3poNzEn raw/ZKB/ZKB_2024.zip
          1gA9eBkY7cF30FnkjhSnIxEVE-_TgLK3v warehouse/objects/bac/year=2025/f6ceb99ab6ebadf88a44315276bb50b7f4e1f536c2651a793a6c0f1f7b4ef738.parquet
          1BsUYCalaMyVAZsjEa1R0i_YzsdzrvcJW warehouse/objects/kyi/year=2025/55fdcc9fd03c70f284b028fa85ef3c6b2882071c685639621061ba146c0fa10b.parquet
          1uTc41dqOriuVa_ZUL3VMPvx43Fclso8M warehouse/objects/cha/year=2025/29a553954b25f75e1ea21965a62e5466c1ad0f13b50aa9a7548c160d1d3a6fc3.parquet
          1g0xyGcGRB5K9VQdtrIC1uJJQ7DK7sdPr warehouse/objects/cyb/year=2025/90f7ae295afc5e461458b236fc17c1abff200c7bc658638bb51d6a12709b5d04.parquet
          1ouEluqM2BkcbVsoGa1Bi_gSuUTPsdSp2 warehouse/objects/zed/year=2025/2097b5386817ed228715bf33bd9316c42478c5f8a65a55e6810e139bcd7bd9f0.parquet
          1JO8OlVc6gMqfCq9sA2RcILw9HmUcC7Vo warehouse/objects/zkb/year=2025/a5ff1aff1bfa8d16033d27f20ebefb7d795710e72b9cf3384479a579cf37c5c1.parquet
          1yKQ90cMI_l7x5EqkSZmwrBdw16wn8P6H warehouse/objects/zed/year=2024/3ae57e5df93dd12f362e7196ec9e3e7507f0ad1cb5eb9924df3b21664f973403.parquet
          1Q8aQz7kApjQjhzqp9DyUJ2uj1OtGLAaw warehouse/objects/zkb/year=2024/986ddf27250f1ba443334a23e85e085b45ee374906333520b3fbe1a5b4e84bbd.parquet
          1qCoOmnH73QvrVMYNhTG28shPHg8yru2S analysis.tar.xz
          1UwNfrupMTHRPhkzULPvClGre4MWz2TFg rrdb.zip
          EOF
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/golden/file_ids.txt').read_text().splitlines():
              file_id,dest=line.strip().split(' ',1)
              path=Path('/tmp/golden')/dest
              path.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['gdown','--id',file_id,'-O',str(path)],check=True)
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              rows.append({'artifact_id':dest.replace('/','_').replace('.','_').replace('-','_'),
                           'file_id':file_id,'destination':dest,'expected_name':path.name,
                           'expected_size':path.stat().st_size,'sha256':h.hexdigest()})
              print('VERIFIED_INVENTORY',dest,path.stat().st_size,h.hexdigest(),flush=True)
          out={'schema_version':1,'transport':'public_google_drive','artifacts':rows}
          Path('racenote_drive_pinned_manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-drive-hash-inventory
          path: racenote_drive_pinned_manifest.json
