name: JRDB Legacy Family Year via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_LEGACY_FAMILY_YEAR_REQUEST]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          family=str(req.get('family','')).upper()
          year=int(req.get('year',0))
          workers=int(req.get('workers',4))
          if family not in {'ZED','ZKB'}:
              raise SystemExit('family must be ZED or ZKB')
          if year < 2010 or year > 2025:
              raise SystemExit('year must be 2010..2025')
          if not 1 <= workers <= 6:
              raise SystemExit('workers must be 1..6')
          Path('/tmp/request.json').write_text(
              json.dumps({'family':family,'year':year,'workers':workers}),
              encoding='utf-8'
          )
          PY

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check 'libarchive-c>=5,<6'

      - name: Build annual ZIP
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          family=$(python -c "import json;print(json.load(open('/tmp/request.json'))['family'])")
          year=$(python -c "import json;print(json.load(open('/tmp/request.json'))['year'])")
          workers=$(python -c "import json;print(json.load(open('/tmp/request.json'))['workers'])")
          python horse-racing/jrdb/src/build_legacy_family_year.py \
            --family "$family" --year "$year" --workers "$workers" --output-dir /tmp/out

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-legacy-family-year-${{ github.event.issue.number }}
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/out/manifest.json').read_text(encoding='utf-8'))
          result={
              'status':'success',
              'run_id':int(os.environ['RUN_ID']),
              'artifact_name':f"jrdb-legacy-family-year-{os.environ['ISSUE_NUMBER']}",
              'family':m['family'],'year':m['year'],'file_name':m['file_name'],
              'member_count':m['member_count'],'size_bytes':m['size_bytes'],'sha256':m['sha256'],
          }
          Path('/tmp/comment.md').write_text(
              'JRDB_LEGACY_FAMILY_YEAR_RESULT\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n',
              encoding='utf-8'
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "JRDB legacy family year build failed. Workflow run: $RUN_URL"
