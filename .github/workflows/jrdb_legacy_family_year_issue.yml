name: JRDB Legacy Family Year via Issue

on:
  repository_dispatch:
    types: [jrdb_legacy_family_year_request]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing request Issue number
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  build:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve request Issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTED_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path

          number = int(os.environ['ROUTED_ISSUE_NUMBER'])
          if number <= 0:
              raise SystemExit('issue_number must be positive')
          raw = subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{number}"
          ], text=True)
          issue = json.loads(raw)
          if 'pull_request' in issue or issue['number'] != number:
              raise SystemExit('request Issue not found')
          if issue['user']['login'] != 'yukki0113':
              raise SystemExit('request Issue must be created by repository owner')
          if not issue['title'].startswith('[JRDB_LEGACY_FAMILY_YEAR_REQUEST]'):
              raise SystemExit('request Issue has wrong title prefix')
          Path('/tmp/routed_issue.json').write_text(
              json.dumps({'number': number, 'title': issue['title'], 'body': issue['body'] or '',
                          'user': issue['user']['login']}, ensure_ascii=False), encoding='utf-8'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'issue_number={number}\n')
          PYCODE
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          req=json.loads((json.loads(Path('/tmp/routed_issue.json').read_text(encoding='utf-8'))['body'] or '').strip())
          family=str(req.get('family','')).upper()
          year=int(req.get('year',0))
          workers=int(req.get('workers',4))
          if family not in {'ZED','ZKB'}:
              raise SystemExit('family must be ZED or ZKB')
          if year < 2010 or year > 2025:
              raise SystemExit('year must be 2010..2025')
          if not 1 <= workers <= 6:
              raise SystemExit('workers must be 1..6')
          Path('/tmp/request.json').write_text(
              json.dumps({'family':family,'year':year,'workers':workers}),
              encoding='utf-8'
          )
          PY

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check 'libarchive-c>=5,<6'

      - name: Build annual ZIP
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          family=$(python -c "import json;print(json.load(open('/tmp/request.json'))['family'])")
          year=$(python -c "import json;print(json.load(open('/tmp/request.json'))['year'])")
          workers=$(python -c "import json;print(json.load(open('/tmp/request.json'))['workers'])")
          python horse-racing/jrdb/src/build_legacy_family_year.py \
            --family "$family" --year "$year" --workers "$workers" --output-dir /tmp/out

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-legacy-family-year-${{ steps.issue.outputs.issue_number }}
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/out/manifest.json').read_text(encoding='utf-8'))
          result={
              'status':'success',
              'run_id':int(os.environ['RUN_ID']),
              'artifact_name':f"jrdb-legacy-family-year-{os.environ['ISSUE_NUMBER']}",
              'family':m['family'],'year':m['year'],'file_name':m['file_name'],
              'member_count':m['member_count'],'size_bytes':m['size_bytes'],'sha256':m['sha256'],
          }
          Path('/tmp/comment.md').write_text(
              'JRDB_LEGACY_FAMILY_YEAR_RESULT\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n',
              encoding='utf-8'
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure() && steps.issue.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "JRDB legacy family year build failed. Workflow run: $RUN_URL"
