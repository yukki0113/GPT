name: RaceNote DAILY-20261011 v0.5.2 prepare temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/daily/20261011/PREPARE_TRIGGER'
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown
      - name: Materialize canonical inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input /tmp/analysis_art /tmp/analysis /tmp/rrdb /tmp/rules
          gdown 'https://drive.google.com/uc?id=1Vflq7qybkFBsGbvzS2rkLlFLi25PmKFn' -O /tmp/input/PACI261011.zip
          gdown 'https://drive.google.com/uc?id=1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/input/RaceReviewDB_CURRENT.zip
          gdown 'https://drive.google.com/uc?id=1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/input/NextWatch.zip
          gh run download 36437363166 --repo "$GITHUB_REPOSITORY" --name 'jrdb-post-race-parquet-refresh-36437363166' --dir /tmp/analysis_art
          ANALYSIS_ARCHIVE="$(find /tmp/analysis_art -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | sort | head -n 1)"
          test -n "$ANALYSIS_ARCHIVE"
          case "$ANALYSIS_ARCHIVE" in
            *.tar.xz) tar -xJf "$ANALYSIS_ARCHIVE" -C /tmp/analysis ;;
            *.tar.gz|*.tgz) tar -xzf "$ANALYSIS_ARCHIVE" -C /tmp/analysis ;;
            *.zip) unzip -q "$ANALYSIS_ARCHIVE" -d /tmp/analysis ;;
          esac
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/analysis')
          gen='analysis-v1_4-canonical-20260928-02'
          manifest=root/'generations'/gen/'manifest.json'
          if not manifest.is_file():
              raise SystemExit(f'analysis generation missing: {manifest}')
          (root/'current.json').write_text(json.dumps({'status':'CURRENT','generation_id':gen,'manifest':f'generations/{gen}/manifest.json'},indent=2)+'\n',encoding='utf-8')
          PY
          unzip -q /tmp/input/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
          unzip -q /tmp/input/NextWatch.zip -d /tmp/rules
      - name: Build canonical DAILY-20261011 v0.5.2 TURN 1
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/daily/20261011/v052_day'
          test ! -e "$TARGET"
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v052_from_paci.py \
            --date 2026-10-11 \
            --paci /tmp/input/PACI261011.zip \
            --selection-id DAILY-20261011 \
            --main-sha "$MAIN_SHA" \
            --analysis-root /tmp/analysis \
            --racereview-root /tmp/rrdb/postrace_review/v0_1 \
            --next-watch-rules /tmp/rules/next_watch_candidate_rules_frozen.json \
            --output-root "$TARGET"
          ROOT="$TARGET/day_prep/RaceNote_20261011"
          cp "$ROOT/manifest.json" "$TARGET/day_prep/manifest.json"
          cp "$ROOT/validation_report.json" "$TARGET/day_prep/validation_report.json"
      - name: Validate TURN 1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/daily/20261011/v052_day')
          o=json.loads((root/'operation_handoff.json').read_text())
          s=json.loads((root/'v052/session.json').read_text())
          m=json.loads((root/'day_prep/manifest.json').read_text())
          v=json.loads((root/'day_prep/validation_report.json').read_text())
          assert o['status']=='READY_FOR_V052_AUTHORING'
          assert s['status']=='SESSION_SEALED'
          assert s['logic_version']=='RaceNote-Human-Context-Reader-0.5.2-candidate'
          assert o['market_blind'] is True and o['result_opened'] is False
          assert s['market_blind'] is True and s['target_market_opened'] is False and s['result_opened'] is False
          assert m['status']=='PASS' and v['status']=='PASS'
          assert o['race_count']==len(s['race_roster'])==m['counts']['races_built']
          PY
      - name: Commit canonical TURN 1
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/daily/20261011/v052_day
          git commit -m 'RaceNote: stage DAILY-20261011 canonical v0.5.2 TURN 1'
          git pull --rebase origin main
          git push origin HEAD:main
