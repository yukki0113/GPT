name: eval-ocr-tests

on:
  push:
    paths:
      - 'horse-racing/eval/**'
      - '.github/workflows/eval_ocr_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/eval/**'
      - '.github/workflows/eval_ocr_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horse-racing/eval/requirements.txt

      - name: Run Eval OCR regression tests
        run: |
          python -m unittest discover -s horse-racing/eval/tests -p 'test_*.py' -v
