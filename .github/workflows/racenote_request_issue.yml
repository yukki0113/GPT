name: racenote-request-issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[RACENOTE_REQUEST]'

jobs:
  run:
    if: startsWith(github.event.issue.title, '[RACENOTE_REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown

      - name: Parse request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          prefix = os.environ['REQUEST_PREFIX']
          title = os.environ['ISSUE_TITLE']
          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('invalid request_id')

          try:
              request = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Issue body must be raw JSON: {exc}') from exc

          target_date = str(request.get('date', '')).replace('-', '').replace('/', '').strip()
          if not re.fullmatch(r'\d{8}', target_date):
              raise SystemExit('date must be YYYYMMDD')
          datetime.strptime(target_date, '%Y%m%d')

          venue = request.get('venue')
          if venue is not None:
              venue = str(venue).strip() or None

          race = request.get('race')
          if race is not None:
              race = int(race)
              if venue is None:
                  raise SystemExit('race requires venue')
              if not 1 <= race <= 12:
                  raise SystemExit('race must be 1..12')

          analysis_url = str(request.get('analysis_url', '')).strip()
          mart_url = str(request.get('mart_url', '')).strip()
          if not analysis_url.startswith('https://drive.google.com/'):
              raise SystemExit('analysis_url must be a Google Drive URL')
          if not mart_url.startswith('https://drive.google.com/'):
              raise SystemExit('mart_url must be a Google Drive URL')

          stats_window_years = int(request.get('stats_window_years', 5))
          if not 1 <= stats_window_years <= 10:
              raise SystemExit('stats_window_years must be 1..10')

          raw_urls = request.get('raw_urls', {}) or {}
          if not isinstance(raw_urls, dict):
              raise SystemExit('raw_urls must be an object')
          normalized_raw_urls = {}
          for key, url in raw_urls.items():
              key = str(key).strip().upper()
              if not re.fullmatch(r'(BAC|KYI|CHA|CYB|SED|SKB)_\d{4}', key):
                  raise SystemExit(f'invalid raw_urls key: {key}')
              url = str(url).strip()
              if not url.startswith('https://drive.google.com/'):
                  raise SystemExit(f'raw_urls[{key}] must be a Google Drive URL')
              normalized_raw_urls[key] = url

          output_dir = f'horse-racing/jrdb/output_issue/{request_id}'
          raw_dir = f'{output_dir}/raw_cache'
          resolved = {
              'request_id': request_id,
              'issue_number': int(os.environ['ISSUE_NUMBER']),
              'date': target_date,
              'venue': venue,
              'race': race,
              'analysis_url': analysis_url,
              'mart_url': mart_url,
              'raw_urls': normalized_raw_urls,
              'stats_window_years': stats_window_years,
              'output_dir': output_dir,
              'raw_dir': raw_dir,
          }
          Path('/tmp/racenote_request.json').write_text(
              json.dumps(resolved, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as file:
              file.write(f'REQUEST_ID={request_id}\n')
              file.write(f'TARGET_DATE={target_date}\n')
              file.write(f'OUTPUT_DIR={output_dir}\n')
              file.write(f'RAW_DIR={raw_dir}\n')
          PY

      - name: Download Analysis, Mart and supplied Raw cache
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          request = json.loads(Path('/tmp/racenote_request.json').read_text(encoding='utf-8'))

          def download_sqlite(url: str, output: Path, label: str) -> None:
              downloaded = output.with_suffix(output.suffix + '.download')
              subprocess.run(['gdown', url, '-O', str(downloaded)], check=True)
              if zipfile.is_zipfile(downloaded):
                  with zipfile.ZipFile(downloaded) as archive:
                      bad_member = archive.testzip()
                      if bad_member is not None:
                          raise SystemExit(f'{label} ZIP has bad member: {bad_member}')
                      members = [
                          name for name in archive.namelist()
                          if not name.endswith('/') and Path(name).name.lower().endswith('.sqlite')
                      ]
                      if len(members) != 1:
                          raise SystemExit(
                              f'{label} ZIP must contain exactly one SQLite member; found {members}'
                          )
                      with archive.open(members[0]) as source, output.open('wb') as target:
                          shutil.copyfileobj(source, target, 1024 * 1024)
                  downloaded.unlink()
              else:
                  downloaded.replace(output)

              with output.open('rb') as handle:
                  header = handle.read(16)
              if header != b'SQLite format 3\x00':
                  raise SystemExit(f'{label} download is not a SQLite database')

          download_sqlite(request['analysis_url'], Path('/tmp/jrdb_analysis.sqlite'), 'Analysis')
          download_sqlite(request['mart_url'], Path('/tmp/jrdb_stats_mart.sqlite'), 'Stats Mart')

          raw_dir = Path(request['raw_dir'])
          for key, url in request['raw_urls'].items():
              kind, year = key.split('_', 1)
              destination = raw_dir / kind / f'{kind}_{year}.zip'
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['gdown', url, '-O', str(destination)], check=True)
          PY

      - name: Resolve publishable monthly Archive
        id: archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import date, datetime
          from pathlib import Path

          request = json.loads(Path('/tmp/racenote_request.json').read_text(encoding='utf-8'))
          target_date = datetime.strptime(request['date'], '%Y%m%d').date()
          result_path = Path('/tmp/archive_resolution.json')

          if target_date >= date.today():
              result = {
                  'status': 'skipped_non_past',
                  'target_month': request['date'][:6],
                  'archive_path': None,
              }
              result_path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(0)

          command = [
              sys.executable,
              'horse-racing/jrdb/src/resolve_racenote_archive_release.py',
              '--repo', os.environ['GITHUB_REPOSITORY'],
              '--target-month', request['date'][:6],
              '--output-dir', str(Path(request['output_dir']) / 'archive_cache'),
              '--result-json', str(result_path),
          ]
          completed = subprocess.run(command, check=False)
          if not result_path.is_file():
              result = {
                  'status': 'error',
                  'target_month': request['date'][:6],
                  'archive_path': None,
                  'resolver_exit_code': completed.returncode,
                  'error': 'resolver did not produce a result file',
              }
              result_path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Run RaceNote request
        id: task
        continue-on-error: true
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set +e
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(Path('/tmp/racenote_request.json').read_text(encoding='utf-8'))
          command = [
              'python', 'horse-racing/jrdb/src/racenote_request.py',
              '--date', request['date'],
              '--analysis', '/tmp/jrdb_analysis.sqlite',
              '--mart', '/tmp/jrdb_stats_mart.sqlite',
              '--raw-dir', request['raw_dir'],
              '--output', request['output_dir'],
              '--stats-window-years', str(request['stats_window_years']),
          ]
          if request['venue']:
              command.extend(['--venue', request['venue']])
          if request['race'] is not None:
              command.extend(['--race', str(request['race'])])

          archive_result_path = Path('/tmp/archive_resolution.json')
          if archive_result_path.is_file():
              archive_result = json.loads(archive_result_path.read_text(encoding='utf-8'))
              archive_path_value = archive_result.get('archive_path')
              if archive_result.get('status') == 'resolved' and archive_path_value:
                  archive_path = Path(archive_path_value)
                  if archive_path.is_file():
                      command.extend(['--archive', str(archive_path)])

          completed = subprocess.run(command, check=False)
          raise SystemExit(completed.returncode)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Collect request ZIP
        id: collect
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR/artifact"
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          request = json.loads(Path('/tmp/racenote_request.json').read_text(encoding='utf-8'))
          root = Path(request['output_dir'])
          artifact_dir = root / 'artifact'
          zips = sorted(root.rglob('RaceNote_*.zip'))
          if not zips:
              raise SystemExit('RaceNote ZIP not found')
          for path in zips:
              shutil.copy2(path, artifact_dir / path.name)

          safe_request = dict(request)
          safe_request.pop('raw_urls', None)
          Path(artifact_dir / 'resolved_request.json').write_text(
              json.dumps(safe_request, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          archive_result_path = Path('/tmp/archive_resolution.json')
          if archive_result_path.is_file():
              shutil.copy2(archive_result_path, artifact_dir / 'archive_resolution.json')

          manifests = sorted(root.rglob('request_manifest.json'))
          if manifests:
              manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
              shutil.copy2(manifests[0], artifact_dir / 'request_manifest.json')
              backend = manifest.get('backend_resolution', {})
              Path('/tmp/backend_resolution_summary.json').write_text(
                  json.dumps(backend, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racenote-${{ env.REQUEST_ID }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment machine-readable result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_EXIT: ${{ steps.task.outputs.exit_code }}
          COLLECT_EXIT: ${{ steps.collect.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path('/tmp/racenote_request.json').read_text(encoding='utf-8'))
          task_exit = os.environ.get('TASK_EXIT', '')
          collect_exit = os.environ.get('COLLECT_EXIT', '')
          status = 'success' if task_exit == '0' and collect_exit == '0' else 'failure'
          artifact_name = f"racenote-{request['request_id']}-{os.environ['GITHUB_RUN_ID']}"

          archive_resolution = {}
          archive_path = Path('/tmp/archive_resolution.json')
          if archive_path.is_file():
              archive_resolution = json.loads(archive_path.read_text(encoding='utf-8'))

          backend_resolution = {}
          backend_path = Path('/tmp/backend_resolution_summary.json')
          if backend_path.is_file():
              backend_resolution = json.loads(backend_path.read_text(encoding='utf-8'))

          result = {
              'request_id': request['request_id'],
              'status': status,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'artifact_name': artifact_name,
              'target_date': request['date'],
              'venue': request['venue'],
              'race': request['race'],
              'archive_resolution_status': archive_resolution.get('status'),
              'archive_tag': archive_resolution.get('tag_name'),
              'used_backend': backend_resolution.get('used_backend'),
              'task_exit_code': task_exit,
              'collect_exit_code': collect_exit,
          }
          Path('/tmp/result_comment.md').write_text(
              'RACENOTE_RESULT\n```json\n'
              + json.dumps(result, ensure_ascii=False, indent=2)
              + '\n```\n', encoding='utf-8'
          )
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result_comment.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

      - name: Fail workflow when request failed
        if: always() && (steps.task.outputs.exit_code != '0' || steps.collect.outputs.exit_code != '0')
        run: exit 1
