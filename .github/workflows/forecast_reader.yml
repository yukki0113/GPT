name: Forecast reader tests
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/forecast_reader/**'
      - 'horse-racing/jrdb/src/jrdb_raw*'
      - '.github/workflows/forecast_reader.yml'
  push:
    paths:
      - 'horse-racing/jrdb/forecast_reader/**'
      - 'horse-racing/jrdb/src/jrdb_raw*'
      - '.github/workflows/forecast_reader.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r tools/data-storage/requirements.txt
      - run: PYTHONPATH=tools/data-storage python -m pytest horse-racing/jrdb/forecast_reader/tests horse-racing/jrdb/tests/test_jrdb_raw_common.py horse-racing/jrdb/tests/test_jrdb_raw_history_batch.py tools/data-storage/tests -q
