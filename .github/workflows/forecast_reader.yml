name: Forecast reader tests
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/forecast_reader/**'\n      - 'tools/data-storage/requirements.txt'\n      - 'tools/data-storage/pyproject.toml'
      - 'horse-racing/jrdb/src/jrdb_raw*'
      - '.github/workflows/forecast_reader.yml'
  push:
    paths:
      - 'horse-racing/jrdb/forecast_reader/**'\n      - 'tools/data-storage/requirements.txt'\n      - 'tools/data-storage/pyproject.toml'
      - 'horse-racing/jrdb/src/jrdb_raw*'
      - '.github/workflows/forecast_reader.yml'
jobs:
  test:
    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest -r tools/data-storage/requirements.txt
      - run: PYTHONPATH=tools/data-storage python -m data_storage check-deps\n      - run: PYTHONPATH=tools/data-storage python -m pytest horse-racing/jrdb/forecast_reader/tests horse-racing/jrdb/tests/test_jrdb_raw_common.py horse-racing/jrdb/tests/test_jrdb_raw_history_batch.py tools/data-storage/tests -q
