name: JRDB Document Fetch via Issue
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  fetch:
    if: github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[JRDB_DOCUMENT_FETCH]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch JRDB docs
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          mkdir -p /tmp/jrdb-docs/raw /tmp/jrdb-docs/utf8
          python - <<'PY'
          import base64, hashlib, html.parser, json, os, pathlib, re, urllib.parse, urllib.request
          out=pathlib.Path('/tmp/jrdb-docs'); raw=out/'raw'; utf=out/'utf8'
          seeds=['http://www.jrdb.com/program/data.html','https://jrdb.com/program/data.html','https://jrdb.com/data_introduction/']
          known=['jrdb_code.txt','bagu_code.txt','ashimoto_code.txt','tokki_code.txt','keito_code.txt','cyokyo_course_code.txt','oi_code.txt','Kta/kta_doc.txt','Sed/sed_doc.txt','Sed/sedsiyo_doc.txt','Skb/skb_doc.txt','Skb/skbsiyo_doc.txt','Cs/Cs_doc1.txt','Cs/CKsiyo_doc1.txt','Ks/Ks_doc1.txt','Ks/CKsiyo_doc1.txt','Msa/msa_doc.txt','Kyi/kyi_doc.txt','Kyi/ky_siyo_doc.txt','Tyb/tyb_doc.txt','Hjc/hjcdata_doc.txt','Sec/secsoku_doc.txt','Se/Sesiyo_doc2a.txt']
          user=os.getenv('JRDB_USER',''); pw=os.getenv('JRDB_PASSWORD','')
          auth='Basic '+base64.b64encode(f'{user}:{pw}'.encode()).decode() if user and pw else None
          def get(url):
              h={'User-Agent':'JRDB-Document-Fetch/0.2','Accept':'*/*'}
              if auth: h['Authorization']=auth
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:
                  return r.geturl(),r.read()
          def dec(b):
              for e in ('cp932','utf-8','shift_jis'):
                  try:return b.decode(e),e
                  except UnicodeDecodeError:pass
              return b.decode('cp932','replace'),'cp932-replace'
          class P(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,t,a):
                  if t=='a':
                      for k,v in a:
                          if k=='href' and v:self.links.append(v)
          urls={'https://jrdb.com/program/'+x for x in known}; rows=[]
          for i,u in enumerate(seeds,1):
              try:
                  final,b=get(u); txt,e=dec(b); (raw/f'index_{i}.html').write_bytes(b); (utf/f'index_{i}.html.utf8.txt').write_text(txt,encoding='utf-8')
                  p=P();p.feed(txt)
                  for x in p.links:
                      z=urllib.parse.urljoin(final,x); q=urllib.parse.urlparse(z)
                      if q.netloc.lower() in ('jrdb.com','www.jrdb.com') and q.path.startswith('/program/') and q.path.lower().endswith(('.txt','.html','.htm')): urls.add(z)
                  rows.append({'url':u,'status':200,'size':len(b),'encoding':e})
              except Exception as ex: rows.append({'url':u,'status':'ERROR','error':str(ex)})
          for u in sorted(urls):
              try:
                  final,b=get(u); txt,e=dec(b); rel=urllib.parse.urlparse(final).path.split('/program/',1)[-1].lstrip('/') or 'document.txt'; rel=re.sub(r'[^A-Za-z0-9._/-]','_',rel)
                  a=raw/rel;a.parent.mkdir(parents=True,exist_ok=True);a.write_bytes(b)
                  t=utf/(rel+'.utf8.txt');t.parent.mkdir(parents=True,exist_ok=True);t.write_text(txt,encoding='utf-8')
                  rows.append({'url':u,'status':200,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'encoding':e,'raw':str(a.relative_to(out)),'utf8':str(t.relative_to(out))})
              except Exception as ex: rows.append({'url':u,'status':'ERROR','error':str(ex)})
          m={'schema_version':'JRDB-Document-Fetch-0.2','success':sum(r['status']==200 for r in rows),'failed':sum(r['status']!=200 for r in rows),'rows':rows}
          (out/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'success':m['success'],'failed':m['failed']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jrdb-document-snapshot
          path: /tmp/jrdb-docs/
          retention-days: 7
          compression-level: 0
      - name: Comment and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "JRDB_DOCUMENT_FETCH_RESULT run_id=$RUN_ID artifact=jrdb-document-snapshot"
          gh issue close "$ISSUE" --repo "${{ github.repository }}" --reason completed
