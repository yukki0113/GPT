name: JRDB PWA Pages

on:
  push:
    branches:
      - main
    paths:
      - "horse-racing/jrdb/pwa/**"
      - "horse-racing/jrdb/src/build_momotaro_newspaper_projection.py"
      - ".github/workflows/jrdb_pwa_pages.yml"
      - ".github/workflows/jrdb_pwa_publish_data.yml"
      - ".github/workflows/jrdb_pwa_fact_lite_publish.yml"
      - ".github/workflows/jrdb_momotaro_newspaper_publish_issue.yml"
      - ".github/workflows/jrdb_newspaper_skeleton_publish_issue.yml"
  workflow_run:
    workflows:
      - "JRDB Newspaper Current Publish"
      - "JRDB PWA Fact Lite Publish"
      - "JRDB Momotaro Newspaper Current Publish"
      - "JRDB Newspaper Skeleton Publish"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jrdb-pwa-pages"
  cancel-in-progress: true

env:
  DATA_RELEASE_TAG: jrdb-stats-mart-current
  FACT_RELEASE_TAG: jrdb-pwa-fact-lite-current
  NEWSPAPER_RELEASE_TAG: jrdb-newspaper-current
  NEWSPAPER_RELEASE_ARCHIVE: jrdb_newspaper_current.tar.xz
  NEWSPAPER_RELEASE_META: jrdb_newspaper_current_release.json
  MOMOTARO_PREDICTION_RELEASE_TAG: jrdb-momotaro-predictions-current
  MOMOTARO_PREDICTION_ASSET: momotaro_predictions.csv
  MOMOTARO_NEWSPAPER_RELEASE_TAG: jrdb-momotaro-newspaper-current
  MOMOTARO_NEWSPAPER_RELEASE_ARCHIVE: jrdb_momotaro_newspaper_current.tar.xz
  MOMOTARO_NEWSPAPER_RELEASE_META: jrdb_momotaro_newspaper_current_release.json

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Run PWA focused tests
        run: |
          python -m unittest discover \
            -s horse-racing/jrdb/tests \
            -p 'test_*momotaro*.py'
          python -m unittest discover \
            -s horse-racing/jrdb/tests \
            -p 'test_newspaper_compact_history_pwa.py'
          node --check horse-racing/jrdb/pwa/newspaper-v4.js
          node --check horse-racing/jrdb/pwa/service-worker.js
          node --check horse-racing/jrdb/pwa/momotaro/momotaro.js
          node --check horse-racing/jrdb/pwa/momotaro/service-worker.js

      - name: Prepare Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf .pages
          mkdir -p .pages/vendor .pages/data .pages/data/fact-lite
          cp -a horse-racing/jrdb/pwa/. .pages/

          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js \
            --output .pages/vendor/sql-wasm.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.wasm \
            --output .pages/vendor/sql-wasm.wasm

          download_release_assets() {
            local tag="$1"
            local destination="$2"
            shift 2
            local attempt
            for attempt in 1 2 3 4 5 6; do
              rm -rf "$destination"
              mkdir -p "$destination"
              if gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                "$@" \
                --dir "$destination"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "Release assets did not become available: $tag" >&2
            return 1
          }

          if gh release view "$DATA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$DATA_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "jrdb_stats_mart.sqlite" \
              --pattern "manifest.json" \
              --dir .pages/data
            echo "Current Stats Mart release added to Pages artifact."
          else
            echo "No current Stats Mart release yet."
          fi

          if gh release view "$FACT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            download_release_assets "$FACT_RELEASE_TAG" .pages/data/fact-lite \
              --pattern "jrdb_pwa_fact_lite.sqlite" \
              --pattern "manifest.json"
            python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          root = Path('.pages/data/fact-lite')
          database = root / 'jrdb_pwa_fact_lite.sqlite'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('artifact_type') != 'jrdb_pwa_fact_lite':
              raise SystemExit('invalid Fact Lite SQLite artifact type')
          if str(manifest.get('schema_version')) != '0.3':
              raise SystemExit('invalid Fact Lite SQLite schema version')
          if database.stat().st_size != int(manifest.get('size') or -1):
              raise SystemExit('Fact Lite SQLite size mismatch')
          if hashlib.sha256(database.read_bytes()).hexdigest() != str(manifest.get('sha256') or ''):
              raise SystemExit('Fact Lite SQLite SHA-256 mismatch')

          connection = sqlite3.connect(f'file:{database}?mode=ro', uri=True)
          try:
              required = {'fact_stats_entry', 'dim_sire', 'dim_bms', 'dim_jockey', 'dim_race', 'meta_pwa_fact_build'}
              present = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if missing := sorted(required - present):
                  raise SystemExit('Fact Lite SQLite missing tables: ' + ', '.join(missing))
              columns = {row[1] for row in connection.execute('PRAGMA table_info(fact_stats_entry)')}
              if missing := sorted({'month', 'race_id', 'prev_distance_delta', 'prev_class_code', 'win5_leg_no'} - columns):
                  raise SystemExit('Fact Lite SQLite missing columns: ' + ', '.join(missing))
              integrity = connection.execute('PRAGMA integrity_check').fetchone()
              if not integrity or integrity[0] != 'ok':
                  raise SystemExit(f'Fact Lite SQLite integrity failure: {integrity}')
              actual_rows = int(connection.execute('SELECT COUNT(*) FROM fact_stats_entry').fetchone()[0])
          finally:
              connection.close()
          if actual_rows != int(manifest.get('rows') or -1):
              raise SystemExit('Fact Lite SQLite row count mismatch')
          PY
            echo "Current Fact Lite release added to Pages artifact."
          else
            echo "No current Fact Lite release yet."
          fi

          if gh release view "$NEWSPAPER_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf .newspaper-release
            mkdir -p .newspaper-release

            download_release_assets "$NEWSPAPER_RELEASE_TAG" .newspaper-release \
              --pattern "$NEWSPAPER_RELEASE_ARCHIVE" \
              --pattern "$NEWSPAPER_RELEASE_META"

            python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(".newspaper-release")
          archive = root / os.environ["NEWSPAPER_RELEASE_ARCHIVE"]
          meta_path = root / os.environ["NEWSPAPER_RELEASE_META"]
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          if meta.get("schema_version") != "0.1" or meta.get("release_kind") != "jrdb_newspaper_current_cache":
              raise SystemExit("invalid Newspaper release metadata")
          if meta.get("archive_filename") != archive.name:
              raise SystemExit("Newspaper release archive filename mismatch")
          if archive.stat().st_size != int(meta.get("archive_size_bytes") or -1):
              raise SystemExit("Newspaper release archive size mismatch")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != meta.get("archive_sha256"):
              raise SystemExit("Newspaper release archive SHA-256 mismatch")

          extract = root / "current"
          extract.mkdir()

          with tarfile.open(archive, mode="r:xz") as handle:
              members = handle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe Newspaper release member: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"link member is not allowed: {member.name}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"special archive member is not allowed: {member.name}")
              handle.extractall(extract, filter="data")

          manifest_path = extract / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("Newspaper release manifest missing")
          manifest_bytes = manifest_path.read_bytes()
          if hashlib.sha256(manifest_bytes).hexdigest() != meta.get("manifest_sha256"):
              raise SystemExit("Newspaper release manifest SHA-256 mismatch")

          manifest = json.loads(manifest_bytes.decode("utf-8"))
          if manifest.get("date") != meta.get("date") or manifest.get("revision") != meta.get("revision"):
              raise SystemExit("Newspaper release date/revision mismatch")

          entries = manifest.get("races")
          if not isinstance(entries, list) or len(entries) != int(meta.get("race_count") or -1):
              raise SystemExit("Newspaper release race count mismatch")

          for entry in entries:
              relative = str(entry.get("path") or "")
              path = PurePosixPath(relative)
              if path.is_absolute() or ".." in path.parts or len(path.parts) != 2 or path.parts[0] != "races":
                  raise SystemExit(f"unsafe Newspaper race path: {relative}")
              race_path = extract / relative
              if not race_path.is_file():
                  raise SystemExit(f"Newspaper race file missing: {relative}")
              data = race_path.read_bytes()
              if hashlib.sha256(data).hexdigest() != str(entry.get("sha256") or ""):
                  raise SystemExit(f"Newspaper race SHA mismatch: {relative}")
              if len(data) != int(entry.get("size_bytes") or -1):
                  raise SystemExit(f"Newspaper race size mismatch: {relative}")
          PY

            rm -rf .pages/data/newspaper/current
            mkdir -p .pages/data/newspaper
            cp -a .newspaper-release/current .pages/data/newspaper/current

            MOMOTARO_ARGS=()
            if gh release view "$MOMOTARO_PREDICTION_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              rm -rf .momotaro-predictions
              mkdir -p .momotaro-predictions
              gh release download "$MOMOTARO_PREDICTION_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$MOMOTARO_PREDICTION_ASSET" \
                --dir .momotaro-predictions
              MOMOTARO_ARGS+=(--momotaro-csv ".momotaro-predictions/$MOMOTARO_PREDICTION_ASSET")
              echo "Current Momotaro prediction source found."
            else
              echo "No current Momotaro prediction source yet; publishing safe empty member columns."
            fi

            rm -rf .pages/momotaro/data/newspaper/current
            python horse-racing/jrdb/src/build_momotaro_newspaper_projection.py \
              --day-dir .pages/data/newspaper/current \
              --output-dir .pages/momotaro/data/newspaper/current \
              "${MOMOTARO_ARGS[@]}"

            echo "Current Newspaper release and Momotaro public projection added to Pages artifact."
          else
            echo "No current Newspaper release yet."
          fi

          if gh release view "$MOMOTARO_NEWSPAPER_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf .momotaro-release
            mkdir -p .momotaro-release

            gh release download "$MOMOTARO_NEWSPAPER_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$MOMOTARO_NEWSPAPER_RELEASE_ARCHIVE" \
              --pattern "$MOMOTARO_NEWSPAPER_RELEASE_META" \
              --dir .momotaro-release

            python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(".momotaro-release")
          archive = root / os.environ["MOMOTARO_NEWSPAPER_RELEASE_ARCHIVE"]
          meta_path = root / os.environ["MOMOTARO_NEWSPAPER_RELEASE_META"]
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          if meta.get("schema_version") != "0.1":
              raise SystemExit("invalid Momotaro release schema")
          if meta.get("release_kind") != "jrdb_momotaro_newspaper_current_cache":
              raise SystemExit("invalid Momotaro release kind")
          if meta.get("archive_filename") != archive.name:
              raise SystemExit("Momotaro release archive filename mismatch")
          if archive.stat().st_size != int(meta.get("archive_size_bytes") or -1):
              raise SystemExit("Momotaro release archive size mismatch")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != meta.get("archive_sha256"):
              raise SystemExit("Momotaro release archive SHA-256 mismatch")

          extract = root / "current"
          extract.mkdir()
          with tarfile.open(archive, mode="r:xz") as handle:
              members = handle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe Momotaro release member: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"Momotaro link member is not allowed: {member.name}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"Momotaro special archive member is not allowed: {member.name}")
              handle.extractall(extract, filter="data")

          manifest_path = extract / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("Momotaro release manifest missing")
          manifest_bytes = manifest_path.read_bytes()
          if hashlib.sha256(manifest_bytes).hexdigest() != meta.get("manifest_sha256"):
              raise SystemExit("Momotaro manifest SHA-256 mismatch")

          manifest = json.loads(manifest_bytes.decode("utf-8"))
          if manifest.get("date") != meta.get("date") or manifest.get("revision") != meta.get("revision"):
              raise SystemExit("Momotaro release date/revision mismatch")
          if (manifest.get("projection") or {}).get("kind") != "momotaro_newspaper_public":
              raise SystemExit("Momotaro projection marker missing")

          entries = manifest.get("races")
          if not isinstance(entries, list) or len(entries) != int(meta.get("race_count") or -1):
              raise SystemExit("Momotaro release race count mismatch")
          PY

            rm -rf .pages/momotaro/data/newspaper/current
            mkdir -p .pages/momotaro/data/newspaper
            cp -a .momotaro-release/current .pages/momotaro/data/newspaper/current
            echo "Independent Momotaro Newspaper release added to Pages artifact."
          else
            echo "No independent Momotaro Newspaper release yet; using fallback projection if available."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
