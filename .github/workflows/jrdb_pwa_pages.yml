name: JRDB PWA Pages

on:
  push:
    branches:
      - main
    paths:
      - "horse-racing/jrdb/pwa/**"
      - ".github/workflows/jrdb_pwa_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jrdb-pwa-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p .pages/vendor
          cp -a horse-racing/jrdb/pwa/. .pages/

          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js \
            --output .pages/vendor/sql-wasm.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.wasm \
            --output .pages/vendor/sql-wasm.wasm

          sed -i \
            's#https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js#./vendor/sql-wasm.js#g' \
            .pages/app.js
          sed -i \
            's#https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.wasm#./vendor/sql-wasm.wasm#g' \
            .pages/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
