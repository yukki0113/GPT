name: RL-T Historical Warehouse Downstream Non-Regression

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RL_T_HISTORICAL_WAREHOUSE_DOWNSTREAM]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen RL-T and Warehouse runtime
        run: |
          python -m pip install --disable-pip-version-check \
            'duckdb==1.1.3' 'pyarrow==25.0.1' 'PyYAML==6.0.3' \
            'requests==2.34.2' 'numpy==2.5.3' 'pandas==3.0.5' \
            'scipy==1.18.1' 'scikit-learn==1.9.1'
          PYTHONPATH=tools/data-storage python -m data_storage check-deps

      - name: Parse formal request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          if req.get('generation_id') != 'jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected generation_id')
          for key in ('manifest_id','audit_id'):
              if not re.fullmatch(r'[A-Za-z0-9_-]{10,}', str(req.get(key) or '')):
                  raise SystemExit(f'invalid {key}')
          builds=req.get('family_builds') or {}
          required=('BAC','KYI','CHA','CYB','SED','UKC')
          if set(builds) != set(required):
              raise SystemExit('family_builds must contain BAC/KYI/CHA/CYB/SED/UKC exactly')
          for family,spec in builds.items():
              if not re.fullmatch(r'[0-9a-f]{40}',str(spec.get('source_git_commit') or '')):
                  raise SystemExit(f'invalid source_git_commit: {family}')
              if not str(spec.get('created_at') or '').endswith('+00:00'):
                  raise SystemExit(f'invalid created_at: {family}')
              if not str(spec.get('generation_id') or '').startswith('historical-warehouse-staging-'):
                  raise SystemExit(f'invalid staging generation_id: {family}')
          root=Path('/tmp/rlt_downstream')
          (root/'report').mkdir(parents=True,exist_ok=True)
          req['years']=list(range(2010,2026))
          (root/'request.json').write_text(
              json.dumps(req,ensure_ascii=False,indent=2),
              encoding='utf-8',
          )
          PY

      - name: Download accepted final manifest and audit
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          root=Path('/tmp/rlt_downstream')
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))

          def download(file_id, path, attempts=5):
              path.parent.mkdir(parents=True,exist_ok=True)
              last=None
              for attempt in range(1,attempts+1):
                  part=path.with_suffix(path.suffix+'.part')
                  part.unlink(missing_ok=True)
                  try:
                      with requests.get(
                          'https://drive.usercontent.google.com/download',
                          params={'id':file_id,'export':'download','confirm':'t'},
                          stream=True,
                          timeout=(20,180),
                      ) as response:
                          response.raise_for_status()
                          with part.open('wb') as handle:
                              for block in response.iter_content(1024*1024):
                                  if block:
                                      handle.write(block)
                      part.replace(path)
                      return
                  except Exception as exc:
                      last=repr(exc)
                      part.unlink(missing_ok=True)
                      if attempt < attempts:
                          time.sleep(min(20,2**attempt))
              raise SystemExit(f'final evidence download failed id={file_id}: {last}')

          download(req['manifest_id'],root/'final'/'manifest.json')
          download(req['audit_id'],root/'final'/'audit.json')
          manifest=json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'final'/'audit.json').read_text(encoding='utf-8'))
          if manifest.get('generation_id') != req['generation_id'] or manifest.get('status') != 'PASS':
              raise SystemExit('accepted manifest gate failed')
          if audit.get('generation_id') != req['generation_id'] or audit.get('status') != 'PASS':
              raise SystemExit('accepted audit gate failed')
          PY

      - name: Fetch original annual JRDB Raw from upstream
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          ROOT=/tmp/rlt_downstream
          mkdir -p "$ROOT/raw"
          python horse-racing/jrdb/src/fetch_jrdb_history.py \
            --from-year 2010 --to-year 2025 \
            --kinds BAC KYI CHA CYB SED UKC \
            --output-dir "$ROOT/raw" \
            --manifest "$ROOT/report/raw_fetch_manifest.jsonl" \
            --sleep-seconds 0.5 --max-retries 4 --retry-backoff-seconds 2 \
            > "$ROOT/report/raw_fetch_stdout.log" \
            2> "$ROOT/report/raw_fetch_stderr.log"

      - name: Prepare frozen Warehouse rebuild inputs
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          root=Path('/tmp/rlt_downstream')
          for family in ('BAC','KYI','CHA','CYB','SED','UKC'):
              for year in range(2010,2026):
                  source=root/'raw'/family/f'{family}_{year}.zip'
                  if not source.is_file():
                      raise SystemExit(f'missing fetched Raw: {source}')
                  target=root/'rebuild_input'/family/str(year)/f'{family}.zip'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  try:
                      os.link(source,target)
                  except OSError:
                      shutil.copy2(source,target)
          PY

      - name: Build legacy record-hash compatibility sidecar
        run: |
          python horse-racing/jrdb/src/build_jrdb_index_base_record_hash_compat.py \
            --raw-root /tmp/rlt_downstream/raw \
            --years $(seq 2010 2025) \
            --output-root /tmp/rlt_downstream/record_hash_compat

      - name: Rebuild accepted Warehouse assets from frozen semantics
        run: |
          set -euo pipefail
          ROOT=/tmp/rlt_downstream
          mkdir -p "$ROOT/rebuild_report" "$ROOT/rebuilt"
          for FAMILY in BAC KYI CHA CYB SED UKC; do
            COMMIT="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['source_git_commit'])")"
            CREATED_AT="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['created_at'])")"
            GEN="$(python -c "import json;print(json.load(open('$ROOT/request.json'))['family_builds']['$FAMILY']['generation_id'])")"
            WORKTREE="$ROOT/source-$FAMILY"
            git worktree add --detach "$WORKTREE" "$COMMIT"
            FAMILY="$FAMILY" COMMIT="$COMMIT" CREATED_AT="$CREATED_AT" GEN="$GEN" \
            WORKTREE="$WORKTREE" ROOT="$ROOT" \
            PYTHONPATH="$WORKTREE/horse-racing/jrdb/src:$WORKTREE/tools/data-storage" \
            python - <<'PY'
          import json, os
          from pathlib import Path
          family=os.environ['FAMILY']
          root=Path(os.environ['ROOT'])
          from build_jrdb_normalized_warehouse import ArchiveSpec, build_generation
          specs=[
              ArchiveSpec(
                  family=family,
                  year=year,
                  path=root/'rebuild_input'/family/str(year)/f'{family}.zip',
              )
              for year in range(2010,2026)
          ]
          result=build_generation(
              specs,
              root/'rebuilt'/family,
              os.environ['GEN'],
              os.environ['COMMIT'],
              created_at=os.environ['CREATED_AT'],
          )
          (root/'rebuild_report'/f'{family}.json').write_text(
              json.dumps(result['manifest'],ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8',
          )
          PY
            git worktree remove --force "$WORKTREE"
          done

      - name: Verify rebuilt Warehouse is byte-identical to accepted assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/rlt_downstream')
          final=json.loads((root/'final'/'manifest.json').read_text(encoding='utf-8'))
          relation_map={
              'BAC':{'bac'}, 'KYI':{'kyi'}, 'CHA':{'cha'}, 'CYB':{'cyb'},
              'SED':{'sed'}, 'UKC':{'ukc','ukc_source_record_lineage'},
          }
          all_pass=True
          checks={}
          for family,relations in relation_map.items():
              rebuilt=json.loads((root/'rebuild_report'/f'{family}.json').read_text(encoding='utf-8'))
              expected={(a['family'],int(a['year'])):a for a in final['assets'] if a['family'] in relations}
              actual={(a['family'],int(a['year'])):a for a in rebuilt['assets'] if a['family'] in relations}
              family_pass=set(expected)==set(actual)
              details={}
              if family_pass:
                  for key in sorted(expected):
                      e=expected[key]
                      a=actual[key]
                      fields=('sha256','size_bytes','row_count','schema_hash','canonical_key','relative_path')
                      equal={field:a.get(field)==e.get(field) for field in fields}
                      details[f'{key[0]}:{key[1]}']=equal
                      if not all(equal.values()):
                          family_pass=False
              if not family_pass:
                  all_pass=False
              checks[family]={'status':'PASS' if family_pass else 'FAIL','assets':details}
          report={
              'status':'PASS' if all_pass else 'FAIL',
              'accepted_generation_id':final.get('generation_id'),
              'families':checks,
          }
          (root/'report'/'warehouse_rebuild_equivalence.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          if not all_pass:
              raise SystemExit('rebuilt Warehouse does not exactly match accepted manifest')
          PY

      - name: Run downstream non-regression gate
        id: downstream
        env:
          PYTHONPATH: tools/data-storage:horse-racing/jrdb/src
        run: |
          set +e
          python horse-racing/jrdb/src/run_rl_t_warehouse_downstream_nonregression.py \
            --raw-root /tmp/rlt_downstream/raw \
            --warehouse-manifest /tmp/rlt_downstream/final/manifest.json \
            --asset-root BAC=/tmp/rlt_downstream/rebuilt/BAC \
            --asset-root KYI=/tmp/rlt_downstream/rebuilt/KYI \
            --asset-root CHA=/tmp/rlt_downstream/rebuilt/CHA \
            --asset-root CYB=/tmp/rlt_downstream/rebuilt/CYB \
            --asset-root SED=/tmp/rlt_downstream/rebuilt/SED \
            --asset-root UKC=/tmp/rlt_downstream/rebuilt/UKC \
            --record-hash-compat-manifest /tmp/rlt_downstream/record_hash_compat/manifest.json \
            --work-root /tmp/rlt_downstream/work \
            --source-git-commit "$GITHUB_SHA" \
            --result-json /tmp/rlt_downstream/report/downstream_result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/rlt_downstream/report/downstream_result.json')
          if p.exists():
              result=json.loads(p.read_text(encoding='utf-8'))
          else:
              result={'status':'FAIL','message':'downstream result was not produced'}
          Path('/tmp/result.md').write_text(
              'RL_T_HISTORICAL_WAREHOUSE_DOWNSTREAM_RESULT\n```json\n'
              +json.dumps(result,ensure_ascii=False,indent=2)
              +'\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlt-historical-warehouse-downstream-${{ github.run_id }}
          path: |
            /tmp/rlt_downstream/report/
            /tmp/rlt_downstream/work/*stage1b*
            /tmp/rlt_downstream/work/*fingerprint*
            /tmp/rlt_downstream/work/downstream_nonregression.json
            /tmp/rlt_downstream/work/downstream_nonregression.log
            /tmp/rlt_downstream/record_hash_compat/
          if-no-files-found: warn
          retention-days: 30

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXIT_CODE: ${{ steps.downstream.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "not planned"
          fi

      - name: Fail closed
        if: always()
        env:
          EXIT_CODE: ${{ steps.downstream.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
