name: Master Duel Source Bundle (temporary local validation)
on:
  push:
    paths:
      - '.github/workflows/md-source-bundle-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: md-public-engine-source
          path: |
            master-duel/engine_m6/
            master-duel/engine_m5/
            master-duel/engine_m4/
            master-duel/engine_m3/
            master-duel/engine_m2/
            master-duel/deck_assistant/
            master-duel/owned_decks/
          if-no-files-found: warn
          retention-days: 1
