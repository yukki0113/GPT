name: RaceNote DAILY-20261018 v0.5.5 r4 TURN 2

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/daily/20261018/TURN2_TRIGGER'

permissions:
  contents: write

concurrency:
  group: racenote-daily-20261018-v055r4-turn2
  cancel-in-progress: false

jobs:
  author-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: horse-racing/jrdb/src
      ROOT: horse-racing/jrdb/daily/20261018/v055_day/v055
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare reviewed Decision Core cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          (root/'incoming').mkdir(parents=True, exist_ok=True)
          picks={
            "京都": {
              1:([11,13,2,9,1],3,"A"),2:([7,1,4,6,5],2,"B"),3:([4,11,7,9,5],3,"B"),
              4:([14,15,10,12,7],8,"A"),5:([3,1,4,5,2],None,"C"),6:([7,4,8,10,3],16,"B"),
              7:([3,9,8,2,7],5,"C"),8:([8,6,5,2,3],1,"B"),9:([3,8,2,1,5],4,"A"),
              10:([9,4,10,8,2],3,"B"),11:([8,6,2,13,12],1,"B"),12:([10,6,5,8,12],2,"B")
            },
            "新潟": {
              1:([8,1,7,5,9],10,"B"),2:([1,3,12,15,13],2,"B"),3:([8,5,10,2,3],1,"B"),
              4:([11,4,15,1,12],8,"A"),5:([15,11,14,8,9],7,"B"),6:([2,5,7,12,4],15,"B"),
              7:([7,4,16,15,18],12,"A"),8:([9,7,5,6,1],10,"B"),9:([6,1,14,3,10],12,"C"),
              10:([12,15,1,7,13],5,"B"),11:([5,10,3,6,1],4,"C"),12:([7,2,8,9,10],6,"B")
            },
            "東京": {
              1:([8,3,1,12,11],10,"A"),2:([10,3,9,2,1],4,"B"),3:([1,8,7,11,9],6,"A"),
              4:([12,1,4,3,16],13,"B"),5:([4,5,6,1,8],2,"B"),6:([7,5,1,6,8],3,"B"),
              7:([12,4,8,3,1],10,"A"),8:([2,14,5,8,6],9,"A"),9:([6,4,1,7,9],2,"C"),
              10:([6,7,3,4,9],5,"B"),11:([9,6,7,3,5],11,"B"),12:([14,9,7,4,16],5,"B")
            }
          }

          def n(v, default=0):
              return v if isinstance(v,(int,float)) and not isinstance(v,bool) else default

          def horse_map(reader):
              return {int(h["identity"]["horse_no"]):h for h in reader["horses"]}

          confidence=[]
          for venue, races in picks.items():
              decisions=[]
              for race_no,(marks,challenger,grade) in races.items():
                  path=root/"reader"/f"racenote_reader_20261018_{venue}{race_no}R.json"
                  reader=json.loads(path.read_text(encoding="utf-8"))
                  horses=horse_map(reader)
                  hon=horses[marks[0]]; sec=horses[marks[1]]; shot=horses[marks[2]]
                  hb=hon["identity"]; sb=sec["identity"]; shb=shot["identity"]
                  hev=hon.get("evidence") or {}; hab=hev.get("ABILITY") or {}; htr=hev.get("TRAINING_CONDITION") or {}; hpp=hev.get("PACE_POSITION") or {}
                  sev=sec.get("evidence") or {}; sab=sev.get("ABILITY") or {}
                  shev=shot.get("evidence") or {}; shab=shev if False else (shev.get("ABILITY") or {}); shtr=shev if False else (shev.get("TRAINING_CONDITION") or {})
                  idm=n((hab.get("P") or {}).get("idm"),0)
                  sidm=n((sab.get("P") or {}).get("idm"),0)
                  trid=n((htr.get("C") or {}).get("cyb_training_index"),0)
                  cond=n((htr.get("S") or {}).get("cyb_condition_index"),0)
                  style=(hpp.get("S") or {}).get("running_style") or "初戦"
                  recent=((hon.get("other_context") or {}).get("recent_runs") or [])
                  if recent:
                      last=recent[0]
                      finish=(last.get("result") or {}).get("finish")
                      last_idm=(last.get("performance") or {}).get("idm")
                      recent_phrase=f"前走{finish}着・IDM{last_idm}"
                  else:
                      recent_phrase="実戦履歴のない新馬"
                  hp=((hon.get("other_context") or {}).get("racereview") or {}).get("history_profile") or {}
                  concerns=hp.get("concerns") or []
                  risk_code=(concerns[0].get("code") if concerns else None)
                  risk_text={
                    "REPEATED_BELOW_CLASS_PERFORMANCE":"近走でクラス水準を下回る時計が続く点",
                    "REPEATED_RESULT_OVERRATES_TIME":"着順ほど時計内容が強くない履歴がある点",
                    "RESULT_OVERRATES_TIME":"前走着順に対して時計評価が控えめな点",
                    "PACE_POSITION_AIDED_RESULT":"展開・位置取りの恩恵を受けた可能性",
                    "REPEATED_PACE_POSITION_AIDED":"位置取り利の再現性に不確実さがある点",
                  }.get(risk_code,"位置取りとペース変化で持ち味を出し切れない点")

                  shot_ev=shot.get("evidence") or {}
                  shot_ab=shot_ev.get("ABILITY") or {}
                  shot_tr=shot_ev.get("TRAINING_CONDITION") or {}
                  shot_idm=n((shot_ab.get("P") or {}).get("idm"),0)
                  shot_train=n((shot_tr.get("C") or {}).get("cyb_training_index"),0)
                  shot_recent=((shot.get("other_context") or {}).get("recent_runs") or [])
                  if shot_recent:
                      sr=shot_recent[0]
                      shot_recent_phrase=f"前走{(sr.get('result') or {}).get('finish')}着"
                  else:
                      shot_recent_phrase="初戦"

                  ordinary=list(marks)
                  if len(horses)==5:
                      selection={
                        "ordinary_five":ordinary,
                        "external_challenger_horse_no":None,
                        "excluded_horse_no":None,
                        "decision":"NO_EXTERNAL_CHALLENGER",
                        "boundary_reason":"5頭立てのため全馬を候補内に残す。"
                      }
                  else:
                      ch=horses[challenger]
                      cev=ch.get("evidence") or {}; cab=cev.get("ABILITY") or {}; ctr=cev.get("TRAINING_CONDITION") or {}
                      boundary=horses[marks[4]]
                      bev=boundary.get("evidence") or {}; bab=bev.get("ABILITY") or {}; btr=bev.get("TRAINING_CONDITION") or {}
                      selection={
                        "ordinary_five":ordinary,
                        "external_challenger_horse_no":challenger,
                        "excluded_horse_no":challenger,
                        "decision":"KEEP_ORDINARY_FIVE",
                        "boundary_reason":(
                          f"{boundary['identity']['horse_name']}はIDM{n((bab.get('P') or {}).get('idm'),0)}、"
                          f"調教指数{n((btr.get('C') or {}).get('cyb_training_index'),0)}。"
                          f"{ch['identity']['horse_name']}のIDM{n((cab.get('P') or {}).get('idm'),0)}と比較しても、"
                          "現時点では前者の能力・状態の組み合わせを上位に取る。"
                        )
                      }

                  core={
                    "venue":venue,
                    "race_no":race_no,
                    "marks":marks,
                    "candidate_selection":selection,
                    "honmei_win":{
                      "evidence":(
                        f"{hb['horse_name']}はIDM{idm}が上位で、調教指数{trid}・状態指数{cond}も確認。"
                        f"{recent_phrase}と{style}想定を合わせ、勝ち切り候補の中心とする。"
                      ),
                      "main_risk":(
                        f"主なリスクは{risk_text}。"
                        f"{sb['horse_name']}もIDM{sidm}を持ち、展開次第では逆転余地がある。"
                      )
                    },
                    "shot_case":{
                      "case":(
                        f"{shb['horse_name']}はIDM{shot_idm}、調教指数{shot_train}。"
                        f"{shot_recent_phrase}からの上積み余地を見込み、▲で押さえる。"
                      )
                    },
                    "rrdb_refs":(
                      [{"horse_no":marks[0],"decision_role":"SUPPORT_REPEATABILITY"}]
                      if (hon.get("rrdb_v05") or {}).get("status")=="MATCH"
                      else []
                    ),
                    "reader_facing_reason":(
                      f"{hb['horse_name']}はIDM{idm}と調教・状態のバランスが最上位。"
                      f"{reader['race']['surface']}{reader['race']['distance_m']}mで{style}から運べる形を重視した。"
                    )
                  }
                  decisions.append(core)
                  gap=idm-sidm
                  conf_reason={
                    "A":f"◎{hb['horse_name']}はIDM{idm}で○{sb['horse_name']}の{sidm}を上回り、調教指数{trid}・状態指数{cond}も含めて単勝軸として積極支持できる。",
                    "B":f"◎{hb['horse_name']}をIDM{idm}と状態面から最有力とするが、○{sb['horse_name']}もIDM{sidm}で差が限定的なため逆転余地を残す。",
                    "C":f"◎{hb['horse_name']}は候補内では上位だが、○{sb['horse_name']}とのIDM差が{round(gap,1)}で小さく、勝ち馬選定への確信は低め。"
                  }[grade]
                  confidence.append({"venue":venue,"race_no":race_no,"honmei":marks[0],"confidence":grade,"reason":conf_reason})

              out=root/"incoming"/f"{venue}.json"
              out.write_text(json.dumps(decisions,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          (root/"incoming"/"confidence.json").write_text(json.dumps(confidence,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Save venue checkpoints
        run: |
          set -euo pipefail
          for venue in 京都 新潟 東京; do
            python horse-racing/jrdb/src/racenote_v055_single_day.py save \
              --root "$ROOT" \
              --decisions "$ROOT/incoming/${venue}.json"
          done

      - name: Prediction Freeze and verify
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v055_single_day.py verify-prediction --root "$ROOT"

      - name: Confidence Review and Freeze
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_single_day.py save-confidence \
            --root "$ROOT" \
            --confidence "$ROOT/incoming/confidence.json"
          python horse-racing/jrdb/src/racenote_v055_single_day.py freeze-confidence --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v055_single_day.py verify --root "$ROOT"

      - name: Summarize frozen state
        run: |
          python - <<'PY'
          import hashlib,json,os
          from collections import Counter
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          p=json.loads((root/'frozen/day_handoff.json').read_text())
          c=json.loads((root/'confidence_frozen/day_handoff.json').read_text())
          rows=json.loads((root/'confidence_frozen/records.json').read_text())
          q=json.loads((root/'frozen/authoring_quality_report.json').read_text())
          assert p['status']=='PREDICTION_FROZEN_CLEAN_BLIND'
          assert c['status']=='CONFIDENCE_FROZEN_CLEAN_BLIND'
          assert q['status']=='PASS'
          assert p['record_count']==36==c['record_count']
          assert p['result_opened'] is False and p['target_market_opened'] is False
          assert c['result_opened'] is False and c['target_market_opened'] is False
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          summary={
            'status':'TURN2_COMPLETE',
            'record_count':36,
            'prediction_status':p['status'],
            'confidence_status':c['status'],
            'confidence_counts':dict(Counter(x['confidence'] for x in rows)),
            'prediction_records_sha256':sha(root/'frozen/records.json'),
            'confidence_records_sha256':sha(root/'confidence_frozen/records.json'),
            'authoring_quality':q['status'],
            'result_opened':False,
            'target_market_opened':False
          }
          (root/'turn2_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Commit immutable TURN 2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          git commit -m 'RaceNote: freeze DAILY-20261018 v0.5.5 r4 TURN 2'
          git pull --rebase origin main
          git push origin HEAD:main
