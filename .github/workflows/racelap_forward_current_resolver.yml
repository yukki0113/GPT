name: RaceLap Forward Current Resolver

on:
  workflow_dispatch:
    inputs:
      current_run_id:
        description: "Run containing the accepted RaceLap CURRENT artifact"
        required: true
        type: string
      current_artifact_name:
        description: "Exact accepted RaceLap CURRENT artifact name"
        required: true
        type: string
      target_date:
        description: "Next forecast date YYYY-MM-DD"
        required: true
        type: string
      expected_period_to:
        description: "RaceLap expected completed-date cutoff YYYY-MM-DD"
        required: true
        type: string
      sed_run_id:
        description: "Optional run containing newly completed canonical SED artifact"
        required: false
        type: string
      sed_artifact_name:
        description: "Optional exact SED artifact name"
        required: false
        type: string
      generation_id:
        description: "Required only when stale CURRENT must advance"
        required: false
        type: string
      expected_dates:
        description: "Comma-separated completed dates; required only when advancing"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r tools/data-storage/requirements.txt

      - name: Materialize accepted CURRENT and optional completed-day SED
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ inputs.current_run_id }}
          CURRENT_ARTIFACT: ${{ inputs.current_artifact_name }}
          SED_RUN: ${{ inputs.sed_run_id }}
          SED_ARTIFACT: ${{ inputs.sed_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .racelap/input/current .racelap/input/sed .racelap/work .racelap/output
          gh run download "$CURRENT_RUN" -n "$CURRENT_ARTIFACT" -D .racelap/input/current

          current_manifest="$(find .racelap/input/current -type f -name manifest.json -print)"
          current_parquet="$(find .racelap/input/current -type f -name race_lap.parquet -print)"
          test "$(printf '%s\n' "$current_manifest" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$current_parquet" | sed '/^$/d' | wc -l)" -eq 1
          test "$(dirname "$current_manifest")" = "$(dirname "$current_parquet")"
          printf '%s' "$(dirname "$current_manifest")" > .racelap/current_bundle_path.txt

          if { test -n "$SED_RUN" && test -z "$SED_ARTIFACT"; } || { test -z "$SED_RUN" && test -n "$SED_ARTIFACT"; }; then
            echo "::error::sed_run_id and sed_artifact_name must be supplied together"
            exit 1
          fi
          if test -n "$SED_RUN"; then
            gh run download "$SED_RUN" -n "$SED_ARTIFACT" -D .racelap/input/sed
            test "$(find .racelap/input/sed -type f -name 'SED*.zip' | wc -l)" -gt 0
          fi

      - name: Resolve CURRENT
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          EXPECTED_PERIOD_TO: ${{ inputs.expected_period_to }}
          GENERATION_ID: ${{ inputs.generation_id }}
          EXPECTED_DATES: ${{ inputs.expected_dates }}
        shell: bash
        run: |
          set -euo pipefail
          current_bundle="$(cat .racelap/current_bundle_path.txt)"
          args=(
            --current-bundle "$current_bundle"
            --target-date "$TARGET_DATE"
            --expected-period-to "$EXPECTED_PERIOD_TO"
            --receipt .racelap/resolver_receipt.json
          )

          mapfile -t sed_files < <(find .racelap/input/sed -type f -name 'SED*.zip' | sort)
          if test "${#sed_files[@]}" -gt 0; then
            test -n "$GENERATION_ID" || { echo "::error::generation_id required for advance"; exit 1; }
            test -n "$EXPECTED_DATES" || { echo "::error::expected_dates required for advance"; exit 1; }
            args+=(
              --work-root .racelap/work
              --generation-id "$GENERATION_ID"
              --resolved-bundle .racelap/resolved
            )
            for file in "${sed_files[@]}"; do
              args+=(--sed "$file")
            done
            IFS=',' read -ra dates <<< "$EXPECTED_DATES"
            for date in "${dates[@]}"; do
              test -n "$date" && args+=(--expected-date "$date")
            done
          fi

          python horse-racing/jrdb/src/jrdb_race_lap_current_resolver.py "${args[@]}"

          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          receipt = json.loads(Path(".racelap/resolver_receipt.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "CURRENT_READY":
              raise SystemExit("RaceLap resolver did not return CURRENT_READY")
          bundle = Path(receipt["bundle"])
          out = Path(".racelap/output")
          for name in ("race_lap.parquet", "manifest.json"):
              shutil.copy2(bundle / name, out / name)
          audit = bundle / "audit.json"
          if audit.is_file():
              shutil.copy2(audit, out / "audit.json")
          shutil.copy2(".racelap/resolver_receipt.json", out / "resolver_receipt.json")
          PY

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: racelap-forward-current-resolved-${{ github.run_id }}
          path: .racelap/output/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Report resolved CURRENT
        run: |
          cat .racelap/resolver_receipt.json
          echo "Resolved CURRENT artifact id: ${{ steps.upload.outputs.artifact-id }}"
