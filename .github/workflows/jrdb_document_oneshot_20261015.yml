name: JRDB One-Time Documentation Collection
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  collect:
    if: github.event.issue.title == '[JRDB_DOC_FETCH_ONESHOT] 20261015' && github.event.issue.user.login == 'yukki0113'
    runs-on: ubuntu-latest
    steps:
      - name: Download official linked documentation
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request, urllib.parse, urllib.error
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          output=Path('/tmp/jrdb_document'); output.mkdir(parents=True,exist_ok=True)
          seeds=['https://jrdb.com/data_introduction/','https://www.jrdb.com/program/data.html','http://www.jrdb.com/program/data.html']
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      d=dict(attrs)
                      if d.get('href'): self.hrefs.append(d['href'])
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 JRDB-document-archive-once','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read(8*1024*1024+1)
                  if len(data)>8*1024*1024: raise ValueError('file too large')
                  return data,r.headers.get('Content-Type','')
          entries=[]; links=set(); errors=[]
          for seed in seeds:
              try:
                  data,ctype=fetch(seed)
                  p=output/('source_'+str(len(entries)+1)+'.html')
                  p.write_bytes(data)
                  entries.append(dict(url=seed,file=p.name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),content_type=ctype))
                  parser=Links(); parser.feed(data.decode('cp932',errors='replace'))
                  links.update(urllib.parse.urljoin(seed,h) for h in parser.hrefs)
                  parser=Links(); parser.feed(data.decode('utf-8',errors='replace'))
                  links.update(urllib.parse.urljoin(seed,h) for h in parser.hrefs)
              except Exception as exc: errors.append(dict(url=seed,error=str(exc)[:250]))
          relevant=[]
          for url in sorted(links):
              u=urllib.parse.urlparse(url)
              if u.scheme not in ('https','http') or (u.hostname or '').lower() not in ('jrdb.com','www.jrdb.com'): continue
              if not (u.path.startswith('/program/') or u.path.startswith('/data/') or re.search(r'\.(txt|pdf|doc|docx|xls|xlsx|zip|lzh|htm|html)$',u.path,re.I)): continue
              if u.path.lower().endswith(('.jpg','.jpeg','.png','.gif','.svg')): continue
              relevant.append(url)
          # Avoid following unrelated pages or downloading the member data archives.
          relevant=relevant[:160]
          for i,url in enumerate(relevant,1):
              try:
                  data,ctype=fetch(url)
                  path=urllib.parse.urlparse(url).path
                  suffix=Path(path).suffix.lower()
                  if suffix not in ('.txt','.pdf','.doc','.docx','.xls','.xlsx','.zip','.lzh','.htm','.html'): suffix='.bin'
                  stem=re.sub(r'[^a-zA-Z0-9_-]+','_',Path(path).stem)[:65] or 'document'
                  name=f'{i:03d}_{stem}{suffix}'
                  (output/name).write_bytes(data)
                  entries.append(dict(url=url,file=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),content_type=ctype))
              except Exception as exc: errors.append(dict(url=url,error=str(exc)[:250]))
          (output/'manifest.json').write_text(json.dumps(dict(sources=seeds,discovered_links=len(links),candidate_links=len(relevant),downloaded=len(entries),entries=entries,errors=errors),ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(dict(discovered_links=len(links),candidate_links=len(relevant),downloaded=len(entries),errors=len(errors))))
          if len(entries)<5: raise SystemExit('Too few documents fetched')
          PY
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-specifications-oneshot-20261015
          path: /tmp/jrdb_document/
          if-no-files-found: error
          retention-days: 7
