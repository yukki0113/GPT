name: RaceNote BTDAY-0111 v055r2 T2 finalize
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0111.v055r2-t2-finalize'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify clean-blind session
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('horse-racing/jrdb/backtests/BTDAY-0111/20250726/v055/session.json')
          s=json.loads(p.read_text())
          assert s['status']=='SESSION_SEALED'
          assert s['contract_revision']=='v055-win-confidence-lean-reader-r2'
          assert s['reader_projection']=='v055-lean-model-reader-r2'
          assert s['result_opened'] is False
          assert s['target_market_opened'] is False
          PY
      - name: Save three venues
        run: |
          ROOT=horse-racing/jrdb/backtests/BTDAY-0111/20250726/v055
          python horse-racing/jrdb/src/racenote_v055_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/中京.json"
          python horse-racing/jrdb/src/racenote_v055_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/新潟.json"
          python horse-racing/jrdb/src/racenote_v055_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/札幌.json"
      - name: Freeze and verify
        run: |
          ROOT=horse-racing/jrdb/backtests/BTDAY-0111/20250726/v055
          python horse-racing/jrdb/src/racenote_v055_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v055_single_day.py verify --root "$ROOT"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0111/20250726/v055')
          h=json.loads((root/'frozen/day_handoff.json').read_text())
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          assert h['record_count']==36
          assert h['confidence_frozen'] is True
          assert h['confidence_meaning']=='HONMEI_WIN_CONFIDENCE'
          assert h['reader_projection']=='v055-lean-model-reader-r2'
          assert h['result_opened'] is False
          assert h['target_market_opened'] is False
          print(json.dumps(h, ensure_ascii=False))
          PY
      - name: Commit immutable T2 outputs
        run: |
          ROOT=horse-racing/jrdb/backtests/BTDAY-0111/20250726/v055
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$ROOT/authored_decisions" "$ROOT/frozen" "$ROOT/authoring_quality_report.json"
          git rm -f "$ROOT/incoming/中京.json" "$ROOT/incoming/新潟.json" "$ROOT/incoming/札幌.json" "$ROOT/incoming/.t2_write_probe" || true
          git commit -m "RaceNote: freeze BTDAY-0111 v055r2 T2"
          git push origin HEAD:main
