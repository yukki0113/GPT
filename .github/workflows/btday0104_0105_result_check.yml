name: BTDAY-0104-0105 result check

on:
  pull_request:
    paths:
      - '.github/workflows/btday0104_0105_result_check.yml'

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install jsonschema pandas numpy pyarrow duckdb
      - name: Extract frozen forecasts
        run: |
          set -euo pipefail
          git fetch origin run/btday0104-v054-t1 run/btday0105-v054-t1
          mkdir -p /tmp/settle/0104 /tmp/settle/0105
          git show origin/run/btday0104-v054-t1:horse-racing/jrdb/backtests/BTDAY-0104/20251207/v054/frozen/records.json > /tmp/settle/0104/records.json
          git show origin/run/btday0105-v054-t1:horse-racing/jrdb/backtests/BTDAY-0105/20251228/v054/frozen/records.json > /tmp/settle/0105/records.json
      - name: Fetch JRDB result sources
        run: |
          set -euo pipefail
          for D in 20251207 20251228; do
            mkdir -p "/tmp/settle/raw/$D"
            python horse-racing/jrdb/src/fetch_jrdb_history.py --date "$D" --kinds SED HJC --output-dir "/tmp/settle/raw/$D/src"
          done
      - name: Build canonical results and settle
        run: |
          set -euo pipefail
          for SPEC in "0104 20251207" "0105 20251228"; do
            set -- $SPEC
            ID="$1"; D="$2"; ISO="${D:0:4}-${D:4:2}-${D:6:2}"
            SED="/tmp/settle/raw/$D/src/SED/SED${D:2}.zip"
            HJC="/tmp/settle/raw/$D/src/HJC/HJC${D:2}.zip"
            python horse-racing/jrdb/src/racenote_daily_result_from_jrdb.py \
              --date "$ISO" --sed "$SED" --hjc "$HJC" \
              --output "/tmp/settle/$ID/result.json" --pretty
            python horse-racing/jrdb/src/racenote_daily_settlement.py \
              --forecast "/tmp/settle/$ID/records.json" \
              --results "/tmp/settle/$ID/result.json" \
              --output-json "/tmp/settle/$ID/settlement.json" \
              --output-md "/tmp/settle/$ID/settlement.md" \
              --top 20
            echo "===== BTDAY-$ID ====="
            cat "/tmp/settle/$ID/settlement.md"
          done
