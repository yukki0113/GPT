name: jra-results-smoke-20260822-23

on:
  push:
    paths:
      - 'horse-racing/eval/.gpt/actions_smoke_20260822_23.trigger'

permissions:
  contents: read
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: horse-racing/eval/output_20260822-20260823
      RANGE_LABEL: 20260822-20260823
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r horse-racing/eval/requirements.txt

      - name: Fetch JRA results
        id: fetch
        continue-on-error: true
        run: |
          set +e
          python horse-racing/eval/src/fetch_jra_daily_results.py \
            --from 2026-08-22 --to 2026-08-23 \
            --output-dir "$OUTPUT_DIR" --interval 0.7
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Validate output CSV
        id: validate
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          csv_path=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*_JRA結果払戻.csv' -print -quit)
          if [ -z "$csv_path" ]; then
            echo 'CSV output not found.' > "$OUTPUT_DIR/validation_error.txt"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          python horse-racing/eval/src/validate_jra_results.py "$csv_path" --report "$OUTPUT_DIR/validation_report.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Write run status
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIR"
          {
            echo "fetch_exit_code=${{ steps.fetch.outputs.exit_code }}"
            echo "validation_exit_code=${{ steps.validate.outputs.exit_code }}"
          } > "$OUTPUT_DIR/run_status.txt"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-results-smoke-${{ env.RANGE_LABEL }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish smoke result issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_EXIT: ${{ steps.fetch.outputs.exit_code }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit_code }}
        run: |
          body_file=$(mktemp)
          {
            echo "run_id=${{ github.run_id }}"
            echo "fetch_exit_code=${FETCH_EXIT}"
            echo "validation_exit_code=${VALIDATE_EXIT}"
            echo
            echo 'validation_report:'
            if [ -f "$OUTPUT_DIR/validation_report.json" ]; then
              cat "$OUTPUT_DIR/validation_report.json"
            elif [ -f "$OUTPUT_DIR/validation_error.txt" ]; then
              cat "$OUTPUT_DIR/validation_error.txt"
            else
              echo 'not available'
            fi
          } > "$body_file"
          gh issue create --repo "${{ github.repository }}" \
            --title "[SMOKE] JRA results 20260822-20260823 run ${{ github.run_id }}" \
            --body-file "$body_file"

      - name: Fail workflow when fetch or validation failed
        if: always() && (steps.fetch.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0')
        run: exit 1
