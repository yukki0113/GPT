name: Archive BTDAY-0010 Frozen Forecast

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0010_FORECAST]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download frozen DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/p
          gh run download 36793101868 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0010-DAY-PREP --dir /tmp/a
          unzip -q /tmp/a/BTDAY-0010_DAY_PREP_20260329_FINAL.zip -d /tmp/p

      - name: Build and Freeze 0.3.5 forecasts
        run: |
          python - <<'PY'
          import json,glob,hashlib,html,shutil
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/tmp/p')
          out=Path('horse-racing/jrdb/backtests/BTDAY-0010/20260329')
          main_sha='803cd8b930d8f217c7378b1f7f01a00443af62e2'
          date='2026-03-29'; compact='20260329'; logic='RaceNote-Human-Context-Reader-0.3.5-candidate'
          picks={
          ('中京',1):(12,6,16,[13,8],True),('中京',2):(10,13,8,[14,3],True),('中京',3):(7,2,8,[12,11],True),
          ('中京',4):(6,11,16,[12,2],False),('中京',5):(15,12,7,[9,14],True),('中京',6):(4,10,5,[1,8],True),
          ('中京',7):(3,2,5,[4,13],True),('中京',8):(2,3,7,[5,1],True),('中京',9):(13,6,5,[16,10],False),
          ('中京',10):(8,4,13,[14,15],True),('中京',11):(13,9,18,[1,10],True),('中京',12):(11,2,1,[6,14],True),
          ('中山',1):(1,8,5,[3,7],True),('中山',2):(4,15,9,[16,1],True),('中山',3):(14,5,1,[8,2],True),
          ('中山',4):(12,2,5,[8,15],True),('中山',5):(13,11,10,[2,1],True),('中山',6):(2,7,11,[10,4],True),
          ('中山',7):(9,12,5,[2,11],True),('中山',8):(5,3,16,[15,4],True),('中山',9):(5,2,4,[6,3],True),
          ('中山',10):(6,15,13,[10,2],True),('中山',11):(14,15,4,[6,11],True),('中山',12):(7,6,10,[9,5],False),
          ('阪神',1):(3,2,13,[10,1],True),('阪神',2):(3,6,1,[8,4],True),('阪神',3):(3,11,2,[4,9],True),
          ('阪神',4):(8,6,14,[1,9],True),('阪神',5):(7,5,11,[1,2],True),('阪神',6):(10,1,7,[8,4],False),
          ('阪神',7):(9,2,3,[10,7],True),('阪神',8):(5,6,3,[2,7],True),('阪神',9):(1,11,2,[15,9],True),
          ('阪神',10):(11,2,8,[10,1],True),('阪神',11):(6,5,9,[8,3],True),('阪神',12):(5,8,15,[4,10],True)}
          def href(h,rank=None):
            d={'horse_no':h['basic']['horse_no'],'horse_name':h['basic']['horse_name']}
            if rank is not None:d['rank']=rank
            return d
          def rr(h):return h.get('racereview') or {}
          def lr(h):return rr(h).get('latest_prior_run') or {}
          def tags(h):return lr(h).get('review_tags') or []
          def nw(h):return (rr(h).get('next_watch') or {}).get('grade')
          def recent(h):
            f=[z.get('result',{}).get('finish') for z in h.get('recent_runs',[])[:3]]
            f=[x for x in f if x is not None]
            return '・'.join(map(str,f))+'着' if f else '実戦履歴が薄い'
          def summary(h,r):
            a=h.get('ability',{}); t=h.get('training',{}).get('summary',{}); hp=h.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; sv=hp.get('same_venue') or {}; b=[]
            if a.get('idm') is not None:b.append(f"今回IDM {a['idm']}")
            if h.get('recent_runs'):b.append(f"近3走着順 {recent(h)}")
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if t.get('training_arrow'):b.append(f"調教{t.get('training_arrow')}")
            if nw(h):b.append(f"Next-Watch {nw(h)}")
            if 'FASTEST_LAST3F' in tags(h):b.append('前走上がり最速')
            if 'TIME_ABOVE_DECLARED_CLASS' in tags(h):b.append('前走時計はクラス水準以上')
            return '、'.join(b[:5])+'。'
          def counter(h):
            hp=h.get('historical_profile') or {};sd=hp.get('same_distance') or {};sv=hp.get('same_venue') or {};b=[]
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if h.get('recent_runs'):b.append(f"近3走は{recent(h)}")
            return '、'.join(b[:3])+'。'
          def winpath(m,s,r):
            mn=m['basic']['horse_name']; a=m.get('ability',{}); t=m.get('training',{}).get('summary',{}); hp=m.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; b=[]
            if a.get('idm') is not None:b.append(f"今回IDM {a['idm']}")
            if m.get('recent_runs'):b.append(f"近3走 {recent(m)}")
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走・3着内{sd.get('top3',0)}回")
            if t.get('training_arrow') in ('上昇','デキ抜群'):b.append(f"調教{t.get('training_arrow')}")
            if nw(m):b.append(f"Next-Watch {nw(m)}")
            return f"{mn}は"+'、'.join(b[:5])+"を総合し、DAY PREP内のレース材料だけなら最も1着に近いと判断する。"
          def caseagainst(h,r):
            sd=((h.get('historical_profile') or {}).get('same_distance') or {})
            st=h.get('ability',{}).get('running_style')
            if not h.get('recent_runs'):return '実戦経験がなく、ペースや馬群への対応は走ってみないと分からない。'
            if sd.get('starts',0)==0:return f"今回の{r['distance_m']}mは直接の同距離実績がなく、距離適応に不確実性が残る。"
            if st=='追込':return '追込脚質のため、前残りや仕掛け遅れになると能力を出し切れないリスクがある。'
            if st=='逃げ':return '逃げ脚質で、同型との競り合いが長引くと終いの余力を失うリスクがある。'
            return '上位候補との能力差が小さく、展開・位置取りが噛み合わない場合は取りこぼし余地がある。'
          def rrrefs(hs,mn,sn):
            z=[]
            for h in hs:
              if rr(h).get('history_status')!='AVAILABLE':continue
              no=h['basic']['horse_no'];role='CONTEXT_ONLY'
              if no==mn:role='UPGRADE_RECENT_FORM'
              elif no==sn:role='SUPPORT_REPEATABILITY'
              elif nw(h) in ('S','A'):role='SUPPORT_COUNTERARGUMENT'
              z.append({'horse_no':no,'horse_name':h['basic']['horse_name'],'source_run_ref':lr(h).get('race_key'),'next_watch_grade':nw(h),'matched_rule_ids':(rr(h).get('next_watch') or {}).get('matched_rule_ids') or [],'decision_role':role,'review_tags':tags(h)[:8]})
            return z
          def ph(r):
            v={'identity':r['identity'],'prediction':r['prediction'],'decision_trace':r['decision_trace']}
            return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          created=datetime.now(timezone.utc).isoformat(timespec='seconds');by={'中京':[],'中山':[],'阪神':[]}
          for p in glob.glob('/tmp/p/reader/*.json'):
            x=json.load(open(p));r=x['race'];key=(r['venue'],int(r['race_no']))
            if key not in picks:continue
            hm={h['basic']['horse_no']:h for h in x['horses']};mn,sn,tn,ons,conv=picks[key]
            m,s,t=hm[mn],hm[sn],hm[tn];oo=[hm[n] for n in ons];cand=[m,s,t]+oo
            M=m['basic']['horse_name'];S=s['basic']['horse_name'];T=t['basic']['horse_name']
            mreason=winpath(m,s,r)
            sreason=(f"{M}自身が勝ち判断と安定判断の双方で最上位。" if conv else f"{S}は{counter(s)}地力・実績の再現性ではこちらを基準に置く。")
            strong=f"{S}が{counter(s)}安定材料をそのまま出せると◎の最有力判断を脅かす。"
            rev=f"{S}が再現性の高い形を出し、{M}が今回評価した能力・状態・適性を十分に発揮できない場合は逆転する。"
            trace={'human_principles_used':['H1','H4','H7'],'race_model':f"{r['venue']}{r['surface']}{r['distance_m']}m・{r.get('class') or ''}。{M}の勝ち切る材料と{S}の安定材料を分け、位置取り・近況・条件再現性をレース内で比較する。",'primary_question':f"市場情報を想像せず、DAY PREPで供給されたレース材料だけなら誰を最も1着に近いと判断するか。",'candidate_cases':[{'horse':href(h),'case_for':summary(h,r),'case_against':caseagainst(h,r),'context_hook':f"{r['venue']}{r['surface']}{r['distance_m']}mで、能力・適性・近況・RaceReviewをレース文脈に戻して比較。"} for h in cand],'attraction_choice':{'horse':href(m),'reason':mreason},'stability_choice':{'horse':href(m if conv else s),'reason':sreason},'attraction_stability_convergence':conv,'winning_path':winpath(m,s,r),'main_vs_second':{'preferred':href(m),'other':href(s),'reason':f"◎{M}: {mreason} ○{S}: {counter(s)}"},'main_vs_third':{'preferred':href(m),'other':href(t),'reason':f"◎{M}は{T}より今回の勝ち筋を具体的に描ける材料が多く、▲{T}は相手候補まで。"},'why_not_numeric_leader':'IDM・調教・Trend・RaceReview等を固定配点で合算せず、DAY PREPの供給材料から勝つ可能性と再現性を別々に判断した。','strongest_counter':strong,'reversal_condition':rev,'missing_evidence':['current odds / current popularity are outside the Forecast Reader input boundary'],'rrdb_evidence':{'available':True,'reviewed':True,'used_in_decision':True,'horse_refs':rrrefs(cand,mn,sn),'reason_not_used':None}}
            rec={'schema_version':'RaceNote-Forecast-Research-Record-0.3.1','identity':{'target_date':date,'venue':r['venue'],'race_no':r['race_no'],'race_key':f"{date}-{r['venue']}-{r['race_no']}",'race_name':r.get('race_name'),'surface':r.get('surface'),'distance_m':r.get('distance_m'),'class':r.get('class')},'research':{'evaluation_mode':'BLINDED_HISTORICAL','turn_id':'BTDAY-0010-TURN2-FULLDAY','logic_version':logic,'base_logic_version':'RaceNote-Human-Context-Reader-0.3.4-candidate','candidate_patch':'win-first market-blind main selection refinement'},'source':{'racenote_identity':f"BTDAY-0010/{compact}/{r['venue']}/{r['race_no']}R",'racenote_semantic_sha256':x['source_semantic_sha256'],'day_prep_package':'BTDAY-0010_DAY_PREP_20260329_FINAL.zip','main_sha_at_forecast':main_sha},'prediction':{'axis':href(m,1),'marks':{'main':href(m,1),'second':href(s,2),'third':href(t,3),'others':[href(h,4+i) for i,h in enumerate(oo)]},'axis_comment':mreason,'reader_facing_reason':mreason,'stability_counter_reason':sreason,'concern':strong,'full_field_order':None},'decision_trace':trace,'audit':{'created_at':created,'frozen_at':created,'prediction_hash':'','pre_result_guard':'PASS','result_visible_at_freeze':False,'candidate_role_separation':'CONVERGE' if conv else 'DIVERGE','winning_path_guard':'NOT_REQUIRED_v0.3.5','independent_selection_guard':'PASS','converge_counter_self_reference_guard':'PASS'}}
            rec['audit']['prediction_hash']=ph(rec);by[r['venue']].append(rec)
          for v,rows in by.items():
            rows.sort(key=lambda x:x['identity']['race_no']);assert len(rows)==12
            slug={'中京':'chukyo','中山':'nakayama','阪神':'hanshin'}[v];d=out/'venues'/slug;d.mkdir(parents=True,exist_ok=True)
            (d/f'forecast_{compact}_{v}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
            (d/f'forecast_{compact}_{v}.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in rows))
            cv=[q['identity']['race_no'] for q in rows if q['decision_trace']['attraction_stability_convergence']]
            aud={'validator_version':'racenote-human-context-0.3.5-candidate-equivalent','candidate_patch':'win-first market-blind main selection refinement','status':'PASS','venue':v,'target_date':date,'record_count':12,'frozen_count':12,'error_count':0,'prediction_hash_unique_count':12,'converge_races':cv,'winning_path_guard':'NOT_REQUIRED_v0.3.5','independent_selection_guard':'PASS','converge_semantic_guard':'PASS','result_opened':False}
            (d/f'forecast_{compact}_{v}_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
            hand={'schema_version':'RaceNote-Venue-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0010','target_date':date,'venue':v,'logic_version':logic,'main_sha':main_sha,'race_count':12,'frozen_count':12,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in rows]}
            (d/f'forecast_{compact}_{v}_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          allrows=by['中京']+by['中山']+by['阪神'];dm=out/'day_merge';dm.mkdir(parents=True,exist_ok=True)
          (dm/f'forecast_{compact}_all.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2)+'\n')
          (dm/f'forecast_{compact}_all.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in allrows))
          trs=[]
          for q in allrows:
            m=q['prediction']['marks'];i=q['identity'];other='、'.join(f"△{z['horse_no']} {html.escape(z['horse_name'])}" for z in m['others'])
            trs.append(f"<tr><td>{i['venue']}{i['race_no']}R</td><td>◎{m['main']['horse_no']} {html.escape(m['main']['horse_name'])}</td><td>○{m['second']['horse_no']} {html.escape(m['second']['horse_name'])}</td><td>▲{m['third']['horse_no']} {html.escape(m['third']['horse_name'])}</td><td>{other}</td><td>{html.escape(q['prediction']['reader_facing_reason'])}</td></tr>")
          doc='<!doctype html><html lang="ja"><meta charset="utf-8"><title>RaceNote Forecast 2026-03-29</title><h1>RaceNote Forecast 2026-03-29</h1><p>BTDAY-0010 / 0.3.5-candidate / result_opened=false</p><table border="1"><tr><th>Race</th><th>◎</th><th>○</th><th>▲</th><th>△</th><th>理由</th></tr>'+''.join(trs)+'</table></html>'
          (dm/f'forecast_{compact}_all.html').write_text(doc)
          aud={'schema_version':'RaceNote-Day-Merge-Audit-0.1-draft','selection_id':'BTDAY-0010','target_date':date,'logic_version':logic,'status':'PASS','venue_count':3,'record_count':36,'frozen_count':36,'technical_skips':0,'prediction_hash_unique_count':36,'winning_path_guard':'NOT_REQUIRED_v0.3.5','independent_selection_guard':'PASS','result_opened':False,'venues':{'中京':'PASS','中山':'PASS','阪神':'PASS'}}
          (dm/f'forecast_{compact}_all_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
          hand={'schema_version':'RaceNote-Day-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0010','target_date':date,'logic_version':logic,'main_sha_at_forecast':main_sha,'day_prep_artifact':'BTDAY-0010-DAY-PREP','day_prep_artifact_digest':'sha256:0d0c427d78d7fd77b5f20c874dc25516d7ce66c643114349690bf0ee1af62e5d','venues':['中京','中山','阪神'],'race_count':36,'frozen_count':36,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in allrows]}
          (dm/f'forecast_{compact}_all_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          dp=out/'day_prep';dp.mkdir(parents=True,exist_ok=True)
          for n in ['day_prep_handoff.json','manifest.json','validation_report.json','selected_pool_state.json']:shutil.copy2(root/n,dp/n)
          (out/'README.md').write_text(f"# BTDAY-0010 — {date}\n\n- Forecast logic: `{logic}`\n- DAY PREP: PASS / result_opened=false\n- Venues: 中京, 中山, 阪神\n- Forecast races: 36 / 36\n- Venue Freeze: PASS x3\n- DAY MERGE: PASS\n- Result opened at Freeze: false\n")
          idx={'selection_id':'BTDAY-0010','target_date':date,'logic_version':logic,'status':'FROZEN','result_opened':False,'day_prep_source':{'artifact_name':'BTDAY-0010-DAY-PREP','run_id':36793101868,'digest':'sha256:0d0c427d78d7fd77b5f20c874dc25516d7ce66c643114349690bf0ee1af62e5d'},'forecast':{'race_count':36,'venue_count':3,'technical_skips':0}}
          (out/'ARTIFACT_INDEX.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          assert len(allrows)==36 and len({q['audit']['prediction_hash'] for q in allrows})==36
          assert all(q['audit']['result_visible_at_freeze'] is False for q in allrows)
          print('PASS: 36 frozen records')
          PY

      - name: Commit canonical Frozen archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0010/20260329
          git commit -m "RaceNote: archive BTDAY-0010 frozen forecast"
          git push origin HEAD:main

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'BTDAY-0010 FORECAST ARCHIVE\nstatus=%s\ncommit=%s\nresult_opened=false\n' "${{ job.status }}" "$sha" > /tmp/c
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/c
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
