name: Archive BTDAY-0005 temp

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0005]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download archive
        run: |
          python -m pip install gdown
          gdown 'https://drive.google.com/uc?id=14SKyO9w2-ij9TMhduZ-IC8dl5m6pAAGE' -O /tmp/btday0005.zip
          unzip -q /tmp/btday0005.zip -d /tmp/archive
          test -f /tmp/archive/horse-racing/jrdb/backtests/BTDAY-0005/20260628/day_merge/forecast_20260628_all.json

      - name: Commit artifacts
        run: |
          set -euxo pipefail
          cp -a /tmp/archive/horse-racing/jrdb/backtests/BTDAY-0005 horse-racing/jrdb/backtests/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horse-racing/jrdb/backtests/BTDAY-0005
          git commit -m "RaceNote: archive BTDAY-0005 0.3.3 candidate blind test"
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "BTDAY-0005 archive committed to main."
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
