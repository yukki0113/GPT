name: RaceNote BTDAY-0094 v0.5.3 r2 TURN 1
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0094/R2_PREPARE_TRIGGER'
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown pytest
      - name: Run Warehouse reader focused regression
        run: python -m pytest -q horse-racing/jrdb/tests/test_jrdb_racenote_warehouse_reader_bulk.py
      - name: Materialize Historical inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/historical
          for attempt in 1 2 3; do
            if python tools/gpt_io/public_drive/fetch.py --manifest horse-racing/jrdb/config/public_drive/racenote_btday0080_historical_20261013.json --output-root /tmp/historical --receipt /tmp/historical/public_drive_fetch_receipt.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
          mkdir -p /tmp/historical/analysis /tmp/historical/rrdb
          tar -xJf /tmp/historical/analysis.tar.xz -C /tmp/historical/analysis
          unzip -q /tmp/historical/rrdb.zip -d /tmp/historical/rrdb
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11799761734/zip > /tmp/historical/course-fit.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/historical/course-fit.zip')
          assert p.stat().st_size == 170365515
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h == '18570ef9c366f78b2f8bb60c380e24b70f1b80e070ddf1961acaed7bde35627d'
          PY
          mkdir -p /tmp/historical/course-fit
          unzip -q /tmp/historical/course-fit.zip -d /tmp/historical/course-fit
      - name: Diagnose BAC snapshots for target day
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          import duckdb
          from jrdb_racenote_warehouse_reader import WarehouseRaceNoteReader
          from jrdb_racenote_warehouse_adapter import source_order
          root=Path('/tmp/historical/warehouse')
          reader=WarehouseRaceNoteReader(root/'current.json', asset_roots={k:root for k in ('BAC','KYI','CHA','CYB','ZED','ZKB')})
          con=duckdb.connect(':memory:')
          day=dt.date(2025,12,14)
          all_bac=reader._rows_on(con,'bac',[2025])
          bac=[r for r in all_bac if str(r.get('race_date'))==day.isoformat()]
          kyi=reader._rows_on(con,'kyi',[2025])
          counts={}
          for r in kyi:
              key=str(r.get('race_key_raw'))
              counts[key]=counts.get(key,0)+1
          for r in sorted(bac,key=lambda x:(str(x.get('race_key_raw')),source_order(x))):
              key=str(r.get('race_key_raw'))
              print('BAC_DIAG',key,r.get('source_member'),r.get('source_member_date'),r.get('source_record_ordinal'),r.get('field_size'),'KYI',counts.get(key))
          prefixes=sorted({str(r.get('race_key_raw'))[:-2] for r in bac if len(str(r.get('race_key_raw')))==8})
          assert prefixes == ['062554','072554','092554'], prefixes
          race_keys=[f'{prefix}{race_no:02d}' for prefix in prefixes for race_no in range(1,13)]
          bac_keys={str(r.get('race_key_raw')) for r in all_bac}
          kyi_keys={str(r.get('race_key_raw')) for r in kyi}
          missing_bac=sorted(set(race_keys)-bac_keys)
          missing_kyi=sorted(set(race_keys)-kyi_keys)
          assert not missing_bac, missing_bac
          assert not missing_kyi, missing_kyi
          assert len(race_keys)==36
          Path('/tmp/historical/btday0094_race_keys.txt').write_text(
              '\n'.join(race_keys)+'\n', encoding='utf-8'
          )
          print('BTDAY0094_RACE_KEYS',len(race_keys),prefixes)
          PY
      - name: Build and validate TURN 1
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0094/20251214'
          rm -rf "$TARGET"
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v053_from_historical_warehouse.py             --date 2025-12-14             --selection-id BTDAY-0094             --main-sha "$MAIN_SHA"             --equivalence-report horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json             --warehouse-current /tmp/historical/warehouse/current.json             --warehouse-asset-root /tmp/historical/warehouse             --analysis-root /tmp/historical/analysis             --racereview-root /tmp/historical/rrdb/postrace_review/v0_1             --course-fit-root /tmp/historical/course-fit             --race-keys-file /tmp/historical/btday0094_race_keys.txt             --target-bac /tmp/historical/raw/BAC/BAC_2025.zip             --binding horse-racing/jrdb/config/racenote_reader_v050_binding.json             --policy horse-racing/jrdb/docs/racenote/research-work/results/stage_c/reader_feature_policy_v0_5_candidate.json             --output-root "$TARGET"
          ROOT="$TARGET/day_prep/RaceNote_20251214"
          cp "$ROOT/manifest.json" "$TARGET/day_prep/manifest.json"
          cp "$ROOT/validation_report.json" "$TARGET/day_prep/validation_report.json"
          mkdir -p "$TARGET/source_audit"
          cp /tmp/historical/public_drive_fetch_receipt.json "$TARGET/source_audit/public_drive_fetch_receipt.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0094/20251214')
          m=json.loads((root/'day_prep/manifest.json').read_text())
          v=json.loads((root/'day_prep/validation_report.json').read_text())
          p=json.loads((root/'forecast_prep/day_prep_handoff.json').read_text())
          o=json.loads((root/'operation_handoff.json').read_text())
          s=json.loads((root/'v053/session.json').read_text())
          rm=json.loads((root/'v053/reader_manifest.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          assert o['status']=='READY_FOR_V053_AUTHORING'
          assert o['source_backend']=='historical_warehouse'
          assert o['contract_revision']=='v053-boundary-safety-r2'
          assert o['market_blind'] is True and o['result_opened'] is False and o['target_market_opened'] is False
          assert s['status']=='SESSION_SEALED'
          assert s['contract_revision']=='v053-boundary-safety-r2'
          assert s['market_blind'] is True and s['result_opened'] is False and s['target_market_opened'] is False
          assert len(s['race_roster'])==m['counts']['races_built']==p['race_count']==o['race_count']==len(rm['entries'])
          assert o['race_count'] == 36, o['race_count']
          venue_races = {}
          for row in s['race_roster']:
              venue_races.setdefault(row['venue'], []).append(row['race_no'])
          assert set(venue_races) == {'中京', '中山', '阪神'}, venue_races
          assert all(sorted(v) == list(range(1, 13)) for v in venue_races.values()), venue_races
          PY
      - name: Commit TURN 1
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0094/20251214'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'RaceNote: stage BTDAY-0094 v0.5.3 r2 TURN 1'
          git pull --rebase origin main
          git push origin HEAD:main
