name: RaceReviewDB Next-Watch Select

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: Completed JRA source race date YYYY-MM-DD
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'yukki0113' &&
       startsWith(github.event.issue.title, '[JRDB_NEXT_WATCH_SELECT]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve race date
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ steps.resolve.outputs.date }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            date="$INPUT_DATE"
          else
            date="${ISSUE_TITLE##*] }"
          fi
          echo "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}
      - name: Download canonical inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch
          gdown '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/next_watch/RaceReviewDB_CURRENT.zip
          gdown '1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/next_watch/Turn5.zip

      - name: Select next-watch horses
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch/output
          python horse-racing/jrdb/src/jrdb_next_watch_select.py             --date '${{ steps.resolve.outputs.date }}'             --current-zip /tmp/next_watch/RaceReviewDB_CURRENT.zip             --turn5-zip /tmp/next_watch/Turn5.zip             --work-root /tmp/next_watch/work             --output-json /tmp/next_watch/output/next_watch_${{ steps.resolve.outputs.date }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-next-watch-select-${{ steps.resolve.outputs.date }}-${{ github.run_id }}
          path: /tmp/next_watch/output/
          retention-days: 30
          compression-level: 0

          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check 'duckdb==1.1.3' 'gdown>=6.1,<7'

      - name: Download canonical inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch
          gdown '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/next_watch/RaceReviewDB_CURRENT.zip
          gdown '1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/next_watch/Turn5.zip

      - name: Select next-watch horses
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch/output
          python horse-racing/jrdb/src/jrdb_next_watch_select.py             --date '${{ steps.resolve.outputs.date }}'             --current-zip /tmp/next_watch/RaceReviewDB_CURRENT.zip             --turn5-zip /tmp/next_watch/Turn5.zip             --work-root /tmp/next_watch/work             --output-json /tmp/next_watch/output/next_watch_${{ steps.resolve.outputs.date }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-next-watch-select-${{ steps.resolve.outputs.date }}-${{ github.run_id }}
          path: /tmp/next_watch/output/
          retention-days: 30
          compression-level: 0
