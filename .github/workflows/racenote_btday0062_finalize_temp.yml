name: RaceNote BTDAY-0062 Kyoto finalize temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0062/FINALIZE_TRIGGER'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save Kyoto, Freeze, Verify
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0062/20260210/v052'
          python horse-racing/jrdb/src/racenote_v052_single_day.py save             --root "$ROOT"             --decisions "$ROOT/incoming/京都.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v052_single_day.py verify --root "$ROOT"
      - name: Commit finalized canonical outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0062/20260210/v052/authored_decisions/京都.json
          git add horse-racing/jrdb/backtests/BTDAY-0062/20260210/v052/frozen
          git commit -m 'RaceNote: freeze and verify BTDAY-0062 v052'
          git pull --rebase origin main
          git push origin HEAD:main
