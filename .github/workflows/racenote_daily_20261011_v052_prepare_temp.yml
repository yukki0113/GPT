name: RaceNote DAILY 20261011 v0.5.2 TURN 1
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/daily/requests/DAILY-20261011.json'
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown
      - name: Resolve request
        id: req
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('horse-racing/jrdb/daily/requests/DAILY-20261011.json').read_text(encoding='utf-8'))
          for k in ('target_date','paci_file_id','analysis_artifact_run_id','analysis_artifact_name','analysis_generation_id','rrdb_file_id','next_watch_file_id'):
              if not r.get(k): raise SystemExit(f'missing {k}')
          for k,v in r.items():
              if isinstance(v,(str,int)): print(f'{k}={v}')
          PY
      - name: Guard immutable target
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/daily/20261011/v052_day'
          if test -e "$TARGET"; then
            echo "immutable target already exists: $TARGET" >&2
            exit 1
          fi
      - name: Materialize canonical sources
        env:
          GH_TOKEN: ${{ github.token }}
          PACI_ID: ${{ steps.req.outputs.paci_file_id }}
          ANALYSIS_RUN: ${{ steps.req.outputs.analysis_artifact_run_id }}
          ANALYSIS_ARTIFACT: ${{ steps.req.outputs.analysis_artifact_name }}
          ANALYSIS_GEN: ${{ steps.req.outputs.analysis_generation_id }}
          RRDB_ID: ${{ steps.req.outputs.rrdb_file_id }}
          NEXTWATCH_ID: ${{ steps.req.outputs.next_watch_file_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input /tmp/analysis_art /tmp/analysis /tmp/rrdb /tmp/rules
          gdown "https://drive.google.com/uc?id=$PACI_ID" -O /tmp/input/PACI261011.zip
          gdown "https://drive.google.com/uc?id=$RRDB_ID" -O /tmp/input/RaceReviewDB_CURRENT.zip
          gdown "https://drive.google.com/uc?id=$NEXTWATCH_ID" -O /tmp/input/NextWatch.zip
          gh run download "$ANALYSIS_RUN" --repo "$GITHUB_REPOSITORY" --name "$ANALYSIS_ARTIFACT" --dir /tmp/analysis_art
          ARCHIVE="$(find /tmp/analysis_art -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | sort | head -n 1)"
          test -n "$ARCHIVE"
          case "$ARCHIVE" in
            *.tar.xz) tar -xJf "$ARCHIVE" -C /tmp/analysis ;;
            *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" -C /tmp/analysis ;;
            *.zip) unzip -q "$ARCHIVE" -d /tmp/analysis ;;
          esac
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('/tmp/analysis'); gen=os.environ['ANALYSIS_GEN']
          manifest=root/'generations'/gen/'manifest.json'
          if not manifest.is_file(): raise SystemExit(f'analysis generation missing: {manifest}')
          (root/'current.json').write_text(json.dumps({'status':'CURRENT','generation_id':gen,'manifest':f'generations/{gen}/manifest.json'},indent=2)+'\n',encoding='utf-8')
          PY
          unzip -q /tmp/input/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
          unzip -q /tmp/input/NextWatch.zip -d /tmp/rules
      - name: Build canonical DAILY v0.5.2 TURN 1
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/daily/20261011/v052_day'
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v052_from_paci.py             --date 2026-10-11             --paci /tmp/input/PACI261011.zip             --selection-id DAILY-20261011             --main-sha "$MAIN_SHA"             --analysis-root /tmp/analysis             --racereview-root /tmp/rrdb/postrace_review/v0_1             --next-watch-rules /tmp/rules/next_watch_candidate_rules_frozen.json             --output-root "$TARGET"
          ROOT="$TARGET/day_prep/RaceNote_20261011"
          cp "$ROOT/manifest.json" "$TARGET/day_prep/manifest.json"
          cp "$ROOT/validation_report.json" "$TARGET/day_prep/validation_report.json"
      - name: Validate handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/daily/20261011/v052_day')
          m=json.loads((root/'day_prep/manifest.json').read_text())
          v=json.loads((root/'day_prep/validation_report.json').read_text())
          p=json.loads((root/'forecast_prep/day_prep_handoff.json').read_text())
          o=json.loads((root/'operation_handoff.json').read_text())
          s=json.loads((root/'v052/session.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          assert o['status']=='READY_FOR_V052_AUTHORING'
          assert o['selection_id']=='DAILY-20261011'
          assert o['target_date']=='2026-10-11'
          assert o['market_blind'] is True and o['result_opened'] is False and o['ab_required'] is False
          assert p['market_blind'] is True and p['result_opened'] is False and p['target_market_opened'] is False
          assert s['logic_version']=='RaceNote-Human-Context-Reader-0.5.2-candidate'
          assert s['market_blind'] is True and s['result_opened'] is False and s['target_market_opened'] is False
          assert len(s['race_roster'])==m['counts']['races_built']==p['race_count']==o['race_count']
          print(json.dumps({'status':o['status'],'session_id':o['session_id'],'race_count':o['race_count'],'expected_venues':o['expected_venues'],'market_blind':o['market_blind']},ensure_ascii=False))
          PY
      - name: Commit immutable TURN 1
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/daily/20261011/v052_day'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET/day_prep/manifest.json" "$TARGET/day_prep/validation_report.json"
          git add "$TARGET/forecast_prep" "$TARGET/v052" "$TARGET/operation_handoff.json"
          git commit -m 'RaceNote: stage DAILY-20261011 canonical v0.5.2 TURN 1'
          git pull --rebase origin main
          git push origin HEAD:main
