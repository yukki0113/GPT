name: RaceNote BTDAY-0023 TURN2 finalize temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  finalize:
    if: startsWith(github.event.issue.title, '[RACENOTE_BTDAY0023_TURN2_FINAL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse HEAD >/tmp/mainsha.txt
          mkdir -p /tmp/a /tmp/prep
          gh run download 36871093084 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0023-DAY-PREP --dir /tmp/a
          unzip -q "$(find /tmp/a -type f -name '*.zip' | head -1)" -d /tmp/prep
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/prep/day_prep_handoff.json').read_text())
          assert h['selection_id']=='BTDAY-0023' and h['target_date']=='2026-05-03'
          assert h['result_opened'] is False and h['race_count']==36
          PY
      - name: Freeze
        run: |
          cat >/tmp/picks.json <<'JSON'
          {"京都:10":[3,4,16,17,9],"京都:11":[3,7,12,11,4],"京都:12":[13,11,6,10,15],"京都:1":[6,10,9,3,4],"京都:2":[11,7,2,5,3],"京都:3":[6,15,10,5,11],"京都:4":[11,1,8,3,4],"京都:5":[7,3,8,11,5],"京都:6":[3,11,5,1,8],"京都:7":[7,1,8,4,6],"京都:8":[14,2,12,15,3],"京都:9":[8,6,5,2,3],"新潟:10":[16,1,4,8,9],"新潟:11":[2,10,4,12,3],"新潟:12":[5,3,10,11,7],"新潟:1":[1,6,12,16,11],"新潟:2":[7,10,14,13,6],"新潟:3":[6,11,8,2,12],"新潟:4":[5,9,11,7,10],"新潟:5":[4,2,11,1,13],"新潟:6":[10,11,12,4,3],"新潟:7":[4,12,5,1,13],"新潟:8":[4,6,7,9,5],"新潟:9":[4,3,1,11,8],"東京:10":[8,9,14,5,15],"東京:11":[11,13,15,5,4],"東京:12":[6,5,8,13,4],"東京:1":[13,3,15,1,12],"東京:2":[11,5,7,10,2],"東京:3":[12,6,10,11,8],"東京:4":[3,6,10,17,4],"東京:5":[10,6,2,1,5],"東京:6":[14,8,9,12,7],"東京:7":[11,7,9,14,10],"東京:8":[2,7,3,5,8],"東京:9":[15,4,10,1,8]}
          JSON
          python horse-racing/jrdb/src/racenote_finalize_fixed_picks.py             --prep-root /tmp/prep --output-root /tmp/bt23             --selection-id BTDAY-0023 --date 2026-05-03             --turn-id BTDAY-0023-TURN2-FULLDAY             --picks-json /tmp/picks.json --main-sha "$(cat /tmp/mainsha.txt)"
      - name: Validate
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt23/day_merge/forecast_20260503_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/validator.json').read_text())
          a=json.loads(Path('/tmp/bt23/day_merge/forecast_20260503_all_audit.json').read_text())
          h=json.loads(Path('/tmp/bt23/day_merge/forecast_20260503_all_handoff.json').read_text())
          assert v['status']=='PASS'
          assert a['status']=='FROZEN_CLEAN_BLIND' and a['record_count']==36
          assert a['prediction_hash_unique_count']==36 and a['anti_template']['status']=='PASS'
          assert a['market_blind_guard']=='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST'
          assert a['rrdb_contract_guard']=='PASS_RECOMMENDATION_V0_3_GRADE_DISABLED'
          assert h['result_opened'] is False
          PY
      - name: Publish
        run: |
          set -euo pipefail
          DEST='horse-racing/jrdb/backtests/BTDAY-0023/20260503'
          rm -rf "$DEST"; mkdir -p "$(dirname "$DEST")"; cp -a /tmp/bt23 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260503_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0023 20260503 forecast"
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD >/tmp/commit.txt
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json,os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          a=json.loads(Path('/tmp/bt23/day_merge/forecast_20260503_all_audit.json').read_text()) if Path('/tmp/bt23/day_merge/forecast_20260503_all_audit.json').exists() else {}
          print('RACENOTE_BTDAY0023_TURN2_RESULT')
          print(json.dumps({'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL','clean_blind_eligible':True if ok else None,'result_opened':False,'race_count':36 if ok else None,'technical_skips':0 if ok else None,'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate','rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.3','validator_status':v.get('status'),'market_blind_guard':a.get('market_blind_guard'),'anti_template':(a.get('anti_template') or {}).get('status'),'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,'run_id':int(os.environ['GITHUB_RUN_ID'])},ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          test -f /tmp/commit.txt && gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
