name: RaceLap Forward Daily Refresh via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  refresh:
    if: >-
      startsWith(github.event.issue.title, '[RACELAP_FORWARD_DAILY_REFRESH]') &&
      github.event.issue.user.login == 'yukki0113'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          mkdir -p .racelap/current .racelap/raw .racelap/work .racelap/output
          python - <<'PY'
          import datetime as dt
          import json, os, re
          from pathlib import Path

          req=json.loads(os.environ['ISSUE_BODY'])
          required=('request_id','completed_date','target_date','current_run_id','current_artifact_name','generation_id')
          missing=[k for k in required if not req.get(k)]
          if missing:
              raise SystemExit('missing: '+','.join(missing))
          completed=dt.date.fromisoformat(str(req['completed_date']))
          target=dt.date.fromisoformat(str(req['target_date']))
          if not completed < target:
              raise SystemExit('completed_date must be earlier than target_date')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]{2,127}', str(req['generation_id'])):
              raise SystemExit('invalid generation_id')
          Path('.racelap/request.json').write_text(json.dumps(req,indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"COMPLETED_DATE={completed.isoformat()}\n")
              f.write(f"TARGET_DATE={target.isoformat()}\n")
              f.write(f"CURRENT_RUN_ID={int(req['current_run_id'])}\n")
              f.write(f"CURRENT_ARTIFACT_NAME={req['current_artifact_name']}\n")
              f.write(f"GENERATION_ID={req['generation_id']}\n")
          PY

      - run: python -m pip install -r tools/data-storage/requirements.txt

      - name: Download accepted RaceLap CURRENT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$CURRENT_RUN_ID" -n "$CURRENT_ARTIFACT_NAME" -D .racelap/current
          test "$(find .racelap/current -type f -name race_lap.parquet | wc -l)" -eq 1
          test "$(find .racelap/current -type f -name manifest.json | wc -l)" -eq 1

      - name: Fetch exact completed-day SED only
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          compact="${COMPLETED_DATE//-/}"
          python horse-racing/jrdb/src/fetch_jrdb_history.py \
            --date "$compact" \
            --kinds SED \
            --output-dir .racelap/raw \
            --sleep-seconds 0
          yymmdd="${compact:2:6}"
          test -s ".racelap/raw/SED/SED${yymmdd}.zip"

      - name: Resolve RaceLap CURRENT
        run: |
          set -euo pipefail
          current_manifest="$(find .racelap/current -type f -name manifest.json -print -quit)"
          current_bundle="$(dirname "$current_manifest")"
          sed_file="$(find .racelap/raw/SED -type f -name 'SED*.zip' -print -quit)"
          python horse-racing/jrdb/src/jrdb_race_lap_current_resolver.py \
            --current-bundle "$current_bundle" \
            --target-date "$TARGET_DATE" \
            --expected-period-to "$COMPLETED_DATE" \
            --sed "$sed_file" \
            --expected-date "$COMPLETED_DATE" \
            --work-root .racelap/work \
            --generation-id "$GENERATION_ID" \
            --resolved-bundle .racelap/output/current \
            --receipt .racelap/output/resolver_receipt.json

      - name: Validate receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('.racelap/output/resolver_receipt.json').read_text())
          assert r['status']=='CURRENT_READY'
          assert r['period_to']==os.environ['COMPLETED_DATE']
          assert r['expected_period_to']==os.environ['COMPLETED_DATE']
          assert r['updated'] is True
          assert r['network_access'] is False
          PY

      - uses: actions/upload-artifact@v4
        id: current_upload
        with:
          name: racelap-forward-current-${{ github.run_id }}
          path: |
            .racelap/output/current/
            .racelap/output/resolver_receipt.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        id: sed_upload
        with:
          name: racelap-canonical-sed-${{ github.run_id }}
          path: .racelap/raw/SED/SED*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'RACELAP_FORWARD_DAILY_REFRESH_RESULT',
                'status: '+(ok?'success':'failure'),
                'run_id: '+context.runId,
                'current_artifact_id: ${{ steps.current_upload.outputs.artifact-id }}',
                'sed_artifact_id: ${{ steps.sed_upload.outputs.artifact-id }}',
                'completed_date: '+process.env.COMPLETED_DATE,
                'target_date: '+process.env.TARGET_DATE
              ].join('\n')
            });
