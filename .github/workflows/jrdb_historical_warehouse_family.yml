name: JRDB Historical Warehouse Family
on:
  workflow_dispatch:
    inputs:
      families:
        description: 'all or comma-separated family names'
        required: true
        default: all
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  family:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'yukki0113' &&
       startsWith(github.event.issue.title, '[JRDB_WAREHOUSE_FAMILY]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [BAC, KYI, CHA, CYB, SED, SKB, ZED, ZKB, UKC, HJC]
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.families || github.event.issue.body }}
          FAMILY: ${{ matrix.family }}
        run: |
          request=",$(echo "$REQUESTED" | tr '[:lower:]' '[:upper:]'),"
          if [ "$(echo "$REQUESTED" | tr '[:upper:]' '[:lower:]')" = all ] || [[ "$request" == *",$FAMILY,"* ]]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.select.outputs.run == 'true'
        with: {python-version: '3.12'}
      - if: steps.select.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r tools/data-storage/requirements.txt requests
      - if: steps.select.outputs.run == 'true'
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p /tmp/warehouse/raw /tmp/warehouse/report
          python horse-racing/jrdb/src/stage_jrdb_warehouse_family_raw.py --inventory horse-racing/jrdb/config/jrdb_frozen_raw_inventory_20260918.json --family "$FAMILY" --output-root /tmp/warehouse/raw --receipt /tmp/warehouse/report/raw_receipt.json
          generation="historical-warehouse-staging-$(echo "$FAMILY" | tr '[:upper:]' '[:lower:]')-$GITHUB_RUN_ID"
          python horse-racing/jrdb/src/build_jrdb_normalized_warehouse_from_inventory.py --inventory horse-racing/jrdb/config/jrdb_frozen_raw_inventory_20260918.json --raw-root /tmp/warehouse/raw --family "$FAMILY" --output-root /tmp/warehouse/output --generation-id "$generation" --source-git-commit "$GITHUB_SHA" > /tmp/warehouse/report/build.json
          FAMILY="$FAMILY" python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('/tmp/warehouse/report/build.json').read_text())
          if r['manifest']['status']!='PASS' or r['audit']['status']!='PASS': raise SystemExit('family audit failed')
          Path('/tmp/warehouse/publish_request.json').write_text(json.dumps({'status':'PASS','family':os.environ['FAMILY'],'generation_id':r['manifest']['generation_id']},indent=2)+'\n')
          PY
          rm -rf /tmp/warehouse/raw
      - if: steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-warehouse-family-${{ matrix.family }}-${{ github.run_id }}
          path: |
            /tmp/warehouse/output
            /tmp/warehouse/report
            /tmp/warehouse/publish_request.json
          retention-days: 14
