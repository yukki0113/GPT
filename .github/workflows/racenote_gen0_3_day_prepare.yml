name: RaceNote Gen0.3 day prepare

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[RACENOTE_GEN03_DAY_PREPARE]'

jobs:
  prepare-day:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RACENOTE_GEN03_DAY_PREPARE]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install gdown duckdb pyarrow

      - name: Parse request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          title = os.environ.get('ISSUE_TITLE') or ''
          prefix = os.environ['REQUEST_PREFIX']
          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('invalid request_id')

          try:
              request = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Issue body must be raw JSON: {exc}') from exc

          source_run_id = int(request.get('source_run_id') or 0)
          source_artifact_name = str(
              request.get('source_artifact_name') or ''
          ).strip()
          racereview_drive_file_id = str(
              request.get('racereview_drive_file_id')
              or '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'
          ).strip()

          if source_run_id <= 0:
              raise SystemExit('source_run_id must be positive')
          if not source_artifact_name:
              raise SystemExit('source_artifact_name is required')
          if not re.fullmatch(r'[A-Za-z0-9_-]+', racereview_drive_file_id):
              raise SystemExit('racereview_drive_file_id is invalid')

          resolved = {
              'request_id': request_id,
              'source_run_id': source_run_id,
              'source_artifact_name': source_artifact_name,
              'racereview_drive_file_id': racereview_drive_file_id,
          }
          Path('/tmp/day_prepare_request.json').write_text(
              json.dumps(resolved, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              f.write(f"REQUEST_ID={request_id}\n")
              f.write(f"SOURCE_RUN_ID={source_run_id}\n")
              f.write(f"SOURCE_ARTIFACT_NAME={source_artifact_name}\n")
              f.write(f"RACEREVIEW_DRIVE_ID={racereview_drive_file_id}\n")
          PY

      - name: Download source RaceNote artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/racenote_source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir /tmp/racenote_source
          find /tmp/racenote_source -maxdepth 3 -type f -print

      - name: Extract all RaceNote bundles
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path('/tmp/racenote_source')
          outer_candidates = sorted(source.rglob('RaceNote_*.zip'))
          if len(outer_candidates) != 1:
              raise SystemExit(
                  f'expected exactly one RaceNote ZIP, found {outer_candidates}'
              )

          destination = Path('/tmp/racenote_day')
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(outer_candidates[0]) as archive:
              bundle_infos = [
                  info
                  for info in archive.infolist()
                  if Path(info.filename).name.startswith('race_bundle_')
                  and Path(info.filename).suffix == '.json'
              ]
              if not bundle_infos:
                  raise SystemExit('RaceNote ZIP contains no race bundles')
              for info in bundle_infos:
                  path = Path(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe RaceNote ZIP member: {info.filename}')
                  target = destination / path.name
                  target.write_bytes(archive.read(info))
          print(f'extracted {len(bundle_infos)} bundles')
          PY

      - name: Download and extract RaceReviewDB CURRENT once
        run: |
          set -euo pipefail
          mkdir -p /tmp/racereview_download /tmp/racereview_extract
          gdown "$RACEREVIEW_DRIVE_ID" \
            -O /tmp/racereview_download/RaceReviewDB_CURRENT.zip
          test -s /tmp/racereview_download/RaceReviewDB_CURRENT.zip
          python -m zipfile -t \
            /tmp/racereview_download/RaceReviewDB_CURRENT.zip >/dev/null
          python - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path('/tmp/racereview_download/RaceReviewDB_CURRENT.zip')
          destination = Path('/tmp/racereview_extract')
          resolved = destination.resolve()
          with zipfile.ZipFile(source) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt RaceReview member: {bad}')
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  try:
                      target.relative_to(resolved)
                  except ValueError as exc:
                      raise SystemExit(
                          f'unsafe RaceReview ZIP member: {member.filename}'
                      ) from exc
              archive.extractall(destination)

          current_files = sorted(destination.rglob('current.json'))
          if len(current_files) != 1:
              raise SystemExit(
                  f'expected one RaceReview current.json; found {current_files}'
              )
          root = current_files[0].parent
          Path('/tmp/racereview_root.txt').write_text(
              str(root),
              encoding='utf-8',
          )
          print(root)
          PY

      - name: Prepare all races
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          source_root = Path('/tmp/racenote_day')
          output_root = Path('/tmp/racenote_day_prepare')
          output_root.mkdir(parents=True, exist_ok=True)
          rr_root = Path('/tmp/racereview_root.txt').read_text(
              encoding='utf-8'
          ).strip()

          def run(command):
              subprocess.run(command, check=True)

          day_rows = []
          bundles = sorted(source_root.glob('race_bundle_*.json'))
          for index, bundle in enumerate(bundles, start=1):
              stem = bundle.stem
              race_dir = output_root / stem
              firewall_dir = race_dir / 'firewall'
              firewall_dir.mkdir(parents=True, exist_ok=True)

              print(f'[{index}/{len(bundles)}] {bundle.name}')

              run([
                  sys.executable,
                  'horse-racing/jrdb/src/racenote_gen0_2_input_firewall.py',
                  str(bundle),
                  '--output-dir',
                  str(firewall_dir),
              ])
              independent = firewall_dir / 'independent_view.json'

              rr_evidence = race_dir / 'racereview_evidence.json'
              run([
                  sys.executable,
                  'horse-racing/jrdb/src/racenote_racereview_adapter.py',
                  '--independent-view',
                  str(independent),
                  '--racereview-root',
                  rr_root,
                  '--per-horse-limit',
                  '5',
                  '--output',
                  str(rr_evidence),
              ])

              cards = race_dir / 'horse_evidence_cards.json'
              run([
                  sys.executable,
                  'horse-racing/jrdb/src/racenote_horse_evidence_card.py',
                  '--racereview-evidence',
                  str(rr_evidence),
                  '--output',
                  str(cards),
              ])

              general = race_dir / 'general_evidence.json'
              run([
                  sys.executable,
                  'horse-racing/jrdb/src/racenote_general_evidence.py',
                  '--independent-view',
                  str(independent),
                  '--racereview-card',
                  str(cards),
                  '--output',
                  str(general),
              ])

              general_obj = json.loads(
                  general.read_text(encoding='utf-8')
              )
              synthesis_request = race_dir / 'all_runner_synthesis_request.json'
              code = (
                  'import json,sys; '
                  'from pathlib import Path; '
                  'from racenote_all_runner_synthesis import build_synthesis_request; '
                  'g=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); '
                  'r=build_synthesis_request(g); '
                  'Path(sys.argv[2]).write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")'
              )
              run([
                  sys.executable,
                  '-c',
                  code,
                  str(general),
                  str(synthesis_request),
              ])

              semantic = hashlib.sha256(
                  json.dumps(
                      general_obj,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(',', ':'),
                  ).encode('utf-8')
              ).hexdigest()

              summary = {
                  'bundle_name': bundle.name,
                  'target': general_obj['target'],
                  'runner_count': len(general_obj['horses']),
                  'general_evidence_sha256': semantic,
                  'field_evidence_summary': general_obj.get(
                      'field_evidence_summary'
                  ),
                  'race_structure': general_obj.get('race_structure'),
                  'race_day_facts_status': (
                      general_obj['race_data_context']['race_day_facts']['status']
                  ),
                  'race_day_facts_source_kind': (
                      general_obj['race_data_context']['race_day_facts']['source_kind']
                  ),
              }
              (race_dir / 'prepare_summary.json').write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              day_rows.append(summary)

          day_summary = {
              'status': 'PASS',
              'race_count': len(day_rows),
              'races': day_rows,
          }
          (output_root / 'day_prepare_summary.json').write_text(
              json.dumps(day_summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(
              {
                  'status': 'PASS',
                  'race_count': len(day_rows),
              },
              ensure_ascii=False,
          ))
          PY

      - name: Upload day prepare artifact
        uses: actions/upload-artifact@v4
        with:
          name: racenote-gen0-3-day-prepare-${{ github.run_id }}
          path: /tmp/racenote_day_prepare/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path('/tmp/day_prepare_request.json')
          request = (
              json.loads(request_path.read_text(encoding='utf-8'))
              if request_path.is_file()
              else {}
          )
          summary_path = Path(
              '/tmp/racenote_day_prepare/day_prepare_summary.json'
          )
          summary = (
              json.loads(summary_path.read_text(encoding='utf-8'))
              if summary_path.is_file()
              else {'status': 'FAIL', 'race_count': None}
          )
          result = {
              'request_id': request.get('request_id'),
              'status': summary.get('status', 'FAIL'),
              'race_count': summary.get('race_count'),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'artifact_name': (
                  'racenote-gen0-3-day-prepare-'
                  + os.environ['GITHUB_RUN_ID']
              ),
          }
          Path('/tmp/day_prepare_comment.md').write_text(
              'RACENOTE_GEN03_DAY_PREPARE_RESULT\n```json\n'
              + json.dumps(result, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/day_prepare_comment.md

      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
