name: RaceNote A05 Analysis RRDB forward freshness preflight

on:
  pull_request:
    paths:
      - '.github/workflows/racenote_v056_forward_paci_t1.yml'
      - '.github/workflows/racenote_a05_forward_freshness_preflight.yml'
      - 'horse-racing/jrdb/src/racenote_v056_forward_freshness.py'
      - 'horse-racing/jrdb/src/racenote_v056_forward_turn1.py'
      - 'horse-racing/jrdb/tests/test_racenote_a05_forward_freshness.py'
      - 'horse-racing/jrdb/docs/racenote/RACENOTE_A05_ANALYSIS_RRDB_FRESHNESS_GATE_20261102.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal canonical Analysis coverage query dependencies
        run: python -m pip install 'duckdb==1.1.3' pytest
      - name: Syntax-check A05 and FORWARD entrypoints
        run: |
          python -m py_compile horse-racing/jrdb/src/racenote_v056_forward_freshness.py
          python -m py_compile horse-racing/jrdb/src/racenote_v056_forward_turn1.py
      - name: Check actual Parquet, RRDB receipt and fail-closed acceptance regressions
        run: python -m pytest -q horse-racing/jrdb/tests/test_racenote_a05_forward_freshness.py
