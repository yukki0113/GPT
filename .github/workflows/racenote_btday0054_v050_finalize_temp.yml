name: RaceNote BTDAY-0054 v0.5.0 lane finalize
on:
  push:
    branches:
      - research/racenote-btday0054-v050
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0054/20260509/ab/v050/FINALIZE'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/racenote-btday0054-v050
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and save venue cards
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          AB='horse-racing/jrdb/backtests/BTDAY-0054/20260509/ab'
          for venue in 京都 新潟 東京; do
            python horse-racing/jrdb/src/racenote_ab_lane.py save               --ab-root "$AB" --lane v050 --decisions "$AB/v050/incoming/$venue.json"
          done
          python horse-racing/jrdb/src/racenote_ab_lane.py freeze --ab-root "$AB" --lane v050
      - name: Verify frozen handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('horse-racing/jrdb/backtests/BTDAY-0054/20260509/ab/v050/frozen/lane_handoff.json')
          h=json.loads(p.read_text(encoding='utf-8'))
          assert h['selection_id']=='BTDAY-0054'
          assert h['target_date']=='2026-05-09'
          assert h['session_id']=='AB-2f0516ec60231303212b'
          assert h['logic_version']=='RaceNote-Human-Context-Reader-0.5.0-candidate'
          assert h['record_count']==36
          assert h['market_blind'] is True
          assert h['target_market_opened'] is False
          assert h['result_opened'] is False
          assert h['sibling_forecast_input_used'] is False
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          print(json.dumps({'status':h['status'],'validator_status':h['validator_status'],'record_count':h['record_count']},ensure_ascii=False))
          PY
      - name: Commit Lane B authored decisions and Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0054/20260509/ab/v050/authored_decisions
          git add horse-racing/jrdb/backtests/BTDAY-0054/20260509/ab/v050/frozen
          git commit -m 'RaceNote: freeze BTDAY-0054 v0.5.0 clean-blind lane'
          git push origin HEAD:research/racenote-btday0054-v050
