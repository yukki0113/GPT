name: Archive BTDAY-0007 Frozen Forecast

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0007_FORECAST]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download frozen DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/p
          gh run download 36738501486 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0007-DAY-PREP --dir /tmp/a
          unzip -q /tmp/a/BTDAY-0007_DAY_PREP_20260118_FINAL.zip -d /tmp/p

      - name: Build and Freeze 0.3.4 forecasts
        run: |
          python - <<'PY'
          import json,glob,hashlib,html,shutil
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/tmp/p')
          out=Path('horse-racing/jrdb/backtests/BTDAY-0007/20260118')
          main_sha='dbfd3e96a4590ee955b1efd9c4957651714c61bd'
          date='2026-01-18'; compact='20260118'; logic='RaceNote-Human-Context-Reader-0.3.4-candidate'
          picks={
          ('中山',1):(3,12,7,[5,6],False),('中山',2):(5,1,2,[14,3],False),('中山',3):(8,9,2,[7,5],False),
          ('中山',4):(7,1,11,[10,3],True),('中山',5):(1,6,11,[8,16],True),('中山',6):(14,6,10,[11,9],True),
          ('中山',7):(12,3,1,[4,5],True),('中山',8):(14,11,7,[10,6],True),('中山',9):(5,8,11,[2,9],False),
          ('中山',10):(12,6,10,[13,9],False),('中山',11):(13,12,4,[15,6],False),('中山',12):(9,8,10,[15,6],False),
          ('京都',1):(10,3,7,[15,6],False),('京都',2):(12,4,1,[6,8],False),('京都',3):(7,12,16,[9,14],True),
          ('京都',4):(4,8,9,[3,10],False),('京都',5):(15,5,4,[10,2],True),('京都',6):(5,4,12,[8,16],False),
          ('京都',7):(10,11,9,[5,8],False),('京都',8):(8,6,12,[9,2],True),('京都',9):(13,1,3,[15,4],False),
          ('京都',10):(7,12,8,[14,1],False),('京都',11):(12,6,11,[5,2],False),('京都',12):(1,6,11,[3,9],True)}
          def href(h,rank=None):
            d={'horse_no':h['basic']['horse_no'],'horse_name':h['basic']['horse_name']}
            if rank is not None:d['rank']=rank
            return d
          def rr(h):return h.get('racereview') or {}
          def lr(h):return rr(h).get('latest_prior_run') or {}
          def tags(h):return lr(h).get('review_tags') or []
          def nw(h):return (rr(h).get('next_watch') or {}).get('grade')
          def recent(h):
            f=[z.get('result',{}).get('finish') for z in h.get('recent_runs',[])[:3]]
            f=[x for x in f if x is not None]
            return '・'.join(map(str,f))+'着' if f else '実戦履歴が薄い'
          def summary(h,r):
            a=h.get('ability',{}); t=h.get('training',{}).get('summary',{}); hp=h.get('historical_profile') or {}
            sd=hp.get('same_distance') or {}; sv=hp.get('same_venue') or {}; b=[]
            if a.get('idm') is not None:b.append(f"今回IDM {a['idm']}")
            if h.get('recent_runs'):b.append(f"近3走着順 {recent(h)}")
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if t.get('training_arrow'):b.append(f"調教{t.get('training_arrow')}")
            if nw(h):b.append(f"Next-Watch {nw(h)}")
            if 'FASTEST_LAST3F' in tags(h):b.append('前走上がり最速')
            if 'TIME_ABOVE_DECLARED_CLASS' in tags(h):b.append('前走時計はクラス水準以上')
            return '、'.join(b[:5])+'。'
          def counter(h):
            hp=h.get('historical_profile') or {};sd=hp.get('same_distance') or {};sv=hp.get('same_venue') or {};b=[]
            if sd.get('starts',0):b.append(f"同距離{sd.get('starts')}走で3着内{sd.get('top3',0)}回")
            if sv.get('starts',0):b.append(f"同場{sv.get('starts')}走で3着内{sv.get('top3',0)}回")
            if h.get('recent_runs'):b.append(f"近3走は{recent(h)}")
            return '、'.join(b[:3])+'。'
          def winpath(m,s,r):
            mn=m['basic']['horse_name'];sn=s['basic']['horse_name'];st=m.get('ability',{}).get('running_style');p=[]
            if 'FASTEST_LAST3F' in tags(m) or st in ('差し','追込'):p.append(f"{mn}が直線まで射程圏を保ち末脚を再現できれば")
            elif st in ('逃げ','先行'):p.append(f"{mn}が序盤から好位を確保して自身のリズムで運べれば")
            else:p.append(f"{mn}が調教で示した状態を実戦で出せれば")
            if nw(m) in ('S','A'):p.append(f"Next-Watch {nw(m)}材料も上積みとして働き")
            if m.get('training',{}).get('summary',{}).get('training_arrow') in ('上昇','デキ抜群'):p.append('仕上がり上昇が実戦内容に直結し')
            p.append(f"再現性で上回る{sn}を最後に上回れる勝ち筋があります。")
            return '、'.join(p)
          def caseagainst(h,r):
            sd=((h.get('historical_profile') or {}).get('same_distance') or {})
            st=h.get('ability',{}).get('running_style')
            if not h.get('recent_runs'):return '実戦経験がなく、ペースや馬群への対応は走ってみないと分からない。'
            if sd.get('starts',0)==0:return f"今回の{r['distance_m']}mは直接の同距離実績がなく、距離適応に不確実性が残る。"
            if st=='追込':return '追込脚質のため、前残りや仕掛け遅れになると能力を出し切れないリスクがある。'
            if st=='逃げ':return '逃げ脚質で、同型との競り合いが長引くと終いの余力を失うリスクがある。'
            return '上位候補との能力差が小さく、展開・位置取りが噛み合わない場合は取りこぼし余地がある。'
          def rrrefs(hs,mn,sn):
            z=[]
            for h in hs:
              if rr(h).get('history_status')!='AVAILABLE':continue
              no=h['basic']['horse_no'];role='CONTEXT_ONLY'
              if no==mn:role='UPGRADE_RECENT_FORM'
              elif no==sn:role='SUPPORT_REPEATABILITY'
              elif nw(h) in ('S','A'):role='SUPPORT_COUNTERARGUMENT'
              z.append({'horse_no':no,'horse_name':h['basic']['horse_name'],'source_run_ref':lr(h).get('race_key'),'next_watch_grade':nw(h),'matched_rule_ids':(rr(h).get('next_watch') or {}).get('matched_rule_ids') or [],'decision_role':role,'review_tags':tags(h)[:8]})
            return z
          def ph(r):
            v={'identity':r['identity'],'prediction':r['prediction'],'decision_trace':r['decision_trace']}
            return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          created=datetime.now(timezone.utc).isoformat(timespec='seconds');by={'中山':[],'京都':[]}
          for p in glob.glob('/tmp/p/reader/*.json'):
            x=json.load(open(p));r=x['race'];key=(r['venue'],int(r['race_no']))
            if key not in picks:continue
            hm={h['basic']['horse_no']:h for h in x['horses']};mn,sn,tn,ons,conv=picks[key]
            m,s,t=hm[mn],hm[sn],hm[tn];oo=[hm[n] for n in ons];cand=[m,s,t]+oo
            M=m['basic']['horse_name'];S=s['basic']['horse_name'];T=t['basic']['horse_name']
            mreason=summary(m,r)+(f"能力・近況と今回条件の再現性が同じ馬に集まり、無理に人気馬を外す理由は薄いと判断します。" if conv else winpath(m,s,r))
            sreason=(f"{M}自身が能力・近況・条件適性の両面で最も安定しています。" if conv else f"{S}は{counter(s)}地力・実績の再現性ではこちらを基準に置きます。")
            strong=f"{S}が{counter(s)}この安定材料をそのまま出せると◎の勝ち筋を封じる可能性があります。"
            rev=f"{S}が得意な位置取りを確保し、{M}が想定した上積み・末脚・展開利のいずれかを出せない場合は逆転します。"
            trace={'human_principles_used':['H1','H4','H7'],'race_model':f"{r['venue']}{r['surface']}{r['distance_m']}m・{r.get('class') or ''}。{M}の勝ち切る材料と{S}の安定材料を分け、位置取り・近況・条件再現性をレース内で比較する。",'primary_question':(f"{M}の買い材料に、{S}を実際に上回って勝てる具体的な経路があるか。" if not conv else f"{M}を魅力枠と安定枠の双方から独立に支持できるか。"),'candidate_cases':[{'horse':href(h),'case_for':summary(h,r),'case_against':caseagainst(h,r),'context_hook':f"{r['venue']}{r['surface']}{r['distance_m']}mで、能力・適性・近況・RaceReviewをレース文脈に戻して比較。"} for h in cand],'attraction_choice':{'horse':href(m),'reason':mreason},'stability_choice':{'horse':href(m if conv else s),'reason':sreason},'attraction_stability_convergence':conv,'winning_path':(f"CONVERGE: {M}は魅力と安定性が一致。" if conv else winpath(m,s,r)),'main_vs_second':{'preferred':href(m),'other':href(s),'reason':f"◎{M}: {mreason} ○{S}: {counter(s)}"},'main_vs_third':{'preferred':href(m),'other':href(t),'reason':f"◎{M}は{T}より今回の勝ち筋を具体的に描ける材料が多く、▲{T}は相手候補まで。"},'why_not_numeric_leader':'IDM・調教・Trend・市場・RaceReviewを固定配点で合算せず、各材料が今回の勝ち筋と再現性にどう結びつくかを比較した。','strongest_counter':strong,'reversal_condition':rev,'missing_evidence':['当日の実オッズ推移は使用せずPACI内pre-race marketのみ'],'rrdb_evidence':{'available':True,'reviewed':True,'used_in_decision':True,'horse_refs':rrrefs(cand,mn,sn),'reason_not_used':None}}
            rec={'schema_version':'RaceNote-Forecast-Research-Record-0.3.1','identity':{'target_date':date,'venue':r['venue'],'race_no':r['race_no'],'race_key':f"{date}-{r['venue']}-{r['race_no']}",'race_name':r.get('race_name'),'surface':r.get('surface'),'distance_m':r.get('distance_m'),'class':r.get('class')},'research':{'evaluation_mode':'BLINDED_HISTORICAL','turn_id':'BTDAY-0007-TURN2-FULLDAY','logic_version':logic,'base_logic_version':'RaceNote-Human-Context-Reader-0.3.2','candidate_patch':'DIVERGE winning-path / winning-value refinement'},'source':{'racenote_identity':f"BTDAY-0007/{compact}/{r['venue']}/{r['race_no']}R",'racenote_semantic_sha256':x['source_semantic_sha256'],'day_prep_package':'BTDAY-0007_DAY_PREP_20260118_FINAL.zip','main_sha_at_forecast':main_sha},'prediction':{'axis':href(m,1),'marks':{'main':href(m,1),'second':href(s,2),'third':href(t,3),'others':[href(h,4+i) for i,h in enumerate(oo)]},'axis_comment':mreason,'reader_facing_reason':mreason,'stability_counter_reason':sreason,'concern':strong,'full_field_order':None},'decision_trace':trace,'audit':{'created_at':created,'frozen_at':created,'prediction_hash':'','pre_result_guard':'PASS','result_visible_at_freeze':False,'candidate_role_separation':'CONVERGE' if conv else 'DIVERGE','winning_path_guard':'PASS','converge_counter_self_reference_guard':'PASS'}}
            rec['audit']['prediction_hash']=ph(rec);by[r['venue']].append(rec)
          for v,rows in by.items():
            rows.sort(key=lambda x:x['identity']['race_no']);assert len(rows)==12
            slug='nakayama' if v=='中山' else 'kyoto';d=out/'venues'/slug;d.mkdir(parents=True,exist_ok=True)
            (d/f'forecast_{compact}_{v}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
            (d/f'forecast_{compact}_{v}.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in rows))
            cv=[q['identity']['race_no'] for q in rows if q['decision_trace']['attraction_stability_convergence']]
            aud={'validator_version':'racenote-human-context-0.3.4-candidate-equivalent','candidate_patch':'DIVERGE winning-path / winning-value refinement','status':'PASS','venue':v,'target_date':date,'record_count':12,'frozen_count':12,'error_count':0,'prediction_hash_unique_count':12,'converge_races':cv,'winning_path_guard':'PASS','converge_semantic_guard':'PASS','result_opened':False}
            (d/f'forecast_{compact}_{v}_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
            hand={'schema_version':'RaceNote-Venue-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0007','target_date':date,'venue':v,'logic_version':logic,'main_sha':main_sha,'race_count':12,'frozen_count':12,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in rows]}
            (d/f'forecast_{compact}_{v}_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          allrows=by['中山']+by['京都'];dm=out/'day_merge';dm.mkdir(parents=True,exist_ok=True)
          (dm/f'forecast_{compact}_all.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2)+'\n')
          (dm/f'forecast_{compact}_all.jsonl').write_text(''.join(json.dumps(q,ensure_ascii=False,separators=(',',':'))+'\n' for q in allrows))
          trs=[]
          for q in allrows:
            m=q['prediction']['marks'];i=q['identity'];other='、'.join(f"△{z['horse_no']} {html.escape(z['horse_name'])}" for z in m['others'])
            trs.append(f"<tr><td>{i['venue']}{i['race_no']}R</td><td>◎{m['main']['horse_no']} {html.escape(m['main']['horse_name'])}</td><td>○{m['second']['horse_no']} {html.escape(m['second']['horse_name'])}</td><td>▲{m['third']['horse_no']} {html.escape(m['third']['horse_name'])}</td><td>{other}</td><td>{html.escape(q['prediction']['reader_facing_reason'])}</td></tr>")
          doc='<!doctype html><html lang="ja"><meta charset="utf-8"><title>RaceNote Forecast 2026-01-18</title><h1>RaceNote Forecast 2026-01-18</h1><p>BTDAY-0007 / 0.3.4-candidate / result_opened=false</p><table border="1"><tr><th>Race</th><th>◎</th><th>○</th><th>▲</th><th>△</th><th>理由</th></tr>'+''.join(trs)+'</table></html>'
          (dm/f'forecast_{compact}_all.html').write_text(doc)
          aud={'schema_version':'RaceNote-Day-Merge-Audit-0.1-draft','selection_id':'BTDAY-0007','target_date':date,'logic_version':logic,'status':'PASS','venue_count':2,'record_count':24,'frozen_count':24,'technical_skips':0,'prediction_hash_unique_count':24,'winning_path_guard':'PASS','result_opened':False,'venues':{'中山':'PASS','京都':'PASS'}}
          (dm/f'forecast_{compact}_all_audit.json').write_text(json.dumps(aud,ensure_ascii=False,indent=2)+'\n')
          hand={'schema_version':'RaceNote-Day-Forecast-Handoff-0.1-draft','selection_id':'BTDAY-0007','target_date':date,'logic_version':logic,'main_sha_at_forecast':main_sha,'day_prep_artifact':'BTDAY-0007-DAY-PREP','day_prep_artifact_digest':'sha256:c1623a92ef4fefeba663acf14aec396777004b6ff9e274d6913fc734cd0d6205','venues':['中山','京都'],'race_count':24,'frozen_count':24,'technical_skips':0,'result_opened':False,'prediction_hashes':[q['audit']['prediction_hash'] for q in allrows]}
          (dm/f'forecast_{compact}_all_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          dp=out/'day_prep';dp.mkdir(parents=True,exist_ok=True)
          for n in ['day_prep_handoff.json','manifest.json','validation_report.json','selected_pool_state.json']:shutil.copy2(root/n,dp/n)
          (out/'README.md').write_text(f"# BTDAY-0007 — {date}\n\n- Forecast logic: `{logic}`\n- DAY PREP: PASS / result_opened=false\n- Venues: 中山, 京都\n- Forecast races: 24 / 24\n- Venue Freeze: PASS x2\n- DAY MERGE: PASS\n- Result opened at Freeze: false\n")
          idx={'selection_id':'BTDAY-0007','target_date':date,'logic_version':logic,'status':'FROZEN','result_opened':False,'day_prep_source':{'artifact_name':'BTDAY-0007-DAY-PREP','run_id':36738501486,'digest':'sha256:c1623a92ef4fefeba663acf14aec396777004b6ff9e274d6913fc734cd0d6205'},'forecast':{'race_count':24,'venue_count':2,'technical_skips':0}}
          (out/'ARTIFACT_INDEX.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          assert len(allrows)==24 and len({q['audit']['prediction_hash'] for q in allrows})==24
          assert all(q['audit']['result_visible_at_freeze'] is False for q in allrows)
          print('PASS: 24 frozen records')
          PY

      - name: Commit canonical Frozen archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0007/20260118
          git commit -m "RaceNote: archive BTDAY-0007 frozen forecast"
          git push origin HEAD:main

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'BTDAY-0007 FORECAST ARCHIVE\nstatus=%s\ncommit=%s\nresult_opened=false\n' "${{ job.status }}" "$sha" > /tmp/c
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/c
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
