name: RaceNote BTDAY-0049 v0.5.0 lane finalize

on:
  push:
    branches:
      - research/racenote-btday0049-v050
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v050/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/racenote-btday0049-v050
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and save all venue cards
        env:
          PYTHONPATH: horse-racing/jrdb/src
        shell: bash
        run: |
          set -euo pipefail
          AB='horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab'
          for venue in 中京 中山 阪神; do
            python horse-racing/jrdb/src/racenote_ab_lane.py save \
              --ab-root "$AB" \
              --lane v050 \
              --decisions "$AB/v050/incoming/$venue.json"
          done
          python horse-racing/jrdb/src/racenote_ab_lane.py freeze \
            --ab-root "$AB" \
            --lane v050
      - name: Verify frozen handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v050/frozen/lane_handoff.json')
          h=json.loads(p.read_text(encoding='utf-8'))
          assert h['selection_id']=='BTDAY-0049'
          assert h['target_date']=='2026-03-22'
          assert h['session_id']=='AB-0575c385144e816bac64'
          assert h['logic_version']=='RaceNote-Human-Context-Reader-0.5.0-candidate'
          assert h['record_count']==36
          assert h['market_blind'] is True
          assert h['target_market_opened'] is False
          assert h['result_opened'] is False
          assert h['sibling_forecast_input_used'] is False
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          print(json.dumps({
            'selection_id':h['selection_id'],
            'session_id':h['session_id'],
            'record_count':h['record_count'],
            'status':h['status'],
            'validator_status':h['validator_status']
          }, ensure_ascii=False))
          PY
      - name: Commit Lane B authored decisions and Freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v050/authored_decisions
          git add horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab/v050/frozen
          git commit -m 'RaceNote: freeze BTDAY-0049 v0.5.0 clean-blind lane'
          git push origin HEAD:research/racenote-btday0049-v050
