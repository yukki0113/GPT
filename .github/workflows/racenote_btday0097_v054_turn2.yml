name: RaceNote BTDAY-0097 v0.5.4 TURN 2

on:
  push:
    branches: [run/btday0097-v054-turn1]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0097/V054_T2_TRIGGER'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/btday0097-v054-turn1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema
      - name: Save Kyoto decisions
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python horse-racing/jrdb/src/racenote_v054_single_day.py save \
            --root horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054 \
            --decisions horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054/incoming/京都.json
      - name: Save Fukushima decisions
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python horse-racing/jrdb/src/racenote_v054_single_day.py save \
            --root horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054 \
            --decisions horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054/incoming/福島.json
      - name: Validate TURN 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054')
          session=json.loads((root/'session.json').read_text())
          assert session['session_id']=='V054-ce71f0178ccc567069c3'
          assert session['status']=='SESSION_SEALED'
          assert session['market_blind'] is True
          assert session['result_opened'] is False
          assert session['target_market_opened'] is False
          for venue in ('京都','福島'):
              p=root/'authored_decisions'/f'{venue}.json'
              d=json.loads(p.read_text())
              assert d['session_id']==session['session_id']
              assert d['selection_id']=='BTDAY-0097'
              assert d['logic_version']=='RaceNote-Human-Context-Reader-0.5.4-candidate'
              assert d['contract_revision']=='v054-context-evidence-r1'
              assert d['venue']==venue
              assert d['race_nos']==list(range(1,13))
              assert len(d['decisions'])==12
          assert not (root/'frozen').exists()
          print(json.dumps({'status':'T2_SAVED','venues':['京都','福島'],'race_count':24,'frozen':False},ensure_ascii=False))
          PY
      - name: Commit TURN 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054/authored_decisions
          git commit -m 'RaceNote: save BTDAY-0097 v0.5.4 TURN 2'
          git push origin HEAD:run/btday0097-v054-turn1
