name: RaceNote BTDAY-0075 finalize temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0075/FINALIZE_TRIGGER'
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0075.json'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0075/20250601/v052')
          parts=root/'incoming_parts'
          inc=root/'incoming'
          inc.mkdir(exist_ok=True)
          ky=[json.loads((parts/f'京都_{i:02d}.json').read_text(encoding='utf-8')) for i in range(1,13)]
          tk=[json.loads((parts/f'東京_{i:02d}.json').read_text(encoding='utf-8')) for i in range(1,9)]
          import subprocess
          api=subprocess.check_output(['gh','api','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/git/blobs/b7bf17a264fe1da96513e4465580f65dc7b08622','--jq','.content'],text=True)
          enc=base64.b64decode(''.join(api.split())).decode()
          tk.extend(json.loads(gzip.decompress(base64.b64decode(enc))))
          assert [x['race_no'] for x in ky]==list(range(1,13))
          assert [x['race_no'] for x in tk]==list(range(1,13))
          (inc/'京都.json').write_text(json.dumps(ky,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (inc/'東京.json').write_text(json.dumps(tk,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Save Freeze Verify
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0075/20250601/v052'
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/京都.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/東京.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v052_single_day.py verify --root "$ROOT"
      - name: Commit outputs
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0075/20250601/v052'
          rm -rf "$ROOT/incoming_parts" "$ROOT/tokyo_rem_00.txt" "$ROOT/tokyo_rem_01.txt" "$ROOT/tokyo_rem_full.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$ROOT"
          git commit -m 'RaceNote: freeze and verify BTDAY-0075 v052'
          git pull --rebase origin main
          git push origin HEAD:main
