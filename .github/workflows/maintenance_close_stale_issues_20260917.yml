name: One-off stale issue cleanup 20260917

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  close-stale-open-issues:
    if: github.event.issue.title == '[MAINTENANCE_CLOSE_STALE_ISSUES_20260917]'
    runs-on: ubuntu-latest
    steps:
      - name: Close all stale open issues except the active issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTIVE_ISSUE: '1045'
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -uo pipefail

          close_issue() {
            local issue_number="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if gh api \
                --method PATCH \
                "/repos/${REPOSITORY}/issues/${issue_number}" \
                -f state=closed \
                -f state_reason=not_planned \
                >/dev/null; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          mapfile -t open_issues < <(
            gh api --paginate \
              "/repos/${REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | .number'
          )

          closed_count=0
          skipped_count=0
          failed_count=0
          failed_issues=()

          for issue_number in "${open_issues[@]}"; do
            if [[ "${issue_number}" == "${ACTIVE_ISSUE}" || "${issue_number}" == "${TRIGGER_ISSUE}" ]]; then
              skipped_count=$((skipped_count + 1))
              continue
            fi

            if close_issue "${issue_number}"; then
              closed_count=$((closed_count + 1))
            else
              failed_count=$((failed_count + 1))
              failed_issues+=("${issue_number}")
            fi
            sleep 0.25
          done

          summary="Bulk stale-Issue cleanup finished. Kept open: #${ACTIVE_ISSUE}. Closed as not_planned: ${closed_count}. Skipped: ${skipped_count}. Failed: ${failed_count}."
          if (( failed_count > 0 )); then
            summary="${summary} Failed issue numbers: ${failed_issues[*]}"
          fi

          gh issue comment "${TRIGGER_ISSUE}" --repo "${REPOSITORY}" --body "${summary}"

          if (( failed_count > 0 )); then
            exit 1
          fi

          gh api \
            --method PATCH \
            "/repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}" \
            -f state=closed \
            -f state_reason=completed \
            >/dev/null
