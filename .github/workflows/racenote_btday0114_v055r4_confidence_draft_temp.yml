name: RaceNote BTDAY-0114 v0.5.5 r4 Confidence Draft
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0114.v055r4-confidence-draft'
permissions:
  contents: write
jobs:
  confidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: horse-racing/jrdb/src
      ROOT: horse-racing/jrdb/backtests/BTDAY-0114/20250913/v055
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save replaceable r4 Confidence Review
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_single_day.py save-confidence --root "$ROOT" --confidence "$ROOT/incoming/confidence.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          p=json.loads((root/'frozen/day_handoff.json').read_text(encoding='utf-8'))
          c=json.loads((root/'confidence_review.json').read_text(encoding='utf-8'))
          assert p['status']=='PREDICTION_FROZEN_CLEAN_BLIND'
          assert p['result_opened'] is False and p['target_market_opened'] is False
          assert c['status']=='CONFIDENCE_REVIEW'
          assert len(c['records'])==24
          counts={g:sum(1 for x in c['records'] if x['confidence']==g) for g in ('A','B','C')}
          print(json.dumps({'status':c['status'],'count':len(c['records']),'grades':counts,'prediction_sha':c['prediction_records_sha256'],'result_opened':False,'target_market_opened':False},ensure_ascii=False))
          PY
      - name: Commit Confidence Review draft
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/confidence_review.json"
          git commit -m "RaceNote: save BTDAY-0114 r4 confidence review draft"
          git pull --rebase origin main
          git push origin HEAD:main
