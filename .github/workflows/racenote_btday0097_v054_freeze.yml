name: RaceNote BTDAY-0097 v0.5.4 FREEZE

on:
  push:
    branches: [run/btday0097-v054-turn1]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0097/V054_FREEZE_TRIGGER'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/btday0097-v054-turn1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema
      - name: Freeze BTDAY-0097 v0.5.4
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT=horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054
          test ! -e "$ROOT/frozen"
          python horse-racing/jrdb/src/racenote_v054_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v054_single_day.py verify --root "$ROOT"
      - name: Audit frozen seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054')
          session=json.loads((root/'session.json').read_text())
          handoff=json.loads((root/'frozen/day_handoff.json').read_text())
          records_raw=(root/'frozen/records.json').read_bytes()
          records=json.loads(records_raw)
          assert handoff['status']=='FROZEN_CLEAN_BLIND'
          assert handoff['validator_status']=='PASS'
          assert handoff['session_id']==session['session_id']=='V054-ce71f0178ccc567069c3'
          assert handoff['selection_id']=='BTDAY-0097'
          assert handoff['target_date']=='2025-11-22'
          assert handoff['logic_version']=='RaceNote-Human-Context-Reader-0.5.4-candidate'
          assert handoff['contract_revision']=='v054-context-evidence-r1'
          assert handoff['record_count']==24==len(records)
          assert handoff['market_blind'] is True
          assert handoff['target_market_opened'] is False
          assert handoff['result_opened'] is False
          assert handoff['records_sha256']==hashlib.sha256(records_raw).hexdigest()
          assert all(r['session_id']==session['session_id'] for r in records)
          assert all(r['selection_id']=='BTDAY-0097' for r in records)
          print(json.dumps({
            'status':'PASS',
            'session_id':session['session_id'],
            'record_count':len(records),
            'records_sha256':handoff['records_sha256'],
            'market_blind':handoff['market_blind'],
            'target_market_opened':handoff['target_market_opened'],
            'result_opened':handoff['result_opened'],
          }, ensure_ascii=False))
          PY
      - name: Commit immutable Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0097/20251122/v054/frozen
          git commit -m 'RaceNote: freeze BTDAY-0097 v0.5.4'
          git push origin HEAD:run/btday0097-v054-turn1
