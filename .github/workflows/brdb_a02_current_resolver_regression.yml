name: BRDB A02 dynamic CURRENT resolver regression

on:
  pull_request:
    paths:
      - 'horse-racing/brdb/src/brdb_current.py'
      - 'horse-racing/brdb/src/brdb_current_live.py'
      - 'horse-racing/brdb/tests/test_brdb_current.py'
      - 'horse-racing/brdb/tests/test_brdb_current_live.py'
      - 'horse-racing/brdb/docs/BRDB_CURRENT_READER_CONTRACT_v0_1.md'
      - 'tools/gpt_io/gdrive/gdrive_api.py'
      - '.github/workflows/brdb_a02_current_resolver_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile resolver and test files
        run: |
          python -m py_compile \
            horse-racing/brdb/src/brdb_current.py \
            horse-racing/brdb/src/brdb_current_live.py \
            horse-racing/brdb/tests/test_brdb_current.py \
            horse-racing/brdb/tests/test_brdb_current_live.py
      - name: Test pinned replay and live CURRENT refresh/rollback
        run: |
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_current*.py' -v
