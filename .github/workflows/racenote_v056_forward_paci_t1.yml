name: RaceNote v0.5.6 Forward PACI T1
on:
  repository_dispatch:
    types: [racenote_v056_forward_paci_t1_request]
  workflow_dispatch:
    inputs:
      target_date:
        description: Target race date YYYY-MM-DD (JST, pre-race)
        required: true
        type: string
      paci_drive_file_id:
        description: Existing target-date PACI file ID verified in canonical Drive PACI folder
        required: true
        type: string
      paci_drive_sha256:
        description: Optional expected SHA-256 from verified Drive file receipt
        required: false
        type: string
      race_lap_expected_period_to:
        description: Last completed day YYYY-MM-DD (strictly before target)
        required: true
        type: string
      analysis_artifact_id:
        description: Accepted canonical Analysis v1.4 Actions artifact ID
        required: true
        type: string
      analysis_generation_id:
        description: Accepted Analysis generation ID from its manifest
        required: true
        type: string
      course_fit_artifact_id:
        description: Accepted Course Fit v0.1 Actions artifact ID
        required: true
        type: string
      race_lap_artifact_id:
        description: Accepted RaceLap CURRENT Actions artifact ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
  issues: read
concurrency:
  group: racenote-v056-forward-${{ inputs.target_date || github.event.client_payload.issue_number }}
  cancel-in-progress: false
jobs:
  prepare-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACI_DRIVE_FILE_ID: ${{ inputs.paci_drive_file_id }}
      PACI_DRIVE_SHA256: ${{ inputs.paci_drive_sha256 }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: horse-racing/jrdb/src
      TARGET_DATE: ${{ inputs.target_date }}
      EXPECTED_PERIOD_TO: ${{ inputs.race_lap_expected_period_to }}
      ANALYSIS_ARTIFACT_ID: ${{ inputs.analysis_artifact_id }}
      ANALYSIS_GENERATION: ${{ inputs.analysis_generation_id }}
      COURSE_FIT_ARTIFACT_ID: ${{ inputs.course_fit_artifact_id }}
      RACE_LAP_ARTIFACT_ID: ${{ inputs.race_lap_artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve explicit manual or owner Issue input
        id: resolve
        env:
          ROUTED_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess

          keys = {
              "target_date": "TARGET_DATE",
              "paci_drive_file_id": "PACI_DRIVE_FILE_ID",
              "paci_drive_sha256": "PACI_DRIVE_SHA256",
              "race_lap_expected_period_to": "EXPECTED_PERIOD_TO",
              "analysis_artifact_id": "ANALYSIS_ARTIFACT_ID",
              "analysis_generation_id": "ANALYSIS_GENERATION",
              "course_fit_artifact_id": "COURSE_FIT_ARTIFACT_ID",
              "race_lap_artifact_id": "RACE_LAP_ARTIFACT_ID",
          }
          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
              number = os.environ.get("ROUTED_ISSUE_NUMBER", "")
              if not number.isdecimal() or int(number) <= 0:
                  raise SystemExit("missing positive routed Issue number")
              issue = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{number}"
              ], text=True))
              title = issue.get("title", "")
              if ("pull_request" in issue
                      or issue.get("user", {}).get("login") != "yukki0113"
                      or not title.startswith("[RACENOTE_V056_FORWARD_PACI_T1]")):
                  raise SystemExit("invalid owner forward T1 request Issue")
              req = json.loads((issue.get("body") or "").strip())
              required = set(keys) - {"paci_drive_sha256"}
              if not isinstance(req, dict) or not required <= set(req) or set(req) - set(keys):
                  raise SystemExit("incorrect forward T1 Issue input fields")
              values = {key: str(req.get(key, "") or "") for key in keys}
              label = title[len("[RACENOTE_V056_FORWARD_PACI_T1]"):].strip()
              if label != values["target_date"].replace("-", ""):
                  raise SystemExit("Issue title date and target_date disagree")
          else:
              values = {key: os.environ.get(env, "") for key, env in keys.items()}
          for key in ("target_date", "race_lap_expected_period_to"):
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", values[key]):
                  raise SystemExit("bad date in " + key)
          if not re.fullmatch(r"[A-Za-z0-9_-]{10,128}", values["paci_drive_file_id"]):
              raise SystemExit("bad PACI Drive ID")
          for key in ("analysis_artifact_id", "course_fit_artifact_id", "race_lap_artifact_id"):
              if not re.fullmatch(r"[1-9][0-9]{6,19}", values[key]):
                  raise SystemExit("bad artifact ID in " + key)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{3,127}", values["analysis_generation_id"]):
              raise SystemExit("bad Analysis generation")
          if values["paci_drive_sha256"] and not re.fullmatch(r"[0-9a-f]{64}", values["paci_drive_sha256"]):
              raise SystemExit("bad PACI SHA256")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, env in keys.items():
                  stream.write(f"{env}={values[key]}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"target_date={values['target_date']}\n")
          PY
      - name: Validate one forward date and immutable target
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          d=os.environ['TARGET_DATE']
          cutoff=os.environ['EXPECTED_PERIOD_TO']
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',d) or date.fromisoformat(d).isoformat()!=d:
              raise SystemExit('Invalid forward date')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',cutoff) or date.fromisoformat(cutoff).isoformat()!=cutoff:
              raise SystemExit('Invalid cutoff')
          now=datetime.now(ZoneInfo('Asia/Tokyo')).date()
          target=date.fromisoformat(d)
          if not now <= target <= now + timedelta(days=7):
              raise SystemExit('Forward date must be today or within 7 days (JST)')
          if not date.fromisoformat(cutoff) < target:
              raise SystemExit('RaceLap cutoff must be before target')
          for key in ('ANALYSIS_ARTIFACT_ID','COURSE_FIT_ARTIFACT_ID','RACE_LAP_ARTIFACT_ID'):
              if not re.fullmatch(r'[1-9][0-9]{6,19}',os.environ[key]):
                  raise SystemExit('Invalid artifact ID: '+key)
          gen=os.environ['ANALYSIS_GENERATION']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{3,127}',gen):
              raise SystemExit('Invalid analysis generation')
          root=Path('horse-racing/jrdb/daily')/d.replace('-','')/'v056_day'
          if root.exists() or root.is_symlink():
              raise SystemExit('Immutable forward T1 target already exists: '+str(root))
          PY
      - name: Install existing RaceNote dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown
      - name: Fetch existing canonical PACI from Google Drive only
        run: |
          set -euo pipefail
          mkdir -p /tmp/racenote-paci
          PACI="/tmp/racenote-paci/PACI${TARGET_DATE:2:2}${TARGET_DATE:5:2}${TARGET_DATE:8:2}.zip"
          args=(
            --date "$TARGET_DATE"
            --drive-file-id "$PACI_DRIVE_FILE_ID"
            --output "$PACI"
            --receipt /tmp/racenote-paci/source_receipt.json
          )
          if [[ -n "$PACI_DRIVE_SHA256" ]]; then
            args+=(--expected-sha256 "$PACI_DRIVE_SHA256")
          fi
          python horse-racing/jrdb/src/racenote_v056_forward_drive_paci.py "${args[@]}"
          echo "PACI=$PACI" >> "$GITHUB_ENV"
      - name: Fetch accepted Analysis, Course Fit and RaceLap artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/v056-artifacts /tmp/racenote-analysis /tmp/racenote-fit /tmp/racenote-lap
          for item in ANALYSIS COURSE_FIT RACE_LAP; do
            key="${item}_ARTIFACT_ID"
            id="${!key}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "/tmp/v056-artifacts/$item.zip"
            unzip -tq "/tmp/v056-artifacts/$item.zip"
          done
          unzip -q /tmp/v056-artifacts/ANALYSIS.zip -d /tmp/v056-artifacts/analysis-inner
          ARCHIVE="$(find /tmp/v056-artifacts/analysis-inner -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | head -n1)"
          test -n "$ARCHIVE"
          case "$ARCHIVE" in
            *.tar.xz) tar -xJf "$ARCHIVE" -C /tmp/racenote-analysis ;;
            *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" -C /tmp/racenote-analysis ;;
            *.zip) unzip -q "$ARCHIVE" -d /tmp/racenote-analysis ;;
          esac
          test -f "/tmp/racenote-analysis/generations/$ANALYSIS_GENERATION/manifest.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('/tmp/racenote-analysis')
          generation=os.environ['ANALYSIS_GENERATION']
          manifest=root/'generations'/generation/'manifest.json'
          value=json.loads(manifest.read_text(encoding='utf-8'))
          if not isinstance(value,dict):
              raise SystemExit('Analysis manifest malformed')
          (root/'current.json').write_text(json.dumps({
              'status':'CURRENT','generation_id':generation,
              'manifest':f'generations/{generation}/manifest.json'
          },ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          unzip -q /tmp/v056-artifacts/COURSE_FIT.zip -d /tmp/racenote-fit
          test -f /tmp/racenote-fit/fit/research/candidate_fit_view.parquet
          mkdir -p /tmp/racenote-lap/current
          unzip -q /tmp/v056-artifacts/RACE_LAP.zip -d /tmp/racenote-lap/current
          test -s /tmp/racenote-lap/current/race_lap.parquet
          test -s /tmp/racenote-lap/current/manifest.json
      - name: Fetch RRDB CURRENT with receipt and CRC
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_fetch_rrdb_current.py --output /tmp/v056-artifacts/rrdb.zip --receipt /tmp/v056-artifacts/rrdb-receipt.json
          unzip -tq /tmp/v056-artifacts/rrdb.zip
          mkdir -p /tmp/racenote-rrdb
          unzip -q /tmp/v056-artifacts/rrdb.zip -d /tmp/racenote-rrdb
          test -f /tmp/racenote-rrdb/postrace_review/v0_1/current.json
      - name: Generate and seal v056 forward RaceNote from PACI
        run: |
          set -euo pipefail
          TARGET="horse-racing/jrdb/daily/${TARGET_DATE//-/}/v056_day"
          BASE_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v056_forward_turn1.py \
            --date "$TARGET_DATE" \
            --paci "$PACI" \
            --paci-source-receipt /tmp/racenote-paci/source_receipt.json \
            --main-sha "$BASE_SHA" \
            --analysis-root /tmp/racenote-analysis \
            --course-fit-root /tmp/racenote-fit \
            --racereview-root /tmp/racenote-rrdb/postrace_review/v0_1 \
            --race-lap-current-bundle /tmp/racenote-lap/current \
            --race-lap-expected-period-to "$EXPECTED_PERIOD_TO" \
            --output-root "$TARGET"
          python - <<'PY'
          import os, json
          from pathlib import Path
          from racenote_v056_single_day import load_session
          root=Path('horse-racing/jrdb/daily')/os.environ['TARGET_DATE'].replace('-','')/'v056_day'
          handoff=json.loads((root/'operation_handoff.json').read_text(encoding='utf-8'))
          session,_,entries=load_session(root/'v056')
          authoring=json.loads((root/'v056/authoring_bundle/manifest.json').read_text(encoding='utf-8'))
          assert handoff['status']=='READY_FOR_V056_AUTHORING'
          assert handoff['execution_mode']=='FORWARD'
          assert handoff['paci_source']['source']=='GOOGLE_DRIVE_CANONICAL_PACI'
          assert handoff['paci_source']['jrdb_direct_fetch'] is False
          assert handoff['paci_source']['sha256']==handoff['paci']['sha256']
          assert session['contract_revision']=='v056-prediction-confidence-audit-newspaper-v1'
          assert session['session_id']==handoff['session_id']==authoring['session_id']
          assert session['target_date']==handoff['target_date']==os.environ['TARGET_DATE']
          assert session['market_blind'] is True and session['result_opened'] is False
          assert len(entries)==len(session['race_roster'])==authoring['race_count']>0
          assert authoring['status']=='READY_FOR_LLM_RACE_BY_RACE_REVIEW'
          assert authoring['automated_marks'] is False and authoring['automated_scoring'] is False
          print('V056_FORWARD_T1_READY',session['session_id'],len(entries))
          PY
      - name: Commit canonical immutable v056 forward RaceNote
        run: |
          set -euo pipefail
          TARGET="horse-racing/jrdb/daily/${TARGET_DATE//-/}/v056_day"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git diff --cached --quiet && { echo 'No T1 payload'; exit 1; }
          git commit -m "RaceNote: seal forward ${TARGET_DATE} v0.5.6 T1"
          git pull --rebase origin main
          test -d "$TARGET/v056"
          git push origin HEAD:main
      - name: Publish lossless v056 authoring bundle
        uses: actions/upload-artifact@v4
        with:
          name: racenote-v056-forward-${{ steps.resolve.outputs.target_date }}-authoring
          path: horse-racing/jrdb/daily/*/v056_day/v056/authoring_bundle/
          retention-days: 7
          if-no-files-found: error
