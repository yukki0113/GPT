name: JRDB Edge Parquet compatibility tests

on:
  push:
    paths:
      - 'horse-racing/jrdb/src/jrdb_edge_analysis_history.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_current_facts.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_current_facts_v0_2.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_match_current_v0_2.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_forward_freeze.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_incremental_shadow.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_statistical_shadow.py'
      - 'horse-racing/jrdb/src/apply_jrdb_edge_v03_statistical_gates_shadow.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_v03_shadow_catalog.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_operational_replay.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_v03_forward_shadow_freeze.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_v03_forward_shadow_freeze.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_operational_replay.py'
      - 'horse-racing/jrdb/src/validate_jrdb_edge_semantic_hierarchy_v0_3.py'
      - 'horse-racing/jrdb/config/jrdb_edge_v03_statistical_gate_policy_shadow.json'
      - 'tools/data-storage/data_storage/materialize.py'
      - 'tools/data-storage/tests/test_materialize.py'
      - 'horse-racing/jrdb/tests/test_jrdb_edge_analysis_history.py'
      - 'horse-racing/jrdb/tests/test_build_jrdb_edge_current_facts.py'
      - 'horse-racing/jrdb/tests/test_jrdb_edge_forward_operations.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_incremental_shadow.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_statistical_shadow.py'
      - 'horse-racing/jrdb/tests/test_apply_jrdb_edge_v03_statistical_gates_shadow.py'
      - 'horse-racing/jrdb/tests/test_build_jrdb_edge_v03_shadow_catalog.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_operational_replay.py'
      - 'horse-racing/jrdb/tests/test_run_jrdb_edge_v03_forward_shadow_freeze.py'
      - 'horse-racing/jrdb/tests/test_run_jrdb_edge_v03_forward_shadow_freeze.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_operational_replay.py'
      - 'horse-racing/jrdb/tests/test_validate_jrdb_edge_semantic_hierarchy_v0_3.py'
      - '.github/workflows/jrdb_edge_forward_freeze_issue.yml'
      - '.github/workflows/jrdb_edge_v03_incremental_shadow_issue.yml'
      - '.github/workflows/jrdb_edge_v03_statistical_shadow_issue.yml'
      - '.github/workflows/jrdb_edge_v03_b2b_gate_issue.yml'
      - '.github/workflows/jrdb_edge_v03_shadow_catalog_issue.yml'
      - '.github/workflows/jrdb_edge_v03_operational_replay_issue.yml'
      - '.github/workflows/jrdb_edge_v03_forward_shadow_freeze_issue.yml'
      - '.github/workflows/jrdb_edge_v03_forward_shadow_freeze_issue.yml'
      - '.github/workflows/jrdb_edge_v03_operational_replay_issue.yml'
      - '.github/workflows/jrdb_edge_parquet_tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/jrdb_edge_analysis_history.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_current_facts.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_current_facts_v0_2.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_match_current_v0_2.py'
      - 'horse-racing/jrdb/src/run_jrdb_edge_forward_freeze.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_incremental_shadow.py'
      - 'horse-racing/jrdb/src/audit_jrdb_edge_v03_statistical_shadow.py'
      - 'horse-racing/jrdb/src/apply_jrdb_edge_v03_statistical_gates_shadow.py'
      - 'horse-racing/jrdb/src/build_jrdb_edge_v03_shadow_catalog.py'
      - 'horse-racing/jrdb/src/validate_jrdb_edge_semantic_hierarchy_v0_3.py'
      - 'horse-racing/jrdb/config/jrdb_edge_v03_statistical_gate_policy_shadow.json'
      - 'tools/data-storage/data_storage/materialize.py'
      - 'tools/data-storage/tests/test_materialize.py'
      - 'horse-racing/jrdb/tests/test_jrdb_edge_analysis_history.py'
      - 'horse-racing/jrdb/tests/test_build_jrdb_edge_current_facts.py'
      - 'horse-racing/jrdb/tests/test_jrdb_edge_forward_operations.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_incremental_shadow.py'
      - 'horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_statistical_shadow.py'
      - 'horse-racing/jrdb/tests/test_apply_jrdb_edge_v03_statistical_gates_shadow.py'
      - 'horse-racing/jrdb/tests/test_build_jrdb_edge_v03_shadow_catalog.py'
      - 'horse-racing/jrdb/tests/test_validate_jrdb_edge_semantic_hierarchy_v0_3.py'
      - '.github/workflows/jrdb_edge_forward_freeze_issue.yml'
      - '.github/workflows/jrdb_edge_v03_incremental_shadow_issue.yml'
      - '.github/workflows/jrdb_edge_v03_statistical_shadow_issue.yml'
      - '.github/workflows/jrdb_edge_v03_b2b_gate_issue.yml'
      - '.github/workflows/jrdb_edge_v03_shadow_catalog_issue.yml'
      - '.github/workflows/jrdb_edge_parquet_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest numpy
          python -m pip install --disable-pip-version-check -q -r tools/data-storage/requirements.txt
      - name: Compile Edge Parquet modules
        run: |
          python -m py_compile \
            horse-racing/jrdb/src/jrdb_edge_analysis_history.py \
            horse-racing/jrdb/src/build_jrdb_edge_current_facts.py \
            horse-racing/jrdb/src/build_jrdb_edge_current_facts_v0_2.py \
            horse-racing/jrdb/src/run_jrdb_edge_match_current_v0_2.py \
            horse-racing/jrdb/src/run_jrdb_edge_forward_freeze.py \
            horse-racing/jrdb/src/audit_jrdb_edge_v03_incremental_shadow.py \
            horse-racing/jrdb/src/audit_jrdb_edge_v03_statistical_shadow.py \
            horse-racing/jrdb/src/apply_jrdb_edge_v03_statistical_gates_shadow.py \
            horse-racing/jrdb/src/build_jrdb_edge_v03_shadow_catalog.py \
            horse-racing/jrdb/src/audit_jrdb_edge_v03_operational_replay.py \
            horse-racing/jrdb/src/run_jrdb_edge_v03_forward_shadow_freeze.py \
            horse-racing/jrdb/src/validate_jrdb_edge_semantic_hierarchy_v0_3.py \
            tools/data-storage/data_storage/materialize.py
      - name: Run Edge Parquet regressions
        env:
          PYTHONPATH: horse-racing/jrdb/src:tools/data-storage
        run: |
          python -m pytest -q \
            horse-racing/jrdb/tests/test_jrdb_edge_analysis_history.py \
            horse-racing/jrdb/tests/test_build_jrdb_edge_current_facts.py \
            horse-racing/jrdb/tests/test_jrdb_edge_forward_operations.py \
            horse-racing/jrdb/tests/test_jrdb_edge_matcher_v0_2_serving.py \
            horse-racing/jrdb/tests/test_jrdb_edge_v02_recent_code_canonical.py \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_incremental_shadow.py \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_statistical_shadow.py \
            horse-racing/jrdb/tests/test_apply_jrdb_edge_v03_statistical_gates_shadow.py \
            horse-racing/jrdb/tests/test_build_jrdb_edge_v03_shadow_catalog.py \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_operational_replay.py \
            horse-racing/jrdb/tests/test_run_jrdb_edge_v03_forward_shadow_freeze.py \
            horse-racing/jrdb/tests/test_validate_jrdb_edge_semantic_hierarchy_v0_3.py \
            tools/data-storage/tests/test_materialize.py
