name: JRDB Edge v0.3 incremental shadow audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_EDGE_V03_INCREMENTAL_SHADOW]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={
              'warehouse_current_drive_file_id','warehouse_manifest_drive_file_id',
              'warehouse_generation_id','warehouse_manifest_sha256',
              'bac_staging_folder_id','kyi_staging_folder_id',
              'sed_staging_folder_id','ukc_staging_folder_id',
              'publication_run_id','publication_artifact_name','publication_sha256'
          }
          missing=sorted(required-set(req))
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          sha_re=re.compile(r'[0-9a-f]{64}')
          if not sha_re.fullmatch(str(req['warehouse_manifest_sha256']).lower()):
              raise SystemExit('invalid warehouse_manifest_sha256')
          if not sha_re.fullmatch(str(req['publication_sha256']).lower()):
              raise SystemExit('invalid publication_sha256')
          if req['warehouse_generation_id']!='jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected Warehouse generation')
          if not isinstance(req['publication_run_id'],int) or req['publication_run_id']<=0:
              raise SystemExit('publication_run_id must be positive')
          Path('/tmp/request.json').write_text(
              json.dumps(req,ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for key,value in req.items():
                  if isinstance(value,(str,int)):
                      f.write(f'{key.upper()}={value}\n')
          PY

      - name: Install dependencies and focused tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest gdown
          python -m pip install --disable-pip-version-check -q -r tools/data-storage/requirements.txt
          PYTHONPATH=horse-racing/jrdb/src:tools/data-storage python -m pytest -q \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_incremental_shadow.py \
            horse-racing/jrdb/tests/test_validate_jrdb_edge_semantic_hierarchy_v0_3.py

      - name: Download and validate Warehouse current + manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/warehouse
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=$WAREHOUSE_CURRENT_DRIVE_FILE_ID&export=download&confirm=t" \
            -o /tmp/warehouse/current.json
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=$WAREHOUSE_MANIFEST_DRIVE_FILE_ID&export=download&confirm=t" \
            -o /tmp/warehouse/manifest.json
          echo "$WAREHOUSE_MANIFEST_SHA256  /tmp/warehouse/manifest.json" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, os
          current=json.load(open('/tmp/warehouse/current.json'))
          manifest=json.load(open('/tmp/warehouse/manifest.json'))
          if current.get('status')!='accepted':
              raise SystemExit('Warehouse current is not accepted')
          if current.get('generation_id')!=os.environ['WAREHOUSE_GENERATION_ID']:
              raise SystemExit('Warehouse current generation mismatch')
          if manifest.get('status')!='PASS' or manifest.get('generation_id')!=current.get('generation_id'):
              raise SystemExit('Warehouse manifest/current mismatch')
          digest=hashlib.sha256(open('/tmp/warehouse/manifest.json','rb').read()).hexdigest()
          if digest!=current.get('manifest_sha256'):
              raise SystemExit(
                  f"Warehouse current manifest SHA mismatch current={current.get('manifest_sha256')} actual={digest}"
              )
          if manifest.get('asset_reference_mode')!='staging_immutable_reference':
              raise SystemExit('unexpected Warehouse asset reference mode')
          PY

      - name: Download immutable Warehouse family staging
        run: |
          set -euo pipefail
          mkdir -p /tmp/warehouse/families
          gdown --folder --remaining-ok --no-cookies \
            "https://drive.google.com/drive/folders/$BAC_STAGING_FOLDER_ID" \
            -O /tmp/warehouse/families/BAC
          gdown --folder --remaining-ok --no-cookies \
            "https://drive.google.com/drive/folders/$KYI_STAGING_FOLDER_ID" \
            -O /tmp/warehouse/families/KYI
          gdown --folder --remaining-ok --no-cookies \
            "https://drive.google.com/drive/folders/$SED_STAGING_FOLDER_ID" \
            -O /tmp/warehouse/families/SED
          gdown --folder --remaining-ok --no-cookies \
            "https://drive.google.com/drive/folders/$UKC_STAGING_FOLDER_ID" \
            -O /tmp/warehouse/families/UKC
          python - <<'PY'
          from pathlib import Path
          for family in ('BAC','KYI','SED','UKC'):
              files=list((Path('/tmp/warehouse/families')/family).rglob('*.parquet'))
              if len(files)!=16:
                  raise SystemExit(f'{family}: expected 16 parquet assets, got {len(files)}')
              print(f'{family}: {len(files)} parquet files, {sum(p.stat().st_size for p in files)} bytes')
          PY

      - name: Download v0.2 STANDARD serving catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/publication
          gh run download "$PUBLICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PUBLICATION_ARTIFACT_NAME" --dir /tmp/publication
          mapfile -t catalogs < <(find /tmp/publication -type f -name edge_serving_catalog_v0_2.jsonl -print)
          test "${#catalogs[@]}" -eq 1
          cp "${catalogs[0]}" /tmp/edge_serving_catalog_v0_2.jsonl
          echo "$PUBLICATION_SHA256  /tmp/edge_serving_catalog_v0_2.jsonl" | sha256sum -c -

      - name: Run v0.3 Stage-B1 parent-relative shadow audit
        env:
          PYTHONPATH: horse-racing/jrdb/src:tools/data-storage
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          python horse-racing/jrdb/src/audit_jrdb_edge_v03_incremental_shadow.py \
            --warehouse-manifest /tmp/warehouse/manifest.json \
            --bac-root /tmp/warehouse/families/BAC \
            --kyi-root /tmp/warehouse/families/KYI \
            --sed-root /tmp/warehouse/families/SED \
            --ukc-root /tmp/warehouse/families/UKC \
            --serving-catalog /tmp/edge_serving_catalog_v0_2.jsonl \
            --output-jsonl /tmp/audit/incremental_edges.jsonl \
            --output-summary /tmp/audit/summary.json
          cp /tmp/request.json /tmp/audit/request.json
          cp /tmp/warehouse/current.json /tmp/audit/warehouse_current.json

      - name: Upload shadow audit
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-edge-v03-incremental-shadow-${{ github.run_id }}
          path: /tmp/audit/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Comment result and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          result=json.load(open('/tmp/audit/summary.json'))
          compact={
              'status':result['status'],
              'run_id':int(os.environ['RUN_ID']),
              'head_sha':os.environ['HEAD_SHA'],
              'artifact_name':f"jrdb-edge-v03-incremental-shadow-{os.environ['RUN_ID']}",
              'warehouse_generation_id':result['warehouse_generation_id'],
              'fact_rows':result['fact_rows'],
              'fact_period_from':result['fact_period_from'],
              'fact_period_to':result['fact_period_to'],
              'served_performance_edges_evaluated':result['served_performance_edges_evaluated'],
              'template_counts':result['template_counts'],
              'shadow_class_counts':result['shadow_class_counts'],
              'parent_complement_sample_bins':result['parent_complement_sample_bins'],
              'raw_incremental_performance_alignment':result['raw_incremental_performance_alignment'],
              'threshold_policy':result['threshold_policy'],
              'mode':'SHADOW_ONLY',
          }
          body='JRDB_EDGE_V03_INCREMENTAL_SHADOW_RESULT\n'+json.dumps(compact,ensure_ascii=False,indent=2,sort_keys=True)
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'],check=True)
          PY

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "JRDB Edge v0.3 Stage-B1 shadow audit failed. No production serving was changed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
