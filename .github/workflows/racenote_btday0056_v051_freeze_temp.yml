name: RaceNote BTDAY-0056 v051 freeze temp
on:
  push:
    branches:
      - racenote/btday0056-v051
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0056.v051-freeze'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racenote/btday0056-v051
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, save, and freeze v051 only
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          AB='horse-racing/jrdb/backtests/BTDAY-0056/20260606/ab'
          python horse-racing/jrdb/src/racenote_ab_lane.py save --ab-root "$AB" --lane v051 --decisions "$AB/v051/incoming/東京.json"
          python horse-racing/jrdb/src/racenote_ab_lane.py save --ab-root "$AB" --lane v051 --decisions "$AB/v051/incoming/阪神.json"
          python horse-racing/jrdb/src/racenote_ab_lane.py freeze --ab-root "$AB" --lane v051
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('horse-racing/jrdb/backtests/BTDAY-0056/20260606/ab/v051/frozen/lane_handoff.json')
          h=json.loads(p.read_text())
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          assert h['record_count']==24
          assert h['market_blind'] is True
          assert h['target_market_opened'] is False
          assert h['result_opened'] is False
          assert h['sibling_forecast_input_used'] is False
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$AB/v051/authored_decisions" "$AB/v051/frozen"
          git commit -m 'RaceNote v0.5.1: freeze BTDAY-0056 v051 clean-blind'
          git push origin HEAD:racenote/btday0056-v051
