name: JRDB Debut same-day UKC correction via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_DEBUT_SAME_DAY_UKC_APPLY]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy scipy scikit-learn
      - name: Apply verified same-day UKC semantics
        run: |
          python - <<'PY'
          """Apply the Controller-resolved same-day UKC availability branch exactly once."""
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          builder = Path('horse-racing/jrdb/src/build_jrdb_debut_ability_snapshot.py')
          replace_once(builder,
              'BUILDER_VERSION = "build_jrdb_debut_ability_snapshot_v0_1"',
              'BUILDER_VERSION = "build_jrdb_debut_ability_snapshot_v0_1_1"')
          replace_once(builder,
              ') -> tuple[dict[str, Any] | None, int]:\n    """Resolve latest strict-prior-day UKC profile and whether a same-day observation exists."""\n    if horse_id is None:\n        return None, 0\n    observations = profiles.get(str(horse_id), [])\n    target = _date_token(race_date)\n    if not observations or target is None:\n        return None, 0\n    dates = [str(item["date_token"]) for item in observations]\n    position = bisect.bisect_left(dates, target)\n    prior = observations[position - 1] if position > 0 else None\n    same_day_exists = 1 if position < len(dates) and dates[position] == target else 0\n    return prior, same_day_exists',
              ') -> tuple[dict[str, Any] | None, int, int]:\n    """Resolve the latest UKC observation verified available pre-race by target date."""\n    if horse_id is None:\n        return None, 0, 0\n    observations = profiles.get(str(horse_id), [])\n    target = _date_token(race_date)\n    if not observations or target is None:\n        return None, 0, 0\n    dates = [str(item["date_token"]) for item in observations]\n    left = bisect.bisect_left(dates, target)\n    right = bisect.bisect_right(dates, target)\n    prior_day_exists = 1 if left > 0 else 0\n    same_day_exists = 1 if left < len(dates) and dates[left] == target else 0\n    selected = observations[right - 1] if right > 0 else None\n    return selected, prior_day_exists, same_day_exists')
          replace_once(builder,
              '"""Build strict-prior-day pedigree and target PRE_RACE training snapshots."""',
              '"""Build verified pre-race pedigree and target PRE_RACE training snapshots."""')
          replace_once(builder,
              'profile, same_day_profile = _resolve_profile(profiles, horse_id, race_date)',
              'profile, prior_day_profile, same_day_profile = _resolve_profile(profiles, horse_id, race_date)')
          replace_once(builder,
              'profile_date,1 if profile else 0,same_day_profile,',
              'profile_date,prior_day_profile,same_day_profile,')
          replace_once(builder,
              '"Strict-prior-day Debut Ability snapshot complete; same-day UKC remains diagnostic only"',
              '"Verified pre-race Debut Ability snapshot complete; same-day UKC allowed by Controller evidence #332"')

          audit = Path('horse-racing/jrdb/src/audit_jrdb_debut_ability_snapshot.py')
          replace_once(audit,
              '        profile_future_or_same_day_use = 0\n        missing_horse_identity = 0',
              '        profile_future_use = 0\n        profile_availability_contract_violation = 0\n        missing_horse_identity = 0')
          replace_once(audit,
              '''            if profile_date is not None:\n                profile_token = _date_token(profile_date)\n                if profile_token is None or profile_token >= target:\n                    profile_future_or_same_day_use += 1\n                if int(profile_prior_day_available) != 1:\n                    profile_future_or_same_day_use += 1\n            elif int(profile_prior_day_available) != 0:\n                profile_future_or_same_day_use += 1''',
              '''            if profile_date is not None:\n                profile_token = _date_token(profile_date)\n                if profile_token is None:\n                    profile_availability_contract_violation += 1\n                elif profile_token > target:\n                    profile_future_use += 1\n                elif profile_token < target and int(profile_prior_day_available) != 1:\n                    profile_availability_contract_violation += 1\n                elif profile_token == target and int(same_day_exists) != 1:\n                    profile_availability_contract_violation += 1\n            elif int(profile_prior_day_available) != 0 or int(same_day_exists) != 0:\n                profile_availability_contract_violation += 1''')
          replace_once(audit,
              '                  SUM(profile_prior_day_available),\n                  SUM(profile_same_day_observation_exists)',
              '                  SUM(profile_prior_day_available),\n                  SUM(profile_same_day_observation_exists),\n                  SUM(CASE WHEN profile_data_date IS NOT NULL THEN 1 ELSE 0 END),\n                  SUM(CASE WHEN profile_data_date=race_date THEN 1 ELSE 0 END)')
          replace_once(audit,
              '                    "profile_same_day_observation_rate":float(summary[3] or 0)/count if count else 0.0,',
              '                    "profile_same_day_observation_rate":float(summary[3] or 0)/count if count else 0.0,\n                    "profile_selected_pre_race_coverage":float(summary[4] or 0)/count if count else 0.0,\n                    "profile_same_day_selected_rate":float(summary[5] or 0)/count if count else 0.0,')
          replace_once(audit,
              '            "profile_future_or_same_day_use":profile_future_or_same_day_use,',
              '            "missing_horse_identity_count":missing_horse_identity,\n            "profile_future_use":profile_future_use,\n            "profile_availability_contract_violation":profile_availability_contract_violation,')

          reporter = Path('horse-racing/jrdb/src/report_jrdb_debut_ability_coverage.py')
          replace_once(reporter,
              '''            profile = sum(int(row["profile_prior_day_available"]) == 1 for row in subset)\n            same_day_profile = sum(int(row["profile_same_day_observation_exists"]) == 1 for row in subset)''',
              '''            profile = sum(int(row["profile_prior_day_available"]) == 1 for row in subset)\n            selected_profile = sum(row.get("profile_data_date") is not None for row in subset)\n            same_day_profile = sum(int(row["profile_same_day_observation_exists"]) == 1 for row in subset)\n            same_day_selected = sum(\n                _date_token(row.get("profile_data_date")) == _date_token(row.get("race_date"))\n                and row.get("profile_data_date") is not None\n                for row in subset\n            )''')
          replace_once(reporter,
              '''                "profile_prior_day_coverage": _coverage(profile, total),\n                "profile_same_day_observation_rate": _coverage(same_day_profile, total),\n                "profile_lag_days_when_prior_available": _distribution(lag_values),''',
              '''                "profile_prior_day_coverage": _coverage(profile, total),\n                "profile_selected_pre_race_coverage": _coverage(selected_profile, total),\n                "profile_same_day_observation_rate": _coverage(same_day_profile, total),\n                "profile_same_day_selected_rate": _coverage(same_day_selected, total),\n                "profile_lag_days_when_selected": _distribution(lag_values),''')

          test = Path('horse-racing/jrdb/tests/test_build_jrdb_debut_ability_snapshot.py')
          replace_once(test,
              '# Same-day UKC intentionally disagrees; it must be diagnostic only, never selected.\n        _insert_profile(connection,"H3","20130101","SAME_DAY_SIRE")',
              '# Same-day UKC is verified PRE_RACE profile data and should be selected.\n        _insert_profile(connection,"H3","20130101","S1")')
          replace_once(test,
              'def test_same_day_results_do_not_enter_debut_prior_and_prior_day_profile_wins(tmp_path: Path) -> None:\n    """Daily batching prevents same-day result leakage and same-day UKC is never selected."""',
              'def test_same_day_results_do_not_enter_debut_prior_and_same_day_profile_is_selected(tmp_path: Path) -> None:\n    """Daily batching blocks same-day result leakage while verified same-day UKC is selected."""')
          replace_once(test,
              '        assert target["profile_data_date"] == "20121220"\n        assert target["profile_same_day_observation_exists"] == 1',
              '        assert target["profile_data_date"] == "20130101"\n        assert target["profile_prior_day_available"] == 1\n        assert target["profile_same_day_observation_exists"] == 1')

          coverage_test = Path('horse-racing/jrdb/tests/test_report_jrdb_debut_ability_coverage.py')
          replace_once(coverage_test,
              '    assert aggregate["profile_prior_day_coverage"] == 1.0\n    assert aggregate["target_label_coverage"] == 2 / 3',
              '    assert aggregate["profile_prior_day_coverage"] == 1.0\n    assert aggregate["profile_selected_pre_race_coverage"] == 1.0\n    assert aggregate["profile_same_day_selected_rate"] == 1 / 3\n    assert aggregate["target_label_coverage"] == 2 / 3')
          PY
      - name: Compile and run focused regressions
        run: |
          python -m py_compile \
            horse-racing/jrdb/src/build_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/src/audit_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/src/report_jrdb_debut_ability_coverage.py
          python -m pytest -q \
            horse-racing/jrdb/tests/test_build_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/tests/test_report_jrdb_debut_ability_coverage.py
      - name: Commit correction to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            horse-racing/jrdb/src/build_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/src/audit_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/src/report_jrdb_debut_ability_coverage.py \
            horse-racing/jrdb/tests/test_build_jrdb_debut_ability_snapshot.py \
            horse-racing/jrdb/tests/test_report_jrdb_debut_ability_coverage.py
          git commit -m 'Allow verified pre-race same-day UKC in Debut snapshot'
          git push origin HEAD:main
      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `JRDB_DEBUT_SAME_DAY_UKC_APPLY_RESULT\nstatus=${{ job.status }}\nrun_id=${context.runId}`,
            });
