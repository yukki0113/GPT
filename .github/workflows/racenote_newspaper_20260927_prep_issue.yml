name: RaceNote Newspaper 20260927 Prep

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  prep:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RACENOTE_NEWSPAPER_20260927_PREP]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check duckdb pyarrow
      - name: Download sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/analysis /tmp/rrdb
          download() {
            local id="$1" out="$2"
            curl -L --fail --retry 4 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "${out}"
            test -s "${out}"
          }
          download "1G57s0Ix5Xb6AcKfZ2HrpOvasLC05dYg8" /tmp/src/PACI260927.zip
          download "1IjtKHRj4Jgw14y5jGyV8sPBNIOzX_DG5" /tmp/src/analysis.tar.xz
          download "1UwNfrupMTHRPhkzULPvClGre4MWz2TFg" /tmp/src/RaceReviewDB_CURRENT.zip
          tar -xJf /tmp/src/analysis.tar.xz -C /tmp/analysis
          unzip -q /tmp/src/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
      - name: Build RaceNote DAY PREP
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
          python horse-racing/jrdb/src/build_racenote_daily.py \
            --date 2026-09-27 \
            --paci /tmp/src/PACI260927.zip \
            --analysis-root /tmp/analysis \
            --racereview-root /tmp/rrdb/postrace_review/v0_1 \
            --output /tmp/racenote \
            --keep-intermediate
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/racenote/RaceNote_20260927')
          m=json.loads((root/'manifest.json').read_text())
          v=json.loads((root/'validation_report.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          fw=v['firewall']
          assert fw['target_result_exposed'] is False
          assert fw['market_exposed'] is False
          assert fw['analysis_as_of_violations']==0
          assert fw['rrdb_as_of_violations']==0
          print(json.dumps({'race_count':m['counts']['races_built'],'horses':m['counts']['horses'],'firewall':fw}))
          PY
      - name: Build Newspaper base
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
          python horse-racing/jrdb/src/jrdb_newspaper_day_build.py \
            --paci /tmp/src/PACI260927.zip \
            --date 20260927 \
            --revision 1 \
            --output-dir /tmp/newspaper/base
          test -s /tmp/newspaper/base/manifest.json
          test -d /tmp/newspaper/base/races
      - name: Package
        run: |
          cd /tmp
          zip -qr /tmp/RACENOTE_NEWSPAPER_20260927_PREP.zip racenote/RaceNote_20260927 newspaper/base
      - uses: actions/upload-artifact@v4
        with:
          name: RACENOTE_NEWSPAPER_20260927_PREP
          path: /tmp/RACENOTE_NEWSPAPER_20260927_PREP.zip
          compression-level: 0
          retention-days: 7
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          r=Path('/tmp/racenote/RaceNote_20260927/manifest.json')
          n=Path('/tmp/newspaper/base/manifest.json')
          if r.exists() and n.exists():
            rm=json.loads(r.read_text()); nm=json.loads(n.read_text())
            payload={'status':'PASS','run_id':int(os.environ['GITHUB_RUN_ID']),'race_count':rm['counts']['races_built'],'horse_count':rm['counts']['horses'],'newspaper_races':len(nm['races'])}
          else:
            payload={'status':'FAILED'}
          print('RACENOTE_NEWSPAPER_20260927_PREP_RESULT')
          print('\\`\\`\\`json')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          print('\\`\\`\\`')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
