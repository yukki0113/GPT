name: RaceNote Forward Producer Acceptance Prepare

on:
  workflow_call:
    inputs:
      producer_evidence_path:
        required: true
        type: string
  repository_dispatch:
    types: [racenote_forward_acceptance_prepare_request]
  workflow_dispatch:
    inputs:
      producer_evidence_path:
        description: Committed producer evidence under horse-racing/jrdb/forward-acceptance/producer-evidence/
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: racenote-forward-acceptance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: horse-racing/jrdb/src
      PRODUCER_EVIDENCE_PATH: ${{ inputs.producer_evidence_path }}
      RACENOTE_FORWARD_FAILURE_JSON: /tmp/racenote-forward-failure.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve producer evidence request
        env:
          ROUTED_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCER_EVIDENCE_PATH}" && "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            test "${ROUTED_ISSUE_NUMBER}" -gt 0
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ROUTED_ISSUE_NUMBER}" --jq .body)"
            path="$(python - "$body" <<'PY'
          import json,sys
          value=json.loads(sys.argv[1])
          print(value.get("producer_evidence_path",""))
          PY
          )"
            echo "PRODUCER_EVIDENCE_PATH=$path" >> "$GITHUB_ENV"
            export PRODUCER_EVIDENCE_PATH="$path"
          fi
          python - <<'PY'
          import os,re
          from pathlib import Path
          from racenote_forward_errors import DataInvalid, OrchestrationMissing, run_cli
          def validate_request():
              path=os.environ["PRODUCER_EVIDENCE_PATH"]
              if (not re.fullmatch(
                      r"horse-racing/jrdb/forward-acceptance/producer-evidence/[A-Za-z0-9_.-]+\.json",
                      path or "")
                      or ".." in path.split("/")):
                  raise DataInvalid("invalid producer_evidence_path")
              if not Path(path).is_file():
                  raise OrchestrationMissing("committed producer evidence not found")
              return 0
          raise SystemExit(run_cli(validate_request, "PRODUCER_EVIDENCE_PREFLIGHT"))
          PY

      - name: Install deterministic validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown

      - name: Materialize exact producer sources
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_forward_source_resolver.py \
            --acceptance "$PRODUCER_EVIDENCE_PATH" \
            --repo-root . \
            --output-root /tmp/racenote-producer-sources
          test -s /tmp/racenote-producer-sources/materialization_receipt.json
          test -d /tmp/racenote-producer-sources/analysis
          test -d /tmp/racenote-producer-sources/course_fit
          test -d /tmp/racenote-producer-sources/race_lap
          test -d /tmp/racenote-producer-sources/finalized_sed

      - name: Fetch accepted RRDB CURRENT
        run: |
          set -euo pipefail
          RRDB_ID="$(python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path(os.environ["PRODUCER_EVIDENCE_PATH"]).read_text(encoding="utf-8"))
          print(data["rrdb"]["file_id"])
          PY
          )"
          mkdir -p /tmp/racenote-rrdb
          python horse-racing/jrdb/src/racenote_fetch_rrdb_current.py \
            --output /tmp/racenote-producer-sources/rrdb.zip \
            --receipt /tmp/racenote-producer-sources/rrdb_receipt.json \
            --expected-file-id "$RRDB_ID"
          unzip -tq /tmp/racenote-producer-sources/rrdb.zip
          unzip -q /tmp/racenote-producer-sources/rrdb.zip -d /tmp/racenote-rrdb
          test -s /tmp/racenote-rrdb/postrace_review/v0_1/current.json

      - name: Verify finalized SED transport integrity
        run: |
          set -euo pipefail
          mapfile -t SEDS < <(find /tmp/racenote-producer-sources/finalized_sed -maxdepth 1 -type f -name 'SED*.zip' | sort)
          test "${#SEDS[@]}" -gt 0
          for path in "${SEDS[@]}"; do
            unzip -tq "$path"
          done
          # No cross-generation field-equality gate: source identity/SHA, ZIP CRC,
          # producer acceptance and cutoff/coverage remain independently verified.

      - name: Build reusable generation-set acceptance
        id: generation
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_forward_generation_acceptance.py \
            --producer-evidence "$PRODUCER_EVIDENCE_PATH" \
            --repo-root . \
            --materialization-receipt /tmp/racenote-producer-sources/materialization_receipt.json \
            --analysis-root /tmp/racenote-producer-sources/analysis \
            --rrdb-root /tmp/racenote-rrdb/postrace_review/v0_1 \
            --rrdb-zip /tmp/racenote-producer-sources/rrdb.zip \
            --rrdb-receipt /tmp/racenote-producer-sources/rrdb_receipt.json \
            --course-fit-root /tmp/racenote-producer-sources/course_fit \
            --race-lap-root /tmp/racenote-producer-sources/race_lap \
            --output /tmp/racenote-producer-sources/generation_set.json
          GENERATION_ID="$(python -c 'import json; print(json.load(open("/tmp/racenote-producer-sources/generation_set.json"))["generation_set_id"])')"
          TARGET="horse-racing/jrdb/forward-acceptance/generation-sets/${GENERATION_ID}.json"
          echo "generation_id=${GENERATION_ID}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          mkdir -p "$(dirname "$TARGET")"
          if [[ -e "$TARGET" ]]; then
            cmp -s "$TARGET" /tmp/racenote-producer-sources/generation_set.json || {
              echo "existing generation-set id has different bytes"; exit 1;
            }
          else
            cp /tmp/racenote-producer-sources/generation_set.json "$TARGET"
          fi

      - name: Commit accepted generation set
        run: |
          set -euo pipefail
          TARGET="${{ steps.generation.outputs.target }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "Generation set already committed with identical bytes."
            exit 0
          fi
          git commit -m "RaceNote: accept forward generation set ${{ steps.generation.outputs.generation_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish acceptance audit
        uses: actions/upload-artifact@v4
        with:
          name: racenote-forward-acceptance-${{ steps.generation.outputs.generation_id }}
          path: |
            /tmp/racenote-producer-sources/materialization_receipt.json
            /tmp/racenote-producer-sources/materialization_receipt.json
            /tmp/racenote-producer-sources/generation_set.json
            /tmp/racenote-producer-sources/rrdb_receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Write structured failure receipt
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("/tmp/racenote-forward-failure.json")
          if not path.is_file():
              path.write_text(json.dumps({
                  "schema_version": "racenote-forward-failure-v1",
                  "status": "FAILED",
                  "error_code": "EXECUTION_FAILED",
                  "failed_stage": "UNCLASSIFIED_RUNNER_STAGE",
                  "detail": "Consult the failing workflow step; no typed contract error was emitted.",
                  "retryable": None
              },sort_keys=True)+"\n",encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Upload producer acceptance failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: racenote-forward-acceptance-failure-${{ github.run_id }}
          path: |
            /tmp/racenote-forward-failure.json
            /tmp/racenote-producer-sources/materialization_receipt.json
          retention-days: 14
          if-no-files-found: error
