name: RaceNote BTDAY-0125 v0.5.5 r6 Prediction Blob Freeze

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/racenote_btday0123_v055r6_prediction_blob_temp.yml'

permissions:
  contents: write

concurrency:
  group: racenote-btday-0125-v055r6-turn2-prediction
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOT: horse-racing/jrdb/backtests/BTDAY-0125/20251026/v055
      BLOB_SHA: 59150843a8513f494efec1fd6971e4d61ad26527
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore LLM-authored prediction draft from Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/incoming"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/blobs/$BLOB_SHA" \
            | python -c 'import json,sys,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$ROOT/incoming/llm_decisions.json"
          python -m json.tool "$ROOT/incoming/llm_decisions.json" >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["ROOT"])/"incoming/llm_decisions.json"
          x=json.loads(p.read_text())
          for r in x:
              k=(r["venue"],r["race_no"])
              if k==("京都",5):
                  r["shot_case"]["case"]="8番グラシアムヘールは事前能力35.6で2番手級、調教47/49かつデキ抜群。1番が初戦で折り合いを欠けば完成度で逆転余地がある。"
              elif k==("新潟",3):
                  r["shot_case"]["case"]="6番カナタコナタは前走1800m3着で能力31。二の脚で先団内を確保して最内から抜け出しかけており、前有利なら残り目がある。"
              elif k==("新潟",8):
                  r["shot_case"]["case"]="7番ピストルスターは前走1800m4着で能力39。出遅れ後に外から押し上げ、直線も渋太く伸びており消耗戦なら浮上できる。"
              elif k==("東京",5):
                  r["honmei_win"]["evidence"]="5番ヴァリスマリネリスは事前能力47.4でこの組最上位。13番43.9を3.5ポイント上回り、調教59/52も安定していて1800m新馬で最も勝ち筋を描きやすい。"
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\\n")
          PY

      - name: Canonical Prediction Freeze
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_v055_turn2_two_phase.py \
            --phase prediction \
            --root "$ROOT" \
            --draft "$ROOT/incoming/llm_decisions.json"

      - name: Commit verified Prediction Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$ROOT"
          git diff --cached --quiet && { echo 'No freeze artifacts to commit'; exit 1; }
          git commit -m "RaceNote: prediction freeze BTDAY-0125 v0.5.5 r6"
          git pull --rebase origin main
          git push origin HEAD:main
