name: JRDB Ability snapshot structural audit via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  build-audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_ABILITY_SNAPSHOT_AUDIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies and regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pytest -q \
            horse-racing/jrdb/tests/test_build_jrdb_index_base_from_raw.py \
            horse-racing/jrdb/tests/test_build_jrdb_runperf_features.py \
            horse-racing/jrdb/tests/test_audit_jrdb_runperf.py \
            horse-racing/jrdb/tests/test_build_jrdb_official_runperf.py \
            horse-racing/jrdb/tests/test_audit_jrdb_official_runperf.py \
            horse-racing/jrdb/tests/test_build_jrdb_ability_snapshot.py
      - name: Parse request
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request=json.loads(os.environ.get('BODY') or '{}')
          lo,hi=int(request.get('from_year',2010)),int(request.get('to_year',2025))
          if lo<2010 or hi>2025 or lo>hi: raise SystemExit('year range must be 2010..2025')
          Path('/tmp/request.json').write_text(json.dumps({'from_year':lo,'to_year':hi}),encoding='utf-8')
          PY
      - name: Build audited source chain and Ability snapshot
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/jrdb_ability/raw /tmp/jrdb_ability/report
          read LO HI < <(python -c "import json; x=json.load(open('/tmp/request.json')); print(x['from_year'],x['to_year'])")
          python horse-racing/jrdb/src/fetch_jrdb_history.py --from-year "$LO" --to-year "$HI" --kinds BAC KYI SED UKC CHA CYB --output-dir /tmp/jrdb_ability/raw --manifest /tmp/jrdb_ability/report/fetch_manifest.jsonl --sleep-seconds 1
          YEARS=$(seq "$LO" "$HI")
          python horse-racing/jrdb/src/build_jrdb_index_base_from_raw.py --raw-root /tmp/jrdb_ability/raw --years $YEARS --db /tmp/jrdb_ability/index.sqlite --no-archive-hash
          python horse-racing/jrdb/src/audit_jrdb_index_base.py --db /tmp/jrdb_ability/index.sqlite --out /tmp/jrdb_ability/report/index_audit.json --no-db-hash
          python horse-racing/jrdb/src/build_jrdb_runperf_features.py --index-db /tmp/jrdb_ability/index.sqlite --out /tmp/jrdb_ability/runperf.sqlite --methods EXPANDING
          python horse-racing/jrdb/src/audit_jrdb_runperf.py --db /tmp/jrdb_ability/runperf.sqlite --out /tmp/jrdb_ability/report/runperf_audit.json --no-db-hash
          python horse-racing/jrdb/src/build_jrdb_official_runperf.py --runperf-db /tmp/jrdb_ability/runperf.sqlite --out /tmp/jrdb_ability/official.sqlite
          python horse-racing/jrdb/src/audit_jrdb_official_runperf.py --db /tmp/jrdb_ability/official.sqlite --source-runperf-db /tmp/jrdb_ability/runperf.sqlite --out /tmp/jrdb_ability/report/official_audit.json --no-db-hash
          python horse-racing/jrdb/src/build_jrdb_ability_snapshot.py --index-db /tmp/jrdb_ability/index.sqlite --official-runperf-db /tmp/jrdb_ability/official.sqlite --out /tmp/jrdb_ability/ability.sqlite
          python horse-racing/jrdb/src/audit_jrdb_ability_snapshot.py --db /tmp/jrdb_ability/ability.sqlite --out /tmp/jrdb_ability/report/ability_snapshot_audit.json
      - name: Build structural result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=Path('/tmp/jrdb_ability/report/ability_snapshot_audit.json')
          result={'status':'failure','run_id':'${{ github.run_id }}','head_sha':'${{ github.sha }}'}
          if report.exists():
              result.update(json.loads(report.read_text(encoding='utf-8')))
              result['status'] = 'success' if result.get('status') == 'PASS' else 'failure'
          Path('/tmp/jrdb_ability/report/workflow_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jrdb-ability-snapshot-audit-${{ github.run_id }}
          path: /tmp/jrdb_ability/report
          if-no-files-found: warn
      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = '/tmp/jrdb_ability/report/workflow_result.json';
            const body = fs.existsSync(p) ? 'JRDB_ABILITY_SNAPSHOT_AUDIT_RESULT\n```json\n' + fs.readFileSync(p,'utf8') + '\n```' : 'JRDB_ABILITY_SNAPSHOT_AUDIT_RESULT\nworkflow failed before report generation';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
