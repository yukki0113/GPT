name: jrdb-raw-backfill-oneshot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  PREFIX: '[JRDB_RAW_BACKFILL_ONESHOT]'

jobs:
  backfill:
    if: startsWith(github.event.issue.title, '[JRDB_RAW_BACKFILL_ONESHOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch SED range and PACI for detected race dates
        id: task
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          ROOT=/tmp/jrdb_raw_backfill
          mkdir -p "$ROOT/sed_raw" "$ROOT/paci_raw" "$ROOT/out"

          python horse-racing/jrdb/src/fetch_jrdb_history.py \
            --from-date 20260101 \
            --to-date 20260823 \
            --kinds SED \
            --output-dir "$ROOT/sed_raw" \
            --sleep-seconds 1.0 \
            --continue-on-error

          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/jrdb_raw_backfill')
          sed_files = sorted((root / 'sed_raw' / 'SED').glob('SED26*.zip'))
          dates = []
          for path in sed_files:
              m = re.fullmatch(r'SED(\d{6})\.zip', path.name)
              if not m:
                  continue
              dates.append('20' + m.group(1))
          if len(dates) != 70:
              raise SystemExit(f'expected 70 SED race dates, found {len(dates)}')
          (root / 'race_dates.txt').write_text('\n'.join(dates) + '\n', encoding='utf-8')
          print(f'detected race dates: {len(dates)}')
          PY

          while IFS= read -r d; do
            python horse-racing/jrdb/src/fetch_jrdb_paci.py \
              --date "$d" \
              --out-dir "$ROOT/paci_raw"
            sleep 1
          done < "$ROOT/race_dates.txt"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import zipfile

          root = Path('/tmp/jrdb_raw_backfill')
          out = root / 'out'
          dates = [x.strip() for x in (root / 'race_dates.txt').read_text(encoding='utf-8').splitlines() if x.strip()]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def validate(path: Path, prefix: str) -> dict:
              if not path.is_file():
                  raise SystemExit(f'missing: {path}')
              if not zipfile.is_zipfile(path):
                  raise SystemExit(f'not zip: {path}')
              with zipfile.ZipFile(path) as zf:
                  bad = zf.testzip()
                  names = [n for n in zf.namelist() if not n.endswith('/')]
              if bad is not None or not names:
                  raise SystemExit(f'invalid zip: {path} bad={bad}')
              return {
                  'filename': path.name,
                  'size_bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'member_count': len(names),
              }

          paci_rows = []
          sed_rows = []
          for d in dates:
              yy = d[2:]
              paci = root / 'paci_raw' / f'PACI{yy}.zip'
              sed = root / 'sed_raw' / 'SED' / f'SED{yy}.zip'
              p = validate(paci, 'PACI')
              s = validate(sed, 'SED')
              p['date'] = d
              s['date'] = d
              paci_rows.append(p)
              sed_rows.append(s)

          if len(paci_rows) != 70 or len(sed_rows) != 70:
              raise SystemExit('file count validation failed')

          paci_manifest = {
              'dataset': 'PACI',
              'from_date': '2026-01-01',
              'to_date': '2026-08-23',
              'race_date_count': len(dates),
              'files': paci_rows,
          }
          sed_manifest = {
              'dataset': 'SED',
              'from_date': '2026-01-01',
              'to_date': '2026-08-23',
              'race_date_count': len(dates),
              'files': sed_rows,
          }

          paci_manifest_path = root / 'paci_manifest.json'
          sed_manifest_path = root / 'sed_manifest.json'
          paci_manifest_path.write_text(json.dumps(paci_manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          sed_manifest_path.write_text(json.dumps(sed_manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          paci_outer = out / 'JRDB_PACI_20260101_20260823.zip'
          sed_outer = out / 'JRDB_SED_20260101_20260823.zip'

          with zipfile.ZipFile(paci_outer, 'w', compression=zipfile.ZIP_STORED) as zf:
              zf.write(paci_manifest_path, 'manifest.json')
              for row in paci_rows:
                  zf.write(root / 'paci_raw' / row['filename'], row['filename'])

          with zipfile.ZipFile(sed_outer, 'w', compression=zipfile.ZIP_STORED) as zf:
              zf.write(sed_manifest_path, 'manifest.json')
              for row in sed_rows:
                  zf.write(root / 'sed_raw' / 'SED' / row['filename'], row['filename'])

          summary = {
              'status': 'success',
              'race_date_count': len(dates),
              'paci_count': len(paci_rows),
              'sed_count': len(sed_rows),
              'paci_outer': {
                  'filename': paci_outer.name,
                  'size_bytes': paci_outer.stat().st_size,
                  'sha256': sha256(paci_outer),
              },
              'sed_outer': {
                  'filename': sed_outer.name,
                  'size_bytes': sed_outer.stat().st_size,
                  'sha256': sha256(sed_outer),
              },
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload backfill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-raw-backfill-20260101-20260823-${{ github.run_id }}
          path: /tmp/jrdb_raw_backfill/out/
          if-no-files-found: error
          retention-days: 30

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          p = Path('/tmp/jrdb_raw_backfill/out/summary.json')
          if p.is_file():
              summary = json.loads(p.read_text(encoding='utf-8'))
          else:
              summary = {'status': 'failure'}
          summary['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          summary['artifact_name'] = f"jrdb-raw-backfill-20260101-20260823-{os.environ['GITHUB_RUN_ID']}"
          body = 'JRDB_RAW_BACKFILL_ONESHOT_RESULT\n```json\n' + json.dumps(summary, ensure_ascii=False, indent=2) + '\n```\n'
          Path('/tmp/result.md').write_text(body, encoding='utf-8')
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.md
