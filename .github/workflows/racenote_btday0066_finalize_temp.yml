name: RaceNote BTDAY-0066 finalize v0.5.2
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0066.finalize'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate venue cards and Freeze
        run: |
          set -euo pipefail
          ROOT="horse-racing/jrdb/backtests/BTDAY-0066/20260524/v052"
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/京都.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/新潟.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/東京.json"
          python horse-racing/jrdb/src/racenote_v052_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v052_single_day.py verify --root "$ROOT"
      - name: Commit validated Freeze
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horse-racing/jrdb/backtests/BTDAY-0066/20260524/v052/authored_decisions
          git add horse-racing/jrdb/backtests/BTDAY-0066/20260524/v052/frozen
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "RaceNote: freeze fresh BTDAY-0066 v0.5.2"
          git push origin HEAD:main
