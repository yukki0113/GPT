name: TMP RRDB SRB Refinement Study
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py'
      - '.github/workflows/tmp_rrdb_srb_refinement_20261015.yml'
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/data-storage/requirements.txt
      - name: Compile study
        run: python -m py_compile horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py
      - uses: actions/download-artifact@v4
        with:
          name: rrdb-current-ready-20261013
          run-id: 38327108923
          github-token: ${{ github.token }}
          path: /tmp/rrdb-current
      - name: Locate RRDB zip
        id: rrdb
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find /tmp/rrdb-current -type f -name '*.zip' | head -1)"
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Run 2024-2026 SRB refinement study
        run: |
          python horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py \
            --rrdb-zip "${{ steps.rrdb.outputs.zip }}" \
            --work-root /tmp/srb-study-work \
            --out /tmp/srb-study-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-rrdb-srb-refinement-${{ github.run_id }}
          path: /tmp/srb-study-out/
