name: TMP RRDB SRB Refinement Study
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py'
      - '.github/workflows/tmp_rrdb_srb_refinement_20261015.yml'
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/data-storage/requirements.txt
      - name: Compile study
        run: python -m py_compile horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py
      - uses: actions/download-artifact@v4
        with:
          name: rrdb-current-ready-20261013
          run-id: 38327108923
          github-token: ${{ github.token }}
          path: /tmp/rrdb-current
      - name: Materialize RRDB zip
        id: rrdb
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/rrdb-current/postrace_review/v0_1/current.json
          (cd /tmp/rrdb-current && zip -qr /tmp/rrdb-current-ready.zip .)
          echo "zip=/tmp/rrdb-current-ready.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tmp-rrdb-srb-refinement-38664393631
          run-id: 38664393631
          github-token: ${{ github.token }}
          path: /tmp/srb-prebuilt
      - name: Run 2024-2026 SRB refinement aggregation
        run: |
          python horse-racing/jrdb/src/tmp_rrdb_srb_refinement_20261015.py \
            --rrdb-zip "${{ steps.rrdb.outputs.zip }}" \
            --work-root /tmp/srb-study-work \
            --out /tmp/srb-study-out \
            --prebuilt-lap /tmp/srb-prebuilt/race_lap_2024_2026.parquet \
            --prebuilt-payouts /tmp/srb-prebuilt/payouts.csv \
            --prebuilt-lap-audit /tmp/srb-prebuilt/race_lap_2024_2026.audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-rrdb-srb-refinement-${{ github.run_id }}
          path: /tmp/srb-study-out/
