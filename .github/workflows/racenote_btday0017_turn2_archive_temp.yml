# registration refresh
name: RaceNote BTDAY-0017 TURN2 archive temp

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0017_TURN2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch frozen archive payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root))
          from tools.gpt_io.gdrive import gdrive_api
          service, automation_root_id = gdrive_api.load_service()
          file_id='1ANN_nKpLC5eoFimI7lXKfDt1F8nakdCX'
          gdrive_api.assert_under_root(service,file_id,automation_root_id)
          meta=gdrive_api.metadata(service,file_id)
          assert meta.get('name')=='BTDAY-0017_ARCHIVE_20260815_v2.zip', meta
          gdrive_api.download(service,file_id,Path('/tmp/bt17.zip'),force=True)
          z=zipfile.ZipFile('/tmp/bt17.zip')
          bad=z.testzip()
          assert bad is None, bad
          print('members',len(z.namelist()))
          z.extractall('/tmp/bt17')
          PY

      - name: Validate v0.4.2 frozen records
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt17/day_merge/forecast_20260815_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/bt17/day_merge/forecast_20260815_all_audit.json').read_text())
          h=json.loads(Path('/tmp/bt17/day_merge/forecast_20260815_all_handoff.json').read_text())
          v=json.loads(Path('/tmp/validator.json').read_text())
          assert v['status']=='PASS', v
          assert a['status']=='FROZEN_CLEAN_BLIND'
          assert a['clean_blind_eligible'] is True
          assert a['result_opened'] is False
          assert a['record_count']==36 and a['prediction_hash_unique_count']==36
          assert a['five_mark_role_guard']=='PASS'
          assert a['mainline_single_shot_guard']=='PASS'
          assert a['reader_facing_prose_guard']=='PASS'
          assert a['market_blind_guard']=='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST'
          assert a['rrdb_contract_guard']=='PASS_RECOMMENDATION_V0_2_GRADE_DISABLED'
          assert h['logic_version']=='RaceNote-Human-Context-Reader-0.4.2-candidate'
          assert h['rrdb_recommendation_contract']=='rrdb-recommendation-signals-v0.2'
          assert h['result_opened'] is False
          print(json.dumps({'validator':v,'audit':a,'handoff':{k:h[k] for k in ['selection_id','target_date','status','clean_blind_eligible','result_opened','logic_version','rrdb_recommendation_contract','race_count']}},ensure_ascii=False,indent=2))
          PY

      - name: Publish canonical archive
        run: |
          set -euo pipefail
          DEST='horse-racing/jrdb/backtests/BTDAY-0017/20260815'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/bt17 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260815_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0017 20260815 forecast"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/commit.txt

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          validator=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else None
          print('RACENOTE_BTDAY0017_TURN2_RESULT')
          print(json.dumps({
            'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL',
            'clean_blind_eligible': True if ok else None,
            'result_opened': False,
            'race_count': 36 if ok else None,
            'technical_skips': 0 if ok else None,
            'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate',
            'rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.2',
            'validator_status': validator.get('status') if validator else None,
            'market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST' if ok else None,
            'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,
            'run_id':int(os.environ['GITHUB_RUN_ID'])
          },ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
