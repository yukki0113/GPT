name: keibailuka-chat

on:
  repository_dispatch:
    types: [keibailuka_request]
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request id
        required: true
        type: string
      date:
        description: Target date (YYYY-MM-DD)
        required: true
        type: string
      venues_json:
        description: JSON array of venues, e.g. ["東京","京都"]
        required: true
        type: string
      request_interval_seconds:
        description: Request interval seconds
        required: false
        default: '0.8'
        type: string
      issue_number:
        description: Optional existing Issue number to receive RESULT and close
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[KEIBAILUKA_REQUEST]'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r horse-racing/fetch_keibailuka_blog/requirements.txt

      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          MANUAL_DATE: ${{ inputs.date }}
          MANUAL_VENUES_JSON: ${{ inputs.venues_json }}
          MANUAL_INTERVAL: ${{ inputs.request_interval_seconds }}
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          prefix = '[KEIBAILUKA_REQUEST]'
          event_name = os.environ['EVENT_NAME']

          if event_name == 'repository_dispatch':
              payload = json.loads(os.environ.get('DISPATCH_PAYLOAD') or '{}')
              if payload.get('source') != 'issue_router':
                  raise SystemExit('repository_dispatch source must be issue_router')
              if str(payload.get('router_version', '')) != '1.0':
                  raise SystemExit('unsupported issue router version')

              title = str(payload.get('title', '') or '')
              if not title.startswith(prefix):
                  raise SystemExit('Unexpected routed issue title')

              request_id = str(payload.get('request_id', '') or '').strip()
              expected_request_id = title[len(prefix):].strip()
              if request_id != expected_request_id:
                  raise SystemExit('routed request_id does not match issue title')

              issue_number_value = payload.get('issue_number')
              try:
                  issue_number = int(issue_number_value)
              except (TypeError, ValueError):
                  raise SystemExit('routed issue_number must be an integer')
              if issue_number <= 0:
                  raise SystemExit('routed issue_number must be positive')

              completed = __import__('subprocess').run(
                  ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue_number}"],
                  check=True, capture_output=True, text=True,
              )
              issue = json.loads(completed.stdout)
              if str(issue.get('title', '') or '') != title:
                  raise SystemExit('routed issue title does not match current Issue')
              body = str(issue.get('body', '') or '').strip()
              try:
                  request = json.loads(body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'Issue body must be raw JSON: {exc}') from exc
              trigger_source = 'issue_router'

          elif event_name == 'workflow_dispatch':
              request_id = str(os.environ.get('MANUAL_REQUEST_ID', '') or '').strip()
              date_text = str(os.environ.get('MANUAL_DATE', '') or '').strip()
              venues_text = str(os.environ.get('MANUAL_VENUES_JSON', '') or '').strip()
              try:
                  venues_value = json.loads(venues_text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'venues_json must be a JSON array: {exc}') from exc

              request = {
                  'date': date_text,
                  'venues': venues_value,
                  'request_interval_seconds': str(
                      os.environ.get('MANUAL_INTERVAL', '') or '0.8'
                  ).strip(),
              }

              issue_text = str(os.environ.get('MANUAL_ISSUE_NUMBER', '') or '').strip()
              if issue_text:
                  if not re.fullmatch(r'[1-9][0-9]*', issue_text):
                      raise SystemExit('manual issue_number must be a positive integer')
                  issue_number = int(issue_text)
              else:
                  issue_number = None
              trigger_source = 'workflow_dispatch'

          else:
              raise SystemExit(f'unsupported event_name: {event_name}')

          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('Invalid request_id')

          date_text = str(request.get('date', '') or '').strip()
          datetime.strptime(date_text, '%Y-%m-%d')

          venues_value = request.get('venues')
          if not isinstance(venues_value, list) or not venues_value:
              raise SystemExit('venues must be a non-empty JSON array')
          venues = [str(value).strip() for value in venues_value]
          valid_venues = {
              '札幌', '函館', '福島', '新潟', '東京',
              '中山', '中京', '京都', '阪神', '小倉'
          }
          if len(set(venues)) != len(venues):
              raise SystemExit('venues must not contain duplicates')
          unknown = [value for value in venues if value not in valid_venues]
          if unknown:
              raise SystemExit('Unsupported venue(s): ' + ', '.join(unknown))

          interval = float(request.get('request_interval_seconds', 0.8))
          if interval < 0:
              raise SystemExit('request_interval_seconds must be >= 0')

          compact_date = date_text.replace('-', '')
          output_dir = (
              f'horse-racing/fetch_keibailuka_blog/'
              f'output_{request_id}_{compact_date}'
          )
          command = [
              'python',
              'horse-racing/fetch_keibailuka_blog/src/fetch_keibailuka_blog.py',
              '--date', date_text,
              '--venues', *venues,
              '--output-dir', output_dir,
              '--interval', str(interval),
          ]

          config = {
              'request_id': request_id,
              'issue_number': issue_number,
              'trigger_source': trigger_source,
              'date': date_text,
              'venues': venues,
              'request_interval_seconds': interval,
              'output_dir': output_dir,
              'command': command,
          }
          Path('/tmp/keibailuka_config.json').write_text(
              json.dumps(config, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as file:
              file.write(f'REQUEST_ID={request_id}\n')
              file.write(f'TARGET_DATE={date_text}\n')
              file.write(f'COMPACT_DATE={compact_date}\n')
              file.write(f'OUTPUT_DIR={output_dir}\n')
              file.write(f'TRIGGER_SOURCE={trigger_source}\n')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as file:
              file.write(f'issue_number={issue_number or ""}\n')
              file.write(f'trigger_source={trigger_source}\n')
          PY

      - name: Save resolved request
        run: |
          mkdir -p "$OUTPUT_DIR"
          cp /tmp/keibailuka_config.json "$OUTPUT_DIR/resolved_request.json"

      - name: Fetch and parse blog
        id: fetch
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          config = json.loads(
              Path('/tmp/keibailuka_config.json').read_text(encoding='utf-8')
          )
          completed = subprocess.run(config['command'], check=False)
          raise SystemExit(completed.returncode)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Validate result
        id: validate
        if: always()
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['OUTPUT_DIR']) / 'validation_report.json'
          if not report_path.exists():
              raise SystemExit(2)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('validation_status') != 'success':
              raise SystemExit(2)
          raise SystemExit(0)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Write run status
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIR"
          {
            echo "request_id=$REQUEST_ID"
            echo "issue_number=${{ steps.request.outputs.issue_number }}"
            echo "trigger_source=$TRIGGER_SOURCE"
            echo "run_id=${{ github.run_id }}"
            echo "head_sha=${{ github.sha }}"
            echo "event_name=${{ github.event_name }}"
            echo "fetch_exit_code=${{ steps.fetch.outputs.exit_code }}"
            echo "validation_exit_code=${{ steps.validate.outputs.exit_code }}"
          } > "$OUTPUT_DIR/run_status.txt"

      - name: Upload outputs
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibailuka-${{ env.REQUEST_ID }}-${{ env.COMPACT_DATE }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Build machine-readable result
        if: always()
        env:
          FETCH_EXIT: ${{ steps.fetch.outputs.exit_code }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          validation_path = output_dir / 'validation_report.json'
          result_path = output_dir / f"keibailuka_{os.environ['COMPACT_DATE']}.json"
          tsv_path = output_dir / f"keibailuka_{os.environ['COMPACT_DATE']}.tsv"

          if validation_path.exists():
              validation = json.loads(validation_path.read_text(encoding='utf-8'))
          else:
              validation = {
                  'validation_status': 'failure',
                  'errors': ['validation report unavailable'],
              }

          entries = []
          source_urls = {}
          if result_path.exists():
              payload = json.loads(result_path.read_text(encoding='utf-8'))
              entries = payload.get('entries', [])
              source_urls = payload.get('source_urls', {})

          config = json.loads(
              Path('/tmp/keibailuka_config.json').read_text(encoding='utf-8')
          )
          result = {
              'request_id': os.environ['REQUEST_ID'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'artifact_name': (
                  f"keibailuka-{os.environ['REQUEST_ID']}-"
                  f"{os.environ['COMPACT_DATE']}-{os.environ['GITHUB_RUN_ID']}"
              ),
              'trigger_source': config['trigger_source'],
              'issue_number': config['issue_number'],
              'date': config['date'],
              'venues': config['venues'],
              'fetch_exit_code': os.environ.get('FETCH_EXIT', ''),
              'validation_exit_code': os.environ.get('VALIDATE_EXIT', ''),
              'validation': validation,
              'source_urls': source_urls,
              'entries': entries,
          }

          parts = [
              'KEIBAILUKA_RESULT',
              '```json',
              json.dumps(result, ensure_ascii=False, indent=2),
              '```',
          ]
          if tsv_path.exists():
              parts.extend(
                  [
                      '',
                      'Plain text',
                      '```text',
                      tsv_path.read_text(encoding='utf-8').rstrip(),
                      '```',
                  ]
              )

          Path('/tmp/result_comment.md').write_text(
              '\n'.join(parts) + '\n',
              encoding='utf-8',
          )

          summary = [
              '## keibailuka execution',
              '',
              f"- trigger_source: {config['trigger_source']}",
              f"- request_id: {config['request_id']}",
              f"- issue_number: {config['issue_number'] or 'none'}",
              f"- date: {config['date']}",
              f"- venues: {', '.join(config['venues'])}",
              f"- artifact: {result['artifact_name']}",
              f"- fetch_exit_code: {result['fetch_exit_code']}",
              f"- validation_exit_code: {result['validation_exit_code']}",
              f"- validation_status: {validation.get('validation_status')}",
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '\n'.join(summary) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Comment machine-readable result
        if: always() && steps.request.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/result_comment.md

      - name: Close request issue
        if: always() && steps.request.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --reason completed

      - name: Fail workflow when fetch or validation failed
        if: always() && (steps.fetch.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0')
        run: exit 1
