name: keibailuka-chat

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[KEIBAILUKA_REQUEST]'

jobs:
  fetch:
    if: startsWith(github.event.issue.title, '[KEIBAILUKA_REQUEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r horse-racing/fetch_keibailuka_blog/requirements.txt

      - name: Parse request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          prefix = '[KEIBAILUKA_REQUEST]'
          title = os.environ['ISSUE_TITLE']
          if not title.startswith(prefix):
              raise SystemExit('Unexpected issue title')

          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request_id):
              raise SystemExit('Invalid request_id in issue title')

          body = (os.environ.get('ISSUE_BODY') or '').strip()
          try:
              request = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Issue body must be raw JSON: {exc}') from exc

          date_text = str(request.get('date', '') or '').strip()
          datetime.strptime(date_text, '%Y-%m-%d')

          venues_value = request.get('venues')
          if not isinstance(venues_value, list) or not venues_value:
              raise SystemExit('venues must be a non-empty JSON array')
          venues = [str(value).strip() for value in venues_value]
          valid_venues = {
              '札幌', '函館', '福島', '新潟', '東京',
              '中山', '中京', '京都', '阪神', '小倉'
          }
          if len(set(venues)) != len(venues):
              raise SystemExit('venues must not contain duplicates')
          unknown = [value for value in venues if value not in valid_venues]
          if unknown:
              raise SystemExit('Unsupported venue(s): ' + ', '.join(unknown))

          interval = float(request.get('request_interval_seconds', 0.8))
          if interval < 0:
              raise SystemExit('request_interval_seconds must be >= 0')

          compact_date = date_text.replace('-', '')
          output_dir = (
              f'horse-racing/fetch_keibailuka_blog/'
              f'output_{request_id}_{compact_date}'
          )
          command = [
              'python',
              'horse-racing/fetch_keibailuka_blog/src/fetch_keibailuka_blog.py',
              '--date', date_text,
              '--venues', *venues,
              '--output-dir', output_dir,
              '--interval', str(interval),
          ]

          config = {
              'request_id': request_id,
              'issue_number': int(os.environ['ISSUE_NUMBER']),
              'date': date_text,
              'venues': venues,
              'request_interval_seconds': interval,
              'output_dir': output_dir,
              'command': command,
          }
          Path('/tmp/keibailuka_config.json').write_text(
              json.dumps(config, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as file:
              file.write(f'REQUEST_ID={request_id}\n')
              file.write(f'TARGET_DATE={date_text}\n')
              file.write(f'COMPACT_DATE={compact_date}\n')
              file.write(f'OUTPUT_DIR={output_dir}\n')
          PY

      - name: Save resolved request
        run: |
          mkdir -p "$OUTPUT_DIR"
          cp /tmp/keibailuka_config.json "$OUTPUT_DIR/resolved_request.json"

      - name: Fetch and parse blog
        id: fetch
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          config = json.loads(
              Path('/tmp/keibailuka_config.json').read_text(encoding='utf-8')
          )
          completed = subprocess.run(config['command'], check=False)
          raise SystemExit(completed.returncode)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Validate result
        id: validate
        if: always()
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['OUTPUT_DIR']) / 'validation_report.json'
          if not report_path.exists():
              raise SystemExit(2)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('validation_status') != 'success':
              raise SystemExit(2)
          raise SystemExit(0)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Write run status
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIR"
          {
            echo "request_id=$REQUEST_ID"
            echo "issue_number=${{ github.event.issue.number }}"
            echo "run_id=${{ github.run_id }}"
            echo "head_sha=${{ github.sha }}"
            echo "event_name=${{ github.event_name }}"
            echo "fetch_exit_code=${{ steps.fetch.outputs.exit_code }}"
            echo "validation_exit_code=${{ steps.validate.outputs.exit_code }}"
          } > "$OUTPUT_DIR/run_status.txt"

      - name: Upload outputs
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibailuka-${{ env.REQUEST_ID }}-${{ env.COMPACT_DATE }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Comment machine-readable result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_EXIT: ${{ steps.fetch.outputs.exit_code }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          validation_path = output_dir / 'validation_report.json'
          result_path = output_dir / f"keibailuka_{os.environ['COMPACT_DATE']}.json"
          tsv_path = output_dir / f"keibailuka_{os.environ['COMPACT_DATE']}.tsv"

          if validation_path.exists():
              validation = json.loads(validation_path.read_text(encoding='utf-8'))
          else:
              validation = {
                  'validation_status': 'failure',
                  'errors': ['validation report unavailable'],
              }

          entries = []
          source_urls = {}
          if result_path.exists():
              payload = json.loads(result_path.read_text(encoding='utf-8'))
              entries = payload.get('entries', [])
              source_urls = payload.get('source_urls', {})

          config = json.loads(
              Path('/tmp/keibailuka_config.json').read_text(encoding='utf-8')
          )
          result = {
              'request_id': os.environ['REQUEST_ID'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'artifact_name': (
                  f"keibailuka-{os.environ['REQUEST_ID']}-"
                  f"{os.environ['COMPACT_DATE']}-{os.environ['GITHUB_RUN_ID']}"
              ),
              'date': config['date'],
              'venues': config['venues'],
              'fetch_exit_code': os.environ.get('FETCH_EXIT', ''),
              'validation_exit_code': os.environ.get('VALIDATE_EXIT', ''),
              'validation': validation,
              'source_urls': source_urls,
              'entries': entries,
          }

          parts = [
              'KEIBAILUKA_RESULT',
              '```json',
              json.dumps(result, ensure_ascii=False, indent=2),
              '```',
          ]
          if tsv_path.exists():
              parts.extend(
                  [
                      '',
                      'Plain text',
                      '```text',
                      tsv_path.read_text(encoding='utf-8').rstrip(),
                      '```',
                  ]
              )

          Path('/tmp/result_comment.md').write_text(
              '\n'.join(parts) + '\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/result_comment.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}"

      - name: Fail workflow when fetch or validation failed
        if: always() && (steps.fetch.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0')
        run: exit 1
