name: MD public engine source bundle temporary
on:
  push:
    paths:
      - '.github/workflows/md-engine-local-bundle-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: md-m6-8-public-source
          path: |
            master-duel/engine_m6/
            master-duel/engine_m5/
            master-duel/engine_m4/
            master-duel/engine_m3/
            master-duel/engine_m2/
          if-no-files-found: warn
          retention-days: 1
