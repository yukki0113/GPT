name: RaceNote BTDAY-0028 Finalize

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  finalize:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RACENOTE_BTDAY028_FINALIZE]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact fixed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/prep_outer /tmp/prep_inner /tmp/prep_for_freeze
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1WjZvuCDPeF_ABI--X8l-oWBrA4sqSdi2&export=download&confirm=t" \
            -o /tmp/src/prepared.jsonl
          echo "4bff3d0140a58ac2195c3a47ae9fc0fc16753676fc275b9d77770ef21dd7afb2  /tmp/src/prepared.jsonl" | sha256sum -c -
          test "$(grep -c '^{' /tmp/src/prepared.jsonl)" -eq 24

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11206589655/zip" > /tmp/src/prep_artifact.zip
          unzip -q /tmp/src/prep_artifact.zip -d /tmp/prep_outer
          test -s /tmp/prep_outer/BTDAY-0028_DAY_PREP_20260607_FINAL.zip
          unzip -q /tmp/prep_outer/BTDAY-0028_DAY_PREP_20260607_FINAL.zip -d /tmp/prep_inner
          test -d /tmp/prep_inner/RaceNote_20260607/reader
          cp -a /tmp/prep_inner/RaceNote_20260607/reader /tmp/prep_for_freeze/reader
          cat > /tmp/prep_for_freeze/day_prep_handoff.json <<'JSON'
          {
            "selection_id": "BTDAY-0028",
            "target_date": "2026-06-07",
            "status": "DAY_PREP_PASS",
            "race_count": 24,
            "result_opened": false
          }
          JSON
      - name: Freeze fixed model-authored records
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
          python horse-racing/jrdb/src/racenote_freeze_prepared_forecast.py \
            --prep-root /tmp/prep_for_freeze \
            --prepared-records /tmp/src/prepared.jsonl \
            --output-root /tmp/frozen \
            --selection-id BTDAY-0028 \
            --date 2026-06-07 \
            --main-sha 2837381bfee13cbbe24e93ddff1d52a8cfc7cd93
      - name: Validate frozen records and prose
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py \
            --records /tmp/frozen/day_merge/forecast_20260607_all.jsonl \
            --output /tmp/frozen/day_merge/forecast_20260607_validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/frozen/day_merge')
          validator=json.loads((root/'forecast_20260607_validator.json').read_text())
          assert validator.get('status')=='PASS'
          assert validator.get('record_count')==24
          assert validator.get('error_count')==0
          audit_path=root/'forecast_20260607_all_audit.json'
          audit=json.loads(audit_path.read_text())
          audit['reader_facing_prose_guard']='PASS'
          audit['anti_template']=validator.get('anti_template')
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Immutability gate
        run: |
          set -euo pipefail
          canonical="horse-racing/jrdb/backtests/BTDAY-0028/20260607/day_merge/forecast_20260607_all_handoff.json"
          python horse-racing/jrdb/src/racenote_freeze_immutability_guard.py \
            --candidate-handoff /tmp/frozen/day_merge/forecast_20260607_all_handoff.json \
            --canonical-handoff "$canonical" \
            --output /tmp/frozen/day_merge/forecast_20260607_immutability.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/frozen/day_merge/forecast_20260607_immutability.json'))
          assert x['status'] in {'NEW_FREEZE','IDENTICAL_RETRY_NOOP'}, x
          PY
      - name: Render daily HTML
        run: |
          python horse-racing/jrdb/src/render_racenote_forecast_html.py \
            --records /tmp/frozen/day_merge/forecast_20260607_all.jsonl \
            --output /tmp/frozen/forecast_20260607.html
      - name: Publish canonical archive
        id: publish
        run: |
          set -euo pipefail
          target="horse-racing/jrdb/backtests/BTDAY-0028/20260607"
          if test -e "$target"; then
            echo "canonical target already exists; refusing overwrite"
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          cp -a /tmp/frozen "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "racenote: freeze BTDAY-0028 2026-06-07"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          h=Path('/tmp/frozen/day_merge/forecast_20260607_all_handoff.json')
          v=Path('/tmp/frozen/day_merge/forecast_20260607_validator.json')
          if h.exists() and v.exists():
              hand=json.loads(h.read_text()); val=json.loads(v.read_text())
              payload={
                'status':hand.get('status'),
                'selection_id':hand.get('selection_id'),
                'target_date':hand.get('target_date'),
                'race_count':hand.get('race_count'),
                'result_opened':hand.get('result_opened'),
                'validator_status':val.get('status'),
                'validator_errors':val.get('error_count'),
                'anti_template':(val.get('anti_template') or {}).get('status'),
                'commit_sha':os.environ.get('COMMIT_SHA')
              }
          else:
              payload={'status':'FAILED_BEFORE_FREEZE','commit_sha':os.environ.get('COMMIT_SHA')}
          print('RACENOTE_BTDAY028_FINAL_RESULT')
          print('\`\`\`json')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          print('\`\`\`')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
