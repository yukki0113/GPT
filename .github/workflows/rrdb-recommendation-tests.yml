name: RRDB Recommendation v0.5 Tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/src/jrdb_recommendation_select.py'
      - 'horse-racing/jrdb/src/jrdb_recommendation_reverse.py'
      - 'horse-racing/jrdb/src/racenote_rrdb_enrichment.py'
      - 'horse-racing/jrdb/src/racenote_racereview_adapter.py'
      - 'horse-racing/jrdb/src/racenote_history_enrichment.py'
      - 'horse-racing/jrdb/src/build_racenote_daily.py'
      - 'horse-racing/jrdb/src/jrdb_newspaper_merge_external.py'
      - 'horse-racing/jrdb/src/build_momotaro_newspaper_projection.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_reverse_v05.py'
      - 'horse-racing/jrdb/tests/test_racenote_rrdb_v05.py'
      - 'horse-racing/jrdb/config/recommendation/rear_srb_q20_v0_1.json'
      - 'horse-racing/jrdb/tests/test_jrdb_newspaper_merge_external.py'
      - 'horse-racing/jrdb/tests/test_build_momotaro_newspaper_projection.py'
      - '.github/workflows/rrdb-recommendation-tests.yml'
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/src/jrdb_recommendation_select.py'
      - 'horse-racing/jrdb/src/jrdb_recommendation_reverse.py'
      - 'horse-racing/jrdb/src/racenote_rrdb_enrichment.py'
      - 'horse-racing/jrdb/src/racenote_racereview_adapter.py'
      - 'horse-racing/jrdb/src/racenote_history_enrichment.py'
      - 'horse-racing/jrdb/src/build_racenote_daily.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_signals.py'
      - 'horse-racing/jrdb/tests/test_jrdb_recommendation_reverse_v05.py'
      - 'horse-racing/jrdb/tests/test_racenote_rrdb_v05.py'
      - 'horse-racing/jrdb/config/recommendation/rear_srb_q20_v0_1.json'
      - '.github/workflows/rrdb-recommendation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'duckdb==1.1.3' pytest
      - name: Compile recommendation cutover modules
        working-directory: horse-racing/jrdb
        run: |
          python -m py_compile src/jrdb_recommendation_signals.py
          python -m py_compile src/jrdb_recommendation_select.py
          python -m py_compile src/jrdb_recommendation_reverse.py
          python -m py_compile src/racenote_rrdb_enrichment.py
          python -m py_compile src/racenote_racereview_adapter.py
          python -m py_compile src/racenote_history_enrichment.py
          python -m py_compile src/build_racenote_daily.py
          python -m py_compile src/racenote_v052_historical_probe.py
          python -m py_compile src/racenote_v052_from_historical_warehouse.py
          python -m py_compile src/racenote_v053_from_historical_warehouse.py
          python -m py_compile src/racenote_v052_from_paci.py
          python -m py_compile src/racenote_v053_from_paci.py
          python -m py_compile src/jrdb_newspaper_merge_external.py
          python -m py_compile src/build_momotaro_newspaper_projection.py
      - name: Run recommendation contract tests
        working-directory: horse-racing/jrdb/tests
        run: |
          python -m unittest -v test_jrdb_recommendation_signals
          python -m unittest -v test_jrdb_recommendation_reverse_v05
          PYTHONPATH=../src python -m pytest -q test_racenote_rrdb_v05.py
          python -m unittest -v test_racenote_racereview_adapter
          python -m unittest -v test_jrdb_newspaper_merge_external
          python -m unittest -v test_build_momotaro_newspaper_projection


  extract1017:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r tools/data-storage/requirements.txt gdown
      - name: Download canonical Drive inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/rrdb1017/input /tmp/rrdb1017/course-fit
          gdown 1mg0mTJhvouvfjok2FA5WYF7TsMPweTQA -O /tmp/rrdb1017/input/PACI261017.zip
          gdown 1UwNfrupMTHRPhkzULPvClGre4MWz2TFg -O /tmp/rrdb1017/input/RaceReviewDB_CURRENT.zip
          gdown 1ljLg_jxVdZtpJ_Aqku0L93y8nwnfXUTQ -O /tmp/rrdb1017/input/course_fit_part1.zip
          gdown 1yxP0EtPRmcTnrAgmgBMlAAj257r3pgYE -O /tmp/rrdb1017/input/course_fit_part2.zip
          unzip -q /tmp/rrdb1017/input/course_fit_part1.zip -d /tmp/rrdb1017/course-fit
          unzip -q /tmp/rrdb1017/input/course_fit_part2.zip -d /tmp/rrdb1017/course-fit
      - name: Download audited RaceLap snapshot
        uses: actions/download-artifact@v4
        with:
          name: tmp-rrdb-srb-refinement-38664393631
          run-id: 38664393631
          github-token: ${{ github.token }}
          path: /tmp/rrdb1017/racelap
      - name: Run canonical RRDB v0.5 reverse
        run: |
          set -euo pipefail
          mkdir -p /tmp/rrdb1017/work /tmp/rrdb1017/out
          python horse-racing/jrdb/src/jrdb_recommendation_reverse.py \
            --race-date 2026-10-17 \
            --paci-zip /tmp/rrdb1017/input/PACI261017.zip \
            --current-zip /tmp/rrdb1017/input/RaceReviewDB_CURRENT.zip \
            --course-fit-root /tmp/rrdb1017/course-fit \
            --race-lap-parquet /tmp/rrdb1017/racelap/race_lap_2024_2026.parquet \
            --work-root /tmp/rrdb1017/work \
            --output-json /tmp/rrdb1017/out/RRDB_v0_5_reverse_20261017.json
      - name: Build detailed match CSV
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          src=Path('/tmp/rrdb1017/out/RRDB_v0_5_reverse_20261017.json')
          out=Path('/tmp/rrdb1017/out/RRDB_v0_5_Matches_20261017.csv')
          payload=json.loads(src.read_text(encoding='utf-8'))
          rows=[]
          for item in payload.get('recommendations', []):
              signals=item.get('signals') or []
              source=item.get('source_run') or {}
              rows.append({
                  'date':payload.get('race_date'),
                  'venue_code':str(item.get('venue_code') or '').zfill(2),
                  'race_no':item.get('race_no'),
                  'race_key':item.get('target_race_key'),
                  'horse_no':item.get('horse_no'),
                  'horse_name':item.get('horse_name_paci'),
                  'matched_signal_count':item.get('matched_signal_count'),
                  'matched_signal_ids':'|'.join(item.get('matched_signal_ids') or []),
                  'matched_signal_labels':'|'.join(str(s.get('label') or '') for s in signals),
                  'human_summary':item.get('human_summary'),
                  'recommendation_comment':item.get('newspaper_comment'),
                  'recommendation_version':item.get('contract_version'),
                  'source_race_date':source.get('race_date'),
                  'source_race_key':source.get('race_key'),
              })
          rows.sort(key=lambda r:(r['venue_code'],int(r['race_no'] or 0),int(r['horse_no'] or 0)))
          fields=list(rows[0].keys()) if rows else [
              'date','venue_code','race_no','race_key','horse_no','horse_name',
              'matched_signal_count','matched_signal_ids','matched_signal_labels',
              'human_summary','recommendation_comment','recommendation_version',
              'source_race_date','source_race_key'
          ]
          with out.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(json.dumps({'rows':len(rows),'output':str(out)},ensure_ascii=False))
          PY
      - name: Build PWA handoff CSV
        run: |
          python horse-racing/jrdb/src/build_rrdb_newspaper_handoff.py \
            --reverse-json /tmp/rrdb1017/out/RRDB_v0_5_reverse_20261017.json \
            --output-csv /tmp/rrdb1017/out/RRDB_v0_5_PWA_handoff_20261017.csv
      - uses: actions/upload-artifact@v4
        with:
          name: rrdb-v0-5-matches-20261017
          path: /tmp/rrdb1017/out/
