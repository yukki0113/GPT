name: GPT Git Update via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gpt-git-update-main
  cancel-in-progress: false

jobs:
  apply-update:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[gpt-git-update]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and validate request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          body = os.environ.get("ISSUE_BODY", "")

          message_match = re.search(r"(?m)^commit_message:\s*(.+?)\s*$", body)
          if message_match is None:
              raise SystemExit("Missing 'commit_message:' line.")

          commit_message = message_match.group(1).strip()
          if len(commit_message) == 0 or len(commit_message) > 200:
              raise SystemExit("commit_message must be 1..200 characters.")

          patch_match = re.search(r"```diff\s*\n(.*?)\n```", body, flags=re.DOTALL)
          if patch_match is None:
              raise SystemExit("Missing fenced ```diff patch block.")

          patch = patch_match.group(1)
          if len(patch.strip()) == 0:
              raise SystemExit("Patch is empty.")

          # This route is repository-wide by default. Only security-sensitive
          # locations and obvious credential material are blocked here.
          forbidden_exact_paths = {
              ".env",
          }
          forbidden_path_prefixes = (
              ".github/workflows/",
              ".git/",
          )
          forbidden_names = {
              "jrdb_secret.py",
          }
          forbidden_secret_suffixes = (
              ".pem",
              ".key",
              ".p12",
              ".pfx",
          )
          forbidden_name_fragments = (
              "secret",
              "credential",
              "password",
          )

          header_paths = []
          for line in patch.splitlines():
              if not (line.startswith("--- ") or line.startswith("+++ ")):
                  continue

              raw = line[4:].split("\t", 1)[0].strip()
              if raw == "/dev/null":
                  continue
              if raw.startswith("a/") or raw.startswith("b/"):
                  raw = raw[2:]
              header_paths.append(raw)

          if not header_paths:
              raise SystemExit("No changed paths found in patch headers.")

          checked = set()
          for raw in header_paths:
              if raw in checked:
                  continue
              checked.add(raw)

              path = pathlib.PurePosixPath(raw)
              parts = path.parts

              if path.is_absolute() or ".." in parts:
                  raise SystemExit(f"Unsafe path: {raw}")

              normalized = path.as_posix()
              normalized_lower = normalized.lower()
              name_lower = path.name.lower()

              if normalized_lower in forbidden_exact_paths:
                  raise SystemExit(f"Forbidden credential path: {raw}")

              if normalized_lower.startswith(forbidden_path_prefixes):
                  raise SystemExit(f"Protected path: {raw}")

              if any(part.lower() == ".git" for part in parts):
                  raise SystemExit(f"Forbidden Git metadata path: {raw}")

              if name_lower in forbidden_names:
                  raise SystemExit(f"Forbidden credential file: {raw}")

              if name_lower.endswith(forbidden_secret_suffixes):
                  raise SystemExit(f"Private-key/certificate file rejected: {raw}")

              if any(fragment in name_lower for fragment in forbidden_name_fragments):
                  raise SystemExit(f"Potential credential file rejected: {raw}")

          pathlib.Path("/tmp/gpt-update.patch").write_text(patch + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit_message={commit_message}\n")

          print("Validated repository paths:")
          for raw in sorted(checked):
              print(f"  {raw}")
          PY

      - name: Check patch applies cleanly
        run: git apply --check --whitespace=error-all /tmp/gpt-update.patch

      - name: Apply patch
        run: git apply --whitespace=error-all /tmp/gpt-update.patch

      - name: Show status and diff
        run: |
          git diff --check
          git status --short
          git diff --stat
          git diff

      - name: Compile changed Python files
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain=v1", "-z"],
              check=True,
              capture_output=True,
          )

          python_files = []
          for record in result.stdout.split(b"\0"):
              if not record:
                  continue
              text = record.decode("utf-8", errors="strict")
              status = text[:2]
              raw_path = text[3:]

              if status.strip() == "D":
                  continue

              if " -> " in raw_path:
                  raw_path = raw_path.split(" -> ", 1)[1]

              path = pathlib.Path(raw_path)
              if path.suffix == ".py" and path.exists():
                  python_files.append(path)

          if not python_files:
              print("No changed Python files.")
              raise SystemExit(0)

          for path in sorted(set(python_files)):
              print(f"py_compile: {path}")
              subprocess.run(
                  [sys.executable, "-m", "py_compile", str(path)],
                  check=True,
              )
          PY

      - name: Commit and push
        id: commit
        env:
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Patch produced no changes."
            exit 1
          fi

          git config user.name "gpt-git-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "$COMMIT_MESSAGE"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cat > /tmp/result_comment.md <<EOF
          ✅ Git update applied and pushed to \`main\`.

          Commit: \`$COMMIT_SHA\`
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result_comment.md
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/result_comment.md <<EOF
          ❌ Git update was not pushed. Validation, patch application, tests, commit, or push failed.

          Workflow run: $RUN_URL

          The issue is left open for inspection/retry.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/result_comment.md
