name: boatrace-ops-20260825

on:
  push:
    branches:
      - ops/boatrace-20260825
  pull_request:
    branches:
      - main

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r boat-racing/requirements.txt
      - name: Create config
        run: |
          cat > /tmp/config_20260825.json <<'JSON'
          {
            "date": "20260825",
            "venues": [
              {"name": "常滑", "code": "08", "day": "4日目"},
              {"name": "三国", "code": "10", "day": "2日目"},
              {"name": "徳山", "code": "18", "day": "3日目"},
              {"name": "若松", "code": "20", "day": "4日目"}
            ],
            "output_dir": "boat-racing/output_20260825",
            "request_interval_seconds": 1.0
          }
          JSON
      - name: Fetch racelists
        id: fetch
        continue-on-error: true
        run: |
          set +e
          python boat-racing/src/fetch_boatrace_racelist.py --config /tmp/config_20260825.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write run status
        if: always()
        run: |
          mkdir -p boat-racing/output_20260825
          echo "fetch_exit_code=${{ steps.fetch.outputs.exit_code }}" > boat-racing/output_20260825/run_status.txt
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-20260825-racelist
          path: boat-racing/output_20260825/
          if-no-files-found: error
