name: RaceNote BTDAY-0032 Finalize

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  finalize:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RACENOTE_BTDAY032_FINALIZE]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact DAY PREP artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/prep_art /tmp/prep
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11210457122/zip > /tmp/prep_artifact.zip
          unzip -q /tmp/prep_artifact.zip -d /tmp/prep_art
          unzip -q /tmp/prep_art/BTDAY-0032_DAY_PREP_20260301_FINAL.zip -d /tmp/prep
          test -d /tmp/prep/RaceNote_20260301/reader
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/prep/RaceNote_20260301')
          readers=list((root/'reader').glob('*.json'))
          handoff={
            'selection_id':'BTDAY-0032',
            'target_date':'2026-03-01',
            'status':'DAY_PREP_PASS',
            'result_opened':False,
            'race_count':len(readers),
            'source_artifact_id':11210457122,
            'source_artifact_sha256':'1b8d0c3122cfd56f31b5b7caee77ce8440f68409936ea72f83934ffea0bd2cb3'
          }
          (root/'day_prep_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(handoff,ensure_ascii=False))
          PY
      - name: Download fixed model-authored records
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-6bdc-81fa-9583-1d21913186de/raw?se=2026-10-02T05%3A15%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=0ccf5d67-64f1-5f6d-a2bc-a4bcc93a1b2d&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A34%3A46Z&ske=2026-10-03T02%3A34%3A46Z&sks=b&skv=2026-02-06&sig=Z2sQiLgJjgRA9YwB6iFpWnN51h6a19r3BZ9IXenBuPk%3D" \
            -o /tmp/BTDAY-0032_prepared_forecast.jsonl
          test -s /tmp/BTDAY-0032_prepared_forecast.jsonl
          echo "5c0ec97d6a69904bae4a6a851d8878c42ee13d1ae34330e10bc7db7e83e5311d  /tmp/BTDAY-0032_prepared_forecast.jsonl" | sha256sum -c -
      - name: Freeze prepared forecast
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
          python horse-racing/jrdb/src/racenote_freeze_prepared_forecast.py \
            --prep-root /tmp/prep/RaceNote_20260301 \
            --prepared-records /tmp/BTDAY-0032_prepared_forecast.jsonl \
            --output-root /tmp/frozen \
            --selection-id BTDAY-0032 \
            --date 2026-03-01 \
            --main-sha 483c17db5ffd0f78b63eabb5c6e0bc6d47e69a6f
      - name: Validate frozen records
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py \
            --records /tmp/frozen/day_merge/forecast_20260301_all.json \
            --output /tmp/frozen/day_merge/forecast_20260301_validator.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/frozen/day_merge/forecast_20260301_validator.json'))
          assert x['status']=='PASS', x
          assert x['error_count']==0, x
          assert x['anti_template']['status']=='PASS', x
          print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Immutability guard
        run: |
          set -euo pipefail
          CANON="horse-racing/jrdb/backtests/BTDAY-0032/20260301/day_merge/forecast_20260301_all_handoff.json"
          python horse-racing/jrdb/src/racenote_freeze_immutability_guard.py \
            --candidate-handoff /tmp/frozen/day_merge/forecast_20260301_all_handoff.json \
            --canonical-handoff "$CANON" \
            --output /tmp/frozen/day_merge/forecast_20260301_immutability.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/frozen/day_merge/forecast_20260301_immutability.json'))
          assert x['status'] in {'NEW_FREEZE','IDENTICAL_RETRY'}
          print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Render HTML
        run: |
          python horse-racing/jrdb/src/render_racenote_forecast_html.py \
            --records /tmp/frozen/day_merge/forecast_20260301_all.json \
            --output /tmp/frozen/forecast_20260301.html
      - name: Publish canonical
        run: |
          set -euo pipefail
          DEST="horse-racing/jrdb/backtests/BTDAY-0032/20260301"
          if [ -e "$DEST" ]; then
            echo "Canonical destination already exists; refusing overwrite."
            exit 3
          fi
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/frozen "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "racenote: freeze BTDAY-0032 2026-03-01"
          git push origin HEAD:main
          echo "CANONICAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Comment result
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          h=Path('/tmp/frozen/day_merge/forecast_20260301_all_handoff.json')
          v=Path('/tmp/frozen/day_merge/forecast_20260301_validator.json')
          i=Path('/tmp/frozen/day_merge/forecast_20260301_immutability.json')
          if h.exists() and v.exists() and i.exists():
            hh=json.loads(h.read_text()); vv=json.loads(v.read_text()); ii=json.loads(i.read_text())
            payload={
              'status':hh.get('status'),'selection_id':hh.get('selection_id'),
              'target_date':hh.get('target_date'),'race_count':hh.get('race_count'),
              'result_opened':hh.get('result_opened'),'validator_status':vv.get('status'),
              'validator_errors':vv.get('error_count'),
              'anti_template':(vv.get('anti_template') or {}).get('status'),
              'immutability':ii.get('status'),
              'canonical_commit':os.environ.get('CANONICAL_COMMIT')
            }
          else:
            payload={'status':'FAILED'}
          print('RACENOTE_BTDAY032_FINALIZE_RESULT')
          print('\\`\\`\\`json')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          print('\\`\\`\\`')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Close issue
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
