name: RRDB Historical Plus1 Audit Temp
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[RRDB_HIST_PLUS1_AUDIT_TEMP]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb gdown pandas pyarrow
      - name: Download inputs
        run: |
          mkdir -p /tmp/rrdb/input /tmp/rrdb/out
          gdown 1UwNfrupMTHRPhkzULPvClGre4MWz2TFg -O /tmp/rrdb/input/current.zip
          gdown 1nAZsvZT3pFSeCvuIbYyzqo7L230HV9Zv -O /tmp/rrdb/input/PACI260905.zip
          gdown 1w7Qo4WpH8TcTtCTXEAK-qv3CH5Sa2BNU -O /tmp/rrdb/input/PACI260906.zip
          gdown 1IM8xl7FNLz02E6jZz0UOAZrxX2gpiZC_ -O /tmp/rrdb/input/PACI260912.zip
          gdown 110iUUdb3un4BGdbSG5AUOVXjKJ4PVAoJ -O /tmp/rrdb/input/PACI260913.zip
          gdown 1AL3Ua_2WY_NlKfMloSOinbzVZVRmjgNi -O /tmp/rrdb/input/PACI260919.zip
          gdown 14HiihawoEMU7kAA6OZ9mzQMwtJ2bckE0 -O /tmp/rrdb/input/PACI260920.zip
          gdown 1dRo6fYQkKaj905FJHjUzhQMNrxXc8KZk -O /tmp/rrdb/input/PACI260921.zip
          gdown 1VdkTE06TwBIWt2vxi98qGgft6jIfwzIv -O /tmp/rrdb/input/PACI260922.zip
          gdown 1PSYw6uL2Gx-rbtcJsgsGFZZNGTnMc4od -O /tmp/rrdb/input/PACI260926.zip
          gdown 1G57s0Ix5Xb6AcKfZ2HrpOvasLC05dYg8 -O /tmp/rrdb/input/PACI260927.zip
      - name: Audit plus1
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import duckdb, pandas as pd
          from jrdb_raw import Parser,ReaderAudit,iter_archive_records
          from jrdb_next_watch_reverse import _race_review_root,_relation_paths,_table_sql
          from jrdb_postrace_review_standard import CLASS_NUMERIC
          from jrdb_postrace_review import normalize_class_group

          dates=["0905","0906","0912","0913","0919","0920","0921","0922","0926","0927"]
          root=_race_review_root(Path('/tmp/rrdb/input/current.zip'),Path('/tmp/rrdb/work'))
          cur=json.loads((root/'current.json').read_text())
          man=json.loads((root/cur['manifest']).read_text())
          con=duckdb.connect()
          hp=_table_sql(_relation_paths(root,man,'fact_horse_performance'))
          rr=_table_sql(_relation_paths(root,man,'fact_race_review'))

          audit=ReaderAudit(); parser=Parser(audit); entrants=[]
          for d in dates:
              z=Path(f'/tmp/rrdb/input/PACI26{d}.zip')
              bac=[parser.bac(x) for _,x in iter_archive_records(z,'BAC',audit)]
              by={x['race_key_raw']:x for x in bac}
              for _,raw in iter_archive_records(z,'KYI',audit):
                  k=parser.kyi(raw); b=by[k['race_key_raw']]
                  entrants.append({
                    'target_date':pd.Timestamp(f'2026-09-{d[-2:]}'),
                    'target_race_key':k['race_key_raw'],
                    'target_race_horse_key':k['race_horse_key'],
                    'target_horse_no':k['horse_no'],
                    'horse_id':k['blood_registration_no'],
                    'horse_name':k['horse_name'],
                  })
          e=pd.DataFrame(entrants); con.register('entrants',e)
          prev=con.execute(f"""
            SELECT e.*, p.race_date previous_race_date,p.race_key previous_race_key,
              p.horse_no previous_horse_no,p.finish previous_finish,p.time_sec previous_time_sec,
              p.venue_code previous_venue_code,p.surface_code previous_surface_code,
              p.distance_m previous_distance_m,p.declared_class_group previous_declared_class_group,
              p.time_class_equivalent,p.time_class_equivalent_numeric,p.class_curve_monotonic,
              p.historical_standard_time_sec,p.adjusted_standard_time_sec,p.day_track_adjustment_sec,
              p.day_adjustment_applied,p.horse_adjusted_delta_sec,p.horse_adjusted_delta_per_1000m,
              r.standard_sample_count,r.standard_scope_level,r.standard_confidence,
              r.standard_sample_start_date,r.standard_sample_end_date,r.time_delta_basis
            FROM entrants e
            LEFT JOIN {hp} p ON e.horse_id=p.horse_id
              AND p.race_date < e.target_date
              AND p.surface_code IN ('1','2') AND COALESCE(p.finish,0)>0 AND COALESCE(p.time_sec,0)>0
            LEFT JOIN {rr} r ON p.race_key=r.race_key
            QUALIFY ROW_NUMBER() OVER(PARTITION BY e.target_race_horse_key ORDER BY p.race_date DESC,p.race_key DESC)=1
          """).fetchdf()

          prev['declared_numeric']=prev.previous_declared_class_group.map(CLASS_NUMERIC)
          prev['historical_gap']=prev.time_class_equivalent_numeric-prev.declared_numeric
          plus=prev[prev.historical_gap>=1.0].copy()
          assert len(plus)==29, f"expected 29 got {len(plus)}"

          winners=con.execute(f"""
            SELECT race_date,race_key,venue_code,surface_code,distance_m,declared_class_group,
                   time_sec,day_track_adjustment_sec,day_adjustment_applied
            FROM {hp}
            WHERE finish=1 AND COALESCE(time_sec,0)>0 AND surface_code IN ('1','2')
          """).fetchdf()

          classes=list(CLASS_NUMERIC)
          rows=[]
          for _,x in plus.iterrows():
              peers=winners[
                (winners.race_date < x.previous_race_date)&
                (winners.venue_code==x.previous_venue_code)&
                (winners.surface_code==x.previous_surface_code)&
                (winners.distance_m==x.previous_distance_m)
              ].copy()
              peers['neutral_time']=peers.time_sec-peers.day_track_adjustment_sec.where(peers.day_adjustment_applied.fillna(False),0).fillna(0)
              med={}; ns={}
              for cls in classes:
                  v=peers.loc[peers.declared_class_group==cls,'neutral_time'].dropna()
                  if len(v):
                      med[cls]=float(v.median()); ns[cls]=int(len(v))
              source_neutral=float(x.previous_time_sec-(x.day_track_adjustment_sec if bool(x.day_adjustment_applied) and pd.notna(x.day_track_adjustment_sec) else 0))
              nearest=None
              if med:
                  nearest=min(med,key=lambda cls:(abs(source_neutral-med[cls]),CLASS_NUMERIC[cls]))
              mono=True
              pts=[(CLASS_NUMERIC[c],med[c]) for c in classes if c in med]
              pts.sort()
              for i in range(1,len(pts)):
                  if pts[i][1]>=pts[i-1][1]:
                      mono=False;break
              own_adv=None
              if pd.notna(x.adjusted_standard_time_sec):
                  own_adv=float(x.adjusted_standard_time_sec-x.previous_time_sec)
              stored_cls=str(x.time_class_equivalent)
              scope4_gap=None
              if nearest is not None and x.previous_declared_class_group in CLASS_NUMERIC:
                  scope4_gap=CLASS_NUMERIC[nearest]-CLASS_NUMERIC[x.previous_declared_class_group]
              flags=[]
              if x.historical_gap>=2: flags.append('GAP_GE2')
              if stored_cls in {'G3','G2','G1'}: flags.append('GRADED_EQ')
              if int(x.standard_sample_count or 0)<10: flags.append('OWN_STD_N_LT10')
              if int(x.standard_scope_level or 99)>=5: flags.append('BROAD_OWN_STD')
              if nearest and CLASS_NUMERIC.get(stored_cls)!=CLASS_NUMERIC.get(nearest): flags.append('SCOPE4_DISAGREE')
              if not mono: flags.append('SCOPE4_NON_MONOTONIC')
              rows.append({
                'target_date':str(x.target_date.date()),'horse_name':x.horse_name,'horse_id':x.horse_id,
                'previous_date':str(x.previous_race_date.date()),'previous_race_key':x.previous_race_key,
                'previous_finish':int(x.previous_finish),'declared_class':x.previous_declared_class_group,
                'actual_time_sec':float(x.previous_time_sec),
                'stored_equivalent':stored_cls,'stored_equivalent_numeric':float(x.time_class_equivalent_numeric),
                'historical_gap':float(x.historical_gap),'own_adjusted_standard_sec':float(x.adjusted_standard_time_sec) if pd.notna(x.adjusted_standard_time_sec) else None,
                'faster_than_own_standard_sec':own_adv,
                'own_standard_n':int(x.standard_sample_count) if pd.notna(x.standard_sample_count) else None,
                'own_standard_scope':int(x.standard_scope_level) if pd.notna(x.standard_scope_level) else None,
                'own_standard_confidence':str(x.standard_confidence) if pd.notna(x.standard_confidence) else None,
                'scope4_neutral_equivalent':nearest,'scope4_gap':scope4_gap,'scope4_curve_monotonic':mono,
                'scope4_class_medians':med,'scope4_class_n':ns,'flags':'|'.join(flags) if flags else 'OK'
              })
          out=pd.DataFrame(rows).sort_values(['historical_gap','target_date'],ascending=[False,True])
          out.to_csv('/tmp/rrdb/out/historical_plus1_audit.csv',index=False,encoding='utf-8-sig')
          Path('/tmp/rrdb/out/historical_plus1_audit.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2,default=str))

          summary={
            'n':len(rows),
            'gap_ge2':sum(r['historical_gap']>=2 for r in rows),
            'graded_equivalent':sum(r['stored_equivalent'] in {'G3','G2','G1'} for r in rows),
            'own_std_n_lt10':sum((r['own_standard_n'] or 0)<10 for r in rows),
            'broad_own_std_scope5plus':sum((r['own_standard_scope'] or 99)>=5 for r in rows),
            'scope4_disagree':sum('SCOPE4_DISAGREE' in r['flags'] for r in rows),
            'scope4_nonmonotonic':sum(not r['scope4_curve_monotonic'] for r in rows),
          }
          md=['# Historical +1 audit','',f"Summary: {json.dumps(summary,ensure_ascii=False)}",'',
              '|馬|前走|着|所属|実時計|保存相当|gap|所属標準|標準差|N/scope|広域同条件相当|flags|',
              '|---|---|---:|---|---:|---|---:|---:|---:|---|---|---|']
          for r in rows:
              std='—' if r['own_adjusted_standard_sec'] is None else f"{r['own_adjusted_standard_sec']:.2f}"
              adv='—' if r['faster_than_own_standard_sec'] is None else f"{r['faster_than_own_standard_sec']:+.2f}"
              md.append(f"|{r['horse_name']}|{r['previous_date']}|{r['previous_finish']}|{r['declared_class']}|{r['actual_time_sec']:.2f}|{r['stored_equivalent']}|{r['historical_gap']:+.2f}|{std}|{adv}|{r['own_standard_n']}/{r['own_standard_scope']}|{r['scope4_neutral_equivalent'] or '—'}|{r['flags']}|")
          Path('/tmp/rrdb/out/comment.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/rrdb/out/comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
