name: RaceNote v0.5.6 shared BTDAY T1

on:
  workflow_call:
    inputs:
      selection_id:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      race_lap_mode:
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-*.v056-turn1'

permissions:
  contents: write
  actions: read

concurrency:
  group: racenote-v056-shared-t1
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      source_mode: ${{ steps.route.outputs.source_mode }}
      selection_id: ${{ steps.route.outputs.selection_id }}
      is_v2: ${{ steps.route.outputs.is_v2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha || 'main' }}
          fetch-depth: 2
      - name: Resolve and validate immutable source
        id: route
        env:
          PYTHONPATH: horse-racing/jrdb/src
          REQUESTED_SELECTION: ${{ inputs.selection_id }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          from racenote_v056_t1_orchestrator import read_selection, mixed_source_enabled
          from racenote_v056_btday_source_router import verify_readiness_receipt
          sid=os.environ.get('REQUESTED_SELECTION','')
          if not sid:
              changes=subprocess.check_output(['git','diff','--name-only',os.environ['BEFORE'],os.environ['AFTER']],text=True).splitlines()
              ids=[m.group(1) for x in changes if (m:=re.fullmatch(r'horse-racing/jrdb/backtests/requests/(BTDAY-\d{4})\.v056-turn1',x))]
              if len(ids)!=1: raise SystemExit('expected exactly one T1 request')
              sid=ids[0]
          if not re.fullmatch(r'BTDAY-\d{4}',sid): raise SystemExit('invalid selection ID')
          if int(sid.split('-')[1]) <= 137:
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write(f'selection_id={sid}\nsource_mode=historical_warehouse\nis_v2=false\n')
              raise SystemExit(0)
          selection=read_selection(sid)
          v2=selection.get('selection_schema_version')=='btday-source-selection-v2'
          mode=selection.get('source_mode') if v2 else 'historical_warehouse'
          if v2:
              if not mixed_source_enabled(mode): raise SystemExit('BTDAY source mode has no accepted T1 proof')
              verify_readiness_receipt(selection['source_row'],Path.cwd())
          if mode not in ('paci','historical_warehouse'): raise SystemExit('unsupported source')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'selection_id={sid}\nsource_mode={mode}\nis_v2={str(v2).lower()}\n')
          PY
  prepare:
    needs: route
    if: needs.route.outputs.source_mode == 'historical_warehouse'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JRDB_USER: ${{ secrets.JRDB_USER }}
      JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
      PYTHONPATH: horse-racing/jrdb/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha || 'main' }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve one future canonical BTDAY request
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REQUESTED_SELECTION: ${{ inputs.selection_id }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
          REQUESTED_RACELAP_MODE: ${{ inputs.race_lap_mode }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          if os.environ.get('REQUESTED_SELECTION'):
              expected=os.environ.get('REQUESTED_BASE_SHA','')
              actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              if not re.fullmatch('[0-9a-f]{40}',expected) or actual!=expected:
                  raise SystemExit('Pinned T1 generation SHA mismatch')
              ids=[(os.environ['REQUESTED_SELECTION'],int(os.environ['REQUESTED_SELECTION'].split('-')[-1]))]
          else:
              changes=subprocess.check_output(
                  ['git','diff','--name-only',os.environ['BEFORE'],os.environ['AFTER']],
                  text=True).splitlines()
              ids=[]
          if not os.environ.get('REQUESTED_SELECTION'):
              for file in changes:
                  m=re.fullmatch(r'horse-racing/jrdb/backtests/requests/(BTDAY-(\d{4}))\.v056-turn1',file)
                  if m:
                      ids.append((m.group(1),int(m.group(2))))
          if len(ids)!=1:
              raise SystemExit(f'Expected one BTDAY T1 request, got {ids}')
          sid, number=ids[0]
          if number<=137:
              print(f'SKIP_LEGACY_REQUEST {sid}')
              with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SKIP_T1=true\n')
              raise SystemExit(0)
          path=Path('horse-racing/jrdb/backtests')/sid/'selection.json'
          selection=json.loads(path.read_text(encoding='utf-8'))
          v2=selection.get('selection_schema_version')=='btday-source-selection-v2'
          if selection.get('selection_id')!=sid or selection.get('n')!=1 or len(selection.get('dates',[]))!=1:
              raise SystemExit('Invalid canonical single-day selection')
          if len(selection.get('sources',[]))!=1 or selection['sources'][0].get('source_mode')!='historical_warehouse':
              raise SystemExit('Shared historical T1 requires historical_warehouse source')
          mode=selection.get('race_lap_mode','baseline')
          if mode not in ('baseline','approved_current'):
              raise SystemExit(f'Unsupported BTDAY RaceLap mode: {mode}')
          requested=os.environ.get('REQUESTED_RACELAP_MODE','')
          if requested and requested!=mode:
              raise SystemExit(f'RaceLap mode request/selection mismatch: {requested} vs {mode}')
          date=selection['dates'][0]
          if not re.fullmatch(r'20\d{2}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid target date')
          # The current historical golden materialization provides BAC/KYI 2025.
          # Never silently reuse the 2025 raw archives for another target year.
          if not v2 and not date.startswith('2025-'):
              raise SystemExit(f'Historical raw archive year not supported: {date}')
          target=Path('horse-racing/jrdb/backtests')/sid/date.replace('-','')
          if target.exists() or target.is_symlink():
              raise SystemExit(f'Immutable T1 already exists: {target}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'BTDAY_ID={sid}\n')
              f.write(f'RACELAP_INPUT_MODE={mode}\n')
              f.write(f'BTDAY_TARGET_DATE={date}\n')
              f.write(f'BTDAY_DATE_RAW={date.replace("-","")}\n')
              f.write(f'BTDAY_YEAR={date[:4]}\n')
              f.write(f'SOURCE_V2={str(v2).lower()}\n')
              f.write(f'TARGET={target}\n')
          print(f'BTDAY_REQUEST_ACCEPTED {sid} {date}')
          PY
      - name: Install dependencies
        if: env.SKIP_T1 != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/data-storage/requirements.txt
          python -m pip install gdown jsonschema pandas numpy
      - name: Confirm immutable target is new
        if: env.SKIP_T1 != 'true'
        run: test ! -e "$TARGET" && test ! -L "$TARGET"
      - name: Stage and verify accepted historical v2 inputs
        if: env.SKIP_T1 != 'true' && env.SOURCE_V2 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          s=json.loads((Path('horse-racing/jrdb/backtests')/os.environ['BTDAY_ID']/'selection.json').read_text())
          row=s['source_row']; aid=str(row['staging_artifact_id']); sha=row['staging_sha256']
          if not re.fullmatch(r'[1-9][0-9]*',aid) or not re.fullmatch(r'[0-9a-f]{64}',sha): raise SystemExit('invalid staged artifact identity')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'STAGE_ARTIFACT_ID={aid}\nSTAGE_SHA={sha}\n')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$STAGE_ARTIFACT_ID/zip" > /tmp/v056-staged.zip
          python horse-racing/jrdb/src/racenote_v056_btday_staged_input.py \
            --archive /tmp/v056-staged.zip --sha256 "$STAGE_SHA" --output /tmp/v056-staged
          root=/tmp/v056-staged/inputs
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path('horse-racing/jrdb/backtests')/os.environ['BTDAY_ID']/'selection.json').read_text())
          receipt=json.loads(Path(s['source_row']['readiness_receipt_path']).read_text())
          print(receipt['as_of_evidence']['race_lap']['coverage_through'],file=open('/tmp/v056-lap-cutoff','w'))
          PY
          python horse-racing/jrdb/src/racenote_v056_btday_historical_preflight.py \
            --date "$BTDAY_TARGET_DATE" --selection-id "$BTDAY_ID" \
            --selection "horse-racing/jrdb/backtests/$BTDAY_ID/selection.json" --repository-root "$GITHUB_WORKSPACE" \
            --warehouse-root "$root/warehouse" --raw-root "$root/raw" --analysis-root "$root/analysis" \
            --course-fit-root "$root/course_fit" --racereview-root "$root/rrdb" \
            --rrdb-zip "$root/rrdb.zip" --rrdb-receipt "$root/rrdb_receipt.json" \
            --race-lap-current-bundle "$root/racelap" --race-lap-expected-period-to "$(cat /tmp/v056-lap-cutoff)" \
            --output /tmp/v056-historical-preflight.json
          {
            echo "WAREHOUSE_ROOT=$root/warehouse"
            echo "RAW_ROOT=$root/raw"
            echo "ANALYSIS_ROOT=$root/analysis"
            echo "COURSE_FIT_ROOT=$root/course_fit"
            echo "RRDB_ROOT=$root/rrdb"
            echo "RACELAP_ROOT=$root/racelap"
          } >> "$GITHUB_ENV"
      - name: Materialize accepted Historical Warehouse inputs
        if: env.SKIP_T1 != 'true' && env.SOURCE_V2 != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/historical
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          manifest=Path('horse-racing/jrdb/config/public_drive/racenote_historical_golden_20251228_v1.json')
          data=json.loads(manifest.read_text())
          wanted={'golden_01','golden_02','golden_03','golden_04','golden_11','golden_12','golden_13','golden_14','golden_15','golden_16','golden_17','golden_18','golden_19'}
          wanted.update(f'golden_{i:02d}' for i in range(21,49))
          for row in data['artifacts']:
              if row['artifact_id'] not in wanted:
                  continue
              cmd=['python','tools/gpt_io/public_drive/fetch.py','--manifest',str(manifest),'--artifact',row['artifact_id'],'--output-root','/tmp/historical']
              last=None
              for attempt in range(1,6):
                  try:
                      subprocess.run(cmd,check=True)
                      last=None
                      break
                  except subprocess.CalledProcessError as exc:
                      last=exc
                      if attempt < 5:
                          time.sleep(attempt * 5)
              if last is not None:
                  raise last
          PY
          mkdir -p /tmp/historical/analysis
          tar -xJf /tmp/historical/analysis.tar.xz -C /tmp/historical/analysis
          {
            echo 'WAREHOUSE_ROOT=/tmp/historical/warehouse'
            echo 'RAW_ROOT=/tmp/historical/raw'
            echo 'ANALYSIS_ROOT=/tmp/historical/analysis'
            echo 'COURSE_FIT_ROOT=/tmp/course-fit'
            echo 'RRDB_ROOT=/tmp/rrdb/postrace_review/v0_1'
            echo 'RACELAP_ROOT=/tmp/racelap'
          } >> "$GITHUB_ENV"
      - name: Materialize verified RRDB CURRENT (per-run digest)
        if: env.SKIP_T1 != 'true' && env.SOURCE_V2 != 'true'
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/current-rrdb
            mkdir -p /tmp/current-rrdb
            if python horse-racing/jrdb/src/racenote_fetch_rrdb_current.py \
                --output /tmp/current-rrdb/rrdb.zip \
                --receipt /tmp/current-rrdb/receipt.json; then
              ok=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$ok" = true
          mkdir -p /tmp/rrdb
          unzip -q /tmp/current-rrdb/rrdb.zip -d /tmp/rrdb
          test -f /tmp/rrdb/postrace_review/v0_1/current.json

      - name: Materialize approved Course Fit v0.1 from immutable Drive baseline
        if: env.SKIP_T1 != 'true' && env.SOURCE_V2 != 'true'
        run: |
          set -euo pipefail
          baseline_root=/tmp/a03-accepted-baselines
          manifest=horse-racing/jrdb/config/public_drive/racenote_a03_accepted_baselines_v1.json
          python tools/gpt_io/public_drive/fetch.py --manifest "$manifest" --artifact course_fit_v01_part1 --output-root "$baseline_root" --receipt /tmp/course-fit-part1-receipt.json
          python tools/gpt_io/public_drive/fetch.py --manifest "$manifest" --artifact course_fit_v01_part2 --output-root "$baseline_root" --receipt /tmp/course-fit-part2-receipt.json
          mkdir -p /tmp/course-fit
          unzip -q "$baseline_root/course_fit/RRDB_Horse_Course_Fit_v0_1_asof20260101_g38370479179_part1.zip" -d /tmp/course-fit
          unzip -qn "$baseline_root/course_fit/RRDB_Horse_Course_Fit_v0_1_asof20260101_g38370479179_part2.zip" -d /tmp/course-fit
          test -f /tmp/course-fit/fit/research/candidate_fit_view.parquet

      - name: Materialize RaceLap by explicitly selected BTDAY source contract
        if: env.SKIP_T1 != 'true' && env.SOURCE_V2 != 'true'
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_btday_racelap_source.py \
            --mode "$RACELAP_INPUT_MODE" \
            --output-root /tmp/racelap \
            --selection-id "$BTDAY_ID" \
            --target-date "$BTDAY_TARGET_DATE"
          test -s /tmp/racelap/race_lap.parquet
          test -f /tmp/racelap/race_lap.input_receipt.json
      - name: Build historical market-blind forecast prep
        if: env.SKIP_T1 != 'true'
        shell: bash
        run: |
          MAIN_SHA="$(git rev-parse HEAD)"
          export MAIN_SHA
          python - <<'PY'
          import json, os, tempfile
          from datetime import date
          from pathlib import Path
          from racenote_v053_from_historical_warehouse import validate_gate
          from racenote_request import RaceNoteRequest, build_historical_warehouse_base
          from racenote_analysis_backend import open_analysis_backend
          from build_racenote_daily import enrich_history_bundles, enrich_rrdb_bundles, build_reader_views, validate_daily_bundles, write_daily_package
          from racenote_prepare_forecast_input import bind

          target=Path(os.environ['TARGET']); target.mkdir(parents=True)
          target_date=os.environ['BTDAY_TARGET_DATE']; day=date.fromisoformat(target_date)
          current=Path(os.environ['WAREHOUSE_ROOT'])/'current.json'
          if os.environ.get('SOURCE_V2')!='true':
              validate_gate(Path('horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json'),current)
          request=RaceNoteRequest(day,None,None,date.today())
          base_work=Path('/tmp/btday-shared-base'); base_work.mkdir(parents=True,exist_ok=True)
          base_dir, warehouse_report=build_historical_warehouse_base(
              request,current,[f"{family}={os.environ['WAREHOUSE_ROOT']}" for family in ('BAC','KYI','CHA','CYB','ZED','ZKB')],base_work)
          warehouse={}
          for path in sorted(base_dir.glob('race_bundle_*.json')):
              bundle=json.loads(path.read_text(encoding='utf-8'))
              warehouse[(bundle['race']['venue'],bundle['race']['race_no'])]=bundle
          bases=[warehouse[k] for k in sorted(warehouse)]
          if not bases: raise SystemExit('no target races reconstructed')
          for bundle in bases:
              assert bundle['race']['date']==target_date
              for horse in bundle['horses']:
                  for run in horse.get('recent_runs') or []:
                      rd=(run.get('race') or {}).get('date')
                      if isinstance(rd,str): assert rd < target_date
          analysis=open_analysis_backend(analysis_root=Path(os.environ['ANALYSIS_ROOT']),backend='parquet')
          try:
              history_bundles, history_report=enrich_history_bundles(bases,analysis)
          finally:
              analysis.close()
          with tempfile.TemporaryDirectory(prefix='btday-shared-rrdb-') as tmp:
              enriched, rrdb_report=enrich_rrdb_bundles(
                  history_bundles,
                  paci_path=Path(os.environ['RAW_ROOT'])/'BAC'/('BAC_'+os.environ['BTDAY_YEAR']+'.zip'),
                  course_fit_root=Path(os.environ['COURSE_FIT_ROOT']),
                  race_lap_parquet=Path(os.environ['RACELAP_ROOT'])/'race_lap.parquet',
                  racereview_root=Path(os.environ['RRDB_ROOT']),
                  racereview_current_cache=None,next_watch_rules=None,work_root=Path(tmp))
          views, reader_report=build_reader_views(enriched)
          report={'base':{'target_date':target_date,'date_raw':os.environ['BTDAY_DATE_RAW'],'race_count':len(bases),'target_result_contamination':0,'record_counts':warehouse_report['record_counts'],'warnings':[]},'history':history_report,'rrdb':rrdb_report,'reader':reader_report}
          validation=validate_daily_bundles(enriched,views,report,target_date)
          if validation['status']!='PASS': raise SystemExit(repr(validation['errors']))
          package=write_daily_package(bundles=enriched,views=views,report=report,validation=validation,target_date=target_date,output_root=target/'day_prep')
          manifest_path=Path(package['manifest']); manifest=json.loads(manifest_path.read_text())
          manifest['sources'].pop('paci',None)
          manifest['sources']['historical_warehouse']={'generation_id':warehouse_report['generation_id'],'target_date':target_date,'as_of_exclusive':target_date,'record_counts':warehouse_report['record_counts']}
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          handoff=bind(target/'day_prep'/('RaceNote_'+os.environ['BTDAY_DATE_RAW']),target/'forecast_prep',os.environ['BTDAY_ID'],target_date,os.environ['MAIN_SHA'])
          assert handoff['market_blind'] is True and handoff['stripped_at_input_bind'] is True
          assert handoff['result_opened'] is False and handoff['target_market_opened'] is False
          (target/'day_prep'/'manifest.json').write_text(manifest_path.read_text(encoding='utf-8'),encoding='utf-8')
          (target/'day_prep'/'validation_report.json').write_text((target/'day_prep'/('RaceNote_'+os.environ['BTDAY_DATE_RAW'])/'validation_report.json').read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - name: Build KYI evidence and seal v0.5.6 Lean Reader
        if: env.SKIP_T1 != 'true'
        run: |
          mkdir -p "$TARGET/v054_inputs" "$TARGET/source_audit"
          python horse-racing/jrdb/src/racenote_v054_kyi_bundle.py             --prep-root "$TARGET/forecast_prep"             --kyi-archive "$RAW_ROOT/KYI/KYI_$BTDAY_YEAR.zip"             --output "$TARGET/v054_inputs/kyi_bundle.json"
          python horse-racing/jrdb/src/racenote_v056_single_day.py init             --prep-root "$TARGET/forecast_prep"             --root "$TARGET/v056"             --base-main-sha "$(git rev-parse HEAD)"             --evidence-bundle "$TARGET/v054_inputs/kyi_bundle.json"             --race-lap-parquet "$RACELAP_ROOT/race_lap.parquet"
          python horse-racing/jrdb/src/racenote_v056_authoring_bundle.py             --root "$TARGET/v056"
          if [[ "$SOURCE_V2" == 'true' ]]; then
            cp /tmp/v056-historical-preflight.json "$TARGET/source_audit/historical_preflight.json"
            cp /tmp/v056-staged/inputs/rrdb_receipt.json "$TARGET/source_audit/rrdb_current_receipt.json"
            python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          selection=json.loads((Path('horse-racing/jrdb/backtests')/os.environ['BTDAY_ID']/'selection.json').read_text())
          row=selection['source_row']; raw=Path(row['readiness_receipt_path']).read_bytes()
          if hashlib.sha256(raw).hexdigest()!=row['receipt_sha256']: raise SystemExit('source receipt changed after preflight')
          (Path(os.environ['TARGET'])/'source_audit/selection_source_receipt.json').write_bytes(raw)
          PY
          else
            cp /tmp/current-rrdb/receipt.json "$TARGET/source_audit/rrdb_current_receipt.json"
            cp /tmp/racelap/race_lap.audit.json "$TARGET/source_audit/race_lap.audit.json"
            cp /tmp/racelap/race_lap.input_receipt.json "$TARGET/source_audit/race_lap_input_receipt.json"
          fi
      - name: Validate current TURN 1 final state
        if: env.SKIP_T1 != 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from racenote_decision_core_v056 import CONTRACT_REVISION
          root=Path(os.environ['TARGET'])
          s=json.loads((root/'v056/session.json').read_text())
          m=json.loads((root/'v056/reader_manifest.json').read_text())
          h=json.loads((root/'forecast_prep/day_prep_handoff.json').read_text())
          a=json.loads((root/'v056/authoring_bundle/manifest.json').read_text())
          assert s['status']=='SESSION_SEALED'
          assert s['logic_version']=='RaceNote-Human-Context-Reader-0.5.6-candidate'
          assert s['contract_revision']==CONTRACT_REVISION
          assert s['reader_projection']=='v055-lean-model-reader-r2'
          assert s['selection_id']==os.environ['BTDAY_ID'] and s['target_date']==os.environ['BTDAY_TARGET_DATE']
          assert s['market_blind'] is True and s['result_opened'] is False and s['target_market_opened'] is False
          assert s['base_main_sha']==h['main_sha']
          assert m['contract_revision']==CONTRACT_REVISION
          assert m['reader_projection']=='v055-lean-model-reader-r2'
          assert len(m['entries'])==len(s['race_roster'])
          assert a['status']=='READY_FOR_LLM_RACE_BY_RACE_REVIEW'
          assert a['race_count']==len(s['race_roster'])
          op={
            'schema_version':'racenote-v056-current-turn1-handoff-0.1',
            'status':'READY_FOR_V056_AUTHORING',
            'selection_id':os.environ['BTDAY_ID'],'target_date':os.environ['BTDAY_TARGET_DATE'],
            'source_backend':'historical_warehouse',
            'source_generation_id':'jrdb_normalized_warehouse_v1_2010_2025_g20260921',
            'logic_version':s['logic_version'],'contract_revision':s['contract_revision'],
            'reader_projection':s['reader_projection'],'session_id':s['session_id'],
            'race_count':len(s['race_roster']),'expected_venues':s['expected_venues'],
            'market_blind':True,'result_opened':False,'target_market_opened':False,
            'rrdb_contract_version':'rrdb-recommendation-signals-v0.5',
            'authoring_bundle_status':a['status'],
            'reader_reduction':{
              'full_normal_bytes_total':sum(e['full_normal_bytes_before_projection'] for e in m['entries']),
              'model_reader_bytes_total':sum(e['model_reader_bytes'] for e in m['entries']),
              'mean_reduction_pct':round(sum(e['model_reader_reduction_pct'] for e in m['entries'])/len(m['entries']),1)
            }
          }
          if os.environ.get('SOURCE_V2')=='true':
              proof=json.loads(Path('/tmp/v056-historical-preflight.json').read_text())
              op.update({k:proof[k] for k in ('source_mode','source_generation_id','source_sha256','source_receipt_sha256','as_of_exclusive')})
          (root/'operation_handoff.json').write_text(json.dumps(op,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(op,ensure_ascii=False))
          PY
      - name: Commit immutable TURN 1
        if: env.SKIP_T1 != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "RaceNote: stage ${BTDAY_ID} v0.5.6 current TURN 1"
          # A stale main is a conflict; never rebase immutable T1 over it.
          git push origin HEAD:main
  prepare_paci:
    needs: route
    if: needs.route.outputs.source_mode == 'paci' && needs.route.outputs.is_v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: horse-racing/jrdb/src
      BTDAY_ID: ${{ needs.route.outputs.selection_id }}
      REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha || 'main' }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical T1 dependencies
        run: |
          python -m pip install -r tools/data-storage/requirements.txt
          python -m pip install jsonschema pandas numpy
      - name: Resolve pinned source and stage approved artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          from racenote_v056_t1_orchestrator import mixed_source_enabled,read_selection
          from racenote_v056_btday_source_router import verify_readiness_receipt
          if not mixed_source_enabled(): raise SystemExit('mixed-source gate is closed')
          sid=os.environ['BTDAY_ID']; s=read_selection(sid); row=s['source_row']
          if row['source_mode']!='paci': raise SystemExit('PACI source required')
          verify_readiness_receipt(row,Path.cwd())
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          pin=os.environ.get('REQUESTED_BASE_SHA','')
          if pin and (not re.fullmatch(r'[0-9a-f]{40}',pin) or actual!=pin): raise SystemExit('pinned base mismatch')
          day=s['target_date']; aid=str(row['staging_artifact_id']); sha=row['staging_sha256']
          if not re.fullmatch(r'[1-9][0-9]*',aid) or not re.fullmatch(r'[0-9a-f]{64}',sha): raise SystemExit('invalid staged artifact identity')
          target=Path('horse-racing/jrdb/backtests')/sid/day.replace('-','')
          if target.exists() or target.is_symlink(): raise SystemExit('immutable target exists')
          receipt=json.loads(Path(row['readiness_receipt_path']).read_text())
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'BTDAY_TARGET_DATE={day}\nSTAGE_ARTIFACT_ID={aid}\nSTAGE_SHA={sha}\nPINNED_SHA={actual}\n')
              f.write('RACELAP_CUTOFF='+receipt['as_of_evidence']['race_lap']['coverage_through']+'\n')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$STAGE_ARTIFACT_ID/zip" > /tmp/v056-paci-staged.zip
          python horse-racing/jrdb/src/racenote_v056_btday_staged_input.py \
            --archive /tmp/v056-paci-staged.zip --sha256 "$STAGE_SHA" --output /tmp/v056-paci-stage
          python - <<'PY'
          import json, os
          from pathlib import Path
          repo=Path(os.environ['GITHUB_WORKSPACE']); stage=Path('/tmp/v056-paci-stage')
          sid=os.environ['BTDAY_ID']; rel=Path('horse-racing/jrdb/backtests')/sid/'selection.json'
          raw=(repo/rel).read_bytes(); row=json.loads(raw)['source_row']
          receipt=Path(row['readiness_receipt_path'])
          for path,data in ((rel,raw),(receipt,(repo/receipt).read_bytes())):
              out=stage/path; out.parent.mkdir(parents=True,exist_ok=True)
              with out.open('xb') as f: f.write(data)
          with (stage/'inputs/source_row.json').open('x',encoding='utf-8') as f:
              json.dump(row,f,ensure_ascii=False)
          PY
      - name: Build and validate PACI BTDAY T1 in isolated staging
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/horse-racing/jrdb/src"
          cd /tmp/v056-paci-stage
          compact="${BTDAY_TARGET_DATE//-/}"
          target="horse-racing/jrdb/backtests/$BTDAY_ID/$compact"
          python "$GITHUB_WORKSPACE/horse-racing/jrdb/src/racenote_v056_btday_paci_t1.py" \
            --date "$BTDAY_TARGET_DATE" --selection-id "$BTDAY_ID" --main-sha "$PINNED_SHA" \
            --paci "inputs/PACI${compact:2}.zip" --paci-source-receipt inputs/paci_receipt.json \
            --source-row inputs/source_row.json --analysis-root inputs/analysis --course-fit-root inputs/course_fit \
            --racereview-root inputs/rrdb --race-lap-current-bundle inputs/racelap \
            --race-lap-expected-period-to "$RACELAP_CUTOFF" --rrdb-zip inputs/rrdb.zip \
            --rrdb-receipt inputs/rrdb_receipt.json --output-root "$target"
          python "$GITHUB_WORKSPACE/horse-racing/jrdb/src/racenote_v056_racezip_delivery.py" \
            --selection-id "$BTDAY_ID" --output /tmp/v056-paci-proof.zip
          test ! -e "$GITHUB_WORKSPACE/$target"
          test ! -L "$GITHUB_WORKSPACE/$target"
          cp -a "$target" "$GITHUB_WORKSPACE/$target"
          echo "TARGET=$target" >> "$GITHUB_ENV"
      - name: Publish immutable T1 without overwriting concurrent main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "RaceNote: stage $BTDAY_ID v0.5.6 PACI TURN 1"
          git push origin HEAD:main
