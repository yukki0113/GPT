name: RaceNote BTDAY-0030 Finalize

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  finalize:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[RACENOTE_BTDAY030_FINALIZE]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact DAY PREP artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/prep_art /tmp/prep
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11209188941/zip > /tmp/prep_artifact.zip
          unzip -q /tmp/prep_artifact.zip -d /tmp/prep_art
          unzip -q /tmp/prep_art/BTDAY-0030_DAY_PREP_20260919_FINAL.zip -d /tmp/prep
          test -d /tmp/prep/RaceNote_20260919/reader
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/prep/RaceNote_20260919')
          readers=list((root/'reader').glob('*.json'))
          handoff={
            'selection_id':'BTDAY-0030',
            'target_date':'2026-09-19',
            'status':'DAY_PREP_PASS',
            'result_opened':False,
            'race_count':len(readers),
            'source_artifact_id':11209188941,
            'source_artifact_sha256':'6da73f1823a4876ebbdf4d0b2d0e1e623dea4260ea14a7ae0bc823ab32a7071f'
          }
          (root/'day_prep_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(handoff,ensure_ascii=False))
          PY
      - name: Download fixed model-authored records
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1M3urx3aAf2XksEEnITueRzAa5VsFdx8v&export=download&confirm=t" \
            -o /tmp/BTDAY-0030_prepared_forecast.jsonl
          test -s /tmp/BTDAY-0030_prepared_forecast.jsonl
          sha256sum /tmp/BTDAY-0030_prepared_forecast.jsonl
      - name: Freeze prepared forecast
        run: |
          set -euo pipefail
          PYTHONPATH=horse-racing/jrdb/src \
          python horse-racing/jrdb/src/racenote_freeze_prepared_forecast.py \
            --prep-root /tmp/prep/RaceNote_20260919 \
            --prepared-records /tmp/BTDAY-0030_prepared_forecast.jsonl \
            --output-root /tmp/frozen \
            --selection-id BTDAY-0030 \
            --date 2026-09-19 \
            --main-sha 7f353a312ae33fa9bf33386e1b6350e7ca51a4b9
      - name: Validate frozen records
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py \
            --records /tmp/frozen/day_merge/forecast_20260919_all.json \
            --output /tmp/frozen/day_merge/forecast_20260919_validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/frozen/day_merge/forecast_20260919_validator.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS', x
          assert x['error_count']==0, x
          assert x['anti_template']['status']=='PASS', x
          print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Immutability guard
        run: |
          set -euo pipefail
          CANON="horse-racing/jrdb/backtests/BTDAY-0030/20260919/day_merge/forecast_20260919_all_handoff.json"
          python horse-racing/jrdb/src/racenote_freeze_immutability_guard.py \
            --candidate-handoff /tmp/frozen/day_merge/forecast_20260919_all_handoff.json \
            --canonical-handoff "$CANON" \
            --output /tmp/frozen/day_merge/forecast_20260919_immutability.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/frozen/day_merge/forecast_20260919_immutability.json'))
          assert x['status'] in {'NEW_FREEZE','IDENTICAL_RETRY'}
          print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Render HTML
        run: |
          python horse-racing/jrdb/src/render_racenote_forecast_html.py \
            --records /tmp/frozen/day_merge/forecast_20260919_all.json \
            --output /tmp/frozen/forecast_20260919.html
      - name: Publish canonical
        run: |
          set -euo pipefail
          DEST="horse-racing/jrdb/backtests/BTDAY-0030/20260919"
          if [ -e "$DEST" ]; then
            echo "Canonical destination already exists; refusing overwrite."
            exit 3
          fi
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/frozen "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "racenote: freeze BTDAY-0030 2026-09-19"
          git push origin HEAD:main
          echo "CANONICAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Comment result
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          h=Path('/tmp/frozen/day_merge/forecast_20260919_all_handoff.json')
          v=Path('/tmp/frozen/day_merge/forecast_20260919_validator.json')
          i=Path('/tmp/frozen/day_merge/forecast_20260919_immutability.json')
          if h.exists() and v.exists() and i.exists():
            hh=json.loads(h.read_text()); vv=json.loads(v.read_text()); ii=json.loads(i.read_text())
            payload={
              'status':hh.get('status'),
              'selection_id':hh.get('selection_id'),
              'target_date':hh.get('target_date'),
              'race_count':hh.get('race_count'),
              'result_opened':hh.get('result_opened'),
              'validator_status':vv.get('status'),
              'validator_errors':vv.get('error_count'),
              'anti_template':(vv.get('anti_template') or {}).get('status'),
              'immutability':ii.get('status'),
              'canonical_commit':os.environ.get('CANONICAL_COMMIT')
            }
          else:
            payload={'status':'FAILED'}
          print('RACENOTE_BTDAY030_FINALIZE_RESULT')
          print('\\`\\`\\`json')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          print('\\`\\`\\`')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Close issue
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
