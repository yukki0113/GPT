name: RaceNote v1.1-P Settlement

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: racenote-v11p-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ github.event.issue.user.login == 'yukki0113' && startsWith(github.event.issue.title, '[RACENOTE_V11P_SETTLEMENT]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse request
        id: request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          prefix = '[RACENOTE_V11P_SETTLEMENT]'
          title = os.environ['ISSUE_TITLE']
          request_id = title[len(prefix):].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,96}', request_id):
              raise SystemExit('REQUEST_INVALID: invalid request_id')
          body = json.loads(os.environ.get('ISSUE_BODY') or '')
          if body.get('request_id') != request_id:
              raise SystemExit('REQUEST_INVALID: title/body request_id mismatch')
          expected = ['20260704', '20260725', '20260726']
          if sorted((body.get('results') or {}).keys()) != expected:
              raise SystemExit(f'REQUEST_INVALID: results dates must be {expected}')
          Path('/tmp/request.json').write_text(json.dumps(body, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'request_id={request_id}\n')
          PY

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run settlement tests
        run: |
          python -m pytest -q \
            horse-racing/jrdb/tests/test_racenote_v11p_settlement.py \
            horse-racing/jrdb/tests/test_jrdb_hjc_common.py

      - name: Materialize immutable freeze snapshot
        run: |
          set -euo pipefail
          freeze_commit="$(jq -r '.freeze.freeze_commit' /tmp/request.json)"
          git cat-file -e "${freeze_commit}^{commit}"
          mkdir -p /tmp/freeze
          base='horse-racing/jrdb/prediction_runs'
          for file in \
            RaceNote_v1_1_Polarity_Gated_20260704_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260725_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260726_PRE_HJC.json \
            RaceNote_v1_1_Polarity_Gated_20260704_25_26_PRE_HJC_FREEZE.json; do
            git show "${freeze_commit}:${base}/${file}" > "/tmp/freeze/${file}"
          done

      - name: Download HJC and SED artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          for day in 20260704 20260725 20260726; do
            run_id="$(jq -r --arg day "$day" '.results[$day].run_id' /tmp/request.json)"
            artifact="$(jq -r --arg day "$day" '.results[$day].artifact_name' /tmp/request.json)"
            mkdir -p "/tmp/raw/$day"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "/tmp/raw/$day"
          done

      - name: Build race-level settlement
        run: |
          code_head="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/run_racenote_v11p_settlement.py \
            --request-json /tmp/request.json \
            --freeze-root /tmp/freeze \
            --raw-root /tmp/raw \
            --output-root /tmp/settlement \
            --run-id "${{ github.run_id }}" \
            --head-sha "$code_head"

      - name: Upload settlement artifact
        uses: actions/upload-artifact@v4
        with:
          name: racenote-v11p-settlement-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: /tmp/settlement/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Commit result-side cache and settlement
        id: commit
        run: |
          set -euo pipefail
          git pull --rebase origin main
          result_cache='horse-racing/jrdb/result_cache'
          settlement_runs='horse-racing/jrdb/settlement_runs'
          mkdir -p "$result_cache" "$settlement_runs"
          outputs=(
            "$result_cache/RaceNote_v1_1_Polarity_Gated_20260704_25_26_HJC_Payouts.csv"
            "$result_cache/RaceNote_v1_1_Polarity_Gated_20260704_25_26_SED_Finish.csv"
            "$settlement_runs/RaceNote_v1_1_Polarity_Gated_20260704_SETTLEMENT.json"
            "$settlement_runs/RaceNote_v1_1_Polarity_Gated_20260725_SETTLEMENT.json"
            "$settlement_runs/RaceNote_v1_1_Polarity_Gated_20260726_SETTLEMENT.json"
            "$settlement_runs/RaceNote_v1_1_Polarity_Gated_20260704_25_26_SETTLEMENT_MANIFEST.json"
          )
          for target in "${outputs[@]}"; do
            if [ -e "$target" ]; then
              echo "DOMAIN_VALIDATION_FAILED: immutable settlement target already exists: $target" >&2
              exit 2
            fi
          done
          cp /tmp/settlement/result_cache/RaceNote_v1_1_Polarity_Gated_20260704_25_26_HJC_Payouts.csv "$result_cache/"
          cp /tmp/settlement/result_cache/RaceNote_v1_1_Polarity_Gated_20260704_25_26_SED_Finish.csv "$result_cache/"
          cp /tmp/settlement/settlement_runs/*.json "$settlement_runs/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${outputs[@]}"
          git commit -m 'settle(jrdb): RaceNote v1.1-P 20260704 25 26'
          git push origin HEAD:main
          echo "settlement_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success and close Issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SETTLEMENT_COMMIT: ${{ steps.commit.outputs.settlement_commit }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = json.loads(Path('/tmp/settlement/result.json').read_text(encoding='utf-8'))
          result['settlement_commit'] = os.environ['SETTLEMENT_COMMIT']
          result['artifact_name'] = f"racenote-v11p-settlement-{os.environ['REQUEST_ID']}-{result['run_id']}"
          body = 'RACENOTE_V11P_SETTLEMENT_RESULT\n```json\n' + json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body], check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'], check=True)
          PY

      - name: Comment failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "RACENOTE_V11P_SETTLEMENT_RESULT\n\`\`\`json\n{\"status\":\"failure\",\"run_id\":$GITHUB_RUN_ID,\"retryable\":false}\n\`\`\`\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
