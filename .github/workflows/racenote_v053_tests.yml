name: RaceNote v0.5.3 focused tests

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/racenote_decision_core_v053.py'
      - 'horse-racing/jrdb/src/racenote_reader_v053.py'
      - 'horse-racing/jrdb/src/racenote_v053_single_day.py'
      - 'horse-racing/jrdb/src/racenote_v053_from_paci.py'
      - 'horse-racing/jrdb/src/racenote_v053_from_historical_warehouse.py'
      - 'horse-racing/jrdb/tests/test_racenote_v053_contract.py'
      - 'horse-racing/jrdb/tests/test_racenote_v053_single_day.py'
      - '.github/workflows/racenote_v053_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v0.5.3 focused tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q \
            horse-racing/jrdb/tests/test_racenote_v053_contract.py \
            horse-racing/jrdb/tests/test_racenote_v053_single_day.py
