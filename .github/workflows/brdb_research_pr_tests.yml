name: BRDB research PR tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'horse-racing/brdb/src/brdb_sed_going_ingest.py'
      - 'horse-racing/brdb/tests/test_brdb_sed_going_ingest.py'
      - 'horse-racing/brdb/docs/BRDB_SED_REAL_GOING_INGEST_V0_1_20261119.md'
      - 'horse-racing/brdb/src/build_brdb_result_mart.py'
      - 'horse-racing/brdb/tests/test_build_brdb_result_mart.py'
      - 'horse-racing/brdb/src/build_lineage_condition_report.py'
      - 'horse-racing/brdb/tests/test_build_lineage_condition_report.py'
      - 'horse-racing/brdb/src/build_brdb_annual_stability_report.py'
      - 'horse-racing/brdb/tests/test_build_brdb_annual_stability_report.py'
      - 'horse-racing/brdb/src/brdb_integrated_review_v03_candidate.py'
      - 'horse-racing/brdb/src/brdb_m7_identity_field_scaffold.py'
      - 'horse-racing/brdb/src/brdb_m7_evidence_adapter.py'
      - 'horse-racing/brdb/src/run_brdb_m7_integrated_replay.py'
      - 'horse-racing/brdb/src/brdb_m7_relatives_detail_candidate.py'
      - 'horse-racing/brdb/src/brdb_m7_research_consumer_preview.py'
      - 'horse-racing/brdb/src/brdb_m7_consumer_boundary_audit.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_consumer_boundary_audit.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_real_newspaper_sparse_noninterference.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_newspaper_semantics_candidate.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_newspaper_display_equivalence.cjs'
      - 'horse-racing/jrdb/src/build_momotaro_newspaper_projection.py'
      - 'horse-racing/jrdb/pwa/newspaper-v4.js'
      - 'horse-racing/jrdb/pwa/newspaper-v5.js'
      - 'horse-racing/brdb/src/export_brdb_m7_newspaper_audit_inputs.py'
      - 'horse-racing/jrdb/src/jrdb_newspaper_build.py'
      - 'horse-racing/jrdb/src/jrdb_newspaper_merge_external.py'
      - 'horse-racing/jrdb/schema/jrdb_pwa_newspaper_race_schema_v0_1.json'
      - 'horse-racing/jrdb/newspaper/incoming/RaceNote_20261115_PWA_Prediction_Sparse_v056.csv'
      - 'horse-racing/brdb/src/run_brdb_m7_relatives_preview.py'
      - 'horse-racing/brdb/schema/brdb_m7_relatives_detail_v0_1_candidate.schema.json'
      - 'horse-racing/brdb/schema/brdb_m7_research_consumer_preview_v0_1.schema.json'
      - 'horse-racing/brdb/tests/test_brdb_m7_relatives_detail_candidate.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_evidence_adapter.py'
      - 'horse-racing/brdb/tests/test_brdb_m7_identity_field_scaffold.py'
      - 'horse-racing/brdb/src/brdb_stage3b_root_identity_resolution.py'
      - 'horse-racing/brdb/src/audit_brdb_stage3b_label_differences.py'
      - 'horse-racing/brdb/tests/test_audit_brdb_stage3b_label_differences.py'
      - 'horse-racing/brdb/tests/test_brdb_stage3b_root_identity_resolution.py'
      - 'horse-racing/brdb/taxonomy/stage3b_root_parent_aliases_research_v0_1.json'
      - 'horse-racing/brdb/taxonomy/stage3b_root_external_evidence_20261117.json'
      - 'horse-racing/brdb/schema/brdb_integrated_review_v0_2_candidate.schema.json'
      - 'horse-racing/brdb/schema/brdb_integrated_review_v0_3_candidate.schema.json'
      - 'horse-racing/brdb/tests/test_brdb_integrated_review_contract_v02_candidate.py'
      - 'horse-racing/brdb/tests/test_brdb_integrated_review_v03_candidate.py'
      - 'horse-racing/brdb/tests/fixtures/brdb_integrated_review_v0_2_candidate_example.json'
      - 'horse-racing/brdb/tests/fixtures/brdb_integrated_review_v0_3_candidate_example.json'
      - '.github/workflows/brdb_research_pr_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brdb-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned shared Data Storage dependencies
        run: python -m pip install -r tools/data-storage/requirements.txt 'jsonschema>=4.22,<5'
      - name: Verify common data-storage dependencies
        env:
          PYTHONPATH: tools/data-storage
        run: python -m data_storage check-deps
      - name: BRDB P0-2, P1-1 and P1-2 research unit tests
        run: |
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_build_brdb_result_mart.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_build_lineage_condition_report.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_build_brdb_annual_stability_report.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_integrated_review_contract_v02_candidate.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_integrated_review_v03_candidate.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_identity_field_scaffold.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_evidence_adapter.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_relatives_detail_candidate.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_newspaper_handoff.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_racenote_p2_adapter.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_consumer_boundary_audit.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_real_newspaper_sparse_noninterference.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_m7_newspaper_semantics_candidate.py' -v
          node horse-racing/brdb/tests/test_brdb_m7_newspaper_display_equivalence.cjs
          python -m unittest discover -s horse-racing/jrdb/tests -p 'test_jrdb_newspaper_build.py' -v
          python -m unittest discover -s horse-racing/jrdb/tests -p 'test_jrdb_newspaper_merge_external.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_stage3b_root_identity_resolution.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_audit_brdb_stage3b_label_differences.py' -v
          python -m unittest discover -s horse-racing/brdb/tests -p 'test_brdb_sed_going_ingest.py' -v
