name: RaceNote v0.5.1 candidate temporary tests
on:
  push:
    branches:
      - research/racenote-v051-candidate
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v0.5.1 contract and harness tests
        run: |
          python -m unittest             horse-racing/jrdb/tests/test_racenote_v051_contract.py             horse-racing/jrdb/tests/test_racenote_ab_harness.py
