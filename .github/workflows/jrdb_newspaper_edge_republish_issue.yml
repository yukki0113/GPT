name: JRDB Newspaper Edge-only Republish via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[JRDB_NEWSPAPER_EDGE_REPUBLISH]'

jobs:
  republish:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEWSPAPER_EDGE_REPUBLISH]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          prefix='[JRDB_NEWSPAPER_EDGE_REPUBLISH]'
          title=os.environ['ISSUE_TITLE']
          request_id=title[len(prefix):].strip()
          if not request_id or not re.fullmatch(r'[A-Za-z0-9._-]{1,96}',request_id):
              raise SystemExit('invalid request_id')
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={
              'date','source_drive_file_id','source_filename','source_size_bytes','source_sha256',
              'source_revision','target_revision','edge_run_id','edge_artifact_name','edge_matches_sha256'
          }
          missing=sorted(required-set(req))
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          date=str(req['date']).strip()
          if not re.fullmatch(r'20\d{2}-\d{2}-\d{2}',date):
              raise SystemExit('date must be YYYY-MM-DD')
          source_drive_file_id=str(req['source_drive_file_id']).strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]+',source_drive_file_id):
              raise SystemExit('invalid source_drive_file_id')
          source_filename=str(req['source_filename']).strip()
          if not source_filename.lower().endswith('.json') or '/' in source_filename or '\\' in source_filename:
              raise SystemExit('source_filename must be JSON basename')
          source_size=int(req['source_size_bytes'])
          source_revision=int(req['source_revision'])
          target_revision=int(req['target_revision'])
          if source_size<=0 or source_revision<1 or target_revision!=source_revision+1:
              raise SystemExit('target_revision must equal source_revision + 1')
          edge_run_id=req['edge_run_id']
          if not isinstance(edge_run_id,int) or isinstance(edge_run_id,bool) or edge_run_id<=0:
              raise SystemExit('edge_run_id must be positive integer')
          edge_artifact_name=str(req['edge_artifact_name']).strip()
          if not edge_artifact_name:
              raise SystemExit('edge_artifact_name must be non-empty')
          sha_re=re.compile(r'[0-9a-f]{64}')
          source_sha=str(req['source_sha256']).strip().lower()
          edge_sha=str(req['edge_matches_sha256']).strip().lower()
          if not sha_re.fullmatch(source_sha) or not sha_re.fullmatch(edge_sha):
              raise SystemExit('SHA fields must be lowercase SHA-256')
          normalized={
              'request_id':request_id,
              'date':date,
              'source_drive_file_id':source_drive_file_id,
              'source_filename':source_filename,
              'source_size_bytes':source_size,
              'source_sha256':source_sha,
              'source_revision':source_revision,
              'target_revision':target_revision,
              'edge_run_id':edge_run_id,
              'edge_artifact_name':edge_artifact_name,
              'edge_matches_sha256':edge_sha,
          }
          Path('/tmp/request.json').write_text(
              json.dumps(normalized,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'request_id={request_id}\n')
              fh.write(f'date_compact={date.replace("-","")}\n')
              fh.write(f'target_revision={target_revision}\n')
          PY

      - name: Download and verify source day package
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          python - <<'PY' > /tmp/source_env.sh
          import json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          print(f"DRIVE_FILE_ID={req['source_drive_file_id']}")
          print(f"SOURCE_FILENAME={req['source_filename']}")
          PY
          source /tmp/source_env.sh
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output "/tmp/source/${SOURCE_FILENAME}"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          path=Path('/tmp/source')/req['source_filename']
          if path.stat().st_size!=req['source_size_bytes']:
              raise SystemExit(f"source size mismatch: {path.stat().st_size}")
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual!=req['source_sha256']:
              raise SystemExit(f"source SHA mismatch expected={req['source_sha256']} actual={actual}")
          package=json.loads(path.read_text(encoding='utf-8'))
          manifest=package.get('manifest') or {}
          if manifest.get('date')!=req['date'] or manifest.get('revision')!=req['source_revision']:
              raise SystemExit('source day-package date/revision mismatch')
          PY

      - name: Download and verify STANDARD Edge matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edge
          python - <<'PY' > /tmp/edge_env.sh
          import json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          print(f"EDGE_RUN_ID={req['edge_run_id']}")
          print(f"EDGE_ARTIFACT_NAME={req['edge_artifact_name']}")
          PY
          source /tmp/edge_env.sh
          gh run download "$EDGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$EDGE_ARTIFACT_NAME" --dir /tmp/edge
          mapfile -t candidates < <(find /tmp/edge -type f -path '*/days/*/edge_matches.jsonl' -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "expected exactly one edge_matches.jsonl; found ${#candidates[@]}" >&2
            exit 1
          fi
          cp "${candidates[0]}" /tmp/edge_matches.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          path=Path('/tmp/edge_matches.jsonl')
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual!=req['edge_matches_sha256']:
              raise SystemExit(f"Edge SHA mismatch expected={req['edge_matches_sha256']} actual={actual}")
          PY

      - name: Expand source package and advance revision
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          source=Path('/tmp/source')/req['source_filename']
          package=json.loads(source.read_text(encoding='utf-8'))
          day=Path('/tmp/day_source')
          (day/'races').mkdir(parents=True,exist_ok=True)

          manifest=package['manifest']
          manifest['revision']=req['target_revision']
          race_by_key={str((race.get('race') or {}).get('race_key') or ''):race for race in package['races']}
          if '' in race_by_key:
              raise SystemExit('race package missing race_key')
          if len(race_by_key)!=len(package['races']):
              raise SystemExit('duplicate race_key in source package')

          for entry in manifest.get('races') or []:
              race_key=str(entry.get('race_key') or '')
              race=race_by_key.get(race_key)
              if race is None:
                  raise SystemExit(f'missing race package for {race_key}')
              metadata=race.setdefault('metadata',{})
              metadata['revision']=req['target_revision']
              target=day/str(entry['path'])
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(race,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              entry['sha256']=hashlib.sha256(target.read_bytes()).hexdigest()
              entry['size_bytes']=target.stat().st_size

          (day/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (day/'audit.json').write_text(
              json.dumps({
                  'schema_version':'0.1',
                  'audit_kind':'jrdb_newspaper_edge_republish_input',
                  'source_revision':req['source_revision'],
                  'target_revision':req['target_revision'],
                  'source_sha256':req['source_sha256'],
                  'edge_matches_sha256':req['edge_matches_sha256'],
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

      - name: Merge Edge into revision candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/day_r4
          python horse-racing/jrdb/src/jrdb_newspaper_merge_edge.py \
            --day-dir /tmp/day_source \
            --edge-jsonl /tmp/edge_matches.jsonl \
            --output-dir /tmp/day_r4 \
            > /tmp/edge_merge_result.json

      - name: Validate and package r4
        id: package
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/output
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          merge=json.loads(Path('/tmp/edge_merge_result.json').read_text(encoding='utf-8'))
          source=Path('/tmp/day_r4/day-package.json')
          package=json.loads(source.read_text(encoding='utf-8'))
          manifest=package['manifest']
          if manifest.get('date')!=req['date'] or manifest.get('revision')!=req['target_revision']:
              raise SystemExit('merged day-package date/revision mismatch')
          races=package.get('races') or []
          if len(races)!=len(manifest.get('races') or []):
              raise SystemExit('race count mismatch')
          for race in races:
              metadata=race.get('metadata') or {}
              if metadata.get('revision')!=req['target_revision']:
                  raise SystemExit('race revision mismatch')
              edge=((metadata.get('source_status') or {}).get('edge') or {})
              if edge.get('state')!='READY' or edge.get('coverage_complete') is not True:
                  raise SystemExit('Edge source status is not complete READY')
          date_compact=req['date'].replace('-','')
          filename=f"JRDB_Newspaper_{date_compact}_DayPackage_r{req['target_revision']}.json"
          target=Path('/tmp/output')/filename
          target.write_bytes(source.read_bytes())
          sha=hashlib.sha256(target.read_bytes()).hexdigest()
          result={
              'status':'PASS',
              'date':req['date'],
              'source_revision':req['source_revision'],
              'target_revision':req['target_revision'],
              'filename':filename,
              'size_bytes':target.stat().st_size,
              'sha256':sha,
              'race_count':len(races),
              'source_sha256':req['source_sha256'],
              'edge_matches_sha256':req['edge_matches_sha256'],
              'edge_run_id':req['edge_run_id'],
              'edge_artifact_name':req['edge_artifact_name'],
              'source_commit':os.environ['HEAD_SHA'],
              'merged_rows':merge['merged_rows'],
              'memo_runners':merge['memo_runners'],
              'memo_count':merge['memo_count'],
          }
          Path('/tmp/output/result.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY
          cat /tmp/output/result.json

      - name: Upload r4 candidate
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-newspaper-edge-republish-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: /tmp/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Comment success and close Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result=json.loads(Path('/tmp/output/result.json').read_text(encoding='utf-8'))
          result['run_id']=int(os.environ['RUN_ID'])
          result['artifact_name']=f"jrdb-newspaper-edge-republish-{os.environ['REQUEST_ID']}-{os.environ['RUN_ID']}"
          body='JRDB_NEWSPAPER_EDGE_REPUBLISH_RESULT\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'],check=True)
          PY

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "JRDB Newspaper Edge-only republish failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
