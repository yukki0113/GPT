name: JRDB Ability existing-horse temporal confirmation via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  confirm:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_ABILITY_HOLDOUT]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy scipy scikit-learn

      - name: Run frozen holdout regression tests
        run: |
          python -m pytest -q \
            horse-racing/jrdb/tests/test_build_jrdb_ability_snapshot.py \
            horse-racing/jrdb/tests/test_evaluate_jrdb_ability_holdout.py \
            horse-racing/jrdb/tests/test_build_jrdb_official_runperf.py \
            horse-racing/jrdb/tests/test_audit_jrdb_official_runperf.py

      - name: Prepare 2010-2025 workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/jrdb_ability_holdout/raw /tmp/jrdb_ability_holdout/report

      - name: Fetch Raw
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: python horse-racing/jrdb/src/fetch_jrdb_history.py --from-year 2010 --to-year 2025 --kinds BAC KYI SED UKC CHA CYB --output-dir /tmp/jrdb_ability_holdout/raw --manifest /tmp/jrdb_ability_holdout/report/fetch_manifest.jsonl --sleep-seconds 1

      - name: Build Index Base
        run: |
          YEARS=$(seq 2010 2025)
          python horse-racing/jrdb/src/build_jrdb_index_base_from_raw.py --raw-root /tmp/jrdb_ability_holdout/raw --years $YEARS --db /tmp/jrdb_ability_holdout/index.sqlite --no-archive-hash

      - name: Audit Index Base
        run: python horse-racing/jrdb/src/audit_jrdb_index_base.py --db /tmp/jrdb_ability_holdout/index.sqlite --out /tmp/jrdb_ability_holdout/report/index_audit.json --no-db-hash

      - name: Build RunPerf
        run: python horse-racing/jrdb/src/build_jrdb_runperf_features.py --index-db /tmp/jrdb_ability_holdout/index.sqlite --out /tmp/jrdb_ability_holdout/runperf.sqlite --methods EXPANDING

      - name: Audit RunPerf
        run: python horse-racing/jrdb/src/audit_jrdb_runperf.py --db /tmp/jrdb_ability_holdout/runperf.sqlite --out /tmp/jrdb_ability_holdout/report/runperf_audit.json --no-db-hash

      - name: Build Official RunPerf
        run: python horse-racing/jrdb/src/build_jrdb_official_runperf.py --runperf-db /tmp/jrdb_ability_holdout/runperf.sqlite --out /tmp/jrdb_ability_holdout/official.sqlite

      - name: Audit Official RunPerf
        run: python horse-racing/jrdb/src/audit_jrdb_official_runperf.py --db /tmp/jrdb_ability_holdout/official.sqlite --source-runperf-db /tmp/jrdb_ability_holdout/runperf.sqlite --out /tmp/jrdb_ability_holdout/report/official_audit.json --no-db-hash

      - name: Build Ability Snapshot
        run: python horse-racing/jrdb/src/build_jrdb_ability_snapshot.py --index-db /tmp/jrdb_ability_holdout/index.sqlite --official-runperf-db /tmp/jrdb_ability_holdout/official.sqlite --out /tmp/jrdb_ability_holdout/ability.sqlite

      - name: Audit Ability Snapshot
        run: python horse-racing/jrdb/src/audit_jrdb_ability_snapshot.py --db /tmp/jrdb_ability_holdout/ability.sqlite --out /tmp/jrdb_ability_holdout/report/ability_snapshot_audit.json

      - name: Evaluate frozen Ability 2024-2025
        run: python horse-racing/jrdb/src/evaluate_jrdb_ability_holdout.py --db /tmp/jrdb_ability_holdout/ability.sqlite --out /tmp/jrdb_ability_holdout/report/ability_holdout.json

      - name: Build lightweight result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path('/tmp/jrdb_ability_holdout/report')
          report_dir.mkdir(parents=True, exist_ok=True)
          report_path = report_dir / 'ability_holdout.json'
          result = {
              'status': 'failure',
              'run_id': '${{ github.run_id }}',
              'head_sha': '${{ github.sha }}',
              'protocol_version': 'Ability_Holdout_Protocol_v0_1',
              'model_promoted': False,
          }
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              result.update({
                  'status': 'success' if report.get('status') == 'PASS' else 'failure',
                  'classification': report.get('classification'),
                  'candidate': report.get('candidate'),
                  'baseline': report.get('baseline'),
                  'holdout_years': report.get('holdout_years'),
                  'holdout_touched': report.get('holdout_touched'),
                  '2024_2025_predictive_metrics_inspected': report.get('2024_2025_predictive_metrics_inspected'),
                  'mean_delta_primary_a1_minus_a0': report.get('mean_delta_primary_a1_minus_a0'),
                  'annual_delta_primary_a1_minus_a0': report.get('annual_delta_primary_a1_minus_a0'),
                  'technical_gates_pass': report.get('technical_gates_pass'),
                  'annual': [
                      {
                          'year': row.get('year'),
                          'train_row_count': row.get('train_row_count'),
                          'test_row_count': row.get('test_row_count'),
                          'train_year_max': row.get('train_year_max'),
                          'a1_prediction_coverage': row.get('a1_prediction_coverage'),
                          'paired_coverage': row.get('paired_coverage'),
                          'a1_primary': (row.get('a1') or {}).get('primary'),
                          'a0_primary': (row.get('a0_d070') or {}).get('primary'),
                          'ridge_primary': (row.get('ridge_diagnostic') or {}).get('primary'),
                          'delta_primary_a1_minus_a0': row.get('delta_primary_a1_minus_a0'),
                      }
                      for row in report.get('annual', [])
                  ],
                  'model_promoted': False,
              })

          (report_dir / 'workflow_result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False),
              encoding='utf-8',
          )
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-ability-holdout-2024-2025-${{ github.run_id }}
          path: /tmp/jrdb_ability_holdout/report
          if-no-files-found: warn

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p='/tmp/jrdb_ability_holdout/report/workflow_result.json';
            const body=fs.existsSync(p)
              ? 'JRDB_ABILITY_HOLDOUT_RESULT\n```json\n'+fs.readFileSync(p,'utf8')+'\n```'
              : 'JRDB_ABILITY_HOLDOUT_RESULT\nworkflow failed before report generation';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
