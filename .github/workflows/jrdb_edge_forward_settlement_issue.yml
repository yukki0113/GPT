name: JRDB Edge TRUE_FORWARD Settlement via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

env:
  REQUEST_PREFIX: '[JRDB_EDGE_FORWARD_SETTLE]'

jobs:
  settlement:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_EDGE_FORWARD_SETTLE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse and validate request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          prefix='[JRDB_EDGE_FORWARD_SETTLE]'
          title=os.environ['ISSUE_TITLE']
          request_id=title[len(prefix):].strip()
          if not request_id or not re.fullmatch(r'[A-Za-z0-9._-]{1,96}', request_id):
              raise SystemExit('request_id in title must match [A-Za-z0-9._-]{1,96}')
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={'freeze_run_id','freeze_artifact_name','freeze_manifest_sha256','matches_sha256'}
          missing=sorted(required-set(req))
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          sha_re=re.compile(r'[0-9a-f]{64}')
          def positive_int(value, field):
              if not isinstance(value,int) or value<=0:
                  raise SystemExit(f'{field} must be a positive integer')
              return value
          def sha(value, field):
              value=str(value).strip().lower()
              if not sha_re.fullmatch(value):
                  raise SystemExit(f'{field} must be lowercase SHA-256 hex')
              return value
          freeze_run_id=positive_int(req['freeze_run_id'],'freeze_run_id')
          freeze_artifact_name=str(req['freeze_artifact_name']).strip()
          if not freeze_artifact_name:
              raise SystemExit('freeze_artifact_name must be non-empty')
          normalized={
              'request_id':request_id,
              'freeze_run_id':freeze_run_id,
              'freeze_artifact_name':freeze_artifact_name,
              'freeze_manifest_sha256':sha(req['freeze_manifest_sha256'],'freeze_manifest_sha256'),
              'matches_sha256':sha(req['matches_sha256'],'matches_sha256'),
              'evaluation_mode':'TRUE_FORWARD',
          }
          expected_sed=req.get('expected_sed_sha256')
          normalized['expected_sed_sha256']=sha(expected_sed,'expected_sed_sha256') if expected_sed is not None else None

          prior_fields=['prior_ledger_run_id','prior_ledger_artifact_name','prior_ledger_sha256']
          supplied=[req.get(field) is not None for field in prior_fields]
          if any(supplied) and not all(supplied):
              raise SystemExit('prior ledger fields must be supplied together')
          if all(supplied):
              normalized['prior_ledger_run_id']=positive_int(req['prior_ledger_run_id'],'prior_ledger_run_id')
              normalized['prior_ledger_artifact_name']=str(req['prior_ledger_artifact_name']).strip()
              if not normalized['prior_ledger_artifact_name']:
                  raise SystemExit('prior_ledger_artifact_name must be non-empty')
              normalized['prior_ledger_sha256']=sha(req['prior_ledger_sha256'],'prior_ledger_sha256')
          else:
              normalized['prior_ledger_run_id']=None
              normalized['prior_ledger_artifact_name']=None
              normalized['prior_ledger_sha256']=None

          Path('/tmp/request.json').write_text(
              json.dumps(normalized,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'request_id={request_id}\n')
          PY

      - name: Edge forward regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            horse-racing/jrdb/tests/test_jrdb_edge_forward_operations.py \
            horse-racing/jrdb/tests/test_evaluate_jrdb_edge_forward.py \
            horse-racing/jrdb/tests/test_build_jrdb_edge_forward_ledger.py

      - name: Download and verify frozen pre-race artifact
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze
          python - <<'PY' > /tmp/freeze_env.sh
          import json
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          print(f"FREEZE_RUN_ID={req['freeze_run_id']}")
          print(f"FREEZE_ARTIFACT_NAME={req['freeze_artifact_name']}")
          PY
          source /tmp/freeze_env.sh
          gh run download "$FREEZE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$FREEZE_ARTIFACT_NAME" --dir /tmp/freeze
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          manifests=list(Path('/tmp/freeze').rglob('manifest.json'))
          matches=list(Path('/tmp/freeze').rglob('edge_matches.jsonl'))
          if len(manifests)!=1:
              raise SystemExit(f'expected exactly one freeze manifest.json; found {len(manifests)}')
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one frozen edge_matches.jsonl; found {len(matches)}')
          manifest=manifests[0]
          match=matches[0]
          manifest_sha=hashlib.sha256(manifest.read_bytes()).hexdigest()
          match_sha=hashlib.sha256(match.read_bytes()).hexdigest()
          if manifest_sha!=req['freeze_manifest_sha256']:
              raise SystemExit(f"freeze manifest SHA mismatch: expected={req['freeze_manifest_sha256']} actual={manifest_sha}")
          if match_sha!=req['matches_sha256']:
              raise SystemExit(f"matches SHA mismatch: expected={req['matches_sha256']} actual={match_sha}")
          data=json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('status')!='PASS' or data.get('evaluation_mode')!='TRUE_FORWARD' or data.get('pre_race_guard')!='PASS':
              raise SystemExit('freeze manifest does not prove a valid TRUE_FORWARD pre-race freeze')
          race_date=str(data.get('race_date') or '')
          if len(race_date)!=10 or race_date[4]!='-' or race_date[7]!='-':
              raise SystemExit(f'invalid freeze race_date: {race_date}')
          day=race_date.replace('-','')
          Path('/tmp/freeze_manifest.json').write_bytes(manifest.read_bytes())
          Path('/tmp/edge_matches.jsonl').write_bytes(match.read_bytes())
          Path('/tmp/race_date.txt').write_text(race_date+'\n',encoding='utf-8')
          Path('/tmp/day.txt').write_text(day+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'race_date={race_date}\n')
              fh.write(f'date={day}\n')
          PY

      - name: Fetch post-race SED
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          day=Path('/tmp/day.txt').read_text(encoding='utf-8').strip()
          out=Path('/tmp/raw')
          subprocess.run([
              'python','horse-racing/jrdb/src/fetch_jrdb_history.py',
              '--date',day,'--kinds','SED','--output-dir',str(out)
          ],check=True)
          sed=out/'SED'/f"SED{day[2:]}.zip"
          if not sed.is_file():
              raise SystemExit(f'SED missing: {sed}')
          digest=hashlib.sha256(sed.read_bytes()).hexdigest()
          if req.get('expected_sed_sha256') and digest!=req['expected_sed_sha256']:
              raise SystemExit(f"SED SHA mismatch: expected={req['expected_sed_sha256']} actual={digest}")
          Path('/tmp/sed_path.txt').write_text(str(sed)+'\n',encoding='utf-8')
          Path('/tmp/sed_sha256.txt').write_text(digest+'\n',encoding='utf-8')
          PY

      - name: Restore optional prior immutable ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edge_forward_settlement
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          target=Path('/tmp/edge_forward_settlement/jrdb_edge_forward_2026.sqlite')
          if req.get('prior_ledger_run_id') is None:
              raise SystemExit(0)
          root=Path('/tmp/prior_ledger')
          root.mkdir(parents=True,exist_ok=True)
          subprocess.run([
              'gh','run','download',str(req['prior_ledger_run_id']),
              '--repo',__import__('os').environ['GITHUB_REPOSITORY'],
              '--name',req['prior_ledger_artifact_name'],'--dir',str(root)
          ],check=True)
          candidates=list(root.rglob('jrdb_edge_forward_2026.sqlite'))
          if len(candidates)!=1:
              raise SystemExit(f'expected exactly one prior ledger; found {len(candidates)}')
          target.write_bytes(candidates[0].read_bytes())
          PY

      - name: Settle frozen TRUE_FORWARD artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          sed=Path('/tmp/sed_path.txt').read_text(encoding='utf-8').strip()
          cmd=[
              'python','horse-racing/jrdb/src/run_jrdb_edge_forward_settlement.py',
              '--matches-jsonl','/tmp/edge_matches.jsonl',
              '--freeze-manifest','/tmp/freeze_manifest.json',
              '--sed',sed,
              '--ledger','/tmp/edge_forward_settlement/jrdb_edge_forward_2026.sqlite',
              '--output-dir','/tmp/edge_forward_settlement',
              '--expected-freeze-manifest-sha256',req['freeze_manifest_sha256'],
              '--expected-matches-sha256',req['matches_sha256'],
          ]
          if req.get('expected_sed_sha256'):
              cmd.extend(['--expected-sed-sha256',req['expected_sed_sha256']])
          if req.get('prior_ledger_sha256'):
              cmd.extend(['--expected-ledger-sha256',req['prior_ledger_sha256']])
          subprocess.run(cmd,check=True)
          PY

      - name: Build compact settlement result
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('/tmp/edge_forward_settlement')
          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          provenance=json.loads((root/'provenance.json').read_text(encoding='utf-8'))
          evaluation=json.loads((root/'forward_evaluation.json').read_text(encoding='utf-8'))
          overall=evaluation.get('overall') or {}
          result={
              'status':'success',
              'run_id':int(os.environ['RUN_ID']),
              'head_sha':os.environ['HEAD_SHA'],
              'artifact_name':f"jrdb-edge-forward-settlement-{os.environ['REQUEST_ID']}-{os.environ['RUN_ID']}",
              'race_date':manifest['race_date'],
              'evaluation_mode':'TRUE_FORWARD',
              'freeze_run_id':req['freeze_run_id'],
              'freeze_artifact_name':req['freeze_artifact_name'],
              'freeze_manifest_sha256':req['freeze_manifest_sha256'],
              'matches_sha256':req['matches_sha256'],
              'sed_sha256':provenance['sed_sha256'],
              'ledger_sha256':provenance['ledger_sha256'],
              'settlement_manifest_sha256':hashlib.sha256((root/'manifest.json').read_bytes()).hexdigest(),
              'runner_rows':(evaluation.get('runner_audit') or {}).get('matcher_rows'),
              'sed_joined_rows':(evaluation.get('runner_audit') or {}).get('sed_joined_rows'),
              'matches':overall.get('matches'),
              'eligible':overall.get('eligible'),
              'win_roi':overall.get('win_roi'),
              'place_roi':overall.get('place_roi'),
              'ledger_import':provenance.get('ledger_import'),
          }
          (root/'result.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Upload settlement artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-edge-forward-settlement-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: /tmp/edge_forward_settlement/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Comment success and close Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result=json.loads(Path('/tmp/edge_forward_settlement/result.json').read_text(encoding='utf-8'))
          body='JRDB_EDGE_FORWARD_SETTLEMENT_RESULT\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'],check=True)
          PY

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          result={
              'status':'failure',
              'run_id':int(os.environ['RUN_ID']),
              'failure_class':'IMPLEMENTATION_ERROR',
              'error_code':'EDGE_FORWARD_SETTLEMENT_FAILED',
              'retryable':False,
              'message':'Inspect the failed Actions step and verify the exact frozen artifact before retrying.',
          }
          body='JRDB_EDGE_FORWARD_SETTLEMENT_FAILURE\n```json\n'+json.dumps(result,indent=2)+'\n```\n'
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          PY
