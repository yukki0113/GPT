name: RaceNote BTDAY-0046 DAY PREP temp
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  build:
    if: startsWith(github.event.issue.title, '[RACENOTE_DAILY_BTDAY0046]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pyarrow pandas numpy jsonschema gdown
      - name: Prepare sources and build
        env:
          PYTHONPATH: horse-racing/jrdb/src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input /tmp/analysis_art /tmp/analysis /tmp/rrdb /tmp/rules /tmp/out /tmp/forecast_prep
          gdown 'https://drive.google.com/uc?id=1icHG-MI3sR5hEfgIrT8Do3AUfNlIIzNK' -O /tmp/input/PACI260221.zip
          gdown 'https://drive.google.com/uc?id=1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/input/RaceReviewDB_CURRENT.zip
          gdown 'https://drive.google.com/uc?id=1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/input/NextWatch.zip
          gh run download 36437363166 --repo "$GITHUB_REPOSITORY" --name 'jrdb-post-race-parquet-refresh-36437363166' --dir /tmp/analysis_art
          tar -xJf /tmp/analysis_art/analysis-parquet-candidate.tar.xz -C /tmp/analysis
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path('/tmp/analysis/generations/analysis-v1_4-canonical-20260928-02/manifest.json')
          if not m.is_file(): raise SystemExit('analysis generation missing')
          Path('/tmp/analysis/current.json').write_text(json.dumps({'status':'CURRENT','generation_id':'analysis-v1_4-canonical-20260928-02','manifest':'generations/analysis-v1_4-canonical-20260928-02/manifest.json'},indent=2)+'\n')
          PY
          unzip -q /tmp/input/RaceReviewDB_CURRENT.zip -d /tmp/rrdb
          unzip -q /tmp/input/NextWatch.zip -d /tmp/rules
          python horse-racing/jrdb/src/build_racenote_daily.py \
            --date 2026-02-21 \
            --paci /tmp/input/PACI260221.zip \
            --analysis-root /tmp/analysis \
            --racereview-root /tmp/rrdb/postrace_review/v0_1 \
            --next-watch-rules /tmp/rules/next_watch_candidate_rules_frozen.json \
            --output /tmp/out
          ROOT=/tmp/out/RaceNote_20260221
          test -s "$ROOT/manifest.json"
          test -s "$ROOT/validation_report.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/out/RaceNote_20260221')
          m=json.loads((root/'manifest.json').read_text())
          v=json.loads((root/'validation_report.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          assert v.get('firewall',{}).get('target_result_exposed') is False
          print(json.dumps({'race_count':m['counts']['races_built'],'horse_count':m['counts']['horses'],'analysis':m['sources']['analysis']['generation_id'],'rrdb':m['sources']['rrdb'].get('generation_id')}))
          PY
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_prepare_forecast_input.py \
            --day-prep-root "$ROOT" \
            --output-root /tmp/forecast_prep \
            --selection-id BTDAY-0046 \
            --date 2026-02-21 \
            --main-sha "$MAIN_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/forecast_prep/day_prep_handoff.json').read_text())
          assert h['market_blind'] is True
          assert h['target_market_opened'] is False
          assert h['result_opened'] is False
          Path('/tmp/summary.json').write_text(json.dumps({'status':'PASS','main_sha':h['main_sha'],'race_count':h['race_count'],'market_blind':h['market_blind'],'result_opened':h['result_opened'],'manifest_sha':h['reader_stripped_manifest_sha256']},indent=2)+'\n')
          PY
      - name: Upload DAY PREP
        uses: actions/upload-artifact@v4
        with:
          name: BTDAY-0046-DAY-PREP
          path: /tmp/out/RaceNote_20260221/
          retention-days: 14
      - name: Upload stripped authoring input
        uses: actions/upload-artifact@v4
        with:
          name: BTDAY-0046-FORECAST-PREP-STRIPPED
          path: /tmp/forecast_prep/
          retention-days: 14
      - name: Comment result and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s /tmp/summary.json; then
            BODY="$(cat /tmp/summary.json)"
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "RACENOTE_DAILY_BTDAY0046_RESULT\n\`\`\`json\n${BODY}\n\`\`\`"
            gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "BTDAY-0046 DAY PREP failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason not_planned
            exit 1
          fi
