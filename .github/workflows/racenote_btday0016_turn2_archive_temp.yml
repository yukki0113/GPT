# registration refresh
name: RaceNote BTDAY-0016 TURN2 archive temp
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  archive:
    if: startsWith(github.event.issue.title, '[ARCHIVE_BTDAY0016_FORECAST]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download DAY PREP artifact
        run: |
          mkdir -p dayprep
          gh run download 36822267446 -n BTDAY-0016-DAY-PREP -D dayprep
          echo "Downloaded:"
          find dayprep -maxdepth 2 -type f -print
      - name: Extract final DAY PREP
        run: |
          mkdir -p dayprep/final
          INNER=$(find dayprep -maxdepth 2 -type f -name 'BTDAY-0016_DAY_PREP_20260419_FINAL.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d dayprep/final
          test "$(find dayprep/final/reader -type f -name '*.json' | wc -l)" -eq 36
      - name: Build frozen forecast archive
        run: |
          echo '数>]>1OgogICAgICAgIHI9cmVjb3Jkc1tpXTsgclsnaXNwcmVkaWN0aW9uJ11bJ3JlYWRlcl9mYWNpbmdfcmVhc29uJ109clsnaXNwcmVkaWN0aW9uJ11bJ3JlYWRlcl9mYWNpbmdfcmVhc29uJ11bOi0xXStmIuOAgntyWydpZGVudGl0eSddWyd2ZW51ZSddfOOBru{r['identity']['surface']}{r['identity']['distance_m']}bOOBqOOBhOOBhuiojOiInuOCguWQq+OCgeOBoOOBkeOBpOimiOebtOOAgg==' | base64 -d > /tmp/build_bt16.py
          python /tmp/build_bt16.py
      - name: Commit canonical archive
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horse-racing/jrdb/backtests/BTDAY-0016/20260419
          git diff --cached --exit-code && { echo "No changes"; exit 1; } || true
          git commit -m "RaceNote: archive BTDAY-0016 frozen forecast (contaminated)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "RACENOTE_BTDAY0016_TURN2_RESULT
status=FROZEN_CONTAMINATED_MARKET_EXPOSURE
clean_blind_eligible=false
result_opened=false
race_count=36
technical_skips=0
anti_template=PASS
market_blind_guard=FAIL_PRE_FREEZE_MARKET_EXPOSURE_ONE_HORSE
commit=${{ steps.commit.outputs.sha }}"
          gh issue close "${{ github.event.issue.number }}" --reason completed
