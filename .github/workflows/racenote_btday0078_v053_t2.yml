name: RaceNote BTDAY-0078 v0.5.3 T2 Save Freeze Verify
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0078/T2_TRIGGER'
permissions:
  contents: write
concurrency:
  group: racenote-btday0078-t2
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical dependencies
        run: python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema
      - name: Save authored venues and Freeze
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          ROOT='horse-racing/jrdb/backtests/BTDAY-0078/20250413/v053'
          for VENUE in 中山 福島 阪神; do
            test -f "$ROOT/incoming/$VENUE.json"
            python horse-racing/jrdb/src/racenote_v053_single_day.py save --root "$ROOT" --decisions "$ROOT/incoming/$VENUE.json"
          done
          python horse-racing/jrdb/src/racenote_v053_single_day.py freeze --root "$ROOT"
          python horse-racing/jrdb/src/racenote_v053_single_day.py verify --root "$ROOT"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0078/20250413/v053')
          h=json.loads((root/'frozen/day_handoff.json').read_text())
          assert h['status']=='FROZEN_CLEAN_BLIND'
          assert h['validator_status']=='PASS'
          assert h['record_count']==36
          assert h['market_blind'] is True and h['result_opened'] is False and h['target_market_opened'] is False
          assert set(h['expected_venues'])=={'中山','福島','阪神'}
          print('BTDAY-0078 v0.5.3 clean-blind verified')
          PY
      - name: Commit immutable Freeze
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0078/20250413/v053/authored_decisions/
          git add horse-racing/jrdb/backtests/BTDAY-0078/20250413/v053/frozen/
          git commit -m "RaceNote: freeze and verify BTDAY-0078 v0.5.3"
          git pull --rebase origin main
          git push origin HEAD:main
