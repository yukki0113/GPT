name: RaceReviewDB Next-Watch Historical OOS

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEXT_WATCH_HIST_OOS]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check 'duckdb==1.1.3' 'gdown>=6.1,<7'

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch
          gdown '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg' -O /tmp/next_watch/RaceReviewDB_CURRENT.zip
          gdown '1AzhPgqr8GXei4opzbI8gD7nb4-5qZ3Zr' -O /tmp/next_watch/Turn5.zip

      - name: Validate historical OOS
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch/output
          python horse-racing/jrdb/src/jrdb_next_watch_historical_oos.py             --current-zip /tmp/next_watch/RaceReviewDB_CURRENT.zip             --turn5-zip /tmp/next_watch/Turn5.zip             --work-root /tmp/next_watch/work             --fact-output /tmp/next_watch/output/next_watch_historical_oos_fact.parquet             --result-output /tmp/next_watch/output/next_watch_historical_oos_validation.parquet             --summary /tmp/next_watch/output/historical_oos_audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-next-watch-historical-oos-${{ github.run_id }}
          path: /tmp/next_watch/output/
          retention-days: 30
          compression-level: 0
