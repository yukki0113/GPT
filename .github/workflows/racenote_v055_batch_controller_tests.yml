name: RaceNote v0.5.5 Batch Controller tests
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_v055_batch_controller.py'
      - 'horse-racing/jrdb/tests/test_racenote_v055_batch_controller.py'
      - '.github/workflows/racenote_v055_batch_controller*.yml'
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/src/racenote_v055_batch_controller.py'
      - 'horse-racing/jrdb/tests/test_racenote_v055_batch_controller.py'
      - '.github/workflows/racenote_v055_batch_controller*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m py_compile horse-racing/jrdb/src/racenote_v055_batch_controller.py
      - run: python -m pytest -q horse-racing/jrdb/tests/test_racenote_v055_batch_controller.py
