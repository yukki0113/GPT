name: RaceNote BTDAY-0049 A/B session temp
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/requests/BTDAY-0049.session'
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize sealed A/B session
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_ab_session.py \
            --prep-root horse-racing/jrdb/backtests/BTDAY-0049/20260322/forecast_prep \
            --request horse-racing/jrdb/backtests/requests/BTDAY-0049.json \
            --ab-root horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab \
            --base-main-sha bc4b0509be5e110035a00c2b00656f06a966f797
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0049/20260322/ab
          git commit -m 'RaceNote: seal BTDAY-0049 A/B session'
          git pull --rebase origin main
          git push origin HEAD:main
