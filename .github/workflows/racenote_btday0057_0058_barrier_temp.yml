name: RaceNote BTDAY-0057-0058 barrier
on:
  push:
    branches:
      - research/racenote-btday0057-0058-barrier
    paths:
      - 'horse-racing/jrdb/backtests/recovery/BTDAY-0057-0058.trigger'
permissions:
  contents: write
jobs:
  barrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/racenote-btday0057-0058-barrier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and verify barriers
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py \
            --ab-root horse-racing/jrdb/backtests/BTDAY-0057/20260104/ab
          python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py \
            --ab-root horse-racing/jrdb/backtests/BTDAY-0057/20260104/ab --verify-only
          python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py \
            --ab-root horse-racing/jrdb/backtests/BTDAY-0058/20260809/ab
          python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py \
            --ab-root horse-racing/jrdb/backtests/BTDAY-0058/20260809/ab --verify-only

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0057/20260104/ab/ab_freeze_barrier.json \
                  horse-racing/jrdb/backtests/BTDAY-0058/20260809/ab/ab_freeze_barrier.json
          git commit -m 'research(racenote): seal BTDAY-0057 and 0058 barriers'
          git push origin HEAD:research/racenote-btday0057-0058-barrier
