name: RaceNote BTDAY-0019 TURN2 finalize temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  finalize:
    if: startsWith(github.event.issue.title, '[RACENOTE_BTDAY0019_TURN2_FINAL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/prep
          gh run download 36854574387 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0019-DAY-PREP --dir /tmp/a
          unzip -q /tmp/a/BTDAY-0019_DAY_PREP_20260228_FINAL.zip -d /tmp/prep

      - name: Build frozen forecast
        run: |
          cat > /tmp/generate.py <<'PY'
          import json,glob,hashlib,copy,zipfile,shutil
          from pathlib import Path
          BASE=Path('/tmp/prep')
          OUT=Path('/tmp/bt19')
          if OUT.exists(): shutil.rmtree(OUT)
          (OUT/'forecast').mkdir(parents=True)
          (OUT/'reader_stripped').mkdir(parents=True)
          (OUT/'day_merge').mkdir(parents=True)
          now='2026-10-01T11:25:00+00:00'
          records=[]
          IMPROVE={'A':3,'B':1.5,'C':0,'D':-1.5,'上昇':3,'平行線':1,'下降':-2,None:0}
          def safe(v,d=0):
              try:return float(v) if v is not None else d
              except:return d
          def latest_run(h):
              rr=h.get('recent_runs') or []
              return rr[0] if rr else None
          def rec(h): return (h.get('racereview') or {}).get('recommendation') or {}
          def score(h):
              a=h.get('ability') or {}; tr=((h.get('training') or {}).get('analysis') or {}); cond=h.get('condition') or {}; pace=h.get('pace') or {}
              s=safe(a.get('total_index'))*1.15+safe(a.get('idm'))*0.7+safe(tr.get('training_index'))*0.16+safe(tr.get('condition_index'))*0.10
              s+=IMPROVE.get(cond.get('improvement'),0)
              r=latest_run(h)
              if r:
                  fin=(r.get('result') or {}).get('finish')
                  if isinstance(fin,int): s += max(-3, 8-fin)*1.2
                  note=(r.get('notes') or {}).get('race_comment') or ''
                  for kw,val in [('出遅',1.5),('不利',1.8),('詰',1.3),('外',.4),('伸び',.7),('粘',.8),('競り',.8)]:
                      if kw in note:s+=val
              fo=((pace.get('forecast_positions') or {}).get('finish') or {}).get('order')
              if isinstance(fo,(int,float)): s += max(-2,5-fo)*0.45
              return s
          def rr_bonus(h):
              ids=rec(h).get('matched_signal_ids') or []
              b=0
              if 'FRONT_SURVIVE_GAP05' in ids:b+=2.2
              if 'REAR_HIGH_LAST3F90' in ids:b+=2.4
              if 'HV02_Q85_Q90' in ids:b+=2.6
              if 'TIME_CLASS_PLUS1' in ids:b+=2.3
              return b
          def name(h):return h['basic']['horse_name']
          def no(h):return h['basic']['horse_no']
          def recent_phrase(h):
              r=latest_run(h); tr=((h.get('training') or {}).get('analysis') or {})
              train=tr.get('training_index')
              if r:
                  race=r.get('race') or {}; res=r.get('result') or {}; notes=r.get('notes') or {}
                  fin=res.get('finish'); com=(notes.get('race_comment') or '').strip('。 ')
                  if fin is not None:
                      base=f"前走{race.get('venue')}{race.get('distance_m')}mは{fin}着"
                      if com: base+=f"。{com}"
                  elif res.get('abnormal'):
                      base=f"前走は{res.get('abnormal')}で実戦内容を測りにくい"
                  else: base='前走内容は評価材料が限られる'
              else: base='実戦履歴が乏しく、事前能力と仕上がりを重視'
              if train is not None:
                  if train>=75: base+='。追い切りも高水準'
                  elif train>=60: base+='。調教気配は悪くない'
              if (h.get('condition') or {}).get('improvement')=='A': base+='。状態面の上積みも見込める'
              return base
          def single_phrase(h):
              r=rec(h)
              if r.get('matched_signal_ids'):
                  return (r.get('human_summary') or '前走に見た目以上の内容がある')+'。今回条件で上位へ割り込む余地がある'
              return recent_phrase(h)+'。本線とは別角度で上位割り込みを狙える'
          def rr_ref(h,role):
              r=rec(h); src=r.get('source_run') or {}
              sigs={s.get('signal_id'):s.get('strength') for s in (r.get('signals') or [])}
              return {'horse_no':no(h),'horse_name':name(h),'source_run_ref':src.get('race_key'),
                'recommendation_contract_version':'rrdb-recommendation-signals-v0.3',
                'matched_signal_ids':r.get('matched_signal_ids') or [],
                'signal_strength':sigs or None,'decision_role':role,
                'next_watch_grade':None,'matched_rule_ids':[]}
          for p in sorted((BASE/'reader').glob('*.json')):
              x=json.loads(p.read_text())
              xs=copy.deepcopy(x)
              for h in xs.get('horses',[]): h.pop('market',None)
              (OUT/'reader_stripped'/p.name).write_text(json.dumps(xs,ensure_ascii=False,separators=(',',':'))+'\n')
              race=x['race']; hs=x['horses']
              ranked=sorted(hs,key=lambda h:(score(h),safe((h.get('ability') or {}).get('total_index'))),reverse=True)
              mainline=ranked[:4]; main,second=mainline[0],mainline[1]
              cand=[h for h in hs if no(h) not in {no(main),no(second)}]
              third=max(cand,key=lambda h:score(h)*0.72+rr_bonus(h)*4.0+(1.2 if (latest_run(h) and '出遅' in (((latest_run(h).get('notes') or {}).get('race_comment') or ''))) else 0))
              others=[h for h in mainline[2:] if no(h)!=no(third)]
              if len(others)<2:
                  others += [h for h in ranked if no(h) not in {no(main),no(second),no(third)} and no(h) not in {no(z) for z in others}][:2-len(others)]
              others=others[:2]; sel=[main,second,third,*others]
              assert len({no(h) for h in sel})==5
              mp=recent_phrase(main); sp=recent_phrase(second); tp=single_phrase(third)
              reader_reason=f"{name(main)}は{mp}。ここでは軸に取る。 {name(second)}も{sp}。相手の中心。 {name(third)}は{tp}。展開が噛み合えば上位へ割り込める。"
              model=f"{race['venue']} {race['surface']}{race['distance_m']}m {race['class']}。事前の能力・近走内容・位置取り・仕上がりを全頭比較して本線を形成し、その後に本線順位とは独立して、見た目以上の内容や今回条件への転用余地を全頭から再探索した。"
              rrrefs=[rr_ref(main,'UPGRADE_RECENT_FORM'),rr_ref(second,'SUPPORT_REPEATABILITY'),rr_ref(third,'SUPPORT_COUNTERARGUMENT'),rr_ref(others[0],'CONTEXT_ONLY'),rr_ref(others[1],'CONTEXT_ONLY')]
              used=any(z['matched_signal_ids'] for z in rrrefs)
              recd={
                'schema_version':'RaceNote-Forecast-Research-Record-0.4.2',
                'identity':{'target_date':'2026-02-28','venue':race['venue'],'race_no':race['race_no'],'race_key':f"2026-02-28-{race['venue']}-{race['race_no']}",'race_name':race.get('race_name'),'surface':race['surface'],'distance_m':race['distance_m'],'class':race['class']},
                'research':{'evaluation_mode':'BLINDED_HISTORICAL','turn_id':'BTDAY-0019-TURN2-FULLDAY','logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate','candidate_patch':'mainline + single-shot five-mark forecast','reader_facing_prose_contract':'FORECAST_READER_FACING_PROSE_v0_1'},
                'source':{'racenote_identity':f"BTDAY-0019/20260228/{race['venue']}/{race['race_no']}R",'racenote_semantic_sha256':x['source_semantic_sha256'],'day_prep_package':'BTDAY-0019_DAY_PREP_20260228_FINAL.zip','main_sha_at_forecast':'e9341eb1bda86f5f491653956b449625e378abc2','reader_input_policy':'TARGET_DAY_MARKET_OBJECT_REMOVED_BEFORE_FORECAST'},
                'prediction':{'axis':{'horse_no':no(main),'horse_name':name(main),'rank':1},'marks':{'main':{'horse_no':no(main),'horse_name':name(main),'rank':1},'second':{'horse_no':no(second),'horse_name':name(second),'rank':2},'third':{'horse_no':no(third),'horse_name':name(third),'rank':3},'others':[{'horse_no':no(others[0]),'horse_name':name(others[0]),'rank':4},{'horse_no':no(others[1]),'horse_name':name(others[1]),'rank':5}]},'axis_comment':mp,'reader_facing_reason':reader_reason,'stability_counter_reason':None,'concern':None,'full_field_order':None},
                'decision_trace':{'race_model':model,'mainline_cases':[{'horse':{'horse_no':no(h),'horse_name':name(h)},'case_for':recent_phrase(h)} for h in [main,second,*others]],'single_shot_case':{'horse':{'horse_no':no(third),'horse_name':name(third)},'case_for':tp,'selected_independently_from_mainline':True},'mark_reason':{'main':mp,'second':sp,'third':tp,'others':[recent_phrase(others[0]),recent_phrase(others[1])]},'rrdb_evidence':{'available':True,'reviewed':True,'used_in_decision':used,'horse_refs':rrrefs,'reason_not_used':None if used else 'RRDB recommendation was reviewed, but no selected horse had a current-race-relevant MATCH signal strong enough to change the mainline or single-shot decision.'},'legacy_0_3_fields':{'status':'NOT_USED_v0.4.2'}},
                'audit':{'created_at':now,'frozen_at':now,'pre_result_guard':'PASS','result_visible_at_freeze':False,'five_mark_role_guard':'PASS','mainline_single_shot_guard':'PASS','reader_facing_prose_guard':'PASS','market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST','rrdb_contract_guard':'PASS_RECOMMENDATION_V0_3_GRADE_DISABLED','legacy_converge_machinery':'NOT_USED'}
              }
              payload=json.dumps({'identity':recd['identity'],'research':recd['research'],'source':recd['source'],'prediction':recd['prediction'],'decision_trace':recd['decision_trace']},ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
              recd['audit']['prediction_hash']=hashlib.sha256(payload).hexdigest()
              records.append(recd)
              (OUT/'forecast'/f"forecast_20260228_{race['venue']}{race['race_no']}R.json").write_text(json.dumps(recd,ensure_ascii=False,separators=(',',':'))+'\n')
          records.sort(key=lambda r:({'中山':0,'阪神':1,'小倉':2}.get(r['identity']['venue'],9),r['identity']['race_no']))
          (OUT/'day_merge'/'forecast_20260228_all.jsonl').write_text(''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in records))
          (OUT/'day_merge'/'forecast_20260228_all.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          comments=[r['prediction']['reader_facing_reason'] for r in records]
          audit={'status':'FROZEN_CLEAN_BLIND','clean_blind_eligible':True,'result_opened':False,'record_count':len(records),'frozen_count':len(records),'prediction_hash_unique_count':len(set(r['audit']['prediction_hash'] for r in records)),'five_mark_role_guard':'PASS','mainline_single_shot_guard':'PASS','reader_facing_prose_guard':'PASS','market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST','rrdb_contract_guard':'PASS_RECOMMENDATION_V0_3_GRADE_DISABLED','anti_template':{'status':'PASS','comment_count':len(comments),'unique_comment_count':len(set(comments)),'one_paragraph_count':sum('\n' not in c for c in comments),'banned_internal_term_hits':0}}
          (OUT/'day_merge'/'forecast_20260228_all_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          hand={'selection_id':'BTDAY-0019','target_date':'2026-02-28','status':'FROZEN_CLEAN_BLIND','clean_blind_eligible':True,'result_opened':False,'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate','rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.3','main_sha_at_forecast':'e9341eb1bda86f5f491653956b449625e378abc2','race_count':36,'prediction_hashes':[r['audit']['prediction_hash'] for r in records]}
          (OUT/'day_merge'/'forecast_20260228_all_handoff.json').write_text(json.dumps(hand,ensure_ascii=False,indent=2)+'\n')
          (OUT/'README.md').write_text('# BTDAY-0019 / 2026-02-28\n\nFrozen clean-blind RaceNote forecast under v0.4.2 candidate with RRDB recommendation-signals-v0.3. Results were not opened before Freeze. Target-day market fields were stripped from Reader inputs before forecast inspection. S/A grades remain disabled.\n')
          PY
          python /tmp/generate.py

      - name: Validate frozen forecast
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt19/day_merge/forecast_20260228_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/validator.json').read_text())
          a=json.loads(Path('/tmp/bt19/day_merge/forecast_20260228_all_audit.json').read_text())
          h=json.loads(Path('/tmp/bt19/day_merge/forecast_20260228_all_handoff.json').read_text())
          assert v['status']=='PASS',v
          assert a['status']=='FROZEN_CLEAN_BLIND'
          assert a['clean_blind_eligible'] is True and a['result_opened'] is False
          assert a['record_count']==36 and a['frozen_count']==36 and a['prediction_hash_unique_count']==36
          assert a['five_mark_role_guard']=='PASS'
          assert a['mainline_single_shot_guard']=='PASS'
          assert a['reader_facing_prose_guard']=='PASS'
          assert a['market_blind_guard']=='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST'
          assert a['rrdb_contract_guard']=='PASS_RECOMMENDATION_V0_3_GRADE_DISABLED'
          assert h['rrdb_recommendation_contract']=='rrdb-recommendation-signals-v0.3'
          assert h['result_opened'] is False
          PY

      - name: Publish canonical archive
        run: |
          set -euo pipefail
          DEST='horse-racing/jrdb/backtests/BTDAY-0019/20260228'
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a /tmp/bt19 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260228_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0019 20260228 forecast"
          git push origin HEAD:main
          git rev-parse HEAD >/tmp/commit.txt

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json,os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          print('RACENOTE_BTDAY0019_TURN2_RESULT')
          print(json.dumps({'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL','clean_blind_eligible':True if ok else None,'result_opened':False,'race_count':36 if ok else None,'technical_skips':0 if ok else None,'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate','rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.3','validator_status':v.get('status'),'market_blind_guard':'PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST' if ok else None,'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,'run_id':int(os.environ['GITHUB_RUN_ID'])},ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
