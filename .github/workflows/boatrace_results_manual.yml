name: boatrace-results-manual

on:
  workflow_dispatch:
    inputs:
      input_filename:
        description: 'Prediction CSV filename (e.g. 20260825_事前予想_常滑_三国_徳山_若松_Ver1.2.1.csv)'
        required: true
        type: string
      input_csv_gzip_base64:
        description: 'gzip-compressed prediction CSV encoded as Base64'
        required: true
        type: string
      timeout_seconds:
        description: 'HTTP timeout per request'
        required: false
        default: '20'
        type: string
      retry_count:
        description: 'Retry count after the first attempt'
        required: false
        default: '2'
        type: string
      request_interval_seconds:
        description: 'Interval between network requests'
        required: false
        default: '1.0'
        type: string
      unit_stake:
        description: 'Stake per bet in yen (100-yen units)'
        required: false
        default: '100'
        type: string
      strict:
        description: 'Fail unless every row is 取得成功 (中止・不成立も失敗扱い)'
        required: false
        default: false
        type: boolean

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r boat-racing/requirements.txt

      - name: Validate inputs and restore prediction CSV
        env:
          INPUT_FILENAME: ${{ inputs.input_filename }}
          INPUT_CSV_GZIP_BASE64: ${{ inputs.input_csv_gzip_base64 }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          REQUEST_INTERVAL_SECONDS: ${{ inputs.request_interval_seconds }}
          UNIT_STAKE: ${{ inputs.unit_stake }}
        run: |
          python - <<'PY'
          import base64
          import csv
          import gzip
          import io
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          filename = os.environ['INPUT_FILENAME'].strip()
          if not filename or Path(filename).name != filename or not filename.lower().endswith('.csv'):
              raise SystemExit('input_filename must be a basename ending in .csv')

          try:
              timeout = float(os.environ.get('TIMEOUT_SECONDS', '20'))
              retry = int(os.environ.get('RETRY_COUNT', '2'))
              interval = float(os.environ.get('REQUEST_INTERVAL_SECONDS', '1.0'))
              unit_stake = int(os.environ.get('UNIT_STAKE', '100'))
          except ValueError as exc:
              raise SystemExit('timeout/retry/interval/unit_stake input is invalid') from exc
          if timeout <= 0 or retry < 0 or interval < 0 or unit_stake <= 0 or unit_stake % 100:
              raise SystemExit('timeout>0, retry>=0, interval>=0, unit_stake>0 and unit_stake%100==0 are required')

          encoded = ''.join(os.environ['INPUT_CSV_GZIP_BASE64'].split())
          try:
              compressed = base64.b64decode(encoded, validate=True)
              raw = gzip.decompress(compressed)
          except Exception as exc:
              raise SystemExit(f'input_csv_gzip_base64 cannot be decoded: {exc}') from exc
          if not raw or len(raw) > 5 * 1024 * 1024:
              raise SystemExit('decoded CSV must be non-empty and at most 5 MiB')

          try:
              text = raw.decode('utf-8-sig')
          except UnicodeDecodeError as exc:
              raise SystemExit('prediction CSV must be UTF-8 (BOM optional)') from exc

          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          if not rows:
              raise SystemExit('prediction CSV has no data rows')

          required = {
              '日付', '会場', 'R', '判定', '主推奨券種', '主推奨買い目展開後', '主推奨点数',
              '保険券種', '保険買い目', '保険点数', '参考券種', '参考買い目', '予想確定日時'
          }
          missing = sorted(required - set(reader.fieldnames or []))
          if missing:
              raise SystemExit(f'missing required columns: {missing}')

          def normalize_date(value):
              value = (value or '').strip()
              for fmt in ('%Y-%m-%d', '%Y/%m/%d', '%Y%m%d'):
                  try:
                      return datetime.strptime(value, fmt).strftime('%Y%m%d')
                  except ValueError:
                      pass
              raise SystemExit(f'invalid date: {value!r}')

          dates = []
          venues = []
          for row in rows:
              date = normalize_date(row.get('日付'))
              if date not in dates:
                  dates.append(date)
              venue = (row.get('会場') or '').strip()
              if not venue:
                  raise SystemExit('会場 is blank')
              if venue not in venues:
                  venues.append(venue)
          if len(dates) != 1:
              raise SystemExit(f'manual workflow requires a single target date: {dates}')

          date = dates[0]
          venue_part = '_'.join(venues)
          output_dir = Path('boat-racing/actions_output')
          output_dir.mkdir(parents=True, exist_ok=True)
          input_path = Path('/tmp') / filename
          input_path.write_bytes(raw)
          output_path = output_dir / f'{date}_結果_{venue_part}.csv'
          log_path = output_dir / f'{date}_結果取得ログ_{venue_part}.log'

          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as f:
              f.write(f'INPUT_PATH={input_path}\n')
              f.write(f'OUTPUT_PATH={output_path}\n')
              f.write(f'LOG_PATH={log_path}\n')
              f.write(f'TARGET_DATE={date}\n')
              f.write(f'VENUE_PART={venue_part}\n')
              f.write(f'TIMEOUT_SECONDS={timeout}\n')
              f.write(f'RETRY_COUNT={retry}\n')
              f.write(f'REQUEST_INTERVAL_SECONDS={interval}\n')
              f.write(f'UNIT_STAKE={unit_stake}\n')
          PY

      - name: Fetch official results and reconcile predictions
        id: fetch
        env:
          STRICT_MODE: ${{ inputs.strict }}
        run: |
          set +e
          strict_arg=""
          if [ "$STRICT_MODE" = "true" ]; then
            strict_arg="--strict"
          fi
          python boat-racing/src/fetch_boatrace_results.py \
            --input "$INPUT_PATH" \
            --output "$OUTPUT_PATH" \
            --log "$LOG_PATH" \
            --timeout "$TIMEOUT_SECONDS" \
            --retry "$RETRY_COUNT" \
            --interval "$REQUEST_INTERVAL_SECONDS" \
            --unit-stake "$UNIT_STAKE" \
            $strict_arg
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write run status
        if: always()
        run: |
          mkdir -p boat-racing/actions_output
          {
            echo "fetch_exit_code=${{ steps.fetch.outputs.exit_code }}"
            echo "target_date=${TARGET_DATE:-unknown}"
            echo "venues=${VENUE_PART:-unknown}"
            echo "input_filename=${{ inputs.input_filename }}"
          } > boat-racing/actions_output/run_status.txt

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-results-${{ env.TARGET_DATE }}-${{ github.run_id }}
          path: boat-racing/actions_output/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when fetcher failed
        if: always() && steps.fetch.outputs.exit_code != '0'
        run: exit 1
