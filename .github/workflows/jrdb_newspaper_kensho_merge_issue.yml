name: JRDB Newspaper Kensho Merge via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  RELEASE_TAG: jrdb-newspaper-current
  RELEASE_ARCHIVE: jrdb_newspaper_current.tar.xz
  RELEASE_META: jrdb_newspaper_current_release.json
  MOMOTARO_RELEASE_TAG: jrdb-momotaro-newspaper-current
  MOMOTARO_RELEASE_ARCHIVE: jrdb_momotaro_newspaper_current.tar.xz
  MOMOTARO_RELEASE_META: jrdb_momotaro_newspaper_current_release.json

jobs:
  merge:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEWSPAPER_KENSHO_MERGE_REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kensho
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          req=json.loads((os.environ.get("ISSUE_BODY") or "").strip())
          date=str(req.get("date") or "").strip()
          revision=req.get("revision")
          rn=str(req.get("racenote_repo_path") or "").strip()
          rn_gzip_b64=str(req.get("racenote_gzip_b64") or "").strip()
          rr=str(req.get("rrdb_repo_path") or "").strip()
          rr_csv=str(req.get("rrdb_csv") or "")
          momotaro_predictions=req.get("momotaro_predictions", [])
          momotaro_predictions_gzip_b64=str(req.get("momotaro_predictions_gzip_b64") or "").strip()
          momotaro_predictions_append=req.get("momotaro_predictions_append", [])
          if not isinstance(momotaro_predictions_append, list):
              raise SystemExit("momotaro_predictions_append must be an array")
          if momotaro_predictions_gzip_b64:
              import base64,gzip
              if momotaro_predictions:
                  raise SystemExit("supply momotaro_predictions or momotaro_predictions_gzip_b64, not both")
              try:
                  momotaro_predictions=json.loads(gzip.decompress(base64.b64decode(momotaro_predictions_gzip_b64,validate=True)).decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(f"failed to decode momotaro_predictions_gzip_b64: {exc}") from exc
          momotaro_predictions=list(momotaro_predictions or []) + list(momotaro_predictions_append)
          req["momotaro_predictions"]=momotaro_predictions
          keibailuka_entries=req.get("keibailuka_entries", [])
          momotaro_race_comments=req.get("momotaro_race_comments", [])
          if not isinstance(momotaro_predictions, list):
              raise SystemExit("momotaro_predictions must be an array")
          if not isinstance(keibailuka_entries, list):
              raise SystemExit("keibailuka_entries must be an array")
          if not isinstance(momotaro_race_comments, list):
              raise SystemExit("momotaro_race_comments must be an array")
          if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}",date):
              raise SystemExit("date must be YYYY-MM-DD")
          if not isinstance(revision,int) or isinstance(revision,bool) or revision < 1:
              raise SystemExit("revision must be integer >= 1")
          if sum(bool(v) for v in (rn, rn_gzip_b64)) != 1:
              raise SystemExit("supply exactly one of racenote_repo_path/racenote_gzip_b64")
          if sum(bool(v) for v in (rr, rr_csv)) != 1:
              raise SystemExit("supply exactly one of rrdb_repo_path/rrdb_csv")
          if rn:
              p=Path(rn)
              if p.is_absolute() or ".." in p.parts or not p.is_file():
                  raise SystemExit("invalid racenote_repo_path")
          else:
              import base64,gzip
              try:
                  payload=gzip.decompress(base64.b64decode(rn_gzip_b64,validate=True))
              except Exception as exc:
                  raise SystemExit(f"failed to decode racenote_gzip_b64: {exc}") from exc
              Path("/tmp/kensho/racenote.json").write_bytes(payload)
              rn="/tmp/kensho/racenote.json"
          if rr:
              p=Path(rr)
              if p.is_absolute() or ".." in p.parts or not p.is_file():
                  raise SystemExit("invalid rrdb_repo_path")
          else:
              Path("/tmp/kensho/rrdb.csv").write_text(rr_csv,encoding="utf-8")
              rr="/tmp/kensho/rrdb.csv"
          Path("/tmp/kensho/request.json").write_text(json.dumps(req,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/kensho/keibailuka.json").write_text(
              json.dumps({"entries":keibailuka_entries},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as h:
              h.write(f"REQUEST_DATE={date}\nREQUEST_REVISION={revision}\nRACENOTE_PATH={rn}\nRRDB_PATH={rr}\n")
          PY

      - name: Download current personal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/current-release /tmp/current-day
          mkdir -p /tmp/current-release /tmp/current-day
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern "$RELEASE_ARCHIVE" --pattern "$RELEASE_META" --dir /tmp/current-release

      - name: Validate and extract current personal release
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          root=Path("/tmp/current-release")
          archive=root/os.environ["RELEASE_ARCHIVE"]
          meta=json.loads((root/os.environ["RELEASE_META"]).read_text(encoding="utf-8"))
          if meta.get("date") != os.environ["REQUEST_DATE"]:
              raise SystemExit(f"current date mismatch: {meta.get('date')}")
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=meta.get("archive_sha256"):
              raise SystemExit("current archive SHA mismatch")
          with tarfile.open(archive,"r:xz") as h:
              for m in h.getmembers():
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or ".." in p.parts or m.issym() or m.islnk():
                      raise SystemExit(f"unsafe member: {m.name}")
              h.extractall("/tmp/current-day",filter="data")
          manifest=json.loads(Path("/tmp/current-day/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("date") != os.environ["REQUEST_DATE"]:
              raise SystemExit("manifest date mismatch")
          if int(manifest.get("revision") or 0) >= int(os.environ["REQUEST_REVISION"]):
              raise SystemExit("requested revision must be newer than current")
          (Path("/tmp/current-day")/"audit.json").write_text(
              json.dumps({"status":"PASS","date":manifest["date"],"source":"current-release"})+"\n",
              encoding="utf-8")
          PY

      - name: Convert compact RaceNote handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          src=Path(os.environ["RACENOTE_PATH"])
          data=json.loads(src.read_text(encoding="utf-8"))
          if data.get("date") != os.environ["REQUEST_DATE"]:
              raise SystemExit("RaceNote date mismatch")
          fields=["date","venue_code","venue","race_no","race_key","horse_no","horse_name","mark","prediction_rank","confidence","race_short_comment","model_version","source_semantic_sha256"]
          current={}
          for p in Path("/tmp/current-day/races").glob("*.json"):
              b=json.loads(p.read_text(encoding="utf-8"))
              r=b["race"]
              key=(str(r["venue"]),int(r["race_no"]))
              current[key]={
                  "venue_code":str(r["venue_code"]).zfill(2),
                  "race_key":str(r["race_key"]),
                  "horses":{int(h["key"]["horse_no"]):str(h["basic"]["horse_name"]) for h in b.get("horses") or []},
              }
          count=0
          marked=0
          sparse=False
          with Path("/tmp/kensho/racenote.csv").open("w",encoding="utf-8",newline="") as h:
              w=csv.DictWriter(h,fieldnames=fields)
              w.writeheader()
              for race in data.get("races") or []:
                  if isinstance(race.get("horses"),list):
                      for horse in race.get("horses") or []:
                          w.writerow({
                              "date":data["date"],"venue_code":race["venue_code"],"venue":race["venue"],
                              "race_no":race["race_no"],"race_key":race["race_key"],
                              "horse_no":horse["horse_no"],"horse_name":horse["horse_name"],
                              "mark":horse.get("mark") or "","prediction_rank":horse["prediction_rank"],
                              "confidence":horse["confidence"],"race_short_comment":race.get("race_short_comment") or "",
                              "model_version":data["model_version"],
                              "source_semantic_sha256":horse["source_semantic_sha256"],
                          })
                          count+=1
                          marked+=int(bool(str(horse.get("mark") or "").strip()))
                  else:
                      sparse=True
                      venue=str(race.get("venue") or "").strip()
                      race_no=int(race.get("race_no"))
                      base=current.get((venue,race_no))
                      if base is None:
                          raise SystemExit(f"RaceNote race not found in current day: {(venue,race_no)}")
                      marks=race.get("marks") or []
                      if len(marks)!=5:
                          raise SystemExit(f"RaceNote sparse marks must contain 5 rows: {(venue,race_no)} got={len(marks)}")
                      for item in marks:
                          horse_no=int(item["horse_no"])
                          horse_name=base["horses"].get(horse_no)
                          if not horse_name:
                              raise SystemExit(f"RaceNote horse not found in current day: {(venue,race_no,horse_no)}")
                          w.writerow({
                              "date":data["date"],"venue_code":base["venue_code"],"venue":venue,
                              "race_no":race_no,"race_key":base["race_key"],
                              "horse_no":horse_no,"horse_name":horse_name,
                              "mark":str(item.get("mark") or "").strip(),"prediction_rank":int(item["prediction_rank"]),
                              "confidence":"","race_short_comment":str(race.get("race_short_comment") or "").strip(),
                              "model_version":str(race.get("model_version") or "").strip(),
                              "source_semantic_sha256":str(race.get("source_semantic_sha256") or "").strip(),
                          })
                          count+=1
                          marked+=1
          race_count=len(data.get("races") or [])
          if race_count != 24 or count <= 0:
              raise SystemExit(f"RaceNote completeness mismatch races={race_count} horses={count}")
          Path("/tmp/kensho/expected-counts.json").write_text(
              json.dumps({"racenote":count,"racenote_marked":marked,"racenote_sparse_marks":sparse},ensure_ascii=False)+"\n",
              encoding="utf-8")
          PY

      - name: Merge RaceNote and RRDB into personal current
        run: |
          set -euo pipefail
          rm -rf /tmp/merged-day
          EXTRA_ARGS=()
          if python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path("/tmp/kensho/request.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if req.get("keibailuka_entries") else 1)
          PY
          then
            EXTRA_ARGS+=(--keibailuka-json /tmp/kensho/keibailuka.json)
          fi
          RN_ARGS=()
          if python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/kensho/expected-counts.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if x.get("racenote_sparse_marks") else 1)
          PY
          then
            RN_ARGS+=(--racenote-sparse-marks)
          fi
          PYTHONPATH=horse-racing/jrdb/src python horse-racing/jrdb/src/jrdb_newspaper_merge_external.py             --day-dir /tmp/current-day             --output-dir /tmp/merged-day             --racenote-csv /tmp/kensho/racenote.csv             "${RN_ARGS[@]}"             --rrdb-recommendation-csv "$RRDB_PATH"             "${EXTRA_ARGS[@]}"             --revision "$REQUEST_REVISION"             > /tmp/kensho/merge-result.json

      - name: Validate personal merge
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("/tmp/merged-day")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          if manifest.get("date") != os.environ["REQUEST_DATE"] or int(manifest.get("revision") or 0)!=int(os.environ["REQUEST_REVISION"]):
              raise SystemExit("personal manifest mismatch")
          baseline={"eval":0,"iluka":0}
          current_manifest=json.loads(Path("/tmp/current-day/manifest.json").read_text(encoding="utf-8"))
          for entry in current_manifest.get("races") or []:
              b=json.loads((Path("/tmp/current-day")/entry["path"]).read_text(encoding="utf-8"))
              for h in b.get("horses") or []:
                  a=h.get("addons") or {}
                  baseline["eval"] += int(isinstance(a.get("eval"),dict))
                  baseline["iluka"] += int(isinstance(a.get("keibailuka"),dict))
          counts={"eval":0,"iluka":0,"racenote":0,"rrdb":0}
          for entry in manifest.get("races") or []:
              b=json.loads((root/entry["path"]).read_text(encoding="utf-8"))
              for h in b.get("horses") or []:
                  a=h.get("addons") or {}
                  counts["eval"] += int(isinstance(a.get("eval"),dict))
                  counts["iluka"] += int(isinstance(a.get("keibailuka"),dict))
                  counts["racenote"] += int(isinstance(a.get("racenote_prediction"),dict))
                  counts["rrdb"] += int(isinstance(a.get("rrdb_recommendation"),dict))
          expected=json.loads(Path("/tmp/kensho/expected-counts.json").read_text(encoding="utf-8"))
          import csv
          with Path(os.environ["RRDB_PATH"]).open(encoding="utf-8-sig",newline="") as h:
              rrdb_expected=sum(1 for _ in csv.DictReader(h))
          req=json.loads(Path("/tmp/kensho/request.json").read_text(encoding="utf-8"))
          requested_iluka=len(req.get("keibailuka_entries") or [])
          wanted={"eval":baseline["eval"],"iluka":requested_iluka if requested_iluka else baseline["iluka"],"racenote":int(expected["racenote"]),"rrdb":rrdb_expected}
          if counts != wanted:
              raise SystemExit(f"personal counts mismatch: got={counts} expected={wanted}")
          Path("/tmp/kensho/personal-validation.json").write_text(
              json.dumps({"status":"PASS","date":manifest["date"],"revision":manifest["revision"],**counts},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8")
          PY

      - name: Publish personal current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/personal-release
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -C /tmp/merged-day --exclude='./audit.json' -cJf "/tmp/personal-release/$RELEASE_ARCHIVE" .
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("/tmp/merged-day"); out=Path("/tmp/personal-release")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          archive=out/os.environ["RELEASE_ARCHIVE"]
          meta={
              "schema_version":"0.1","release_kind":"jrdb_newspaper_current_cache",
              "date":manifest["date"],"revision":manifest["revision"],"race_count":len(manifest.get("races") or []),
              "manifest_sha256":hashlib.sha256((root/"manifest.json").read_bytes()).hexdigest(),
              "archive_filename":archive.name,"archive_size_bytes":archive.stat().st_size,
              "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "source_run_id":int(os.environ["GITHUB_RUN_ID"]),"source_artifact":"kensho-racenote-rrdb-merge",
          }
          (out/os.environ["RELEASE_META"]).write_text(json.dumps(meta,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --title "JRDB Newspaper current"             --notes "Current personal newspaper with Kensho RaceNote and RRDB merged."             "/tmp/personal-release/$RELEASE_ARCHIVE" "/tmp/personal-release/$RELEASE_META"             /tmp/kensho/personal-validation.json

      - name: Prepare optional Momotaro member predictions
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          req=json.loads(Path("/tmp/kensho/request.json").read_text(encoding="utf-8"))
          rows=req.get("momotaro_predictions") or []
          if not rows:
              raise SystemExit(0)
          fields=["date","venue_code","race_no","horse_no","horse_name","member","mark","confidence","tag","review_horse","comment"]
          # Allow Library-style review-horse rows to omit horse_no when venue/race
          # and horse_name identify exactly one current runner.  Do not fuzzy-match.
          runner_lookup={}
          for p in Path("/tmp/merged-day/races").glob("*.json"):
              b=json.loads(p.read_text(encoding="utf-8"))
              venue_code=str(b["race"]["venue_code"]).zfill(2)
              race_no=int(b["race"]["race_no"])
              for horse in b.get("horses") or []:
                  key=(venue_code,race_no,str(horse["basic"]["horse_name"]))
                  if key in runner_lookup:
                      raise SystemExit(f"duplicate exact horse lookup key: {key}")
                  runner_lookup[key]=int(horse["key"]["horse_no"])
          resolved=[]
          with Path("/tmp/kensho/momotaro_predictions.csv").open("w",encoding="utf-8",newline="") as h:
              w=csv.DictWriter(h,fieldnames=fields)
              w.writeheader()
              for row in rows:
                  row=dict(row)
                  venue_code=str(row.get("venue_code") or "").zfill(2)
                  race_no=int(row.get("race_no"))
                  horse_name=str(row.get("horse_name") or "").strip()
                  raw_no=row.get("horse_no")
                  if raw_no in (None,""):
                      key=(venue_code,race_no,horse_name)
                      if key not in runner_lookup:
                          raise SystemExit(f"exact horse lookup failed: {key}")
                      row["horse_no"]=runner_lookup[key]
                  out={key:row.get(key,"") for key in fields}
                  out["review_horse"]="1" if row.get("review_horse") is True else ""
                  w.writerow(out)
                  resolved.append(row)
          req["momotaro_predictions"]=resolved
          Path("/tmp/kensho/request.json").write_text(
              json.dumps(req,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8")
          PY

      - name: Prepare optional Momotaro race comments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path("/tmp/kensho/request.json").read_text(encoding="utf-8"))
          rows=req.get("momotaro_race_comments") or []
          if rows:
              Path("/tmp/kensho/momotaro_race_comments.json").write_text(
                  json.dumps({"entries":rows},ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8",
              )
          PY

      - name: Build Momotaro projection
        run: |
          set -euo pipefail
          rm -rf /tmp/momotaro-current
          MOMOTARO_ARGS=()
          if [ -f /tmp/kensho/momotaro_predictions.csv ]; then
            MOMOTARO_ARGS+=(--momotaro-csv /tmp/kensho/momotaro_predictions.csv)
          fi
          if [ -f /tmp/kensho/momotaro_race_comments.json ]; then
            MOMOTARO_ARGS+=(--race-comments-json /tmp/kensho/momotaro_race_comments.json)
          fi
          python horse-racing/jrdb/src/build_momotaro_newspaper_projection.py             --day-dir /tmp/merged-day             --output-dir /tmp/momotaro-current             "${MOMOTARO_ARGS[@]}"             > /tmp/kensho/momotaro-projection.json

      - name: Validate Momotaro Kensho projection
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          rrdb={}
          with Path(os.environ["RRDB_PATH"]).open(encoding="utf-8-sig",newline="") as h:
              for row in csv.DictReader(h):
                  rrdb[(str(row["race_key"]),int(row["horse_no"]))]=row["recommendation_comment"]
          root=Path("/tmp/momotaro-current")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          checked=0; rn_marked=0; iluka=0
          for entry in manifest.get("races") or []:
              b=json.loads((root/entry["path"]).read_text(encoding="utf-8"))
              rk=str(b["race"]["race_key"])
              for h in b.get("horses") or []:
                  a=h.get("addons") or {}
                  m=a.get("momotaro") or {}
                  k=m.get("kenshow") or {}
                  if k.get("mark"): rn_marked += 1
                  if isinstance(a.get("keibailuka"),dict): iluka += 1
                  key=(rk,int(h["key"]["horse_no"]))
                  if key in rrdb:
                      if k.get("review_horse") is not True:
                          raise SystemExit(f"RRDB review_horse missing {key}")
                      if k.get("tag") != "不利分析":
                          raise SystemExit(f"RRDB tag mismatch {key}: {k.get('tag')!r}")
                      if k.get("comment") != rrdb[key]:
                          raise SystemExit(f"RRDB comment mismatch {key}")
                      checked+=1
          expected=json.loads(Path("/tmp/kensho/expected-counts.json").read_text(encoding="utf-8"))
          if checked != len(rrdb):
              raise SystemExit(f"RRDB projection count mismatch: got={checked} expected={len(rrdb)}")
          if rn_marked != int(expected["racenote_marked"]):
              raise SystemExit(f"RaceNote marked count mismatch: got={rn_marked} expected={expected['racenote_marked']}")
          personal=json.loads(Path("/tmp/kensho/personal-validation.json").read_text(encoding="utf-8"))
          if iluka != int(personal["iluka"]):
              raise SystemExit(f"Iluka projection count mismatch: got={iluka} expected={personal['iluka']}")

          req=json.loads(Path("/tmp/kensho/request.json").read_text(encoding="utf-8"))
          requested=req.get("momotaro_predictions") or []
          requested_comments=req.get("momotaro_race_comments") or []
          projected={}
          projected_comments={}
          for entry in manifest.get("races") or []:
              b=json.loads((root/entry["path"]).read_text(encoding="utf-8"))
              venue_code=str(b["race"]["venue_code"]).zfill(2)
              race_no=int(b["race"]["race_no"])
              for member,comment in ((b.get("race_notes") or {}).get("momotaro_comments") or {}).items():
                  projected_comments[(venue_code,race_no,str(member))]=str(comment)
              for h in b.get("horses") or []:
                  horse_no=int(h["key"]["horse_no"])
                  member_map=((h.get("addons") or {}).get("momotaro") or {})
                  for member in ("ryota","oji","kenshow"):
                      if isinstance(member_map.get(member),dict):
                          projected[(venue_code,race_no,horse_no,member)]=member_map[member]
          for row in requested:
              key=(str(row["venue_code"]).zfill(2),int(row["race_no"]),int(row["horse_no"]),str(row["member"]))
              got=projected.get(key)
              if not isinstance(got,dict):
                  raise SystemExit(f"requested Momotaro row missing from projection: {key}")
              expected={
                  "mark": str(row.get("mark") or "").strip() or None,
                  "confidence": str(row.get("confidence") or "").strip() or None,
                  "tag": str(row.get("tag") or "").strip() or None,
                  "review_horse": bool(row.get("review_horse")),
                  "comment": str(row.get("comment") or "").strip() or None,
              }
              for field,value in expected.items():
                  if got.get(field) != value:
                      raise SystemExit(f"Momotaro row mismatch {key} field={field}: {got.get(field)!r}!={value!r}")
          for row in requested_comments:
              key=(str(row["venue_code"]).zfill(2),int(row["race_no"]),str(row["member"]))
              expected_comment=str(row.get("comment") or "").strip()
              if projected_comments.get(key) != expected_comment:
                  raise SystemExit(f"Momotaro race comment mismatch {key}: {projected_comments.get(key)!r}!={expected_comment!r}")

          Path("/tmp/kensho/momotaro-validation.json").write_text(
              json.dumps({"status":"PASS","date":manifest["date"],"rrdb_checked":checked,"racenote_marked":rn_marked,"iluka":iluka},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8")
          PY

      - name: Publish Momotaro current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/momotaro-release
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -C /tmp/momotaro-current -cJf "/tmp/momotaro-release/$MOMOTARO_RELEASE_ARCHIVE" .
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("/tmp/momotaro-current"); out=Path("/tmp/momotaro-release")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          archive=out/os.environ["MOMOTARO_RELEASE_ARCHIVE"]
          meta={
              "schema_version":"0.1","release_kind":"jrdb_momotaro_newspaper_current_cache",
              "date":manifest["date"],"revision":manifest.get("revision"),"race_count":len(manifest.get("races") or []),
              "manifest_sha256":hashlib.sha256((root/"manifest.json").read_bytes()).hexdigest(),
              "archive_filename":archive.name,"archive_size_bytes":archive.stat().st_size,
              "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "source_run_id":int(os.environ["GITHUB_RUN_ID"]),"source_artifact":"kensho-projection",
          }
          (out/os.environ["MOMOTARO_RELEASE_META"]).write_text(json.dumps(meta,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          if gh release view "$MOMOTARO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$MOMOTARO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$MOMOTARO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --title "JRDB Momotaro Newspaper current"             --notes "Current Momotaro newspaper projection with Kensho RaceNote and RRDB."             "/tmp/momotaro-release/$MOMOTARO_RELEASE_ARCHIVE" "/tmp/momotaro-release/$MOMOTARO_RELEASE_META"             /tmp/kensho/momotaro-validation.json

      - name: Comment success and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cat /tmp/kensho/personal-validation.json
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "JRDB_NEWSPAPER_KENSHO_MERGE_RESULT: success. Personal and Momotaro current releases updated from the same ${REQUEST_DATE} dataset."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Comment failure and close
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Kensho merge failed. $RUN_URL"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
