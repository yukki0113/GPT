name: keibailuka-note-reaction-probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[KEIBAILUKA_NOTE_PROBE]')
    runs-on: ubuntu-latest
    steps:
      - name: Probe public note metadata
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          req = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          note_key = str(req.get("note_key") or "").strip()
          if not re.fullmatch(r"n[0-9a-f]+", note_key):
              raise SystemExit("invalid note_key")

          ua = {"User-Agent": "Mozilla/5.0", "Accept": "application/json,text/html;q=0.9,*/*;q=0.8"}
          def get(url):
              request = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode("utf-8", errors="replace")

          api_raw = get(f"https://note.com/api/v3/notes/{note_key}")
          payload = json.loads(api_raw)

          matches = []
          def walk(value, path="$"):
              if isinstance(value, dict):
                  for k, v in value.items():
                      child = f"{path}.{k}"
                      if re.search(r"(like|reaction|message)", str(k), re.I):
                          if isinstance(v, (str, int, float, bool)) or v is None:
                              matches.append({"path": child, "value": v})
                          elif isinstance(v, list):
                              matches.append({"path": child, "type": "list", "length": len(v), "preview": v[:10]})
                          elif isinstance(v, dict):
                              matches.append({"path": child, "type": "object", "keys": list(v.keys())[:30]})
                      walk(v, child)
              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      walk(item, f"{path}[{i}]")
          walk(payload)

          html = get(f"https://note.com/keibailuka/n/{note_key}")
          terms = {}
          for term in ("reaction", "like", "スキ", "thank"):
              terms[term] = len(re.findall(term, html, re.I))

          html_matches = []
          for pattern in (
              r'like_appeal_(?:text|image)[^<>{}]{0,300}',
              r'reaction_(?:text|image(?:_url)?)[^<>{}]{0,300}',
          ):
              for match in re.finditer(pattern, html, re.I):
                  snippet = re.sub(r'\\s+', ' ', match.group(0)).strip()
                  if snippet not in html_matches:
                      html_matches.append(snippet[:400])

          reversible = bool(req.get("reversible_like_probe", False))
          reversible_result = None
          if reversible:
              client_code = ("0123456789abcdef" * 4)[:64]
              like_url = f"https://note.com/api/v3/notes/{note_key}/likes"
              post_data = b"{}"
              post_req = urllib.request.Request(
                  like_url,
                  data=post_data,
                  headers={
                      "User-Agent": ua["User-Agent"],
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "X-Note-Client-Code": client_code,
                  },
                  method="POST",
              )
              post_status = None
              post_body = ""
              delete_status = None
              try:
                  try:
                      with urllib.request.urlopen(post_req, timeout=20) as response:
                          post_status = response.status
                          post_body = response.read().decode("utf-8", errors="replace")
                  except urllib.error.HTTPError as exc:
                      post_status = exc.code
                      post_body = exc.read().decode("utf-8", errors="replace")
                  if post_status in (200, 201):
                      delete_req = urllib.request.Request(
                          like_url,
                          headers={
                              "User-Agent": ua["User-Agent"],
                              "Accept": "application/json",
                              "X-Note-Client-Code": client_code,
                          },
                          method="DELETE",
                      )
                      try:
                          with urllib.request.urlopen(delete_req, timeout=20) as response:
                              delete_status = response.status
                      except urllib.error.HTTPError as exc:
                          delete_status = exc.code
              finally:
                  reversible_result = {
                      "post_status": post_status,
                      "post_json": json.loads(post_body) if post_body.strip().startswith("{") else post_body[:500],
                      "delete_status": delete_status,
                  }

          result = {
              "note_key": note_key,
              "api_top_keys": list(payload.keys()),
              "data_keys": list((payload.get("data") or {}).keys()) if isinstance(payload.get("data"), dict) else [],
              "metadata_matches": matches[:100],
              "html_term_counts": terms,
              "html_reaction_snippets": html_matches[:50],
              "reversible_like_probe": reversible_result,
              "write_action_performed": bool(reversible and reversible_result and reversible_result.get("post_status") in (200, 201))
          }

          body = "KEIBAILUKA_NOTE_PROBE_RESULT\n```json\n" + json.dumps(result, ensure_ascii=False, indent=2) + "\n```"
          data = json.dumps({"body": body}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=data,
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20):
              pass
          PY
