name: RRDB Horse Course Fit v0.1 validation

on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/jrdb_horse_course_fit.py'
      - 'horse-racing/jrdb/src/run_rrdb_horse_course_fit_validation.py'
      - 'horse-racing/jrdb/tests/test_jrdb_horse_course_fit.py'
      - '.github/workflows/rrdb_horse_course_fit_validation.yml'
      - 'horse-racing/jrdb/config/public_drive/racenote_a03_accepted_baselines_v1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/data-storage/requirements.txt pytest
      - name: Focused leakage and restart regressions
        run: python -m pytest horse-racing/jrdb/tests/test_jrdb_horse_course_fit.py -q

      - name: Materialize immutable accepted RRDB validation baseline
        run: |
          set -euo pipefail
          python tools/gpt_io/public_drive/fetch.py \
            --manifest horse-racing/jrdb/config/public_drive/racenote_a03_accepted_baselines_v1.json \
            --artifact rrdb_validation_g38327108923 \
            --output-root /tmp/course-fit-input/accepted \
            --receipt /tmp/rrdb-source-storage-receipt.json
          mkdir -p /tmp/course-fit-input/rrdb
          unzip -q /tmp/course-fit-input/accepted/rrdb/RaceReviewDB_jrdb_race_review_v0_1_incremental_g38327108923.zip -d /tmp/course-fit-input/rrdb
          test -f /tmp/course-fit-input/rrdb/postrace_review/v0_1/current.json
      - name: Materialize reviewed public Warehouse BAC and SED
        run: |
          python tools/gpt_io/public_drive/fetch.py --manifest horse-racing/jrdb/config/course_profile/jra_bac_2010_2025_public_drive_manifest.json --output-root /tmp/course-fit-input/warehouse --receipt /tmp/bac-receipt.json
          python tools/gpt_io/public_drive/fetch.py --manifest horse-racing/jrdb/config/course_profile/jra_sed_2010_2025_public_drive_manifest.json --output-root /tmp/course-fit-input/warehouse --receipt /tmp/sed-receipt.json
      - name: Rebuild Phase3, build all stages, assert identical restart
        run: python horse-racing/jrdb/src/run_rrdb_horse_course_fit_validation.py --warehouse-root /tmp/course-fit-input/warehouse --rrdb-artifact-root /tmp/course-fit-input/rrdb --output-dir /tmp/course-fit-output --as-of-date 2026-01-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rrdb-course-fit-reports-${{ github.run_id }}
          path: |
            /tmp/course-fit-output/reports/
            /tmp/course-fit-output/fit/reports/
            /tmp/course-fit-output/fit/manifest.json
            /tmp/course-fit-output/fit/audit.json
            /tmp/rrdb-source-storage-receipt.json
            /tmp/bac-receipt.json
            /tmp/sed-receipt.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rrdb-course-fit-v0-1-${{ github.run_id }}
          path: /tmp/course-fit-output/
