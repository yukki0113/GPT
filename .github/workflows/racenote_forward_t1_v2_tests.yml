name: RaceNote Forward T1 Multi-Source v2 Checks
on:
  pull_request:
    paths:
      - 'horse-racing/jrdb/src/racenote_forward_source_*.py'
      - 'horse-racing/jrdb/src/racenote_v056_forward_turn1.py'
      - 'horse-racing/jrdb/tests/test_racenote_forward_source_v2.py'
      - '.github/workflows/racenote_v056_forward_paci_t1.yml'
      - '.github/workflows/racenote_forward_t1_v2_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: python -m pip install 'duckdb==1.1.3' pytest gdown pyyaml
      - name: Compile source and verify workflow YAML
        run: |
          python -m py_compile horse-racing/jrdb/src/racenote_forward_source_acceptance.py horse-racing/jrdb/src/racenote_forward_source_resolver.py horse-racing/jrdb/src/racenote_v056_forward_turn1.py
          python - <<'PY'
          import yaml
          for name in ('.github/workflows/racenote_v056_forward_paci_t1.yml',
                       '.github/workflows/racenote_forward_t1_v2_tests.yml'):
              with open(name, encoding='utf-8') as f:
                  obj = yaml.safe_load(f)
              assert isinstance(obj, dict) and obj['jobs']
          PY
      - name: Run v2 unit and old A05 regression tests
        run: |
          pytest -q horse-racing/jrdb/tests/test_racenote_forward_source_v2.py \
                    horse-racing/jrdb/tests/test_racenote_a05_forward_freshness.py
