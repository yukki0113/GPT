name: RaceNote BTDAY-0066-0068 settle temp

on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0066_0068.settle'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch JRDB SED HJC and settle
        env:
          JRDB_USER: ${{ secrets.JRDB_USER }}
          JRDB_PASSWORD: ${{ secrets.JRDB_PASSWORD }}
        run: |
          set -euo pipefail
          declare -A DATE
          DATE[0066]=20260719
          DATE[0067]=20260111
          DATE[0068]=20260531

          for ID in 0066 0067 0068; do
            D="${DATE[$ID]}"
            ISO="${D:0:4}-${D:4:2}-${D:6:2}"
            RAW="/tmp/jrdb_result_query/$D"
            ROOT="horse-racing/jrdb/backtests/BTDAY-$ID/$D/v052"
            mkdir -p "$RAW" "$ROOT/settlement"

            python horse-racing/jrdb/src/fetch_jrdb_history.py \
              --date "$D" --kinds SED --output-dir "$RAW/src"
            python horse-racing/jrdb/src/fetch_jrdb_history.py \
              --date "$D" --kinds HJC --output-dir "$RAW/src"

            cp "$RAW/src/SED/SED${D:2}.zip" "$RAW/SED${D:2}.zip"
            cp "$RAW/src/HJC/HJC${D:2}.zip" "$RAW/HJC${D:2}.zip"

            python horse-racing/jrdb/src/racenote_daily_result_from_jrdb.py \
              --date "$ISO" \
              --sed "$RAW/SED${D:2}.zip" \
              --hjc "$RAW/HJC${D:2}.zip" \
              --output "$ROOT/settlement/${D}_JRDB_Result.json" \
              --pretty

            python horse-racing/jrdb/src/racenote_daily_settlement.py \
              --forecast "$ROOT/frozen/records.json" \
              --results "$ROOT/settlement/${D}_JRDB_Result.json" \
              --output-json "$ROOT/settlement/settlement.json" \
              --output-md "$ROOT/settlement/settlement.md" \
              --top 10
          done

      - name: Commit settlement outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horse-racing/jrdb/backtests/BTDAY-0066/20260719/v052/settlement
          git add horse-racing/jrdb/backtests/BTDAY-0067/20260111/v052/settlement
          git add horse-racing/jrdb/backtests/BTDAY-0068/20260531/v052/settlement
          git commit -m "RaceNote: settle BTDAY-0066 through 0068 v0.5.2"
          git push origin HEAD:main
