name: RaceNote recover BTDAY-0055-0056 three-way artifacts
on:
  push:
    branches:
      - research/racenote-btday0055-0056-recover
    paths:
      - 'horse-racing/jrdb/backtests/recovery/BTDAY-0055-0056.trigger'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/racenote-btday0055-0056-recover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact Decision Cores and rebind to current sessions
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json, subprocess, hashlib

          repo = Path('.')
          specs = [
              {
                  "selection_id": "BTDAY-0055",
                  "date": "20260105",
                  "lanes": {
                      "v046": {"pr": 1854, "head": "eb4559e18a03a1c09cc0a1fda46291dd5144f626", "venues": ["中山","京都"]},
                      "v050": {"pr": 1853, "head": "113fc7d539aa62ca4720c394b97b1cf9a9c26ddc", "venues": ["中山","京都"]},
                      "v051": {"pr": 1855, "head": "96608a8297085fe1e2be797ef9c0791a9f5fabdf", "venues": ["中山","京都"]},
                  },
              },
              {
                  "selection_id": "BTDAY-0056",
                  "date": "20260606",
                  "lanes": {
                      "v046": {"pr": 1856, "head": "9f41733dfef552c134334eb0240c52bcf4c1c91a", "venues": ["東京","阪神"]},
                      "v050": {"pr": 1858, "head": "c2124d615d73d91cbe40bac92308b7b6f3d36013", "venues": ["東京","阪神"]},
                      "v051": {"pr": 1857, "head": "bf78282f0b4a6561a3d58f97f6d36dffd876f60c", "venues": ["東京","阪神"]},
                  },
              },
          ]

          def git_show(ref, path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"])

          def sha256(raw):
              return hashlib.sha256(raw).hexdigest()

          audit = {
              "schema_version": "racenote-three-way-recovery-0.1",
              "purpose": "Recover exact lane Decision Cores from immutable PR heads and rebind them without modification to the current three-lane sealed sessions.",
              "days": [],
          }

          for spec in specs:
              sid = spec["selection_id"]
              date = spec["date"]
              root = repo / "horse-racing/jrdb/backtests" / sid / date / "ab"
              session = json.loads((root / "ab_session.json").read_text(encoding="utf-8"))
              day_audit = {
                  "selection_id": sid,
                  "target_date": session["target_date"],
                  "current_session_id": session["session_id"],
                  "clean_reader_manifest_sha256": session["clean_reader_manifest_sha256"],
                  "lanes": {},
              }

              for lane, src in spec["lanes"].items():
                  lane_audit = {
                      "source_pr": src["pr"],
                      "source_head_sha": src["head"],
                      "venues": src["venues"],
                      "source_decision_core_sha256": [],
                  }
                  source_handoff_path = f"horse-racing/jrdb/backtests/{sid}/{date}/ab/{lane}/frozen/lane_handoff.json"
                  source_handoff = json.loads(git_show(src["head"], source_handoff_path))
                  lane_audit.update({
                      "source_session_id": source_handoff["session_id"],
                      "source_records_sha256": source_handoff["records_sha256"],
                      "source_status": source_handoff["status"],
                      "source_validator_status": source_handoff["validator_status"],
                      "source_original_clean_reader_manifest_sha256": source_handoff["original_clean_reader_manifest_sha256"],
                  })
                  if source_handoff["original_clean_reader_manifest_sha256"] != session["clean_reader_manifest_sha256"]:
                      raise SystemExit(f"{sid} {lane}: clean Reader manifest mismatch")

                  incoming_dir = root / lane / "incoming"
                  incoming_dir.mkdir(parents=True, exist_ok=True)
                  for venue in src["venues"]:
                      authored_path = f"horse-racing/jrdb/backtests/{sid}/{date}/ab/{lane}/authored_decisions/{venue}.json"
                      source = json.loads(git_show(src["head"], authored_path))
                      decisions = source["decisions"]
                      hashes = source["decision_core_sha256"]
                      lane_audit["source_decision_core_sha256"].extend(hashes)
                      (incoming_dir / f"{venue}.json").write_text(
                          json.dumps(decisions, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8",
                      )

                  day_audit["lanes"][lane] = lane_audit

              audit["days"].append(day_audit)

          audit_path = repo / "horse-racing/jrdb/backtests/recovery/BTDAY-0055-0056_source_audit.json"
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          for DAY in "BTDAY-0055:20260105:中山:京都" "BTDAY-0056:20260606:東京:阪神"; do
            IFS=':' read -r SID DATE V1 V2 <<< "$DAY"
            AB="horse-racing/jrdb/backtests/$SID/$DATE/ab"
            for LANE in v046 v050 v051; do
              for VENUE in "$V1" "$V2"; do
                python horse-racing/jrdb/src/racenote_ab_lane.py save                   --ab-root "$AB"                   --lane "$LANE"                   --decisions "$AB/$LANE/incoming/$VENUE.json"
              done
              python horse-racing/jrdb/src/racenote_ab_lane.py freeze                 --ab-root "$AB"                 --lane "$LANE"
            done
            python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py               --ab-root "$AB"
            python horse-racing/jrdb/src/racenote_ab_freeze_barrier.py               --ab-root "$AB" --verify-only
          done

          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          base = Path("horse-racing/jrdb/backtests")
          audit_path = base / "recovery/BTDAY-0055-0056_source_audit.json"
          audit = json.loads(audit_path.read_text(encoding="utf-8"))

          for day in audit["days"]:
              sid = day["selection_id"]
              date = day["target_date"].replace("-","")
              root = base / sid / date / "ab"
              barrier = json.loads((root / "ab_freeze_barrier.json").read_text(encoding="utf-8"))
              day["barrier_status"] = barrier["status"]
              day["barrier_session_id"] = barrier["session_id"]
              for lane, lane_audit in day["lanes"].items():
                  authored_hashes = []
                  for path in sorted((root / lane / "authored_decisions").glob("*.json")):
                      authored_hashes.extend(json.loads(path.read_text(encoding="utf-8"))["decision_core_sha256"])
                  if authored_hashes != lane_audit["source_decision_core_sha256"]:
                      raise SystemExit(f"{sid} {lane}: Decision Core hashes changed during recovery")
                  handoff = json.loads((root / lane / "frozen/lane_handoff.json").read_text(encoding="utf-8"))
                  lane_audit["rebound_session_id"] = handoff["session_id"]
                  lane_audit["rebound_records_sha256"] = handoff["records_sha256"]
                  lane_audit["decision_core_hashes_exact_match"] = True
                  lane_audit["rebound_status"] = handoff["status"]
                  lane_audit["rebound_validator_status"] = handoff["validator_status"]

          audit["status"] = "RECOVERED_EXACT_DECISION_CORES_REBOUND_AND_BARRIER_VERIFIED"
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          find horse-racing/jrdb/backtests/BTDAY-0055/20260105/ab                horse-racing/jrdb/backtests/BTDAY-0056/20260606/ab                -type d -name incoming -prune -exec rm -rf {} +

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add horse-racing/jrdb/backtests/BTDAY-0055/20260105/ab                   horse-racing/jrdb/backtests/BTDAY-0056/20260606/ab                   horse-racing/jrdb/backtests/recovery/BTDAY-0055-0056_source_audit.json
          git commit -m 'RaceNote: recover BTDAY-0055 and 0056 three-way freezes'
          git push origin HEAD:research/racenote-btday0055-0056-recover
