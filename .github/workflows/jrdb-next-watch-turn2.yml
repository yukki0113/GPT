name: RaceReviewDB Next-Watch Turn2 Candidate Features

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_NEXT_WATCH_TURN2]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check             'duckdb==1.1.3' 'gdown>=6.1,<7'

      - name: Download RaceReviewDB CURRENT
        run: |
          set -euo pipefail
          mkdir -p /tmp/next_watch
          for attempt in 1 2 3; do
            rm -f /tmp/next_watch/RaceReviewDB_CURRENT.zip
            if gdown '1UwNfrupMTHRPhkzULPvClGre4MWz2TFg'               -O /tmp/next_watch/RaceReviewDB_CURRENT.zip; then
              if python - <<'PY'
import zipfile
path = '/tmp/next_watch/RaceReviewDB_CURRENT.zip'
with zipfile.ZipFile(path) as archive:
    assert archive.testzip() is None
PY
              then
                exit 0
              fi
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Build candidate feature Parquet
        id: build
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/next_watch/output
          python horse-racing/jrdb/src/jrdb_next_watch_candidate.py             --current-zip /tmp/next_watch/RaceReviewDB_CURRENT.zip             --work-root /tmp/next_watch/work             --output /tmp/next_watch/output/next_watch_candidate_signals.parquet             --summary /tmp/next_watch/output/candidate_signals_audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload Turn2 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-next-watch-turn2-${{ github.run_id }}
          path: /tmp/next_watch/output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          python - <<'PY'
import json
import os
from pathlib import Path

path = Path('/tmp/next_watch/output/candidate_signals_audit.json')
if path.is_file():
    result = json.loads(path.read_text(encoding='utf-8'))
else:
    result = {'status': 'FAIL', 'error': 'audit summary missing'}
result['run_id'] = int(os.environ['GITHUB_RUN_ID'])
result['build_exit_code'] = os.environ.get('BUILD_EXIT')
Path('/tmp/next_watch_result.md').write_text(
    'JRDB_NEXT_WATCH_TURN2_RESULT\n```json\n'
    + json.dumps(result, ensure_ascii=False, indent=2)
    + '\n```\n',
    encoding='utf-8',
)
PY
          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body-file /tmp/next_watch_result.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          if [ "$BUILD_EXIT" = "0" ]; then
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason completed
          else
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason "not planned"
          fi

      - name: Fail unless Turn2 passed
        if: always()
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          test "$BUILD_EXIT" = "0"
