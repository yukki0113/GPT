name: RaceNote BTDAY-0021 TURN2 finalize temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  finalize:
    if: startsWith(github.event.issue.title, '[RACENOTE_BTDAY0021_TURN2_FINAL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore DAY PREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse HEAD >/tmp/mainsha.txt
          mkdir -p /tmp/a /tmp/prep
          gh run download 36866276332 --repo "${GITHUB_REPOSITORY}" --name BTDAY-0021-DAY-PREP --dir /tmp/a
          unzip -q "$(find /tmp/a -type f -name '*.zip' | head -1)" -d /tmp/prep
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/prep/day_prep_handoff.json').read_text())
          assert h['selection_id']=='BTDAY-0021' and h['target_date']=='2026-09-21'
          assert h['result_opened'] is False and h['race_count']==12
          PY
      - name: Freeze
        run: |
          cat >/tmp/picks.json <<'JSON'
          {"阪神:1":[8,6,1,3,5],"阪神:2":[9,5,1,3,8],"阪神:3":[9,3,12,6,4],"阪神:4":[1,3,15,11,12],"阪神:5":[6,7,10,3,9],"阪神:6":[8,4,11,13,6],"阪神:7":[16,12,14,2,17],"阪神:8":[7,3,2,4,11],"阪神:9":[12,2,6,4,3],"阪神:10":[5,10,15,11,8],"阪神:11":[1,7,4,3,10],"阪神:12":[10,9,4,5,6]}
          JSON
          python horse-racing/jrdb/src/racenote_finalize_fixed_picks.py             --prep-root /tmp/prep --output-root /tmp/bt21             --selection-id BTDAY-0021 --date 2026-09-21             --turn-id BTDAY-0021-TURN2-FULLDAY             --picks-json /tmp/picks.json --main-sha "$(cat /tmp/mainsha.txt)"
      - name: Validate
        run: |
          set -euo pipefail
          python horse-racing/jrdb/src/validate_racenote_forecast_human_context.py             --records /tmp/bt21/day_merge/forecast_20260921_all.jsonl             --output /tmp/validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/validator.json').read_text())
          a=json.loads(Path('/tmp/bt21/day_merge/forecast_20260921_all_audit.json').read_text())
          h=json.loads(Path('/tmp/bt21/day_merge/forecast_20260921_all_handoff.json').read_text())
          assert v['status']=='PASS'
          assert a['status']=='FROZEN_CLEAN_BLIND' and a['record_count']==12
          assert a['prediction_hash_unique_count']==12 and a['anti_template']['status']=='PASS'
          assert a['market_blind_guard']=='PASS_TARGET_DAY_MARKET_FIELDS_STRIPPED_BEFORE_FORECAST'
          assert a['rrdb_contract_guard']=='PASS_RECOMMENDATION_V0_3_GRADE_DISABLED'
          assert h['result_opened'] is False
          PY
      - name: Publish
        run: |
          set -euo pipefail
          DEST='horse-racing/jrdb/backtests/BTDAY-0021/20260921'
          rm -rf "$DEST"; mkdir -p "$(dirname "$DEST")"; cp -a /tmp/bt21 "$DEST"
          cp /tmp/validator.json "$DEST/day_merge/forecast_20260921_validator.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "RaceNote: freeze BTDAY-0021 20260921 forecast"
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD >/tmp/commit.txt
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json,os
          from pathlib import Path
          ok=Path('/tmp/commit.txt').exists()
          v=json.loads(Path('/tmp/validator.json').read_text()) if Path('/tmp/validator.json').exists() else {}
          a=json.loads(Path('/tmp/bt21/day_merge/forecast_20260921_all_audit.json').read_text()) if Path('/tmp/bt21/day_merge/forecast_20260921_all_audit.json').exists() else {}
          print('RACENOTE_BTDAY0021_TURN2_RESULT')
          print(json.dumps({'status':'FROZEN_CLEAN_BLIND' if ok else 'FAIL','clean_blind_eligible':True if ok else None,'result_opened':False,'race_count':12 if ok else None,'technical_skips':0 if ok else None,'logic_version':'RaceNote-Human-Context-Reader-0.4.2-candidate','rrdb_recommendation_contract':'rrdb-recommendation-signals-v0.3','validator_status':v.get('status'),'market_blind_guard':a.get('market_blind_guard'),'anti_template':(a.get('anti_template') or {}).get('status'),'commit':Path('/tmp/commit.txt').read_text().strip() if ok else None,'run_id':int(os.environ['GITHUB_RUN_ID'])},ensure_ascii=False,indent=2))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          test -f /tmp/commit.txt && gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed || true
