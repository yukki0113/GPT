name: RaceNote BTDAY-0079 v0.5.3 r2 TURN 1
on:
  push:
    branches: [main]
    paths:
      - 'horse-racing/jrdb/backtests/BTDAY-0079/R2_PREPARE_TRIGGER'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'duckdb==1.1.3' pyarrow pandas numpy jsonschema gdown
      - name: Materialize reviewed Historical inputs
        run: |
          set -euo pipefail
          python tools/gpt_io/public_drive/fetch.py \
            --manifest horse-racing/jrdb/config/public_drive/racenote_historical_golden_20251228_v1.json \
            --output-root /tmp/historical \
            --receipt /tmp/historical/public_drive_fetch_receipt.json
          mkdir -p /tmp/historical/analysis /tmp/historical/rrdb
          tar -xJf /tmp/historical/analysis.tar.xz -C /tmp/historical/analysis
          unzip -q /tmp/historical/rrdb.zip -d /tmp/historical/rrdb
      - name: Build canonical v0.5.3 r2 TURN 1
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0079/20251018'
          test ! -e "$TARGET" || { echo "immutable target already exists: $TARGET" >&2; exit 1; }
          MAIN_SHA="$(git rev-parse HEAD)"
          python horse-racing/jrdb/src/racenote_v053_from_historical_warehouse.py \
            --date 2025-10-18 \
            --selection-id BTDAY-0079 \
            --main-sha "$MAIN_SHA" \
            --equivalence-report horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json \
            --warehouse-current /tmp/historical/warehouse/current.json \
            --warehouse-asset-root /tmp/historical/warehouse \
            --analysis-root /tmp/historical/analysis \
            --racereview-root /tmp/historical/rrdb/postrace_review/v0_1 \
            --binding horse-racing/jrdb/config/racenote_reader_v050_binding.json \
            --policy horse-racing/jrdb/docs/racenote/research-work/results/stage_c/reader_feature_policy_v0_5_candidate.json \
            --output-root "$TARGET"
          ROOT="$TARGET/day_prep/RaceNote_20251018"
          cp "$ROOT/manifest.json" "$TARGET/day_prep/manifest.json"
          cp "$ROOT/validation_report.json" "$TARGET/day_prep/validation_report.json"
          mkdir -p "$TARGET/source_audit"
          cp /tmp/historical/public_drive_fetch_receipt.json "$TARGET/source_audit/public_drive_fetch_receipt.json"
          cp horse-racing/jrdb/docs/racenote/RACENOTE_HISTORICAL_WAREHOUSE_V052_EQUIVALENCE_20251228.json "$TARGET/source_audit/accepted_equivalence_gate.json"
      - name: Validate sealed v0.5.3 r2 TURN 1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('horse-racing/jrdb/backtests/BTDAY-0079/20251018')
          m=json.loads((root/'day_prep/manifest.json').read_text())
          v=json.loads((root/'day_prep/validation_report.json').read_text())
          p=json.loads((root/'forecast_prep/day_prep_handoff.json').read_text())
          o=json.loads((root/'operation_handoff.json').read_text())
          s=json.loads((root/'v053/session.json').read_text())
          rm=json.loads((root/'v053/reader_manifest.json').read_text())
          assert m['status']=='PASS' and v['status']=='PASS'
          assert p['market_blind'] is True and p['result_opened'] is False and p['target_market_opened'] is False
          assert o['status']=='READY_FOR_V053_AUTHORING'
          assert o['source_backend']=='historical_warehouse'
          assert o['source_generation_id']=='jrdb_normalized_warehouse_v1_2010_2025_g20260921'
          assert o['as_of_exclusive']=='2025-10-18'
          assert o['logic_version']=='RaceNote-Human-Context-Reader-0.5.3-candidate'
          assert o['contract_revision']=='v053-boundary-safety-r2'
          assert o['market_blind'] is True and o['result_opened'] is False and o['target_market_opened'] is False
          assert s['status']=='SESSION_SEALED'
          assert s['logic_version']=='RaceNote-Human-Context-Reader-0.5.3-candidate'
          assert s['contract_revision']=='v053-boundary-safety-r2'
          assert rm['contract_revision']=='v053-boundary-safety-r2'
          assert s['market_blind'] is True and s['result_opened'] is False and s['target_market_opened'] is False
          assert len(s['race_roster'])==m['counts']['races_built']==p['race_count']==o['race_count']==len(rm['entries'])
          assert len(s['race_roster']) > 0
          PY
      - name: Commit immutable r2 TURN 1
        run: |
          set -euo pipefail
          TARGET='horse-racing/jrdb/backtests/BTDAY-0079/20251018'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET/day_prep/manifest.json" "$TARGET/day_prep/validation_report.json"
          git add "$TARGET/forecast_prep" "$TARGET/v053" "$TARGET/operation_handoff.json" "$TARGET/source_audit"
          git commit -m 'RaceNote: stage BTDAY-0079 v0.5.3 r2 TURN 1'
          git pull --rebase origin main
          git push origin HEAD:main
