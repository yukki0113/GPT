# Registration refresh: 2026-09-15
name: JRDB Training Edge v0.2 Daily Runtime Tests via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_TRAINING_V02_DAILY_TEST]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frozen Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install frozen numerical runtime
        run: >-
          python -m pip install --disable-pip-version-check
          'numpy==2.5.3'
          'pandas==3.0.5'
          'scipy==1.18.1'
          'scikit-learn==1.9.1'
          pytest

      - name: Run Training Edge daily tests
        run: |
          python -m pytest -q horse-racing/jrdb/tests/test_training_edge_v0_2_core.py
          python -m pytest -q horse-racing/jrdb/tests/test_fingerprint_training_edge_v0_2_runtime.py
          python -m pytest -q horse-racing/jrdb/tests/test_score_training_edge_v0_2_daily.py

      - name: Comment PASS
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'JRDB_TRAINING_V02_DAILY_TEST_RESULT: PASS'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
