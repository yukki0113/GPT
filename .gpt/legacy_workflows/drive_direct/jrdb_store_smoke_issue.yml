name: jrdb-store-smoke-issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: startsWith(github.event.issue.title, '[JRDB_STORE_SMOKE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          try:
              request = json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Issue body must be raw JSON: {exc}') from exc

          manifest_url = str(request.get('manifest_url', '')).strip()
          logical_name = str(request.get('logical_name', '')).strip()
          expected_payload_sha256 = str(request.get('expected_payload_sha256', '')).strip().lower()
          expected_index = str(request.get('expected_index', '')).strip()

          if not manifest_url.startswith('https://drive.google.com/'):
              raise SystemExit('manifest_url must be a Google Drive URL')
          if not re.fullmatch(r'[a-z0-9_./-]{1,120}', logical_name):
              raise SystemExit('invalid logical_name')
          if expected_payload_sha256 and not re.fullmatch(r'[0-9a-f]{64}', expected_payload_sha256):
              raise SystemExit('expected_payload_sha256 must be 64 hex characters')
          if expected_index and not re.fullmatch(r'[A-Za-z0-9_]{1,120}', expected_index):
              raise SystemExit('invalid expected_index')

          resolved = {
              'manifest_url': manifest_url,
              'logical_name': logical_name,
              'expected_payload_sha256': expected_payload_sha256,
              'expected_index': expected_index,
          }
          Path('/tmp/jrdb_store_smoke_request.json').write_text(
              json.dumps(resolved, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Download live manifest
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(Path('/tmp/jrdb_store_smoke_request.json').read_text(encoding='utf-8'))
          subprocess.run(
              ['gdown', request['manifest_url'], '-O', '/tmp/jrdb_store_manifest.json'],
              check=True,
          )
          PY

      - name: Resolve with StoreResolver and validate
        id: smoke
        continue-on-error: true
        env:
          PYTHONPATH: horse-racing/jrdb/src
        run: |
          set +e
          python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          from jrdb_store import StoreResolver

          request = json.loads(Path('/tmp/jrdb_store_smoke_request.json').read_text(encoding='utf-8'))
          result_path = Path('/tmp/jrdb_store_smoke_result.json')

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          try:
              resolver = StoreResolver.from_file(
                  Path('/tmp/jrdb_store_manifest.json'),
                  cache_root=Path('/tmp/jrdb_store_cache'),
              )
              resolved = resolver.resolve(request['logical_name'])
              payload_sha256 = sha256_file(resolved)
              output = {
                  'status': 'success',
                  'logical_name': request['logical_name'],
                  'resolved_path': str(resolved),
                  'payload_size': resolved.stat().st_size,
                  'payload_sha256': payload_sha256,
              }

              expected_sha = request['expected_payload_sha256']
              if expected_sha and payload_sha256 != expected_sha:
                  raise RuntimeError(
                      f'payload SHA mismatch: expected {expected_sha}, got {payload_sha256}'
                  )

              if resolved.suffix.lower() == '.sqlite':
                  connection = sqlite3.connect(resolved)
                  try:
                      integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
                      if integrity != 'ok':
                          raise RuntimeError(f'integrity_check={integrity!r}')
                      output['integrity_check'] = integrity
                      tables = {
                          row[0]
                          for row in connection.execute(
                              "SELECT name FROM sqlite_master WHERE type='table'"
                          )
                      }
                      if 'fact_entry_result_lite' in tables:
                          output['fact_rows'] = connection.execute(
                              'SELECT count(*) FROM fact_entry_result_lite'
                          ).fetchone()[0]
                          indexes = {
                              row[1]
                              for row in connection.execute(
                                  'PRAGMA index_list(fact_entry_result_lite)'
                              )
                          }
                          output['fact_indexes'] = sorted(indexes)
                          expected_index = request['expected_index']
                          if expected_index and expected_index not in indexes:
                              raise RuntimeError(f'missing expected index: {expected_index}')
                  finally:
                      connection.close()

              result_path.write_text(
                  json.dumps(output, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          except Exception as exc:
              result_path.write_text(
                  json.dumps(
                      {
                          'status': 'failure',
                          'logical_name': request.get('logical_name'),
                          'error': f'{type(exc).__name__}: {exc}',
                      },
                      ensure_ascii=False,
                      indent=2,
                  ) + '\n',
                  encoding='utf-8',
              )
              raise
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-store-smoke-${{ github.run_id }}
          path: /tmp/jrdb_store_smoke_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path('/tmp/jrdb_store_smoke_result.json')
          if result_path.is_file():
              result = json.loads(result_path.read_text(encoding='utf-8'))
          else:
              result = {'status': 'failure', 'error': 'smoke result was not produced'}
          result['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          result['head_sha'] = os.environ['GITHUB_SHA']
          result['smoke_exit_code'] = os.environ.get('SMOKE_EXIT', '')
          Path('/tmp/jrdb_store_smoke_comment.md').write_text(
              'JRDB_STORE_SMOKE_RESULT\n```json\n'
              + json.dumps(result, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/jrdb_store_smoke_comment.md

      - name: Close request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

      - name: Fail when smoke failed
        if: always() && steps.smoke.outputs.exit_code != '0'
        run: exit 1
