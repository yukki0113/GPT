name: JRDB Edge v0.3 statistical shadow audit via Issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_EDGE_V03_STATISTICAL_SHADOW]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          req=json.loads((os.environ.get('ISSUE_BODY') or '').strip())
          required={
              'warehouse_current_drive_file_id','warehouse_manifest_drive_file_id',
              'warehouse_generation_id','warehouse_manifest_sha256',
              'bac_staging_folder_id','kyi_staging_folder_id',
              'sed_staging_folder_id','ukc_staging_folder_id',
              'b1_run_id','b1_artifact_name','b1_incremental_edges_sha256','b1_summary_sha256'
          }
          missing=sorted(required-set(req))
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          sha_re=re.compile(r'[0-9a-f]{64}')
          for field in ('warehouse_manifest_sha256','b1_incremental_edges_sha256','b1_summary_sha256'):
              if not sha_re.fullmatch(str(req[field]).lower()):
                  raise SystemExit(f'invalid {field}')
          if req['warehouse_generation_id']!='jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('unexpected Warehouse generation')
          if not isinstance(req['b1_run_id'],int) or req['b1_run_id']<=0:
              raise SystemExit('b1_run_id must be positive')
          Path('/tmp/request.json').write_text(
              json.dumps(req,ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for key,value in req.items():
                  if isinstance(value,(str,int)):
                      f.write(f'{key.upper()}={value}\n')
          PY

      - name: Install dependencies and focused tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest numpy gdown
          python -m pip install --disable-pip-version-check -q -r tools/data-storage/requirements.txt
          PYTHONPATH=horse-racing/jrdb/src:tools/data-storage python -m pytest -q \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_incremental_shadow.py \
            horse-racing/jrdb/tests/test_audit_jrdb_edge_v03_statistical_shadow.py \
            horse-racing/jrdb/tests/test_validate_jrdb_edge_semantic_hierarchy_v0_3.py \
            tools/data-storage/tests/test_materialize.py

      - name: Download and validate Warehouse current + manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/warehouse
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=$WAREHOUSE_CURRENT_DRIVE_FILE_ID&export=download&confirm=t" \
            -o /tmp/warehouse/current.json
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=$WAREHOUSE_MANIFEST_DRIVE_FILE_ID&export=download&confirm=t" \
            -o /tmp/warehouse/manifest.json
          python - <<'PY'
          import hashlib, json, os
          current=json.load(open('/tmp/warehouse/current.json'))
          manifest=json.load(open('/tmp/warehouse/manifest.json'))
          if current.get('status')!='accepted':
              raise SystemExit('Warehouse current is not accepted')
          if current.get('generation_id')!=os.environ['WAREHOUSE_GENERATION_ID']:
              raise SystemExit('Warehouse current generation mismatch')
          if manifest.get('status')!='PASS' or manifest.get('generation_id')!=current.get('generation_id'):
              raise SystemExit('Warehouse manifest/current mismatch')
          digest=hashlib.sha256(
              json.dumps(
                  manifest,ensure_ascii=False,sort_keys=True,separators=(',',':')
              ).encode('utf-8')
          ).hexdigest()
          if digest!=os.environ['WAREHOUSE_MANIFEST_SHA256']:
              raise SystemExit(
                  f"Warehouse canonical manifest SHA mismatch expected={os.environ['WAREHOUSE_MANIFEST_SHA256']} actual={digest}"
              )
          if digest!=current.get('manifest_sha256'):
              raise SystemExit(
                  f"Warehouse current manifest SHA mismatch current={current.get('manifest_sha256')} actual={digest}"
              )
          if manifest.get('asset_reference_mode')!='staging_immutable_reference':
              raise SystemExit('unexpected Warehouse asset reference mode')
          PY

      - name: Materialize immutable Warehouse families from manifest
        env:
          PYTHONPATH: tools/data-storage
        run: |
          set -euo pipefail
          mkdir -p /tmp/warehouse/families /tmp/warehouse/cache /tmp/warehouse/materialization-audit
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.load(open('/tmp/warehouse/manifest.json'))
          for family in ('BAC','KYI','SED','UKC'):
              assets=[
                  item for item in source.get('assets',[])
                  if str(item.get('family') or '').upper()==family
              ]
              if len(assets)!=16:
                  raise SystemExit(f'{family}: expected 16 canonical manifest assets, got {len(assets)}')
              subset=dict(source)
              subset['assets']=assets
              Path(f'/tmp/warehouse/manifest-{family}.json').write_text(
                  json.dumps(subset,ensure_ascii=False,indent=2,sort_keys=True)+'\n',
                  encoding='utf-8'
              )
          PY
          for family in BAC KYI SED UKC; do
            folder_var="${family}_STAGING_FOLDER_ID"
            folder_id="${!folder_var}"
            python -m data_storage materialize-manifest \
              --manifest "/tmp/warehouse/manifest-$family.json" \
              --output-root "/tmp/warehouse/families/$family" \
              --cache-dir /tmp/warehouse/cache \
              --audit "/tmp/warehouse/materialization-audit/$family.json" \
              --folder "$family=$folder_id" \
              --folder-label "$family" \
              --backend auto
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for family in ('BAC','KYI','SED','UKC'):
              root=Path('/tmp/warehouse/families')/family
              files=list(root.rglob('*.parquet'))
              audit=json.load(open(Path('/tmp/warehouse/materialization-audit')/f'{family}.json'))
              if audit.get('status')!='PASS':
                  raise SystemExit(f'{family}: materialization audit failed')
              if audit.get('verified_count')!=16 or audit.get('expected_asset_count')!=16:
                  raise SystemExit(
                      f"{family}: expected 16 verified assets, "
                      f"got verified={audit.get('verified_count')} expected={audit.get('expected_asset_count')}"
                  )
              if len(files)!=16:
                  raise SystemExit(f'{family}: expected 16 parquet assets, got {len(files)}')
          PY

      - name: Download and verify Stage-B1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b1
          gh run download "$B1_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$B1_ARTIFACT_NAME" --dir /tmp/b1
          mapfile -t incremental < <(find /tmp/b1 -type f -name incremental_edges.jsonl -print)
          mapfile -t summaries < <(find /tmp/b1 -type f -name summary.json -print)
          test "${#incremental[@]}" -eq 1
          test "${#summaries[@]}" -eq 1
          cp "${incremental[0]}" /tmp/b1_incremental_edges.jsonl
          cp "${summaries[0]}" /tmp/b1_summary.json
          echo "$B1_INCREMENTAL_EDGES_SHA256  /tmp/b1_incremental_edges.jsonl" | sha256sum -c -
          echo "$B1_SUMMARY_SHA256  /tmp/b1_summary.json" | sha256sum -c -
          python - <<'PY'
          import json
          summary=json.load(open('/tmp/b1_summary.json'))
          if summary.get('status')!='PASS':
              raise SystemExit('Stage-B1 summary is not PASS')
          if summary.get('mode')!='SHADOW_ONLY':
              raise SystemExit('Stage-B1 mode mismatch')
          if summary.get('threshold_policy')!='NOT_APPLIED':
              raise SystemExit('Stage-B1 threshold policy mismatch')
          if summary.get('warehouse_generation_id')!='jrdb_normalized_warehouse_v1_2010_2025_g20260921':
              raise SystemExit('Stage-B1 Warehouse generation mismatch')
          PY

      - name: Run v0.3 Stage-B2a statistical diagnostics
        env:
          PYTHONPATH: horse-racing/jrdb/src:tools/data-storage
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit/materialization-audit
          python horse-racing/jrdb/src/audit_jrdb_edge_v03_statistical_shadow.py \
            --warehouse-manifest /tmp/warehouse/manifest.json \
            --bac-root /tmp/warehouse/families/BAC \
            --kyi-root /tmp/warehouse/families/KYI \
            --sed-root /tmp/warehouse/families/SED \
            --ukc-root /tmp/warehouse/families/UKC \
            --b1-jsonl /tmp/b1_incremental_edges.jsonl \
            --output-jsonl /tmp/audit/statistical_edges.jsonl \
            --output-summary /tmp/audit/summary.json \
            --bootstrap-replicates 2000 \
            --bootstrap-confidence 0.95
          cp /tmp/request.json /tmp/audit/request.json
          cp /tmp/warehouse/current.json /tmp/audit/warehouse_current.json
          cp /tmp/b1_summary.json /tmp/audit/b1_summary.json
          cp /tmp/warehouse/materialization-audit/*.json /tmp/audit/materialization-audit/

      - name: Upload statistical shadow audit
        uses: actions/upload-artifact@v4
        with:
          name: jrdb-edge-v03-statistical-shadow-${{ github.run_id }}
          path: /tmp/audit/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Comment result and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          result=json.load(open('/tmp/audit/summary.json'))
          compact={
              'status':result['status'],
              'stage':result['stage'],
              'run_id':int(os.environ['RUN_ID']),
              'head_sha':os.environ['HEAD_SHA'],
              'artifact_name':f"jrdb-edge-v03-statistical-shadow-{os.environ['RUN_ID']}",
              'warehouse_generation_id':result['warehouse_generation_id'],
              'fact_rows':result['fact_rows'],
              'fact_period_from':result['fact_period_from'],
              'fact_period_to':result['fact_period_to'],
              'b1_raw_incremental_edges':result['b1_raw_incremental_edges'],
              'b2_metrics_ready':result['b2_metrics_ready'],
              'bootstrap':result['bootstrap'],
              'multiple_testing':result['multiple_testing'],
              'temporal':result['temporal'],
              'value':result['value'],
              'threshold_policy':result['threshold_policy'],
              'mode':'SHADOW_ONLY',
          }
          body='JRDB_EDGE_V03_STATISTICAL_SHADOW_RESULT\n'+json.dumps(compact,ensure_ascii=False,indent=2,sort_keys=True)
          subprocess.run(['gh','issue','comment',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          subprocess.run(['gh','issue','close',os.environ['ISSUE_NUMBER'],'--repo',os.environ['GITHUB_REPOSITORY'],'--reason','completed'],check=True)
          PY

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "JRDB Edge v0.3 Stage-B2a statistical shadow audit failed. No production serving was changed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
