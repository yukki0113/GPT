name: RaceReviewDB Input Acquisition Smoke

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      github.event.issue.user.login == 'yukki0113' &&
      startsWith(github.event.issue.title, '[JRDB_RACE_REVIEW_INPUT_SMOKE]')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader
        run: |
          python -m pip install --disable-pip-version-check 'gdown>=6.1,<7'

      - name: Parse PACI and SED request lists
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/race_review_smoke
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get('ISSUE_BODY') or ''
          grouped = {'PACI': [], 'SED': []}

          for raw in body.splitlines():
              line = raw.strip()
              kind = None
              if line.startswith('PACI|'):
                  kind = 'PACI'
              elif line.startswith('SED|'):
                  kind = 'SED'
              if kind is None:
                  continue

              parts = line.split('|')
              if len(parts) != 3:
                  raise SystemExit(f'invalid input line: {line}')
              _, file_id, name = parts
              if not re.fullmatch(r'[A-Za-z0-9_-]+', file_id):
                  raise SystemExit(f'invalid Drive file id: {file_id}')
              if not re.fullmatch(kind + r'\d{6}\.zip', name):
                  raise SystemExit(f'invalid {kind} file name: {name}')
              grouped[kind].append((name, file_id))

          for kind in ('PACI', 'SED'):
              grouped[kind].sort()
              if not grouped[kind]:
                  raise SystemExit(f'no {kind} inputs')
              dates = [name[len(kind):len(kind)+6] for name, _ in grouped[kind]]
              if len(dates) != len(set(dates)):
                  raise SystemExit(f'duplicate {kind} dates')

          paci_dates = [name[4:10] for name, _ in grouped['PACI']]
          sed_dates = [name[3:9] for name, _ in grouped['SED']]
          if paci_dates != sed_dates:
              raise SystemExit('PACI/SED date coverage mismatch')

          for kind in ('PACI', 'SED'):
              path = Path('/tmp/race_review_smoke/' + kind.lower() + '.tsv')
              path.write_text(
                  ''.join(
                      f'{name}\t{file_id}\n'
                      for name, file_id in grouped[kind]
                  ),
                  encoding='utf-8',
              )

          print(f'paired_dates={len(paci_dates)}')
          print(f'first={paci_dates[0]}')
          print(f'last={paci_dates[-1]}')
          PY

      - name: Download and validate all inputs
        id: acquire
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/race_review_smoke/files
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          root = Path('/tmp/race_review_smoke')
          files_root = root / 'files'
          files_root.mkdir(parents=True, exist_ok=True)

          def run(command):
              return subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )

          def zip_ok(path):
              try:
                  with zipfile.ZipFile(path) as archive:
                      return archive.testzip() is None
              except (OSError, zipfile.BadZipFile):
                  return False

          def download(name, file_id, target):
              methods = []

              for attempt in range(1, 3):
                  target.unlink(missing_ok=True)
                  result = run([
                      'gdown',
                      file_id,
                      '-O',
                      str(target),
                  ])
                  methods.append({
                      'method': 'gdown',
                      'attempt': attempt,
                      'returncode': result.returncode,
                  })
                  if result.returncode == 0 and target.is_file() and target.stat().st_size > 0 and zip_ok(target):
                      return 'gdown', methods
                  target.unlink(missing_ok=True)
                  time.sleep(attempt * 2)

              urls = [
                  (
                      'driveusercontent',
                      f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  ),
                  (
                      'drive_uc',
                      f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t',
                  ),
              ]
              for label, url in urls:
                  target.unlink(missing_ok=True)
                  result = run([
                      'curl',
                      '--fail',
                      '--location',
                      '--silent',
                      '--show-error',
                      '--retry',
                      '5',
                      '--retry-all-errors',
                      '--connect-timeout',
                      '20',
                      '--max-time',
                      '180',
                      url,
                      '-o',
                      str(target),
                  ])
                  methods.append({
                      'method': label,
                      'attempt': 1,
                      'returncode': result.returncode,
                  })
                  if result.returncode == 0 and target.is_file() and target.stat().st_size > 0 and zip_ok(target):
                      return label, methods

              target.unlink(missing_ok=True)
              return None, methods

          def validate_members(kind, name, target):
              if kind == 'PACI':
                  date = name[4:10]
                  required = {
                      f'BAC{date}.txt',
                      f'KYI{date}.txt',
                  }
              else:
                  date = name[3:9]
                  required = {
                      f'SED{date}.txt',
                  }

              with zipfile.ZipFile(target) as archive:
                  members = set(archive.namelist())
                  missing = sorted(required - members)
                  if missing:
                      raise RuntimeError(
                          f'{name}: missing ZIP members {missing}'
                      )
                  return len(members)

          summary = {
              'status': 'PASS',
              'files': [],
              'failures': [],
          }

          tasks = []
          for kind in ('PACI', 'SED'):
              tsv = root / (kind.lower() + '.tsv')
              for line in tsv.read_text(encoding='utf-8').splitlines():
                  name, file_id = line.split('\t')
                  tasks.append((kind, name, file_id))

          def acquire_one(task):
              kind, name, file_id = task
              target = files_root / name
              method, attempts = download(
                  name,
                  file_id,
                  target,
              )
              if method is None:
                  return {
                      'ok': False,
                      'failure': {
                          'kind': kind,
                          'name': name,
                          'file_id': file_id,
                          'reason': 'download_failed_all_methods',
                          'attempts': attempts,
                      },
                  }

              try:
                  member_count = validate_members(
                      kind,
                      name,
                      target,
                  )
              except Exception as exc:
                  return {
                      'ok': False,
                      'failure': {
                          'kind': kind,
                          'name': name,
                          'file_id': file_id,
                          'reason': str(exc),
                          'method': method,
                      },
                  }

              digest = hashlib.sha256(
                  target.read_bytes()
              ).hexdigest()
              return {
                  'ok': True,
                  'file': {
                      'kind': kind,
                      'name': name,
                      'file_id': file_id,
                      'method': method,
                      'size_bytes': target.stat().st_size,
                      'sha256': digest,
                      'member_count': member_count,
                  },
              }

          with ThreadPoolExecutor(max_workers=8) as executor:
              future_map = {
                  executor.submit(acquire_one, task): task
                  for task in tasks
              }
              for future in as_completed(future_map):
                  result = future.result()
                  if result['ok']:
                      summary['files'].append(result['file'])
                  else:
                      summary['status'] = 'FAIL'
                      summary['failures'].append(result['failure'])

          summary['files'].sort(
              key=lambda item: (item['kind'], item['name'])
          )
          summary['failures'].sort(
              key=lambda item: (item['kind'], item['name'])
          )

          summary['paci_count'] = sum(
              1 for item in summary['files']
              if item['kind'] == 'PACI'
          )
          summary['sed_count'] = sum(
              1 for item in summary['files']
              if item['kind'] == 'SED'
          )
          summary['downloaded_count'] = len(summary['files'])
          summary['failure_count'] = len(summary['failures'])
          summary['method_counts'] = {}
          for item in summary['files']:
              label = item['method']
              summary['method_counts'][label] = (
                  summary['method_counts'].get(label, 0) + 1
              )

          path = root / 'acquisition_summary.json'
          path.write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2,
              )
              + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'status': summary['status'],
              'paci_count': summary['paci_count'],
              'sed_count': summary['sed_count'],
              'failure_count': summary['failure_count'],
              'method_counts': summary['method_counts'],
              'failures': summary['failures'],
          }, ensure_ascii=False))

          if summary['status'] != 'PASS':
              raise SystemExit(1)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload acquisition summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceReviewDB-input-smoke-${{ github.run_id }}
          path: /tmp/race_review_smoke/acquisition_summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACQUIRE_EXIT: ${{ steps.acquire.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/race_review_smoke/acquisition_summary.json')
          if path.is_file():
              summary = json.loads(path.read_text(encoding='utf-8'))
              compact = {
                  'status': summary.get('status'),
                  'paci_count': summary.get('paci_count'),
                  'sed_count': summary.get('sed_count'),
                  'failure_count': summary.get('failure_count'),
                  'method_counts': summary.get('method_counts'),
                  'failures': summary.get('failures'),
              }
          else:
              compact = {
                  'status': 'FAIL',
                  'error': 'acquisition_summary.json missing',
              }

          compact['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          compact['acquire_exit_code'] = os.environ.get('ACQUIRE_EXIT')

          Path('/tmp/race_review_smoke_result.md').write_text(
              'JRDB_RACE_REVIEW_INPUT_SMOKE_RESULT\n```json\n'
              + json.dumps(compact, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          PY

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body-file /tmp/race_review_smoke_result.md

      - name: Close request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACQUIRE_EXIT: ${{ steps.acquire.outputs.exit_code }}
        run: |
          if [ "$ACQUIRE_EXIT" = "0" ]; then
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason completed
          else
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --reason "not planned"
          fi

      - name: Fail unless all inputs passed
        if: always()
        env:
          ACQUIRE_EXIT: ${{ steps.acquire.outputs.exit_code }}
        run: |
          test "$ACQUIRE_EXIT" = "0"
