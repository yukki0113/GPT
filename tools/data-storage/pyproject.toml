[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-data-storage"
version = "0.1.0"
description = "Project-neutral Parquet and DuckDB conversion, validation, and benchmark tools"
requires-python = ">=3.10"
dependencies = [
  "duckdb==1.1.3",
  "pyarrow>=18,<26",
  "PyYAML>=6,<7",
]

[project.scripts]
gpt-data-storage = "data_storage.cli.storage_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
